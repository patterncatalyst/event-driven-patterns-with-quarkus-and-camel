<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 360" font-family="'Red Hat Text', system-ui, sans-serif" role="img">
<defs><marker id="a" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#555"/></marker><marker id="am" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b8650a"/></marker></defs>
<rect x="40" y="80" width="190" height="90" rx="9" fill="#ffffff" stroke="#111111" stroke-width="2"/>
<text x="135.0" y="115.5" font-size="13.5" font-weight="700" fill="#111111" text-anchor="middle">edp.orders.placed</text>
<text x="135.0" y="132.5" font-size="11.5" fill="#555555" text-anchor="middle">record time = commit</text>
<text x="135.0" y="147.5" font-size="11.5" fill="#555555" text-anchor="middle">occurredAt = commit</text>
<rect x="280" y="80" width="190" height="90" rx="9" fill="#ffffff" stroke="#999999" stroke-width="1.5" stroke-dasharray="6 4"/>
<text x="375.0" y="115.5" font-size="13.5" font-weight="700" fill="#111111" text-anchor="middle">inventory-service</text>
<text x="375.0" y="132.5" font-size="11.5" fill="#555555" text-anchor="middle">fails: no stock row</text>
<text x="375.0" y="147.5" font-size="11.5" fill="#555555" text-anchor="middle">nack</text>
<rect x="520" y="80" width="190" height="90" rx="9" fill="#ffffff" stroke="#111111" stroke-width="2"/>
<text x="615.0" y="115.5" font-size="13.5" font-weight="700" fill="#111111" text-anchor="middle">edp.orders.placed-dlq</text>
<text x="615.0" y="132.5" font-size="11.5" fill="#555555" text-anchor="middle">headers kept,</text>
<text x="615.0" y="147.5" font-size="11.5" fill="#555555" text-anchor="middle">waits for a fix</text>
<rect x="760" y="80" width="200" height="90" rx="9" fill="#fff8ef" stroke="#e8870c" stroke-width="2"/>
<text x="860.0" y="108.0" font-size="13.5" font-weight="700" fill="#111111" text-anchor="middle">Redrive</text>
<text x="860.0" y="125.0" font-size="11.5" fill="#555555" text-anchor="middle">written again:</text>
<text x="860.0" y="140.0" font-size="11.5" fill="#555555" text-anchor="middle">new record time,</text>
<text x="860.0" y="155.0" font-size="11.5" fill="#555555" text-anchor="middle">same occurredAt</text>
<rect x="520" y="230" width="190" height="90" rx="9" fill="#ffffff" stroke="#111111" stroke-width="2"/>
<text x="615.0" y="265.5" font-size="13.5" font-weight="700" fill="#111111" text-anchor="middle">Record age</text>
<text x="615.0" y="282.5" font-size="11.5" fill="#555555" text-anchor="middle">now minus record time</text>
<text x="615.0" y="297.5" font-size="11.5" fill="#555555" text-anchor="middle">reads small</text>
<rect x="760" y="230" width="200" height="90" rx="9" fill="#fff8ef" stroke="#e8870c" stroke-width="2"/>
<text x="860.0" y="265.5" font-size="13.5" font-weight="700" fill="#111111" text-anchor="middle">Event age</text>
<text x="860.0" y="282.5" font-size="11.5" fill="#555555" text-anchor="middle">now minus occurredAt</text>
<text x="860.0" y="297.5" font-size="11.5" fill="#555555" text-anchor="middle">reads the wait</text>
<path d="M230,125 L280,125" fill="none" stroke="#555" stroke-width="2" marker-end="url(#a)"/>
<path d="M470,125 L520,125" fill="none" stroke="#555" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#a)"/>
<path d="M710,125 L760,125" fill="none" stroke="#b8650a" stroke-width="2" marker-end="url(#am)"/>
<path d="M800,170 L650,230" fill="none" stroke="#555" stroke-width="2" marker-end="url(#a)"/>
<path d="M860,170 L860,230" fill="none" stroke="#b8650a" stroke-width="2" marker-end="url(#am)"/>
<text x="500" y="30" font-size="15" fill="#444444" text-anchor="middle" font-weight="700">The time stamped when the event happened survives a rewrite; the record timestamp does not</text>
</svg>
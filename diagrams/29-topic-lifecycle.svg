<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 430" font-family="'Red Hat Text', system-ui, sans-serif" role="img">
<defs><marker id="a" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#555"/></marker><marker id="am" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b8650a"/></marker></defs>
<rect x="20" y="60" width="960" height="150" rx="12" fill="#fff8ef" stroke="#ddd"/>
<text x="32" y="80" font-size="12" font-weight="700" fill="#888">Acted on in Kubernetes</text>
<rect x="20" y="230" width="960" height="150" rx="12" fill="#f6f8fa" stroke="#ddd"/>
<text x="32" y="250" font-size="12" font-weight="700" fill="#888">Acted on in Kafka</text>
<rect x="40" y="100" width="200" height="90" rx="9" fill="#ffffff" stroke="#111111" stroke-width="2"/>
<text x="140.0" y="135.5" font-size="13.5" font-weight="700" fill="#111111" text-anchor="middle">Apply a KafkaTopic</text>
<text x="140.0" y="152.5" font-size="11.5" fill="#555555" text-anchor="middle">the topic exists</text>
<text x="140.0" y="167.5" font-size="11.5" fill="#555555" text-anchor="middle">Ready within seconds</text>
<rect x="280" y="100" width="200" height="90" rx="9" fill="#fff8ef" stroke="#e8870c" stroke-width="2"/>
<text x="380.0" y="135.5" font-size="13.5" font-weight="700" fill="#111111" text-anchor="middle">Delete the KafkaTopic</text>
<text x="380.0" y="152.5" font-size="11.5" fill="#555555" text-anchor="middle">the finalizer waits,</text>
<text x="380.0" y="167.5" font-size="11.5" fill="#555555" text-anchor="middle">then the topic is gone</text>
<rect x="520" y="100" width="200" height="90" rx="9" fill="#ffffff" stroke="#111111" stroke-width="2"/>
<text x="620.0" y="143.0" font-size="13.5" font-weight="700" fill="#111111" text-anchor="middle">Annotate managed: false</text>
<text x="620.0" y="160.0" font-size="11.5" fill="#555555" text-anchor="middle">status Unmanaged</text>
<rect x="760" y="100" width="200" height="90" rx="9" fill="#fff8ef" stroke="#e8870c" stroke-width="2"/>
<text x="860.0" y="135.5" font-size="13.5" font-weight="700" fill="#111111" text-anchor="middle">Then delete it</text>
<text x="860.0" y="152.5" font-size="11.5" fill="#555555" text-anchor="middle">the resource goes,</text>
<text x="860.0" y="167.5" font-size="11.5" fill="#555555" text-anchor="middle">the topic stays</text>
<rect x="40" y="270" width="200" height="90" rx="9" fill="#ffffff" stroke="#111111" stroke-width="2"/>
<text x="140.0" y="305.5" font-size="13.5" font-weight="700" fill="#111111" text-anchor="middle">Alter a declared key</text>
<text x="140.0" y="322.5" font-size="11.5" fill="#555555" text-anchor="middle">reverted on a</text>
<text x="140.0" y="337.5" font-size="11.5" fill="#555555" text-anchor="middle">later pass</text>
<rect x="280" y="270" width="200" height="90" rx="9" fill="#ffffff" stroke="#111111" stroke-width="2"/>
<text x="380.0" y="305.5" font-size="13.5" font-weight="700" fill="#111111" text-anchor="middle">Delete the topic</text>
<text x="380.0" y="322.5" font-size="11.5" fill="#555555" text-anchor="middle">recreated from</text>
<text x="380.0" y="337.5" font-size="11.5" fill="#555555" text-anchor="middle">the KafkaTopic</text>
<rect x="520" y="270" width="200" height="90" rx="9" fill="#ffffff" stroke="#999999" stroke-width="1.5" stroke-dasharray="6 4"/>
<text x="620.0" y="305.5" font-size="13.5" font-weight="700" fill="#111111" text-anchor="middle">Raise partitions</text>
<text x="620.0" y="322.5" font-size="11.5" fill="#555555" text-anchor="middle">stays raised;</text>
<text x="620.0" y="337.5" font-size="11.5" fill="#555555" text-anchor="middle">Ready=False NotSupported</text>
<rect x="760" y="270" width="200" height="90" rx="9" fill="#ffffff" stroke="#999999" stroke-width="1.5" stroke-dasharray="6 4"/>
<text x="860.0" y="305.5" font-size="13.5" font-weight="700" fill="#111111" text-anchor="middle">Create a new topic</text>
<text x="860.0" y="322.5" font-size="11.5" fill="#555555" text-anchor="middle">no KafkaTopic</text>
<text x="860.0" y="337.5" font-size="11.5" fill="#555555" text-anchor="middle">ever appears</text>
<path d="M240,145 L280,145" fill="none" stroke="#555" stroke-width="2" marker-end="url(#a)"/>
<path d="M480,145 L520,145" fill="none" stroke="#555" stroke-width="2" marker-end="url(#a)"/>
<path d="M720,145 L760,145" fill="none" stroke="#b8650a" stroke-width="2" marker-end="url(#am)"/>
<text x="500" y="30" font-size="15" fill="#444444" text-anchor="middle" font-weight="700">Deleting the resource deletes the topic unless the resource was unmanaged first</text>
<text x="500" y="410" font-size="13" fill="#555555" text-anchor="middle">Measured with a 15 second reconciliation interval</text>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 360" font-family="'Red Hat Text', system-ui, sans-serif" role="img">
<defs><marker id="a" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#555"/></marker><marker id="am" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b8650a"/></marker></defs>
<rect x="20" y="60" width="960" height="250" rx="12" fill="#fff8ef" stroke="#ddd"/>
<text x="32" y="80" font-size="12" font-weight="700" fill="#888">During: each start and each stop is a membership change</text>
<rect x="40" y="130" width="170" height="100" rx="9" fill="#f4f4f4" stroke="#888888" stroke-width="1.5"/>
<text x="125.0" y="170.5" font-size="13.5" font-weight="700" fill="#111111" text-anchor="middle">edp.orders.placed</text>
<text x="125.0" y="187.5" font-size="11.5" fill="#555555" text-anchor="middle">group notify-roll</text>
<text x="125.0" y="202.5" font-size="11.5" fill="#555555" text-anchor="middle">committed offsets</text>
<rect x="290" y="90" width="220" height="46" rx="9" fill="#ffffff" stroke="#111111" stroke-width="2"/>
<text x="400.0" y="111.0" font-size="13.5" font-weight="700" fill="#111111" text-anchor="middle">revision 1 pod</text>
<text x="400.0" y="128.0" font-size="11.5" fill="#555555" text-anchor="middle">keeps its partition</text>
<rect x="290" y="148" width="220" height="46" rx="9" fill="#ffffff" stroke="#111111" stroke-width="2"/>
<text x="400.0" y="169.0" font-size="13.5" font-weight="700" fill="#111111" text-anchor="middle">revision 1 pod</text>
<text x="400.0" y="186.0" font-size="11.5" fill="#555555" text-anchor="middle">keeps its partition</text>
<rect x="290" y="206" width="220" height="46" rx="9" fill="#ffffff" stroke="#999999" stroke-width="1.5" stroke-dasharray="6 4"/>
<text x="400.0" y="227.0" font-size="13.5" font-weight="700" fill="#111111" text-anchor="middle">revision 1 pod</text>
<text x="400.0" y="244.0" font-size="11.5" fill="#555555" text-anchor="middle">leaves after the new pod is ready</text>
<rect x="290" y="258" width="220" height="46" rx="9" fill="#eef4fb" stroke="#2f6db5" stroke-width="2"/>
<text x="400.0" y="279.0" font-size="13.5" font-weight="700" fill="#111111" text-anchor="middle">revision 2 pod</text>
<text x="400.0" y="296.0" font-size="11.5" fill="#555555" text-anchor="middle">joins the group</text>
<rect x="640" y="130" width="320" height="100" rx="9" fill="#fff8ef" stroke="#e8870c" stroke-width="2"/>
<text x="800.0" y="170.5" font-size="13.5" font-weight="700" fill="#111111" text-anchor="middle">Rebalance</text>
<text x="800.0" y="187.5" font-size="11.5" fill="#555555" text-anchor="middle">a partition moves to another member</text>
<text x="800.0" y="202.5" font-size="11.5" fill="#555555" text-anchor="middle">records read but not committed are delivered again</text>
<path d="M210,170 L290,113" fill="none" stroke="#555" stroke-width="2" marker-end="url(#a)"/>
<path d="M210,180 L290,171" fill="none" stroke="#555" stroke-width="2" marker-end="url(#a)"/>
<path d="M210,190 L290,229" fill="none" stroke="#555" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#a)"/>
<path d="M210,200 L290,281" fill="none" stroke="#555" stroke-width="2" marker-end="url(#a)"/>
<path d="M510,281 L640,205" fill="none" stroke="#b8650a" stroke-width="2" marker-end="url(#am)"/>
<path d="M510,229 L640,185" fill="none" stroke="#b8650a" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#am)"/>
<text x="500" y="30" font-size="15" fill="#444444" text-anchor="middle" font-weight="700">Every membership change moves partitions</text>
<text x="500" y="338" font-size="12" fill="#555555" text-anchor="middle">The consumer protocol lets the group coordinator drive the move (KIP-848); neither protocol guarantees there is no repeat</text>
</svg>
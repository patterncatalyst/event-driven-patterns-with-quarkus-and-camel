<text x="150.0" y="237.5" font-size="11.5" fill="#555555" text-anchor="middle">op d</text>
<text x="150.0" y="252.5" font-size="11.5" fill="#555555" text-anchor="middle">before: key only, or</text>
<text x="150.0" y="267.5" font-size="11.5" fill="#555555" text-anchor="middle">whole row under FULL</text>
<text x="150.0" y="282.5" font-size="11.5" fill="#555555" text-anchor="middle">after: null</text>
<rect x="30" y="320" width="240" height="70" rx="9" fill="#ffffff" stroke="#999999" stroke-width="1.5" stroke-dasharray="6 4"/>

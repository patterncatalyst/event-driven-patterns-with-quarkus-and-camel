<text x="480" y="24" font-size="15" fill="#444444" text-anchor="middle" font-weight="700">Camel maps the envelope; the delete is published once, not twice</text>
<text x="480" y="450" font-size="11" fill="#555555" text-anchor="middle">Without the drop, Debezium&#x27;s tombstone fails conversion and is logged as a failed change.</text>

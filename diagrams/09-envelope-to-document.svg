<text x="470.0" y="190.5" font-size="13.5" font-weight="700" fill="#111111" text-anchor="middle">InventoryItemDocumentRoute</text>
<text x="470.0" y="207.5" font-size="11.5" fill="#555555" text-anchor="middle">drop records with no value</text>
<text x="470.0" y="222.5" font-size="11.5" fill="#555555" text-anchor="middle">unmarshal to ChangeEnvelope</text>
<text x="470.0" y="237.5" font-size="11.5" fill="#555555" text-anchor="middle">key from after, or before on d</text>
<text x="470.0" y="252.5" font-size="11.5" fill="#555555" text-anchor="middle">map the legacy row</text>

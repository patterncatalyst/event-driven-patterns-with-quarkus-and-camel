<text x="480" y="24" font-size="15" fill="#444444" text-anchor="middle" font-weight="700">The log holds every table&#x27;s changes; the slot holds the reader&#x27;s place</text>
<text x="480" y="455" font-size="11" fill="#555555" text-anchor="middle">The publication filters what is sent. It does not stop the log from growing while the slot stays behind.</text>

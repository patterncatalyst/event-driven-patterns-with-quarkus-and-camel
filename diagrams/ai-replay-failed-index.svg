<text x="740.0" y="225.0" font-size="11.5" fill="#555555" text-anchor="middle">reads partition 1, row becomes DONE</text>
<rect x="520" y="260" width="440" height="60" rx="9" fill="#ffffff" stroke="#999999" stroke-width="1.5"/>
<text x="740.0" y="288.0" font-size="13.5" font-weight="700" fill="#111111" text-anchor="middle">index 2</text>

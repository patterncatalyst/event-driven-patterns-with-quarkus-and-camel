<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 480" font-family="'Red Hat Text', system-ui, sans-serif" role="img">
<defs><marker id="a" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#555"/></marker><marker id="am" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b8650a"/></marker></defs>
<rect x="20" y="60" width="920" height="150" rx="12" fill="#fafafa" stroke="#ddd"/>
<text x="32" y="80" font-size="12" font-weight="700" fill="#888">First delivery of an event id</text>
<rect x="20" y="250" width="920" height="150" rx="12" fill="#fafafa" stroke="#ddd"/>
<text x="32" y="270" font-size="12" font-weight="700" fill="#888">Second delivery of the same event id</text>
<rect x="40" y="105" width="170" height="70" rx="9" fill="#f1f5f9" stroke="#64748b" stroke-width="2"/>
<text x="125.0" y="138.0" font-size="13.5" font-weight="700" fill="#111111" text-anchor="middle">edp.orders.placed</text>
<text x="125.0" y="155.0" font-size="11.5" fill="#555555" text-anchor="middle">header id = A</text>
<rect x="250" y="105" width="200" height="70" rx="9" fill="#ffffff" stroke="#111111" stroke-width="2"/>
<text x="350.0" y="138.0" font-size="13.5" font-weight="700" fill="#111111" text-anchor="middle">INSERT INTO inbox</text>
<text x="350.0" y="155.0" font-size="11.5" fill="#555555" text-anchor="middle">ON CONFLICT DO NOTHING</text>
<rect x="490" y="105" width="200" height="70" rx="9" fill="#ffffff" stroke="#111111" stroke-width="2"/>
<text x="590.0" y="138.0" font-size="13.5" font-weight="700" fill="#111111" text-anchor="middle">UPDATE inventory_item</text>
<text x="590.0" y="155.0" font-size="11.5" fill="#555555" text-anchor="middle">quantity - 3</text>
<rect x="730" y="105" width="190" height="70" rx="9" fill="#fff8ef" stroke="#e8870c" stroke-width="2"/>
<text x="825.0" y="138.0" font-size="13.5" font-weight="700" fill="#111111" text-anchor="middle">commit, then ack</text>
<text x="825.0" y="155.0" font-size="11.5" fill="#555555" text-anchor="middle">one row, one decrement</text>
<rect x="40" y="295" width="170" height="70" rx="9" fill="#f1f5f9" stroke="#64748b" stroke-width="2"/>
<text x="125.0" y="328.0" font-size="13.5" font-weight="700" fill="#111111" text-anchor="middle">edp.orders.placed</text>
<text x="125.0" y="345.0" font-size="11.5" fill="#555555" text-anchor="middle">header id = A</text>
<rect x="250" y="295" width="200" height="70" rx="9" fill="#ffffff" stroke="#111111" stroke-width="2"/>
<text x="350.0" y="328.0" font-size="13.5" font-weight="700" fill="#111111" text-anchor="middle">INSERT INTO inbox</text>
<text x="350.0" y="345.0" font-size="11.5" fill="#555555" text-anchor="middle">ON CONFLICT DO NOTHING</text>
<rect x="490" y="295" width="200" height="70" rx="9" fill="#ffffff" stroke="#999999" stroke-width="1.5" stroke-dasharray="6 4"/>
<text x="590.0" y="328.0" font-size="13.5" font-weight="700" fill="#111111" text-anchor="middle">no decrement</text>
<text x="590.0" y="345.0" font-size="11.5" fill="#555555" text-anchor="middle">0 rows inserted</text>
<rect x="730" y="295" width="190" height="70" rx="9" fill="#fff8ef" stroke="#e8870c" stroke-width="2"/>
<text x="825.0" y="328.0" font-size="13.5" font-weight="700" fill="#111111" text-anchor="middle">ack</text>
<text x="825.0" y="345.0" font-size="11.5" fill="#555555" text-anchor="middle">duplicate skipped</text>
<path d="M210,140 L250,140" fill="none" stroke="#555" stroke-width="2" marker-end="url(#a)"/>
<path d="M450,140 L490,140" fill="none" stroke="#555" stroke-width="2" marker-end="url(#a)"/>
<text x="476.0" y="134.0" font-size="11" fill="#ffffff" stroke="#ffffff" stroke-width="3" paint-order="stroke" text-anchor="middle">1 row</text>
<text x="476.0" y="134.0" font-size="11" fill="#555" text-anchor="middle">1 row</text>
<path d="M690,140 L730,140" fill="none" stroke="#555" stroke-width="2" marker-end="url(#a)"/>
<path d="M210,330 L250,330" fill="none" stroke="#555" stroke-width="2" marker-end="url(#a)"/>
<path d="M450,330 L490,330" fill="none" stroke="#555" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#a)"/>
<text x="476.0" y="324.0" font-size="11" fill="#ffffff" stroke="#ffffff" stroke-width="3" paint-order="stroke" text-anchor="middle">0 rows</text>
<text x="476.0" y="324.0" font-size="11" fill="#555" text-anchor="middle">0 rows</text>
<path d="M690,330 L730,330" fill="none" stroke="#555" stroke-width="2" marker-end="url(#a)"/>
<text x="480" y="30" font-size="15" fill="#444444" text-anchor="middle" font-weight="700">The processed-id row and the effect are one transaction</text>
<text x="480" y="440" font-size="13" fill="#555555" text-anchor="middle">If the decrement fails, the transaction rolls back and the inbox row goes with it</text>
</svg>
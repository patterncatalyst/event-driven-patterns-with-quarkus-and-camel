<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 430" font-family="'Red Hat Text', system-ui, sans-serif" role="img">
<defs><marker id="a" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#555"/></marker><marker id="am" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b8650a"/></marker></defs>
<rect x="20" y="60" width="280" height="330" rx="12" fill="#fafafa" stroke="#ddd"/>
<text x="32" y="80" font-size="12" font-weight="700" fill="#888">You apply</text>
<rect x="400" y="60" width="580" height="330" rx="12" fill="#fff8ef" stroke="#ddd"/>
<text x="412" y="80" font-size="12" font-weight="700" fill="#888">The operator keeps</text>
<rect x="40" y="100" width="240" height="60" rx="9" fill="#ffffff" stroke="#111111" stroke-width="2"/>
<text x="160.0" y="128.0" font-size="13.5" font-weight="700" fill="#111111" text-anchor="middle">Kafka edp</text>
<text x="160.0" y="145.0" font-size="11.5" fill="#555555" text-anchor="middle">version, listeners, config</text>
<rect x="40" y="190" width="240" height="60" rx="9" fill="#ffffff" stroke="#111111" stroke-width="2"/>
<text x="160.0" y="218.0" font-size="13.5" font-weight="700" fill="#111111" text-anchor="middle">KafkaNodePool controller</text>
<text x="160.0" y="235.0" font-size="11.5" fill="#555555" text-anchor="middle">roles: controller</text>
<rect x="40" y="280" width="240" height="60" rx="9" fill="#ffffff" stroke="#111111" stroke-width="2"/>
<text x="160.0" y="308.0" font-size="13.5" font-weight="700" fill="#111111" text-anchor="middle">KafkaNodePool broker</text>
<text x="160.0" y="325.0" font-size="11.5" fill="#555555" text-anchor="middle">roles: broker</text>
<rect x="420" y="100" width="250" height="60" rx="9" fill="#fff8ef" stroke="#e8870c" stroke-width="2"/>
<text x="545.0" y="128.0" font-size="13.5" font-weight="700" fill="#111111" text-anchor="middle">Strimzi cluster operator</text>
<text x="545.0" y="145.0" font-size="11.5" fill="#555555" text-anchor="middle">edp-kafka namespace</text>
<rect x="720" y="100" width="240" height="60" rx="9" fill="#f1f5f9" stroke="#64748b" stroke-width="2"/>
<text x="840.0" y="128.0" font-size="13.5" font-weight="700" fill="#111111" text-anchor="middle">Service edp-kafka-bootstrap</text>
<text x="840.0" y="145.0" font-size="11.5" fill="#555555" text-anchor="middle">the address clients use</text>
<rect x="420" y="200" width="250" height="60" rx="9" fill="#ffffff" stroke="#111111" stroke-width="2"/>
<text x="545.0" y="228.0" font-size="13.5" font-weight="700" fill="#111111" text-anchor="middle">StrimziPodSet edp-controller</text>
<text x="545.0" y="245.0" font-size="11.5" fill="#555555" text-anchor="middle">pod edp-controller-&lt;id&gt;</text>
<rect x="420" y="290" width="250" height="60" rx="9" fill="#ffffff" stroke="#111111" stroke-width="2"/>
<text x="545.0" y="318.0" font-size="13.5" font-weight="700" fill="#111111" text-anchor="middle">StrimziPodSet edp-broker</text>
<text x="545.0" y="335.0" font-size="11.5" fill="#555555" text-anchor="middle">pod edp-broker-&lt;id&gt;</text>
<rect x="720" y="200" width="240" height="60" rx="9" fill="#ffffff" stroke="#999999" stroke-width="1.5" stroke-dasharray="6 4"/>
<text x="840.0" y="228.0" font-size="13.5" font-weight="700" fill="#111111" text-anchor="middle">PersistentVolumeClaim</text>
<text x="840.0" y="245.0" font-size="11.5" fill="#555555" text-anchor="middle">one per node, follows the node</text>
<rect x="720" y="290" width="240" height="60" rx="9" fill="#ffffff" stroke="#999999" stroke-width="1.5" stroke-dasharray="6 4"/>
<text x="840.0" y="318.0" font-size="13.5" font-weight="700" fill="#111111" text-anchor="middle">status</text>
<text x="840.0" y="335.0" font-size="11.5" fill="#555555" text-anchor="middle">nodeIds, kafkaVersion</text>
<path d="M280,130 L420,130" fill="none" stroke="#b8650a" stroke-width="2" marker-end="url(#am)"/>
<path d="M280,220 L420,150" fill="none" stroke="#b8650a" stroke-width="2" marker-end="url(#am)"/>
<path d="M280,310 L420,155" fill="none" stroke="#b8650a" stroke-width="2" marker-end="url(#am)"/>
<path d="M670,130 L720,130" fill="none" stroke="#555" stroke-width="2" marker-end="url(#a)"/>
<path d="M545,160 L545,200" fill="none" stroke="#555" stroke-width="2" marker-end="url(#a)"/>
<path d="M545,260 L545,290" fill="none" stroke="#555" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#a)"/>
<path d="M670,230 L720,230" fill="none" stroke="#555" stroke-width="2" marker-end="url(#a)"/>
<path d="M670,320 L720,320" fill="none" stroke="#555" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#a)"/>
<text x="500" y="30" font-size="15" fill="#444444" text-anchor="middle" font-weight="700">Declare the cluster; the operator creates and keeps the pods, volumes and Services</text>
<text x="500" y="415" font-size="13" fill="#555555" text-anchor="middle">A deleted pod is created again with the same name, node id and volume claim</text>
</svg>
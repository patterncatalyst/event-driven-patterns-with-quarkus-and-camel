<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 500" font-family="'Red Hat Text', system-ui, sans-serif" role="img">
<defs><marker id="a" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#555"/></marker><marker id="am" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b8650a"/></marker></defs>
<rect x="20" y="60" width="920" height="190" rx="12" fill="#fafafa" stroke="#ddd"/>
<text x="32" y="80" font-size="12" font-weight="700" fill="#888">Commit first, then publish</text>
<rect x="20" y="280" width="920" height="190" rx="12" fill="#fafafa" stroke="#ddd"/>
<text x="32" y="300" font-size="12" font-weight="700" fill="#888">Publish first, then commit</text>
<rect x="40" y="110" width="200" height="70" rx="9" fill="#ffffff" stroke="#111111" stroke-width="2"/>
<text x="140.0" y="143.0" font-size="13.5" font-weight="700" fill="#111111" text-anchor="middle">order-service</text>
<text x="140.0" y="160.0" font-size="11.5" fill="#555555" text-anchor="middle">POST /orders</text>
<rect x="320" y="110" width="200" height="70" rx="9" fill="#ffffff" stroke="#111111" stroke-width="2"/>
<text x="420.0" y="143.0" font-size="13.5" font-weight="700" fill="#111111" text-anchor="middle">1. commit the order</text>
<text x="420.0" y="160.0" font-size="11.5" fill="#555555" text-anchor="middle">PostgreSQL</text>
<rect x="600" y="110" width="200" height="70" rx="9" fill="#ffffff" stroke="#999999" stroke-width="1.5" stroke-dasharray="6 4"/>
<text x="700.0" y="143.0" font-size="13.5" font-weight="700" fill="#111111" text-anchor="middle">2. publish OrderPlaced</text>
<text x="700.0" y="160.0" font-size="11.5" fill="#555555" text-anchor="middle">Kafka</text>
<rect x="320" y="190" width="480" height="46" rx="9" fill="#fff8ef" stroke="#e8870c" stroke-width="2"/>
<text x="560.0" y="218.5" font-size="13.5" font-weight="700" fill="#111111" text-anchor="middle">crash between 1 and 2: the order exists, no event ever announces it</text>
<rect x="40" y="330" width="200" height="70" rx="9" fill="#ffffff" stroke="#111111" stroke-width="2"/>
<text x="140.0" y="363.0" font-size="13.5" font-weight="700" fill="#111111" text-anchor="middle">order-service</text>
<text x="140.0" y="380.0" font-size="11.5" fill="#555555" text-anchor="middle">POST /orders</text>
<rect x="320" y="330" width="200" height="70" rx="9" fill="#ffffff" stroke="#111111" stroke-width="2"/>
<text x="420.0" y="363.0" font-size="13.5" font-weight="700" fill="#111111" text-anchor="middle">1. publish OrderPlaced</text>
<text x="420.0" y="380.0" font-size="11.5" fill="#555555" text-anchor="middle">Kafka</text>
<rect x="600" y="330" width="200" height="70" rx="9" fill="#ffffff" stroke="#999999" stroke-width="1.5" stroke-dasharray="6 4"/>
<text x="700.0" y="363.0" font-size="13.5" font-weight="700" fill="#111111" text-anchor="middle">2. commit the order</text>
<text x="700.0" y="380.0" font-size="11.5" fill="#555555" text-anchor="middle">PostgreSQL</text>
<rect x="320" y="410" width="480" height="46" rx="9" fill="#fff8ef" stroke="#e8870c" stroke-width="2"/>
<text x="560.0" y="438.5" font-size="13.5" font-weight="700" fill="#111111" text-anchor="middle">commit fails after 1: the event announces an order that does not exist</text>
<path d="M240,145 L320,145" fill="none" stroke="#555" stroke-width="2" marker-end="url(#a)"/>
<path d="M520,145 L600,145" fill="none" stroke="#555" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#a)"/>
<path d="M240,365 L320,365" fill="none" stroke="#555" stroke-width="2" marker-end="url(#a)"/>
<path d="M520,365 L600,365" fill="none" stroke="#555" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#a)"/>
<text x="480" y="30" font-size="15" fill="#444444" text-anchor="middle" font-weight="700">No transaction spans the database and the broker</text>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 470" font-family="'Red Hat Text', system-ui, sans-serif" role="img">
<defs><marker id="a" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#555"/></marker><marker id="am" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b8650a"/></marker></defs>
<rect x="20" y="50" width="1240" height="170" rx="12" fill="#fafafa" stroke="#ddd"/>
<text x="32" y="70" font-size="12" font-weight="700" fill="#888">Write: the attachment is stored, the event stays small</text>
<rect x="20" y="235" width="1240" height="180" rx="12" fill="#fafafa" stroke="#ddd"/>
<text x="32" y="255" font-size="12" font-weight="700" fill="#888">Read: only a consumer that needs the content asks for it</text>
<rect x="40" y="95" width="250" height="80" rx="9" fill="#f1f5f9" stroke="#64748b" stroke-width="2"/>
<text x="165.0" y="133.0" font-size="13.5" font-weight="700" fill="#111111" text-anchor="middle">order-service</text>
<text x="165.0" y="150.0" font-size="11.5" fill="#555555" text-anchor="middle">POST /orders with attachment</text>
<rect x="350" y="95" width="250" height="80" rx="9" fill="#fff8ef" stroke="#e8870c" stroke-width="2"/>
<text x="475.0" y="133.0" font-size="13.5" font-weight="700" fill="#111111" text-anchor="middle">orders.claim_check</text>
<text x="475.0" y="150.0" font-size="11.5" fill="#555555" text-anchor="middle">id, order_id, content, created_at</text>
<rect x="660" y="95" width="250" height="80" rx="9" fill="#fff8ef" stroke="#e8870c" stroke-width="2"/>
<text x="785.0" y="133.0" font-size="13.5" font-weight="700" fill="#111111" text-anchor="middle">edp.orders.placed</text>
<text x="785.0" y="150.0" font-size="11.5" fill="#555555" text-anchor="middle">Order, status, claim id and size</text>
<rect x="970" y="95" width="250" height="80" rx="9" fill="#ffffff" stroke="#111111" stroke-width="2"/>
<text x="1095.0" y="133.0" font-size="13.5" font-weight="700" fill="#111111" text-anchor="middle">Every consumer</text>
<text x="1095.0" y="150.0" font-size="11.5" fill="#555555" text-anchor="middle">reads a few hundred bytes</text>
<rect x="40" y="285" width="250" height="80" rx="9" fill="#ffffff" stroke="#111111" stroke-width="2"/>
<text x="165.0" y="323.0" font-size="13.5" font-weight="700" fill="#111111" text-anchor="middle">Caller</text>
<text x="165.0" y="340.0" font-size="11.5" fill="#555555" text-anchor="middle">GET /order-copies/O-1001/attachment</text>
<rect x="350" y="285" width="250" height="80" rx="9" fill="#ffffff" stroke="#111111" stroke-width="2"/>
<text x="475.0" y="323.0" font-size="13.5" font-weight="700" fill="#111111" text-anchor="middle">notification-service</text>
<text x="475.0" y="340.0" font-size="11.5" fill="#555555" text-anchor="middle">reads the claim id from its copy</text>
<rect x="660" y="285" width="250" height="80" rx="9" fill="#f1f5f9" stroke="#64748b" stroke-width="2"/>
<text x="785.0" y="323.0" font-size="13.5" font-weight="700" fill="#111111" text-anchor="middle">order-service</text>
<text x="785.0" y="340.0" font-size="11.5" fill="#555555" text-anchor="middle">GET /claims/{id}</text>
<rect x="970" y="285" width="250" height="80" rx="9" fill="#fff8ef" stroke="#e8870c" stroke-width="2"/>
<text x="1095.0" y="323.0" font-size="13.5" font-weight="700" fill="#111111" text-anchor="middle">The content</text>
<text x="1095.0" y="340.0" font-size="11.5" fill="#555555" text-anchor="middle">100 KB, fetched once, when asked</text>
<path d="M290,135 L350,135" fill="none" stroke="#b8650a" stroke-width="2" marker-end="url(#am)"/>
<path d="M600,135 L660,135" fill="none" stroke="#b8650a" stroke-width="2" marker-end="url(#am)"/>
<path d="M910,135 L970,135" fill="none" stroke="#555" stroke-width="2" marker-end="url(#a)"/>
<path d="M290,325 L350,325" fill="none" stroke="#555" stroke-width="2" marker-end="url(#a)"/>
<path d="M600,325 L660,325" fill="none" stroke="#555" stroke-width="2" marker-end="url(#a)"/>
<path d="M910,325 L970,325" fill="none" stroke="#b8650a" stroke-width="2" marker-end="url(#am)"/>
<text x="640" y="28" font-size="15" fill="#444444" text-anchor="middle" font-weight="700">Claim check: store, publish the claim, fetch on demand</text>
<text x="640" y="445" font-size="11" fill="#555555" text-anchor="middle">The event no longer grows with the attachment; reading the content now needs the order-service to be up.</text>
</svg>
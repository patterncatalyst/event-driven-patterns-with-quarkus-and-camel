<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 420" font-family="'Red Hat Text', system-ui, sans-serif" role="img">
<defs><marker id="a" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#555"/></marker><marker id="am" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b8650a"/></marker></defs>
<rect x="490" y="195" width="450" height="190" rx="12" fill="#fafafa" stroke="#ddd"/>
<text x="502" y="215" font-size="12" font-weight="700" fill="#888">max.poll.interval.ms: the longest gap allowed between two poll() calls</text>
<rect x="30" y="90" width="190" height="80" rx="9" fill="#ffffff" stroke="#111111" stroke-width="2"/>
<text x="125.0" y="128.0" font-size="13.5" font-weight="700" fill="#111111" text-anchor="middle">Broker</text>
<text x="125.0" y="145.0" font-size="11.5" fill="#555555" text-anchor="middle">3 topics, 9 partitions</text>
<rect x="270" y="90" width="190" height="80" rx="9" fill="#ffffff" stroke="#111111" stroke-width="2"/>
<text x="365.0" y="120.5" font-size="13.5" font-weight="700" fill="#111111" text-anchor="middle">Fetch request</text>
<text x="365.0" y="137.5" font-size="11.5" fill="#555555" text-anchor="middle">returns at fetch.min.bytes</text>
<text x="365.0" y="152.5" font-size="11.5" fill="#555555" text-anchor="middle">or after fetch.max.wait.ms</text>
<rect x="510" y="90" width="190" height="80" rx="9" fill="#ffffff" stroke="#111111" stroke-width="2"/>
<text x="605.0" y="120.5" font-size="13.5" font-weight="700" fill="#111111" text-anchor="middle">Client buffer</text>
<text x="605.0" y="137.5" font-size="11.5" fill="#555555" text-anchor="middle">fetched data that poll()</text>
<text x="605.0" y="152.5" font-size="11.5" fill="#555555" text-anchor="middle">has not returned yet</text>
<rect x="750" y="90" width="190" height="80" rx="9" fill="#fff8ef" stroke="#e8870c" stroke-width="2"/>
<text x="845.0" y="120.5" font-size="13.5" font-weight="700" fill="#111111" text-anchor="middle">poll() and process</text>
<text x="845.0" y="137.5" font-size="11.5" fill="#555555" text-anchor="middle">at most max.poll.records</text>
<text x="845.0" y="152.5" font-size="11.5" fill="#555555" text-anchor="middle">each record costs work</text>
<rect x="510" y="245" width="190" height="80" rx="9" fill="#f1f5f9" stroke="#64748b" stroke-width="2"/>
<text x="605.0" y="275.5" font-size="13.5" font-weight="700" fill="#111111" text-anchor="middle">A slow batch</text>
<text x="605.0" y="292.5" font-size="11.5" fill="#555555" text-anchor="middle">500 records x 50 ms</text>
<text x="605.0" y="307.5" font-size="11.5" fill="#555555" text-anchor="middle">is 25 s without a poll</text>
<rect x="730" y="245" width="190" height="80" rx="9" fill="#ffffff" stroke="#999999" stroke-width="1.5" stroke-dasharray="6 4"/>
<text x="825.0" y="275.5" font-size="13.5" font-weight="700" fill="#111111" text-anchor="middle">Member removed</text>
<text x="825.0" y="292.5" font-size="11.5" fill="#555555" text-anchor="middle">partitions reassigned,</text>
<text x="825.0" y="307.5" font-size="11.5" fill="#555555" text-anchor="middle">batch delivered again</text>
<path d="M220,130 L270,130" fill="none" stroke="#b8650a" stroke-width="2" marker-end="url(#am)"/>
<path d="M460,130 L510,130" fill="none" stroke="#b8650a" stroke-width="2" marker-end="url(#am)"/>
<path d="M700,130 L750,130" fill="none" stroke="#b8650a" stroke-width="2" marker-end="url(#am)"/>
<path d="M800,170 L640,245" fill="none" stroke="#555" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#a)"/>
<path d="M700,285 L730,285" fill="none" stroke="#555" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#a)"/>
<text x="480" y="24" font-size="15" fill="#444444" text-anchor="middle" font-weight="700">A fetch fills a buffer; poll() hands out a bounded slice of it</text>
<text x="30" y="230" font-size="12" fill="#555555" text-anchor="start">max.poll.records limits what poll() returns.</text>
<text x="30" y="252" font-size="12" fill="#555555" text-anchor="start">It does not limit what a fetch brings back.</text>
<text x="30" y="290" font-size="12" fill="#555555" text-anchor="start">fetch.min.bytes and fetch.max.wait.ms</text>
<text x="30" y="312" font-size="12" fill="#555555" text-anchor="start">decide how often a trickle of records is fetched.</text>
<text x="30" y="350" font-size="12" fill="#555555" text-anchor="start">Size max.poll.records so one poll&#x27;s work</text>
<text x="30" y="372" font-size="12" fill="#555555" text-anchor="start">finishes well inside max.poll.interval.ms.</text>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 580" font-family="'Red Hat Text', system-ui, sans-serif" role="img">
<defs><marker id="a" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#555"/></marker><marker id="am" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b8650a"/></marker></defs>
<rect x="20" y="60" width="920" height="110" rx="12" fill="#fafafa" stroke="#ddd"/>
<text x="32" y="80" font-size="12" font-weight="700" fill="#888">Write side: every command appends events and commits</text>
<rect x="20" y="210" width="450" height="320" rx="12" fill="#fafafa" stroke="#ddd"/>
<text x="32" y="230" font-size="12" font-weight="700" fill="#888">Replay: on request</text>
<rect x="490" y="210" width="450" height="320" rx="12" fill="#fff8ef" stroke="#ddd"/>
<text x="502" y="230" font-size="12" font-weight="700" fill="#888">Projection: kept current</text>
<rect x="50" y="100" width="230" height="56" rx="9" fill="#ffffff" stroke="#111111" stroke-width="2"/>
<text x="165.0" y="126.0" font-size="13.5" font-weight="700" fill="#111111" text-anchor="middle">OrderCommands</text>
<text x="165.0" y="143.0" font-size="11.5" fill="#555555" text-anchor="middle">decide, append at version</text>
<rect x="410" y="100" width="300" height="56" rx="9" fill="#f1f5f9" stroke="#64748b" stroke-width="2"/>
<text x="560.0" y="126.0" font-size="13.5" font-weight="700" fill="#111111" text-anchor="middle">orders.events</text>
<text x="560.0" y="143.0" font-size="11.5" fill="#555555" text-anchor="middle">one row per event, append only</text>
<rect x="50" y="265" width="390" height="66" rx="9" fill="#ffffff" stroke="#111111" stroke-width="2"/>
<text x="245.0" y="296.0" font-size="13.5" font-weight="700" fill="#111111" text-anchor="middle">ReplayReport</text>
<text x="245.0" y="313.0" font-size="11.5" fill="#555555" text-anchor="middle">every stream, one OrderAggregate at a time</text>
<rect x="50" y="365" width="390" height="66" rx="9" fill="#ffffff" stroke="#999999" stroke-width="1.5" stroke-dasharray="6 4"/>
<text x="245.0" y="396.0" font-size="13.5" font-weight="700" fill="#111111" text-anchor="middle">fold, count the shipped</text>
<text x="245.0" y="413.0" font-size="11.5" fill="#555555" text-anchor="middle">cost grows with the store</text>
<rect x="50" y="455" width="390" height="56" rx="9" fill="#fff8ef" stroke="#e8870c" stroke-width="2"/>
<text x="245.0" y="481.0" font-size="13.5" font-weight="700" fill="#111111" text-anchor="middle">carrier, day, shipments</text>
<text x="245.0" y="498.0" font-size="11.5" fill="#555555" text-anchor="middle">the answer</text>
<rect x="520" y="265" width="390" height="66" rx="9" fill="#ffffff" stroke="#111111" stroke-width="2"/>
<text x="715.0" y="296.0" font-size="13.5" font-weight="700" fill="#111111" text-anchor="middle">CarrierDailyProjector</text>
<text x="715.0" y="313.0" font-size="11.5" fill="#555555" text-anchor="middle">tick, batch, checkpoint</text>
<rect x="520" y="365" width="390" height="66" rx="9" fill="#f1f5f9" stroke="#64748b" stroke-width="2"/>
<text x="715.0" y="396.0" font-size="13.5" font-weight="700" fill="#111111" text-anchor="middle">carrier_daily_shipments</text>
<text x="715.0" y="413.0" font-size="11.5" fill="#555555" text-anchor="middle">27 rows, whatever the store holds</text>
<rect x="520" y="455" width="390" height="56" rx="9" fill="#fff8ef" stroke="#e8870c" stroke-width="2"/>
<text x="715.0" y="481.0" font-size="13.5" font-weight="700" fill="#111111" text-anchor="middle">carrier, day, shipments</text>
<text x="715.0" y="498.0" font-size="11.5" fill="#555555" text-anchor="middle">one table scan</text>
<path d="M280,128 L410,128" fill="none" stroke="#555" stroke-width="2" marker-end="url(#a)"/>
<path d="M440,156 L330,265" fill="none" stroke="#555" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#a)"/>
<path d="M245,331 L245,365" fill="none" stroke="#555" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#a)"/>
<path d="M245,431 L245,455" fill="none" stroke="#555" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#a)"/>
<path d="M680,156 L800,265" fill="none" stroke="#b8650a" stroke-width="2" marker-end="url(#am)"/>
<path d="M715,331 L715,365" fill="none" stroke="#b8650a" stroke-width="2" marker-end="url(#am)"/>
<path d="M715,431 L715,455" fill="none" stroke="#b8650a" stroke-width="2" marker-end="url(#am)"/>
<text x="480" y="30" font-size="15" fill="#444444" text-anchor="middle" font-weight="700">The same question over the same events: read them all now, or read what was kept up to date</text>
<text x="480" y="560" font-size="11" fill="#555555" text-anchor="middle">A new question costs code for the replay, and code plus a rebuild from the first event for the projection.</text>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" font-family="'Red Hat Text', system-ui, sans-serif" role="img">
<defs><marker id="a" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#555"/></marker><marker id="am" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b8650a"/></marker></defs>
<rect x="20" y="60" width="920" height="110" rx="12" fill="#fafafa" stroke="#ddd"/>
<text x="32" y="80" font-size="12" font-weight="700" fill="#888">How the two failures look</text>
<rect x="20" y="200" width="920" height="290" rx="12" fill="#fff8ef" stroke="#ddd"/>
<text x="32" y="220" font-size="12" font-weight="700" fill="#888">Recovery</text>
<rect x="40" y="100" width="420" height="60" rx="9" fill="#ffffff" stroke="#111111" stroke-width="2"/>
<text x="250.0" y="128.0" font-size="13.5" font-weight="700" fill="#111111" text-anchor="middle">slot lost (wal_status = lost)</text>
<text x="250.0" y="145.0" font-size="11.5" fill="#555555" text-anchor="middle">connector RUNNING, tasks empty, retries about 30 minutes</text>
<rect x="500" y="100" width="420" height="60" rx="9" fill="#ffffff" stroke="#111111" stroke-width="2"/>
<text x="710.0" y="128.0" font-size="13.5" font-weight="700" fill="#111111" text-anchor="middle">slot dropped, offsets kept</text>
<text x="710.0" y="145.0" font-size="11.5" fill="#555555" text-anchor="middle">task FAILED: position no longer available</text>
<rect x="40" y="250" width="190" height="60" rx="9" fill="#fff8ef" stroke="#e8870c" stroke-width="2"/>
<text x="135.0" y="278.0" font-size="13.5" font-weight="700" fill="#111111" text-anchor="middle">1. PUT /stop</text>
<text x="135.0" y="295.0" font-size="11.5" fill="#555555" text-anchor="middle">wait for active = f</text>
<rect x="260" y="250" width="190" height="60" rx="9" fill="#ffffff" stroke="#111111" stroke-width="2"/>
<text x="355.0" y="278.0" font-size="13.5" font-weight="700" fill="#111111" text-anchor="middle">2. drop the slot</text>
<text x="355.0" y="295.0" font-size="11.5" fill="#555555" text-anchor="middle">pg_drop_replication_slot</text>
<rect x="480" y="250" width="190" height="60" rx="9" fill="#ffffff" stroke="#111111" stroke-width="2"/>
<text x="575.0" y="278.0" font-size="13.5" font-weight="700" fill="#111111" text-anchor="middle">3. DELETE offsets</text>
<text x="575.0" y="295.0" font-size="11.5" fill="#555555" text-anchor="middle">reset the stored position</text>
<rect x="700" y="250" width="220" height="60" rx="9" fill="#ffffff" stroke="#111111" stroke-width="2"/>
<text x="810.0" y="278.0" font-size="13.5" font-weight="700" fill="#111111" text-anchor="middle">4. PUT /resume</text>
<text x="810.0" y="295.0" font-size="11.5" fill="#555555" text-anchor="middle">new slot, snapshot again</text>
<rect x="260" y="360" width="410" height="60" rx="9" fill="#f1f5f9" stroke="#64748b" stroke-width="2"/>
<text x="465.0" y="388.0" font-size="13.5" font-weight="700" fill="#111111" text-anchor="middle">restart with onlyFailed fixes neither:</text>
<text x="465.0" y="405.0" font-size="11.5" fill="#555555" text-anchor="middle">the stored position is still unusable</text>
<rect x="700" y="360" width="220" height="60" rx="9" fill="#ffffff" stroke="#999999" stroke-width="1.5" stroke-dasharray="6 4"/>
<text x="810.0" y="388.0" font-size="13.5" font-weight="700" fill="#111111" text-anchor="middle">current state re-delivered</text>
<text x="810.0" y="405.0" font-size="11.5" fill="#555555" text-anchor="middle">changes in the gap are lost</text>
<path d="M230,280 L260,280" fill="none" stroke="#b8650a" stroke-width="2" marker-end="url(#am)"/>
<path d="M450,280 L480,280" fill="none" stroke="#b8650a" stroke-width="2" marker-end="url(#am)"/>
<path d="M670,280 L700,280" fill="none" stroke="#b8650a" stroke-width="2" marker-end="url(#am)"/>
<path d="M810,310 L810,360" fill="none" stroke="#555" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#a)"/>
<text x="480" y="30" font-size="15" fill="#444444" text-anchor="middle" font-weight="700">A slot the server cannot use is replaced, not repaired</text>
</svg>
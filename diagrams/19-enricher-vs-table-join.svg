<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 560" font-family="'Red Hat Text', system-ui, sans-serif" role="img">
<defs><marker id="a" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#555"/></marker><marker id="am" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b8650a"/></marker></defs>
<rect x="20" y="60" width="940" height="120" rx="12" fill="#fafafa" stroke="#ddd"/>
<text x="32" y="80" font-size="12" font-weight="700" fill="#888">shipping-service, the owner of carrier reference data</text>
<rect x="20" y="210" width="460" height="310" rx="12" fill="#fff8ef" stroke="#ddd"/>
<text x="32" y="230" font-size="12" font-weight="700" fill="#888">notification-service: Camel Content Enricher</text>
<rect x="500" y="210" width="460" height="310" rx="12" fill="#fff8ef" stroke="#ddd"/>
<text x="512" y="230" font-size="12" font-weight="700" fill="#888">notification-service: Kafka Streams left join</text>
<rect x="400" y="100" width="180" height="60" rx="9" fill="#f1f5f9" stroke="#64748b" stroke-width="2"/>
<text x="490.0" y="128.0" font-size="13.5" font-weight="700" fill="#111111" text-anchor="middle">shipping.carrier table</text>
<text x="490.0" y="145.0" font-size="11.5" fill="#555555" text-anchor="middle">mode, tracking URL template</text>
<rect x="140" y="100" width="220" height="60" rx="9" fill="#ffffff" stroke="#111111" stroke-width="2"/>
<text x="250.0" y="128.0" font-size="13.5" font-weight="700" fill="#111111" text-anchor="middle">GET /carriers/{carrier}</text>
<text x="250.0" y="145.0" font-size="11.5" fill="#555555" text-anchor="middle">the owner&#x27;s current row</text>
<rect x="620" y="100" width="220" height="60" rx="9" fill="#ffffff" stroke="#111111" stroke-width="2"/>
<text x="730.0" y="128.0" font-size="13.5" font-weight="700" fill="#111111" text-anchor="middle">edp.shipping.carriers</text>
<text x="730.0" y="145.0" font-size="11.5" fill="#555555" text-anchor="middle">compacted, one per carrier</text>
<rect x="45" y="250" width="260" height="55" rx="9" fill="#ffffff" stroke="#111111" stroke-width="2"/>
<text x="175.0" y="275.5" font-size="13.5" font-weight="700" fill="#111111" text-anchor="middle">from kafka: edp.shipping.scheduled</text>
<text x="175.0" y="292.5" font-size="11.5" fill="#555555" text-anchor="middle">ShipmentScheduled, key = order id</text>
<rect x="45" y="340" width="410" height="60" rx="9" fill="#fff8ef" stroke="#e8870c" stroke-width="2"/>
<text x="250.0" y="368.0" font-size="13.5" font-weight="700" fill="#111111" text-anchor="middle">enrich().simple(.../carriers/${body.shipment.carrier})</text>
<text x="250.0" y="385.0" font-size="11.5" fill="#555555" text-anchor="middle">one HTTP call per record, merged by CarrierEnrichment</text>
<rect x="45" y="435" width="410" height="55" rx="9" fill="#f4f4f4" stroke="#888888" stroke-width="1.5"/>
<text x="250.0" y="460.5" font-size="13.5" font-weight="700" fill="#111111" text-anchor="middle">edp.shipping.scheduled-enriched-camel</text>
<text x="250.0" y="477.5" font-size="11.5" fill="#555555" text-anchor="middle">mode and link, or the record waits</text>
<rect x="525" y="250" width="260" height="55" rx="9" fill="#ffffff" stroke="#111111" stroke-width="2"/>
<text x="655.0" y="275.5" font-size="13.5" font-weight="700" fill="#111111" text-anchor="middle">stream: edp.shipping.scheduled</text>
<text x="655.0" y="292.5" font-size="11.5" fill="#555555" text-anchor="middle">ShipmentScheduled, key = order id</text>
<rect x="525" y="340" width="410" height="60" rx="9" fill="#fff8ef" stroke="#e8870c" stroke-width="2"/>
<text x="730.0" y="368.0" font-size="13.5" font-weight="700" fill="#111111" text-anchor="middle">leftJoin(GlobalKTable carriers)</text>
<text x="730.0" y="385.0" font-size="11.5" fill="#555555" text-anchor="middle">local store on every instance, no network call</text>
<rect x="525" y="435" width="410" height="55" rx="9" fill="#f4f4f4" stroke="#888888" stroke-width="1.5"/>
<text x="730.0" y="460.5" font-size="13.5" font-weight="700" fill="#111111" text-anchor="middle">edp.shipping.scheduled-enriched</text>
<text x="730.0" y="477.5" font-size="11.5" fill="#555555" text-anchor="middle">mode and link, or empty when no reference</text>
<path d="M400,130 L360,130" fill="none" stroke="#555" stroke-width="2" marker-end="url(#a)"/>
<path d="M580,130 L620,130" fill="none" stroke="#555" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#a)"/>
<path d="M340,160 L340,340" fill="none" stroke="#b8650a" stroke-width="2" marker-end="url(#am)"/>
<path d="M820,160 L820,340" fill="none" stroke="#b8650a" stroke-width="2" marker-end="url(#am)"/>
<path d="M170,305 L170,340" fill="none" stroke="#555" stroke-width="2" marker-end="url(#a)"/>
<path d="M250,400 L250,435" fill="none" stroke="#555" stroke-width="2" marker-end="url(#a)"/>
<path d="M650,305 L650,340" fill="none" stroke="#555" stroke-width="2" marker-end="url(#a)"/>
<path d="M730,400 L730,435" fill="none" stroke="#555" stroke-width="2" marker-end="url(#a)"/>
<text x="490" y="30" font-size="15" fill="#444444" text-anchor="middle" font-weight="700">The same merge, from two places: the owner&#x27;s answer now, or the owner&#x27;s last published record</text>
<text x="490" y="545" font-size="11" fill="#555555" text-anchor="middle">A real service runs one of the two; the example runs both on the same input.</text>
</svg>
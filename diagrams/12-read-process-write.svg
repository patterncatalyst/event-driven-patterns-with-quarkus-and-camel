<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 440" font-family="'Red Hat Text', system-ui, sans-serif" role="img">
<defs><marker id="a" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#555"/></marker><marker id="am" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b8650a"/></marker></defs>
<rect x="530" y="70" width="410" height="250" rx="12" fill="#fff8ef" stroke="#ddd"/>
<text x="542" y="90" font-size="12" font-weight="700" fill="#888">One Kafka transaction (transactional.id payment-service-tx)</text>
<rect x="30" y="150" width="200" height="80" rx="9" fill="#ffffff" stroke="#111111" stroke-width="2"/>
<text x="130.0" y="188.0" font-size="13.5" font-weight="700" fill="#111111" text-anchor="middle">edp.inventory.reserved</text>
<text x="130.0" y="205.0" font-size="11.5" fill="#555555" text-anchor="middle">a batch of 5 records</text>
<rect x="290" y="150" width="190" height="80" rx="9" fill="#ffffff" stroke="#111111" stroke-width="2"/>
<text x="385.0" y="188.0" font-size="13.5" font-weight="700" fill="#111111" text-anchor="middle">PaymentProcessor</text>
<text x="385.0" y="205.0" font-size="11.5" fill="#555555" text-anchor="middle">poll, map, send</text>
<rect x="560" y="110" width="350" height="70" rx="9" fill="#ffffff" stroke="#111111" stroke-width="2"/>
<text x="735.0" y="143.0" font-size="13.5" font-weight="700" fill="#111111" text-anchor="middle">edp.payments.processed</text>
<text x="735.0" y="160.0" font-size="11.5" fill="#555555" text-anchor="middle">5 PaymentProcessed records</text>
<rect x="560" y="210" width="350" height="70" rx="9" fill="#ffffff" stroke="#111111" stroke-width="2"/>
<text x="735.0" y="243.0" font-size="13.5" font-weight="700" fill="#111111" text-anchor="middle">__consumer_offsets</text>
<text x="735.0" y="260.0" font-size="11.5" fill="#555555" text-anchor="middle">group payment-service moves to offset 5</text>
<rect x="530" y="350" width="410" height="56" rx="9" fill="#fff8ef" stroke="#e8870c" stroke-width="2"/>
<text x="735.0" y="376.0" font-size="13.5" font-weight="700" fill="#111111" text-anchor="middle">commit marker on both partitions</text>
<text x="735.0" y="393.0" font-size="11.5" fill="#555555" text-anchor="middle">the records become visible and the offset moves</text>
<path d="M230,190 L290,190" fill="none" stroke="#555" stroke-width="2" marker-end="url(#a)"/>
<path d="M480,175 L560,145" fill="none" stroke="#b8650a" stroke-width="2" marker-end="url(#am)"/>
<path d="M480,205 L560,245" fill="none" stroke="#b8650a" stroke-width="2" marker-end="url(#am)"/>
<path d="M735,320 L735,350" fill="none" stroke="#555" stroke-width="2" marker-end="url(#a)"/>
<text x="480" y="30" font-size="15" fill="#444444" text-anchor="middle" font-weight="700">The offsets are written in the producer&#x27;s transaction, not by the consumer</text>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 320" font-family="'Red Hat Text', system-ui, sans-serif" role="img">
<defs><marker id="a" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#555"/></marker><marker id="am" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b8650a"/></marker></defs>
<rect x="20" y="60" width="960" height="210" rx="12" fill="#fff8ef" stroke="#ddd"/>
<text x="32" y="80" font-size="12" font-weight="700" fill="#888">The gap: old pods gone, new pods not ready</text>
<rect x="40" y="125" width="150" height="70" rx="9" fill="#eef4fb" stroke="#2f6db5" stroke-width="2"/>
<text x="115.0" y="150.5" font-size="13.5" font-weight="700" fill="#111111" text-anchor="middle">Producer Job</text>
<text x="115.0" y="167.5" font-size="11.5" fill="#555555" text-anchor="middle">keeps sending</text>
<text x="115.0" y="182.5" font-size="11.5" fill="#555555" text-anchor="middle">at the same rate</text>
<rect x="240" y="110" width="190" height="100" rx="9" fill="#fff8ef" stroke="#e8870c" stroke-width="2"/>
<text x="335.0" y="150.5" font-size="13.5" font-weight="700" fill="#111111" text-anchor="middle">edp.orders.placed</text>
<text x="335.0" y="167.5" font-size="11.5" fill="#555555" text-anchor="middle">records keep arriving</text>
<text x="335.0" y="182.5" font-size="11.5" fill="#555555" text-anchor="middle">backlog grows</text>
<rect x="500" y="125" width="200" height="70" rx="9" fill="#ffffff" stroke="#999999" stroke-width="1.5" stroke-dasharray="6 4"/>
<text x="600.0" y="158.0" font-size="13.5" font-weight="700" fill="#111111" text-anchor="middle">no pods</text>
<text x="600.0" y="175.0" font-size="11.5" fill="#555555" text-anchor="middle">the group has no member</text>
<rect x="780" y="125" width="180" height="70" rx="9" fill="#f4f4f4" stroke="#888888" stroke-width="1.5"/>
<text x="870.0" y="158.0" font-size="13.5" font-weight="700" fill="#111111" text-anchor="middle">notifications.notification</text>
<text x="870.0" y="175.0" font-size="11.5" fill="#555555" text-anchor="middle">no new rows</text>
<path d="M190,160 L240,160" fill="none" stroke="#b8650a" stroke-width="2" marker-end="url(#am)"/>
<path d="M430,160 L500,160" fill="none" stroke="#555" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#a)"/>
<path d="M700,160 L780,160" fill="none" stroke="#555" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#a)"/>
<text x="500" y="30" font-size="15" fill="#444444" text-anchor="middle" font-weight="700">The topic keeps the records while no consumer runs</text>
<text x="500" y="296" font-size="12" fill="#555555" text-anchor="middle">The backlog grows by the producer&#x27;s rate for as long as the new pods need to start</text>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 340" font-family="'Red Hat Text', system-ui, sans-serif" role="img">
<defs><marker id="a" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#555"/></marker><marker id="am" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b8650a"/></marker></defs>
<rect x="20" y="60" width="960" height="230" rx="12" fill="#fff8ef" stroke="#ddd"/>
<text x="32" y="80" font-size="12" font-weight="700" fill="#888">Breaking change: orderId becomes orderRef</text>
<rect x="40" y="120" width="170" height="90" rx="9" fill="#eef4fb" stroke="#2f6db5" stroke-width="2"/>
<text x="125.0" y="155.5" font-size="13.5" font-weight="700" fill="#111111" text-anchor="middle">v2 producer</text>
<text x="125.0" y="172.5" font-size="11.5" fill="#555555" text-anchor="middle">sends orderRef</text>
<text x="125.0" y="187.5" font-size="11.5" fill="#555555" text-anchor="middle">no orderId</text>
<rect x="260" y="120" width="170" height="90" rx="9" fill="#f4f4f4" stroke="#888888" stroke-width="1.5"/>
<text x="345.0" y="163.0" font-size="13.5" font-weight="700" fill="#111111" text-anchor="middle">edp.orders.placed</text>
<text x="345.0" y="180.0" font-size="11.5" fill="#555555" text-anchor="middle">accepts the record</text>
<rect x="480" y="120" width="200" height="90" rx="9" fill="#ffffff" stroke="#111111" stroke-width="2"/>
<text x="580.0" y="155.5" font-size="13.5" font-weight="700" fill="#111111" text-anchor="middle">v1 consumer</text>
<text x="580.0" y="172.5" font-size="11.5" fill="#555555" text-anchor="middle">insert fails: order_id</text>
<text x="580.0" y="187.5" font-size="11.5" fill="#555555" text-anchor="middle">is null</text>
<rect x="740" y="95" width="220" height="60" rx="9" fill="#fff8ef" stroke="#e8870c" stroke-width="2"/>
<text x="850.0" y="123.0" font-size="13.5" font-weight="700" fill="#111111" text-anchor="middle">Offset committed</text>
<text x="850.0" y="140.0" font-size="11.5" fill="#555555" text-anchor="middle">group lag is 0</text>
<rect x="740" y="185" width="220" height="60" rx="9" fill="#ffffff" stroke="#999999" stroke-width="1.5" stroke-dasharray="6 4"/>
<text x="850.0" y="213.0" font-size="13.5" font-weight="700" fill="#111111" text-anchor="middle">No row exists</text>
<text x="850.0" y="230.0" font-size="11.5" fill="#555555" text-anchor="middle">ERROR Failed delivery in the log</text>
<path d="M210,165 L260,165" fill="none" stroke="#555" stroke-width="2" marker-end="url(#a)"/>
<path d="M430,165 L480,165" fill="none" stroke="#555" stroke-width="2" marker-end="url(#a)"/>
<path d="M680,150 L740,125" fill="none" stroke="#b8650a" stroke-width="2" marker-end="url(#am)"/>
<path d="M680,180 L740,215" fill="none" stroke="#555" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#a)"/>
<text x="500" y="30" font-size="15" fill="#444444" text-anchor="middle" font-weight="700">A breaking change is a silent loss</text>
<text x="500" y="315" font-size="12" fill="#555555" text-anchor="middle">A dashboard on lag stays at zero; a schema registry with a compatibility rule would have refused the change</text>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 420" font-family="'Red Hat Text', system-ui, sans-serif" role="img">
<defs><marker id="a" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#555"/></marker><marker id="am" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b8650a"/></marker></defs>
<rect x="20" y="60" width="960" height="130" rx="12" fill="#f6f8fa" stroke="#ddd"/>
<text x="32" y="80" font-size="12" font-weight="700" fill="#888">Source cluster edp</text>
<rect x="20" y="215" width="960" height="150" rx="12" fill="#fff8ef" stroke="#ddd"/>
<text x="32" y="235" font-size="12" font-weight="700" fill="#888">Target cluster edp-dr</text>
<rect x="40" y="100" width="210" height="70" rx="9" fill="#ffffff" stroke="#111111" stroke-width="2"/>
<text x="145.0" y="133.0" font-size="13.5" font-weight="700" fill="#111111" text-anchor="middle">Record at source offset 4</text>
<text x="145.0" y="150.0" font-size="11.5" fill="#555555" text-anchor="middle">partition 1</text>
<rect x="290" y="100" width="210" height="70" rx="9" fill="#fff8ef" stroke="#e8870c" stroke-width="2"/>
<text x="395.0" y="125.5" font-size="13.5" font-weight="700" fill="#111111" text-anchor="middle">Offset sync</text>
<text x="395.0" y="142.5" font-size="11.5" fill="#555555" text-anchor="middle">source 4 is target 4</text>
<text x="395.0" y="157.5" font-size="11.5" fill="#555555" text-anchor="middle">offset.lag.max: 0</text>
<rect x="540" y="100" width="210" height="70" rx="9" fill="#ffffff" stroke="#111111" stroke-width="2"/>
<text x="645.0" y="133.0" font-size="13.5" font-weight="700" fill="#111111" text-anchor="middle">Group commits 4</text>
<text x="645.0" y="150.0" font-size="11.5" fill="#555555" text-anchor="middle">then is stopped</text>
<rect x="790" y="100" width="170" height="70" rx="9" fill="#fff8ef" stroke="#e8870c" stroke-width="2"/>
<text x="875.0" y="125.5" font-size="13.5" font-weight="700" fill="#111111" text-anchor="middle">Checkpoint</text>
<text x="875.0" y="142.5" font-size="11.5" fill="#555555" text-anchor="middle">group, partition,</text>
<text x="875.0" y="157.5" font-size="11.5" fill="#555555" text-anchor="middle">translated offset</text>
<rect x="40" y="255" width="210" height="80" rx="9" fill="#f1f5f9" stroke="#64748b" stroke-width="2"/>
<text x="145.0" y="293.0" font-size="13.5" font-weight="700" fill="#111111" text-anchor="middle">Copied record</text>
<text x="145.0" y="310.0" font-size="11.5" fill="#555555" text-anchor="middle">target offset 4</text>
<rect x="540" y="255" width="210" height="80" rx="9" fill="#fff8ef" stroke="#e8870c" stroke-width="2"/>
<text x="645.0" y="285.5" font-size="13.5" font-weight="700" fill="#111111" text-anchor="middle">Group on edp-dr</text>
<text x="645.0" y="302.5" font-size="11.5" fill="#555555" text-anchor="middle">committed 4</text>
<text x="645.0" y="317.5" font-size="11.5" fill="#555555" text-anchor="middle">(only while it has no members)</text>
<rect x="790" y="255" width="170" height="80" rx="9" fill="#eef4fb" stroke="#2f6db5" stroke-width="2"/>
<text x="875.0" y="285.5" font-size="13.5" font-weight="700" fill="#111111" text-anchor="middle">Consumer, new</text>
<text x="875.0" y="302.5" font-size="11.5" fill="#555555" text-anchor="middle">bootstrap address</text>
<text x="875.0" y="317.5" font-size="11.5" fill="#555555" text-anchor="middle">reads from 4</text>
<path d="M250,135 L290,135" fill="none" stroke="#555" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#a)"/>
<path d="M500,135 L540,135" fill="none" stroke="#555" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#a)"/>
<path d="M750,135 L790,135" fill="none" stroke="#b8650a" stroke-width="2" marker-end="url(#am)"/>
<path d="M875,170 L700,255" fill="none" stroke="#b8650a" stroke-width="2" marker-end="url(#am)"/>
<text x="793.5" y="204.5" font-size="11" fill="#ffffff" stroke="#ffffff" stroke-width="3" paint-order="stroke" text-anchor="middle">sync every 5 s</text>
<text x="793.5" y="204.5" font-size="11" fill="#b8650a" text-anchor="middle">sync every 5 s</text>
<path d="M750,295 L790,295" fill="none" stroke="#b8650a" stroke-width="2" marker-end="url(#am)"/>
<path d="M395,170 L250,255" fill="none" stroke="#555" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#a)"/>
<text x="500" y="30" font-size="15" fill="#444444" text-anchor="middle" font-weight="700">The target group is written from a checkpoint, so the consumer needs no offset of its own</text>
<text x="500" y="395" font-size="12" fill="#555555" text-anchor="middle">Without the sync setting no group exists on the target, and the consumer starts at its reset policy</text>
</svg>
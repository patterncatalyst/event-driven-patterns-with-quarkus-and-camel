<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 420" font-family="'Red Hat Text', system-ui, sans-serif" role="img">
<defs><marker id="a" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#555"/></marker><marker id="am" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b8650a"/></marker></defs>
<rect x="250" y="56" width="710" height="340" rx="12" fill="#fafafa" stroke="#ddd"/>
<text x="262" y="76" font-size="12" font-weight="700" fill="#888">Same records, same one-minute windows, same lateness</text>
<rect x="20" y="160" width="190" height="100" rx="9" fill="#f1f5f9" stroke="#64748b" stroke-width="2"/>
<text x="115.0" y="200.5" font-size="13.5" font-weight="700" fill="#111111" text-anchor="middle">edp.shipping.delivered</text>
<text x="115.0" y="217.5" font-size="11.5" fill="#555555" text-anchor="middle">one partition</text>
<text x="115.0" y="232.5" font-size="11.5" fill="#555555" text-anchor="middle">deliveredAt in the payload</text>
<rect x="270" y="90" width="260" height="80" rx="9" fill="#fff8ef" stroke="#e8870c" stroke-width="2"/>
<text x="400.0" y="120.5" font-size="13.5" font-weight="700" fill="#111111" text-anchor="middle">Kafka Streams in the service</text>
<text x="400.0" y="137.5" font-size="11.5" fill="#555555" text-anchor="middle">window store deliveries-by-carrier</text>
<text x="400.0" y="152.5" font-size="11.5" fill="#555555" text-anchor="middle">state lives in the application</text>
<rect x="270" y="200" width="260" height="80" rx="9" fill="#ffffff" stroke="#111111" stroke-width="2"/>
<text x="400.0" y="230.5" font-size="13.5" font-weight="700" fill="#111111" text-anchor="middle">Flink SQL job</text>
<text x="400.0" y="247.5" font-size="11.5" fill="#555555" text-anchor="middle">TUMBLE over a watermarked table</text>
<text x="400.0" y="262.5" font-size="11.5" fill="#555555" text-anchor="middle">state lives in the job</text>
<rect x="270" y="310" width="260" height="70" rx="9" fill="#ffffff" stroke="#111111" stroke-width="2"/>
<text x="400.0" y="335.5" font-size="13.5" font-weight="700" fill="#111111" text-anchor="middle">RisingWave views</text>
<text x="400.0" y="352.5" font-size="11.5" fill="#555555" text-anchor="middle">tumble() over a source</text>
<text x="400.0" y="367.5" font-size="11.5" fill="#555555" text-anchor="middle">state lives in the database</text>
<rect x="640" y="90" width="300" height="80" rx="9" fill="#eef4fb" stroke="#2f6db5" stroke-width="2"/>
<text x="790.0" y="120.5" font-size="13.5" font-weight="700" fill="#111111" text-anchor="middle">GET /counts?carrier=...</text>
<text x="790.0" y="137.5" font-size="11.5" fill="#555555" text-anchor="middle">an interactive query on the store</text>
<text x="790.0" y="152.5" font-size="11.5" fill="#555555" text-anchor="middle">answers for open and closed windows</text>
<rect x="640" y="200" width="300" height="80" rx="9" fill="#eef4fb" stroke="#2f6db5" stroke-width="2"/>
<text x="790.0" y="230.5" font-size="13.5" font-weight="700" fill="#111111" text-anchor="middle">edp.shipping.delivery-counts-flink</text>
<text x="790.0" y="247.5" font-size="11.5" fill="#555555" text-anchor="middle">upsert-kafka, one row per window</text>
<text x="790.0" y="262.5" font-size="11.5" fill="#555555" text-anchor="middle">a row appears when the window closes</text>
<rect x="640" y="310" width="300" height="70" rx="9" fill="#eef4fb" stroke="#2f6db5" stroke-width="2"/>
<text x="790.0" y="335.5" font-size="13.5" font-weight="700" fill="#111111" text-anchor="middle">psql: select from counts_rw</text>
<text x="790.0" y="352.5" font-size="11.5" fill="#555555" text-anchor="middle">PostgreSQL wire protocol</text>
<text x="790.0" y="367.5" font-size="11.5" fill="#555555" text-anchor="middle">EMIT ON WINDOW CLOSE variant</text>

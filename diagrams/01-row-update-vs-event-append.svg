<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 470" font-family="'Red Hat Text', system-ui, sans-serif" role="img">
<defs><marker id="a" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#555"/></marker><marker id="am" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b8650a"/></marker></defs>
<rect x="20" y="150" width="450" height="300" rx="12" fill="#fafafa" stroke="#ddd"/>
<text x="32" y="170" font-size="12" font-weight="700" fill="#888">Row model: consignment</text>
<rect x="490" y="150" width="450" height="300" rx="12" fill="#fafafa" stroke="#ddd"/>
<text x="502" y="170" font-size="12" font-weight="700" fill="#888">Event model: consignment_event</text>
<rect x="280" y="15" width="400" height="70" rx="9" fill="#f1f5f9" stroke="#64748b" stroke-width="2"/>
<text x="480.0" y="48.0" font-size="13.5" font-weight="700" fill="#111111" text-anchor="middle">ChangeConsignmentStatus</text>
<text x="480.0" y="65.0" font-size="11.5" fill="#555555" text-anchor="middle">consignmentId C-1001, to IN_TRANSIT</text>
<rect x="50" y="185" width="390" height="60" rx="9" fill="#ffffff" stroke="#111111" stroke-width="2"/>
<text x="245.0" y="213.0" font-size="13.5" font-weight="700" fill="#111111" text-anchor="middle">Before: status LOADED</text>
<text x="245.0" y="230.0" font-size="11.5" fill="#555555" text-anchor="middle">one row, id C-1001</text>
<rect x="50" y="285" width="390" height="60" rx="9" fill="#fff8ef" stroke="#e8870c" stroke-width="2"/>
<text x="245.0" y="313.0" font-size="13.5" font-weight="700" fill="#111111" text-anchor="middle">UPDATE consignment SET status = IN_TRANSIT</text>
<text x="245.0" y="330.0" font-size="11.5" fill="#555555" text-anchor="middle">in place</text>
<rect x="50" y="375" width="390" height="60" rx="9" fill="#ffffff" stroke="#111111" stroke-width="2"/>
<text x="245.0" y="403.0" font-size="13.5" font-weight="700" fill="#111111" text-anchor="middle">After: status IN_TRANSIT</text>
<text x="245.0" y="420.0" font-size="11.5" fill="#555555" text-anchor="middle">LOADED is gone</text>
<rect x="520" y="185" width="390" height="60" rx="9" fill="#ffffff" stroke="#111111" stroke-width="2"/>
<text x="715.0" y="213.0" font-size="13.5" font-weight="700" fill="#111111" text-anchor="middle">Before: v1 ConsignmentBooked, v2 LOADED</text>
<text x="715.0" y="230.0" font-size="11.5" fill="#555555" text-anchor="middle">two facts in stream C-1001</text>
<rect x="520" y="285" width="390" height="60" rx="9" fill="#fff8ef" stroke="#e8870c" stroke-width="2"/>
<text x="715.0" y="313.0" font-size="13.5" font-weight="700" fill="#111111" text-anchor="middle">INSERT version 3 ConsignmentStatusChanged</text>
<text x="715.0" y="330.0" font-size="11.5" fill="#555555" text-anchor="middle">unique (stream_id, version)</text>
<rect x="520" y="375" width="390" height="60" rx="9" fill="#ffffff" stroke="#111111" stroke-width="2"/>
<text x="715.0" y="403.0" font-size="13.5" font-weight="700" fill="#111111" text-anchor="middle">After: v1, v2, v3</text>
<text x="715.0" y="420.0" font-size="11.5" fill="#555555" text-anchor="middle">every earlier status is still there</text>
<path d="M400,85 L245,150" fill="none" stroke="#b8650a" stroke-width="2" marker-end="url(#am)"/>
<path d="M560,85 L715,150" fill="none" stroke="#b8650a" stroke-width="2" marker-end="url(#am)"/>
<path d="M245,245 L245,285" fill="none" stroke="#555" stroke-width="2" marker-end="url(#a)"/>
<path d="M245,345 L245,375" fill="none" stroke="#555" stroke-width="2" marker-end="url(#a)"/>
<path d="M715,245 L715,285" fill="none" stroke="#555" stroke-width="2" marker-end="url(#a)"/>
<path d="M715,345 L715,375" fill="none" stroke="#555" stroke-width="2" marker-end="url(#a)"/>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 500" font-family="'Red Hat Text', system-ui, sans-serif" role="img">
<defs><marker id="a" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#555"/></marker><marker id="am" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b8650a"/></marker></defs>
<rect x="20" y="60" width="480" height="400" rx="12" fill="#fff8ef" stroke="#ddd"/>
<text x="32" y="80" font-size="12" font-weight="700" fill="#888">One transaction in order-service</text>
<rect x="520" y="60" width="420" height="400" rx="12" fill="#fafafa" stroke="#ddd"/>
<text x="532" y="80" font-size="12" font-weight="700" fill="#888">Out of the service</text>
<rect x="40" y="100" width="440" height="56" rx="9" fill="#ffffff" stroke="#111111" stroke-width="2"/>
<text x="260.0" y="126.0" font-size="13.5" font-weight="700" fill="#111111" text-anchor="middle">place order</text>
<text x="260.0" y="143.0" font-size="11.5" fill="#555555" text-anchor="middle">append OrderPlaced, schema_version 2, as JSON</text>
<rect x="40" y="185" width="440" height="70" rx="9" fill="#fff8ef" stroke="#e8870c" stroke-width="2"/>
<text x="260.0" y="218.0" font-size="13.5" font-weight="700" fill="#111111" text-anchor="middle">AvroKafkaSerializer, topic edp.orders.placed</text>
<text x="260.0" y="235.0" font-size="11.5" fill="#555555" text-anchor="middle">registers the schema, or the registry refuses and everything rolls back</text>
<rect x="40" y="285" width="440" height="56" rx="9" fill="#f4f4f4" stroke="#888888" stroke-width="1.5"/>
<text x="260.0" y="311.0" font-size="13.5" font-weight="700" fill="#111111" text-anchor="middle">orders.outboxevent row</text>
<text x="260.0" y="328.0" font-size="11.5" fill="#555555" text-anchor="middle">payload bytea: 0, schema id, Avro bytes</text>
<rect x="40" y="370" width="440" height="56" rx="9" fill="#ffffff" stroke="#111111" stroke-width="2"/>
<text x="260.0" y="396.0" font-size="13.5" font-weight="700" fill="#111111" text-anchor="middle">commit</text>
<text x="260.0" y="413.0" font-size="11.5" fill="#555555" text-anchor="middle">event and outbox row together, or neither</text>
<rect x="700" y="100" width="220" height="70" rx="9" fill="#ffffff" stroke="#999999" stroke-width="1.5" stroke-dasharray="6 4"/>
<text x="810.0" y="133.0" font-size="13.5" font-weight="700" fill="#111111" text-anchor="middle">Apicurio Registry</text>
<text x="810.0" y="150.0" font-size="11.5" fill="#555555" text-anchor="middle">edp.orders.placed-value</text>
<rect x="540" y="285" width="380" height="56" rx="9" fill="#f1f5f9" stroke="#64748b" stroke-width="2"/>
<text x="730.0" y="311.0" font-size="13.5" font-weight="700" fill="#111111" text-anchor="middle">Debezium Event Router</text>
<text x="730.0" y="328.0" font-size="11.5" fill="#555555" text-anchor="middle">BinaryDataConverter, bytes unchanged</text>
<rect x="540" y="370" width="380" height="56" rx="9" fill="#f1f5f9" stroke="#64748b" stroke-width="2"/>
<text x="730.0" y="396.0" font-size="13.5" font-weight="700" fill="#111111" text-anchor="middle">edp.orders.placed</text>
<text x="730.0" y="413.0" font-size="11.5" fill="#555555" text-anchor="middle">a consumer resolves the schema id in the registry</text>
<path d="M260,156 L260,185" fill="none" stroke="#555" stroke-width="2" marker-end="url(#a)"/>
<path d="M480,215 L700,150" fill="none" stroke="#555" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#a)"/>
<path d="M260,255 L260,285" fill="none" stroke="#555" stroke-width="2" marker-end="url(#a)"/>
<path d="M260,341 L260,370" fill="none" stroke="#555" stroke-width="2" marker-end="url(#a)"/>
<path d="M480,398 L540,313" fill="none" stroke="#b8650a" stroke-width="2" marker-end="url(#am)"/>
<path d="M730,341 L730,370" fill="none" stroke="#555" stroke-width="2" marker-end="url(#a)"/>
<path d="M810,370 L810,170" fill="none" stroke="#555" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#a)"/>
<text x="480" y="30" font-size="15" fill="#444444" text-anchor="middle" font-weight="700">The schema is checked where the event is written, inside the transaction</text>
<text x="480" y="485" font-size="11" fill="#555555" text-anchor="middle">The schema id travels in the payload, so a consumer resolves it from the registry.</text>
</svg>
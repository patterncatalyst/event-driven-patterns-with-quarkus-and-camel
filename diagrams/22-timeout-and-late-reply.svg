<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 360" font-family="'Red Hat Text', system-ui, sans-serif" role="img">
<defs><marker id="a" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#555"/></marker><marker id="am" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b8650a"/></marker></defs>
<rect x="20" y="60" width="960" height="130" rx="12" fill="#fff8ef" stroke="#ddd"/>
<text x="32" y="80" font-size="12" font-weight="700" fill="#888">payment-service is stopped</text>
<rect x="40" y="95" width="170" height="80" rx="9" fill="#ffffff" stroke="#111111" stroke-width="2"/>
<text x="125.0" y="125.5" font-size="13.5" font-weight="700" fill="#111111" text-anchor="middle">InventoryReserved</text>
<text x="125.0" y="142.5" font-size="11.5" fill="#555555" text-anchor="middle">saga: AWAITING_PAYMENT</text>
<text x="125.0" y="157.5" font-size="11.5" fill="#555555" text-anchor="middle">deadline set</text>
<rect x="235" y="95" width="170" height="80" rx="9" fill="#fff8ef" stroke="#e8870c" stroke-width="2"/>
<text x="320.0" y="125.5" font-size="13.5" font-weight="700" fill="#111111" text-anchor="middle">Deadline passes</text>
<text x="320.0" y="142.5" font-size="11.5" fill="#555555" text-anchor="middle">sweeper: CANCELLED</text>
<text x="320.0" y="157.5" font-size="11.5" fill="#555555" text-anchor="middle">OrderCancelled written</text>
<rect x="430" y="95" width="170" height="80" rx="9" fill="#ffffff" stroke="#111111" stroke-width="2"/>
<text x="515.0" y="125.5" font-size="13.5" font-weight="700" fill="#111111" text-anchor="middle">inventory releases</text>
<text x="515.0" y="142.5" font-size="11.5" fill="#555555" text-anchor="middle">stock is back</text>
<text x="515.0" y="157.5" font-size="11.5" fill="#555555" text-anchor="middle">reservation RELEASED</text>
<rect x="625" y="215" width="170" height="80" rx="9" fill="#eef4fb" stroke="#2f6db5" stroke-width="2"/>
<text x="710.0" y="245.5" font-size="13.5" font-weight="700" fill="#111111" text-anchor="middle">payment-service returns</text>
<text x="710.0" y="262.5" font-size="11.5" fill="#555555" text-anchor="middle">reads cancellations</text>
<text x="710.0" y="277.5" font-size="11.5" fill="#555555" text-anchor="middle">then reservations</text>
<rect x="820" y="215" width="160" height="80" rx="9" fill="#fff8ef" stroke="#e8870c" stroke-width="2"/>
<text x="900.0" y="245.5" font-size="13.5" font-weight="700" fill="#111111" text-anchor="middle">Payment refused</text>
<text x="900.0" y="262.5" font-size="11.5" fill="#555555" text-anchor="middle">no PaymentProcessed</text>
<text x="900.0" y="277.5" font-size="11.5" fill="#555555" text-anchor="middle">no money taken</text>
<rect x="820" y="95" width="160" height="80" rx="9" fill="#ffffff" stroke="#999999" stroke-width="1.5" stroke-dasharray="6 4"/>
<text x="900.0" y="125.5" font-size="13.5" font-weight="700" fill="#111111" text-anchor="middle">Guard off:</text>
<text x="900.0" y="142.5" font-size="11.5" fill="#555555" text-anchor="middle">payment taken for</text>
<text x="900.0" y="157.5" font-size="11.5" fill="#555555" text-anchor="middle">a cancelled order</text>
<path d="M210,135 L235,135" fill="none" stroke="#555" stroke-width="2" marker-end="url(#a)"/>
<path d="M405,135 L430,135" fill="none" stroke="#555" stroke-width="2" marker-end="url(#a)"/>
<path d="M600,175 L625,235" fill="none" stroke="#555" stroke-width="2" marker-end="url(#a)"/>
<path d="M795,255 L820,255" fill="none" stroke="#b8650a" stroke-width="2" marker-end="url(#am)"/>
<path d="M795,235 L900,175" fill="none" stroke="#555" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#a)"/>
<text x="500" y="30" font-size="15" fill="#444444" text-anchor="middle" font-weight="700">A participant that can act after the saga gave up needs a countermeasure</text>
<text x="500" y="335" font-size="13" fill="#555555" text-anchor="middle">The lock is set by OrderCancelled and checked before the payment is taken</text>
</svg>
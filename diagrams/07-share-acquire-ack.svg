<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 500" font-family="'Red Hat Text', system-ui, sans-serif" role="img">
<defs><marker id="a" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#555"/></marker><marker id="am" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b8650a"/></marker></defs>
<rect x="40" y="180" width="190" height="80" rx="9" fill="#ffffff" stroke="#111111" stroke-width="2"/>
<text x="135.0" y="218.0" font-size="13.5" font-weight="700" fill="#111111" text-anchor="middle">available</text>
<text x="135.0" y="235.0" font-size="11.5" fill="#555555" text-anchor="middle">in the share partition</text>
<rect x="290" y="180" width="210" height="80" rx="9" fill="#fff8ef" stroke="#e8870c" stroke-width="2"/>
<text x="395.0" y="218.0" font-size="13.5" font-weight="700" fill="#111111" text-anchor="middle">acquired, locked</text>
<text x="395.0" y="235.0" font-size="11.5" fill="#555555" text-anchor="middle">delivery count + 1</text>
<rect x="590" y="50" width="330" height="60" rx="9" fill="#ffffff" stroke="#111111" stroke-width="2"/>
<text x="755.0" y="78.0" font-size="13.5" font-weight="700" fill="#111111" text-anchor="middle">accept</text>
<text x="755.0" y="95.0" font-size="11.5" fill="#555555" text-anchor="middle">ack(): done, never delivered again</text>
<rect x="590" y="140" width="330" height="60" rx="9" fill="#ffffff" stroke="#111111" stroke-width="2"/>
<text x="755.0" y="168.0" font-size="13.5" font-weight="700" fill="#111111" text-anchor="middle">release</text>
<text x="755.0" y="185.0" font-size="11.5" fill="#555555" text-anchor="middle">nack(release): available again, count kept</text>
<rect x="590" y="230" width="330" height="60" rx="9" fill="#ffffff" stroke="#111111" stroke-width="2"/>
<text x="755.0" y="258.0" font-size="13.5" font-weight="700" fill="#111111" text-anchor="middle">reject</text>
<text x="755.0" y="275.0" font-size="11.5" fill="#555555" text-anchor="middle">nack(reject): archived at once</text>
<rect x="590" y="320" width="330" height="60" rx="9" fill="#ffffff" stroke="#999999" stroke-width="1.5" stroke-dasharray="6 4"/>
<text x="755.0" y="348.0" font-size="13.5" font-weight="700" fill="#111111" text-anchor="middle">lock expires</text>
<text x="755.0" y="365.0" font-size="11.5" fill="#555555" text-anchor="middle">no answer in time: available again</text>
<rect x="290" y="410" width="450" height="56" rx="9" fill="#f1f5f9" stroke="#64748b" stroke-width="2"/>
<text x="515.0" y="436.0" font-size="13.5" font-weight="700" fill="#111111" text-anchor="middle">delivery count reaches the limit: archived</text>
<text x="515.0" y="453.0" font-size="11.5" fill="#555555" text-anchor="middle">a record can be delivered more than once</text>
<path d="M230,220 L290,220" fill="none" stroke="#b8650a" stroke-width="2" marker-end="url(#am)"/>
<path d="M500,200 L590,80" fill="none" stroke="#555" stroke-width="2" marker-end="url(#a)"/>
<path d="M500,210 L590,170" fill="none" stroke="#555" stroke-width="2" marker-end="url(#a)"/>
<path d="M500,230 L590,260" fill="none" stroke="#555" stroke-width="2" marker-end="url(#a)"/>
<path d="M500,250 L590,350" fill="none" stroke="#555" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#a)"/>
<path d="M590,170 L135,180" fill="none" stroke="#555" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#a)"/>
<path d="M590,375 L135,260" fill="none" stroke="#555" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#a)"/>
<path d="M135,260 L290,430" fill="none" stroke="#555" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#a)"/>
<text x="480" y="24" font-size="15" fill="#444444" text-anchor="middle" font-weight="700">Acknowledgement is per record, and the lock bounds how long a worker may hold it</text>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 300" font-family="'Red Hat Text', system-ui, sans-serif" role="img">
<defs><marker id="a" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#555"/></marker><marker id="am" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b8650a"/></marker></defs>
<rect x="20" y="60" width="960" height="170" rx="12" fill="#fafafa" stroke="#ddd"/>
<text x="32" y="80" font-size="12" font-weight="700" fill="#888">Expand, migrate, contract</text>
<rect x="40" y="105" width="270" height="90" rx="9" fill="#ffffff" stroke="#111111" stroke-width="2"/>
<text x="175.0" y="140.5" font-size="13.5" font-weight="700" fill="#111111" text-anchor="middle">1 Expand</text>
<text x="175.0" y="157.5" font-size="11.5" fill="#555555" text-anchor="middle">the producer sends orderId</text>
<text x="175.0" y="172.5" font-size="11.5" fill="#555555" text-anchor="middle">and orderRef</text>
<rect x="365" y="105" width="270" height="90" rx="9" fill="#ffffff" stroke="#111111" stroke-width="2"/>
<text x="500.0" y="140.5" font-size="13.5" font-weight="700" fill="#111111" text-anchor="middle">2 Migrate</text>
<text x="500.0" y="157.5" font-size="11.5" fill="#555555" text-anchor="middle">each consumer is deployed to</text>
<text x="500.0" y="172.5" font-size="11.5" fill="#555555" text-anchor="middle">read orderRef</text>
<rect x="690" y="105" width="270" height="90" rx="9" fill="#fff8ef" stroke="#e8870c" stroke-width="2"/>
<text x="825.0" y="140.5" font-size="13.5" font-weight="700" fill="#111111" text-anchor="middle">3 Contract</text>
<text x="825.0" y="157.5" font-size="11.5" fill="#555555" text-anchor="middle">the producer stops sending</text>
<text x="825.0" y="172.5" font-size="11.5" fill="#555555" text-anchor="middle">orderId</text>
<path d="M310,150 L365,150" fill="none" stroke="#555" stroke-width="2" marker-end="url(#a)"/>
<path d="M635,150 L690,150" fill="none" stroke="#b8650a" stroke-width="2" marker-end="url(#am)"/>
<text x="500" y="30" font-size="15" fill="#444444" text-anchor="middle" font-weight="700">The change that removes a field comes last</text>
<text x="500" y="262" font-size="12" fill="#555555" text-anchor="middle">Contract needs evidence that no consumer still reads orderId</text>
</svg>
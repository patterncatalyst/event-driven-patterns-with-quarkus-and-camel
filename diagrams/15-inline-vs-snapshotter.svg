<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 500" font-family="'Red Hat Text', system-ui, sans-serif" role="img">
<defs><marker id="a" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#555"/></marker><marker id="am" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b8650a"/></marker></defs>
<rect x="20" y="60" width="920" height="180" rx="12" fill="#fff8ef" stroke="#ddd"/>
<text x="32" y="80" font-size="12" font-weight="700" fill="#888">Inline: the command&#x27;s own transaction</text>
<rect x="20" y="270" width="920" height="180" rx="12" fill="#fafafa" stroke="#ddd"/>
<text x="32" y="290" font-size="12" font-weight="700" fill="#888">Out of band: a Camel route on a timer</text>
<rect x="50" y="105" width="190" height="66" rx="9" fill="#ffffff" stroke="#111111" stroke-width="2"/>
<text x="145.0" y="136.0" font-size="13.5" font-weight="700" fill="#111111" text-anchor="middle">command appends</text>
<text x="145.0" y="153.0" font-size="11.5" fill="#555555" text-anchor="middle">event s+N</text>
<rect x="290" y="105" width="200" height="66" rx="9" fill="#fff8ef" stroke="#e8870c" stroke-width="2"/>
<text x="390.0" y="136.0" font-size="13.5" font-weight="700" fill="#111111" text-anchor="middle">same transaction</text>
<text x="390.0" y="153.0" font-size="11.5" fill="#555555" text-anchor="middle">guarded upsert of the snapshot</text>
<rect x="540" y="105" width="190" height="66" rx="9" fill="#ffffff" stroke="#111111" stroke-width="2"/>
<text x="635.0" y="136.0" font-size="13.5" font-weight="700" fill="#111111" text-anchor="middle">commit</text>
<text x="635.0" y="153.0" font-size="11.5" fill="#555555" text-anchor="middle">event and snapshot together</text>
<rect x="770" y="105" width="140" height="66" rx="9" fill="#f1f5f9" stroke="#64748b" stroke-width="2"/>
<text x="840.0" y="136.0" font-size="13.5" font-weight="700" fill="#111111" text-anchor="middle">tail &lt; N</text>
<text x="840.0" y="153.0" font-size="11.5" fill="#555555" text-anchor="middle">always</text>
<rect x="50" y="315" width="190" height="66" rx="9" fill="#ffffff" stroke="#111111" stroke-width="2"/>
<text x="145.0" y="346.0" font-size="13.5" font-weight="700" fill="#111111" text-anchor="middle">burst of commands</text>
<text x="145.0" y="363.0" font-size="11.5" fill="#555555" text-anchor="middle">append, no snapshot</text>
<rect x="290" y="315" width="200" height="66" rx="9" fill="#ffffff" stroke="#999999" stroke-width="1.5" stroke-dasharray="6 4"/>
<text x="390.0" y="346.0" font-size="13.5" font-weight="700" fill="#111111" text-anchor="middle">timer tick</text>
<text x="390.0" y="363.0" font-size="11.5" fill="#555555" text-anchor="middle">sql: streams N or more past</text>
<rect x="540" y="315" width="190" height="66" rx="9" fill="#fff8ef" stroke="#e8870c" stroke-width="2"/>
<text x="635.0" y="346.0" font-size="13.5" font-weight="700" fill="#111111" text-anchor="middle">split, then take(sku)</text>
<text x="635.0" y="363.0" font-size="11.5" fill="#555555" text-anchor="middle">own transaction, same guard</text>
<rect x="770" y="315" width="140" height="66" rx="9" fill="#f1f5f9" stroke="#64748b" stroke-width="2"/>
<text x="840.0" y="346.0" font-size="13.5" font-weight="700" fill="#111111" text-anchor="middle">tail can pass N</text>
<text x="840.0" y="363.0" font-size="11.5" fill="#555555" text-anchor="middle">until the next tick</text>
<path d="M240,138 L290,138" fill="none" stroke="#555" stroke-width="2" marker-end="url(#a)"/>
<path d="M490,138 L540,138" fill="none" stroke="#b8650a" stroke-width="2" marker-end="url(#am)"/>
<path d="M730,138 L770,138" fill="none" stroke="#555" stroke-width="2" marker-end="url(#a)"/>
<path d="M240,348 L290,348" fill="none" stroke="#555" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#a)"/>
<path d="M490,348 L540,348" fill="none" stroke="#b8650a" stroke-width="2" marker-end="url(#am)"/>
<path d="M730,348 L770,348" fill="none" stroke="#555" stroke-width="2" marker-end="url(#a)"/>
<text x="480" y="30" font-size="15" fill="#444444" text-anchor="middle" font-weight="700">Where the snapshot is written decides how long the tail can get</text>
<text x="480" y="480" font-size="11" fill="#555555" text-anchor="middle">Both write the same row, so a load cannot tell which one wrote it.</text>
</svg>
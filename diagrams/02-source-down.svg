<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1190 430" font-family="'Red Hat Text', system-ui, sans-serif" role="img">
<defs><marker id="a" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#555"/></marker><marker id="am" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b8650a"/></marker></defs>
<rect x="20" y="50" width="1150" height="120" rx="12" fill="#fafafa" stroke="#ddd"/>
<text x="32" y="70" font-size="12" font-weight="700" fill="#888">order-service</text>
<rect x="20" y="185" width="1150" height="120" rx="12" fill="#fafafa" stroke="#ddd"/>
<text x="32" y="205" font-size="12" font-weight="700" fill="#888">Kafka topic edp.orders.placed</text>
<rect x="20" y="320" width="1150" height="70" rx="12" fill="#fafafa" stroke="#ddd"/>
<text x="32" y="340" font-size="12" font-weight="700" fill="#888">notification-service</text>
<rect x="40" y="90" width="250" height="60" rx="9" fill="#ffffff" stroke="#111111" stroke-width="2"/>
<text x="165.0" y="118.0" font-size="13.5" font-weight="700" fill="#111111" text-anchor="middle">Place order B</text>
<text x="165.0" y="135.0" font-size="11.5" fill="#555555" text-anchor="middle">committed, event published</text>
<rect x="440" y="90" width="250" height="60" rx="9" fill="#ffffff" stroke="#999999" stroke-width="1.5" stroke-dasharray="6 4"/>
<text x="565.0" y="118.0" font-size="13.5" font-weight="700" fill="#111111" text-anchor="middle">Stopped</text>
<text x="565.0" y="135.0" font-size="11.5" fill="#555555" text-anchor="middle">cannot serve GET /orders/B</text>
<rect x="900" y="90" width="250" height="60" rx="9" fill="#ffffff" stroke="#111111" stroke-width="2"/>
<text x="1025.0" y="118.0" font-size="13.5" font-weight="700" fill="#111111" text-anchor="middle">Started again</text>
<text x="1025.0" y="135.0" font-size="11.5" fill="#555555" text-anchor="middle">serves GET /orders/B</text>
<rect x="40" y="225" width="250" height="60" rx="9" fill="#f1f5f9" stroke="#64748b" stroke-width="2"/>
<text x="165.0" y="253.0" font-size="13.5" font-weight="700" fill="#111111" text-anchor="middle">Record B at offset n</text>
<text x="165.0" y="270.0" font-size="11.5" fill="#555555" text-anchor="middle">committed offset stays at n</text>
<rect x="440" y="225" width="250" height="60" rx="9" fill="#fff8ef" stroke="#e8870c" stroke-width="2"/>
<text x="565.0" y="253.0" font-size="13.5" font-weight="700" fill="#111111" text-anchor="middle">Re-polled</text>
<text x="565.0" y="270.0" font-size="11.5" fill="#555555" text-anchor="middle">breakOnFirstError</text>
<rect x="900" y="225" width="250" height="60" rx="9" fill="#f1f5f9" stroke="#64748b" stroke-width="2"/>
<text x="1025.0" y="253.0" font-size="13.5" font-weight="700" fill="#111111" text-anchor="middle">Offset moves to n+1</text>
<text x="1025.0" y="270.0" font-size="11.5" fill="#555555" text-anchor="middle">after the notification is stored</text>
<rect x="440" y="345" width="250" height="38" rx="9" fill="#ffffff" stroke="#111111" stroke-width="2"/>
<text x="565.0" y="369.5" font-size="13.5" font-weight="700" fill="#111111" text-anchor="middle">Fetch fails, retried, no notification</text>
<rect x="900" y="345" width="250" height="38" rx="9" fill="#fff8ef" stroke="#e8870c" stroke-width="2"/>
<text x="1025.0" y="369.5" font-size="13.5" font-weight="700" fill="#111111" text-anchor="middle">Fetch succeeds, notification for B</text>
<path d="M165,150 L165,225" fill="none" stroke="#555" stroke-width="2" marker-end="url(#a)"/>
<path d="M290,255 L440,255" fill="none" stroke="#b8650a" stroke-width="2" marker-end="url(#am)"/>
<path d="M565,285 L565,345" fill="none" stroke="#555" stroke-width="2" marker-end="url(#a)"/>
<path d="M690,255 L900,255" fill="none" stroke="#b8650a" stroke-width="2" marker-end="url(#am)"/>
<text x="801.0" y="245.0" font-size="11" fill="#ffffff" stroke="#ffffff" stroke-width="3" paint-order="stroke" text-anchor="middle">order-service is back</text>
<text x="801.0" y="245.0" font-size="11" fill="#b8650a" text-anchor="middle">order-service is back</text>
<path d="M1025,150 L1025,225" fill="none" stroke="#555" stroke-width="2" marker-end="url(#a)"/>
<path d="M1025,285 L1025,345" fill="none" stroke="#555" stroke-width="2" marker-end="url(#a)"/>
<text x="595" y="28" font-size="15" fill="#444444" text-anchor="middle" font-weight="700">An unreadable source holds the record; it is neither lost nor skipped</text>
<text x="595" y="415" font-size="11" fill="#555555" text-anchor="middle">Left to right: time. Without breakOnFirstError the offset would move past B and no notification would ever follow.</text>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 360" font-family="'Red Hat Text', system-ui, sans-serif" role="img">
<defs><marker id="a" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#555"/></marker><marker id="am" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b8650a"/></marker></defs>
<rect x="250" y="60" width="450" height="140" rx="12" fill="#fff8ef" stroke="#ddd"/>
<text x="262" y="80" font-size="12" font-weight="700" fill="#888">The delivered channel is paused</text>
<rect x="20" y="100" width="200" height="80" rx="9" fill="#ffffff" stroke="#111111" stroke-width="2"/>
<text x="120.0" y="130.5" font-size="13.5" font-weight="700" fill="#111111" text-anchor="middle">ShipmentDelivered</text>
<text x="120.0" y="147.5" font-size="11.5" fill="#555555" text-anchor="middle">produced at t0</text>
<text x="120.0" y="162.5" font-size="11.5" fill="#555555" text-anchor="middle">group lag becomes 1</text>
<rect x="270" y="100" width="190" height="80" rx="9" fill="#fff8ef" stroke="#e8870c" stroke-width="2"/>
<text x="365.0" y="130.5" font-size="13.5" font-weight="700" fill="#111111" text-anchor="middle">Read at t0 + 1 s</text>
<text x="365.0" y="147.5" font-size="11.5" fill="#555555" text-anchor="middle">SHIPPED</text>
<text x="365.0" y="162.5" font-size="11.5" fill="#555555" text-anchor="middle">asOf: scheduled time</text>
<rect x="490" y="100" width="190" height="80" rx="9" fill="#fff8ef" stroke="#e8870c" stroke-width="2"/>
<text x="585.0" y="130.5" font-size="13.5" font-weight="700" fill="#111111" text-anchor="middle">Read at t0 + 4 s</text>
<text x="585.0" y="147.5" font-size="11.5" fill="#555555" text-anchor="middle">SHIPPED</text>
<text x="585.0" y="162.5" font-size="11.5" fill="#555555" text-anchor="middle">asOf unchanged</text>
<rect x="720" y="100" width="220" height="80" rx="9" fill="#ffffff" stroke="#111111" stroke-width="2"/>
<text x="830.0" y="130.5" font-size="13.5" font-weight="700" fill="#111111" text-anchor="middle">Resume</text>
<text x="830.0" y="147.5" font-size="11.5" fill="#555555" text-anchor="middle">upsert applied, record</text>
<text x="830.0" y="162.5" font-size="11.5" fill="#555555" text-anchor="middle">acknowledged at t1</text>
<rect x="720" y="210" width="220" height="70" rx="9" fill="#f1f5f9" stroke="#64748b" stroke-width="2"/>
<text x="830.0" y="235.5" font-size="13.5" font-weight="700" fill="#111111" text-anchor="middle">Read after t1</text>
<text x="830.0" y="252.5" font-size="11.5" fill="#555555" text-anchor="middle">DELIVERED, asOf is the</text>
<text x="830.0" y="267.5" font-size="11.5" fill="#555555" text-anchor="middle">delivered record time</text>
<rect x="20" y="210" width="680" height="70" rx="9" fill="#f4f4f4" stroke="#888888" stroke-width="1.5"/>
<text x="360.0" y="243.0" font-size="13.5" font-weight="700" fill="#111111" text-anchor="middle">order.view.lag records t1 minus the record timestamp of ShipmentDelivered</text>
<text x="360.0" y="260.0" font-size="11.5" fill="#555555" text-anchor="middle">the paused span appears as the maximum</text>
<path d="M220,140 L270,140" fill="none" stroke="#555" stroke-width="2" marker-end="url(#a)"/>
<path d="M460,140 L490,140" fill="none" stroke="#555" stroke-width="2" marker-end="url(#a)"/>
<path d="M680,140 L720,140" fill="none" stroke="#555" stroke-width="2" marker-end="url(#a)"/>
<path d="M830,180 L830,210" fill="none" stroke="#555" stroke-width="2" marker-end="url(#a)"/>
<text x="480" y="30" font-size="15" fill="#444444" text-anchor="middle" font-weight="700">A read answers from what the view has applied, and says when that was</text>
</svg>
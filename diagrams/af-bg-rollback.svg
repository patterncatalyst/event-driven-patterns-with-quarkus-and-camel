<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 390" font-family="'Red Hat Text', system-ui, sans-serif" role="img">
<defs><marker id="a" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#555"/></marker><marker id="am" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b8650a"/></marker></defs>
<rect x="20" y="60" width="960" height="100" rx="12" fill="#fafafa" stroke="#ddd"/>
<text x="32" y="80" font-size="12" font-weight="700" fill="#888">Green live</text>
<rect x="20" y="180" width="960" height="150" rx="12" fill="#fff8ef" stroke="#ddd"/>
<text x="32" y="200" font-size="12" font-weight="700" fill="#888">Rollback, the same four steps the other way</text>
<rect x="40" y="90" width="920" height="55" rx="9" fill="#fff8ef" stroke="#e8870c" stroke-width="2"/>
<text x="500.0" y="115.5" font-size="13.5" font-weight="700" fill="#111111" text-anchor="middle">notify-green, 3 replicas, group notify-green is serving</text>
<text x="500.0" y="132.5" font-size="11.5" fill="#555555" text-anchor="middle">notify-blue, 0 replicas, its group keeps its old offsets</text>
<rect x="40" y="215" width="210" height="90" rx="9" fill="#ffffff" stroke="#111111" stroke-width="2"/>
<text x="145.0" y="250.5" font-size="13.5" font-weight="700" fill="#111111" text-anchor="middle">1 Scale green to 0</text>
<text x="145.0" y="267.5" font-size="11.5" fill="#555555" text-anchor="middle">wait until the group</text>
<text x="145.0" y="282.5" font-size="11.5" fill="#555555" text-anchor="middle">notify-green is Empty</text>
<rect x="285" y="215" width="210" height="90" rx="9" fill="#ffffff" stroke="#111111" stroke-width="2"/>
<text x="390.0" y="258.0" font-size="13.5" font-weight="700" fill="#111111" text-anchor="middle">2 Export green&#x27;s</text>
<text x="390.0" y="275.0" font-size="11.5" fill="#555555" text-anchor="middle">committed offsets</text>
<rect x="530" y="215" width="210" height="90" rx="9" fill="#ffffff" stroke="#111111" stroke-width="2"/>
<text x="635.0" y="250.5" font-size="13.5" font-weight="700" fill="#111111" text-anchor="middle">3 Import into blue</text>
<text x="635.0" y="267.5" font-size="11.5" fill="#555555" text-anchor="middle">the group exists and holds</text>
<text x="635.0" y="282.5" font-size="11.5" fill="#555555" text-anchor="middle">older offsets: they are replaced</text>
<rect x="775" y="215" width="185" height="90" rx="9" fill="#fff8ef" stroke="#e8870c" stroke-width="2"/>
<text x="867.5" y="250.5" font-size="13.5" font-weight="700" fill="#111111" text-anchor="middle">4 Scale blue to 3</text>
<text x="867.5" y="267.5" font-size="11.5" fill="#555555" text-anchor="middle">resumes after what</text>
<text x="867.5" y="282.5" font-size="11.5" fill="#555555" text-anchor="middle">green processed</text>
<path d="M250,260 L285,260" fill="none" stroke="#555" stroke-width="2" marker-end="url(#a)"/>
<path d="M495,260 L530,260" fill="none" stroke="#555" stroke-width="2" marker-end="url(#a)"/>
<path d="M740,260 L775,260" fill="none" stroke="#b8650a" stroke-width="2" marker-end="url(#am)"/>
<text x="500" y="30" font-size="15" fill="#444444" text-anchor="middle" font-weight="700">Rollback is a cut-over in the other direction</text>
<text x="500" y="360" font-size="12" fill="#555555" text-anchor="middle">Without step 3 blue resumes at its old offsets and reads again everything since the cut-over</text>
</svg>
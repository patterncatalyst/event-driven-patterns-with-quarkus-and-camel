<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1010 500" font-family="'Red Hat Text', system-ui, sans-serif" role="img">
<defs><marker id="a" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#555"/></marker><marker id="am" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b8650a"/></marker></defs>
<rect x="20" y="50" width="290" height="395" rx="12" fill="#fafafa" stroke="#ddd"/>
<text x="32" y="70" font-size="12" font-weight="700" fill="#888">order-service</text>
<rect x="360" y="50" width="290" height="395" rx="12" fill="#fafafa" stroke="#ddd"/>
<text x="372" y="70" font-size="12" font-weight="700" fill="#888">Kafka</text>
<rect x="700" y="50" width="290" height="395" rx="12" fill="#fafafa" stroke="#ddd"/>
<text x="712" y="70" font-size="12" font-weight="700" fill="#888">notification-service</text>
<rect x="40" y="80" width="250" height="60" rx="9" fill="#ffffff" stroke="#111111" stroke-width="2"/>
<text x="165.0" y="108.0" font-size="13.5" font-weight="700" fill="#111111" text-anchor="middle">1. Commit the order</text>
<text x="165.0" y="125.0" font-size="11.5" fill="#555555" text-anchor="middle">orders row, status PLACED</text>
<rect x="40" y="180" width="250" height="60" rx="9" fill="#fff8ef" stroke="#e8870c" stroke-width="2"/>
<text x="165.0" y="208.0" font-size="13.5" font-weight="700" fill="#111111" text-anchor="middle">2. Publish OrderPlaced</text>
<text x="165.0" y="225.0" font-size="11.5" fill="#555555" text-anchor="middle">after commit, order id only</text>
<rect x="380" y="180" width="250" height="60" rx="9" fill="#f1f5f9" stroke="#64748b" stroke-width="2"/>
<text x="505.0" y="208.0" font-size="13.5" font-weight="700" fill="#111111" text-anchor="middle">edp.orders.placed</text>
<text x="505.0" y="225.0" font-size="11.5" fill="#555555" text-anchor="middle">key O-1001, value: the id</text>
<rect x="720" y="180" width="250" height="60" rx="9" fill="#ffffff" stroke="#111111" stroke-width="2"/>
<text x="845.0" y="208.0" font-size="13.5" font-weight="700" fill="#111111" text-anchor="middle">3. Consume the record</text>
<text x="845.0" y="225.0" font-size="11.5" fill="#555555" text-anchor="middle">offset stays until step 5</text>
<rect x="720" y="280" width="250" height="60" rx="9" fill="#fff8ef" stroke="#e8870c" stroke-width="2"/>
<text x="845.0" y="308.0" font-size="13.5" font-weight="700" fill="#111111" text-anchor="middle">4. Fetch the order</text>
<text x="845.0" y="325.0" font-size="11.5" fill="#555555" text-anchor="middle">Camel http, GET /orders/O-1001</text>
<rect x="40" y="280" width="250" height="60" rx="9" fill="#ffffff" stroke="#111111" stroke-width="2"/>
<text x="165.0" y="308.0" font-size="13.5" font-weight="700" fill="#111111" text-anchor="middle">Serve the order</text>
<text x="165.0" y="325.0" font-size="11.5" fill="#555555" text-anchor="middle">customer, amount, status now</text>
<rect x="720" y="375" width="250" height="50" rx="9" fill="#ffffff" stroke="#111111" stroke-width="2"/>
<text x="845.0" y="398.0" font-size="13.5" font-weight="700" fill="#111111" text-anchor="middle">5. Store the Notification</text>
<text x="845.0" y="415.0" font-size="11.5" fill="#555555" text-anchor="middle">facts as read at fetch time</text>
<path d="M165,140 L165,180" fill="none" stroke="#555" stroke-width="2" marker-end="url(#a)"/>
<path d="M290,210 L380,210" fill="none" stroke="#b8650a" stroke-width="2" marker-end="url(#am)"/>
<path d="M630,210 L720,210" fill="none" stroke="#b8650a" stroke-width="2" marker-end="url(#am)"/>
<path d="M845,240 L845,280" fill="none" stroke="#555" stroke-width="2" marker-end="url(#a)"/>
<path d="M720,297 L290,297" fill="none" stroke="#b8650a" stroke-width="2" marker-end="url(#am)"/>
<text x="511.0" y="289.0" font-size="11" fill="#ffffff" stroke="#ffffff" stroke-width="3" paint-order="stroke" text-anchor="middle">GET</text>
<text x="511.0" y="289.0" font-size="11" fill="#b8650a" text-anchor="middle">GET</text>
<path d="M290,325 L720,325" fill="none" stroke="#555" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#a)"/>
<text x="511.0" y="339.0" font-size="11" fill="#ffffff" stroke="#ffffff" stroke-width="3" paint-order="stroke" text-anchor="middle">200 JSON</text>
<text x="511.0" y="339.0" font-size="11" fill="#555" text-anchor="middle">200 JSON</text>
<path d="M845,340 L845,375" fill="none" stroke="#555" stroke-width="2" marker-end="url(#a)"/>
<text x="505" y="28" font-size="15" fill="#444444" text-anchor="middle" font-weight="700">The event says what happened; the consumer asks the source for the rest</text>
<text x="505" y="470" font-size="11" fill="#555555" text-anchor="middle">The fetch reads the order as it is now, which may differ from the order at event time.</text>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 360" font-family="'Red Hat Text', system-ui, sans-serif" role="img">
<defs><marker id="a" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#555"/></marker><marker id="am" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b8650a"/></marker></defs>
<rect x="20" y="60" width="960" height="250" rx="12" fill="#fafafa" stroke="#ddd"/>
<text x="32" y="80" font-size="12" font-weight="700" fill="#888">A new topic for the new shape</text>
<rect x="40" y="110" width="170" height="80" rx="9" fill="#f4f4f4" stroke="#888888" stroke-width="1.5"/>
<text x="125.0" y="140.5" font-size="13.5" font-weight="700" fill="#111111" text-anchor="middle">old topic</text>
<text x="125.0" y="157.5" font-size="11.5" fill="#555555" text-anchor="middle">shape v1</text>
<text x="125.0" y="172.5" font-size="11.5" fill="#555555" text-anchor="middle">retired when retention passes</text>
<rect x="280" y="110" width="190" height="80" rx="9" fill="#ffffff" stroke="#111111" stroke-width="2"/>
<text x="375.0" y="148.0" font-size="13.5" font-weight="700" fill="#111111" text-anchor="middle">migration consumer</text>
<text x="375.0" y="165.0" font-size="11.5" fill="#555555" text-anchor="middle">reads v1, writes v2</text>
<rect x="540" y="110" width="170" height="80" rx="9" fill="#f4f4f4" stroke="#888888" stroke-width="1.5"/>
<text x="625.0" y="148.0" font-size="13.5" font-weight="700" fill="#111111" text-anchor="middle">new topic</text>
<text x="625.0" y="165.0" font-size="11.5" fill="#555555" text-anchor="middle">shape v2</text>
<rect x="780" y="110" width="180" height="80" rx="9" fill="#eef4fb" stroke="#2f6db5" stroke-width="2"/>
<text x="870.0" y="148.0" font-size="13.5" font-weight="700" fill="#111111" text-anchor="middle">v2 consumers</text>
<text x="870.0" y="165.0" font-size="11.5" fill="#555555" text-anchor="middle">read the new topic</text>
<rect x="280" y="220" width="190" height="60" rx="9" fill="#eef4fb" stroke="#2f6db5" stroke-width="2"/>
<text x="375.0" y="248.0" font-size="13.5" font-weight="700" fill="#111111" text-anchor="middle">v2 producer</text>
<text x="375.0" y="265.0" font-size="11.5" fill="#555555" text-anchor="middle">writes the new topic</text>
<rect x="40" y="220" width="170" height="60" rx="9" fill="#ffffff" stroke="#999999" stroke-width="1.5" stroke-dasharray="6 4"/>
<text x="125.0" y="248.0" font-size="13.5" font-weight="700" fill="#111111" text-anchor="middle">v1 producer</text>
<text x="125.0" y="265.0" font-size="11.5" fill="#555555" text-anchor="middle">stops after the cut</text>
<path d="M210,150 L280,150" fill="none" stroke="#555" stroke-width="2" marker-end="url(#a)"/>
<path d="M470,150 L540,150" fill="none" stroke="#b8650a" stroke-width="2" marker-end="url(#am)"/>
<path d="M710,150 L780,150" fill="none" stroke="#555" stroke-width="2" marker-end="url(#a)"/>
<path d="M470,250 L625,190" fill="none" stroke="#555" stroke-width="2" marker-end="url(#a)"/>
<path d="M125,220 L125,190" fill="none" stroke="#555" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#a)"/>
<text x="500" y="30" font-size="15" fill="#444444" text-anchor="middle" font-weight="700">An incompatible change gets its own topic</text>
<text x="500" y="336" font-size="12" fill="#555555" text-anchor="middle">The costs are a topic, a consumer, and a window with two sources of truth</text>
</svg>
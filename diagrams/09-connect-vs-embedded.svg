<path d="M805,200 L805,300" fill="none" stroke="#555" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#a)"/>
<text x="813.0" y="254.0" font-size="11" fill="#ffffff" stroke="#ffffff" stroke-width="3" paint-order="stroke" text-anchor="middle">publishes</text>
<text x="813.0" y="254.0" font-size="11" fill="#555" text-anchor="middle">publishes</text>
<text x="480" y="24" font-size="15" fill="#444444" text-anchor="middle" font-weight="700">Two readers, two slots: each one holds its own place in the log</text>
<text x="480" y="450" font-size="11" fill="#555555" text-anchor="middle">Embedded keeps one process and one fewer hop. Connect keeps the envelopes, the REST API and the offsets in Kafka.</text>
</svg>
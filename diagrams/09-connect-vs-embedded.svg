<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 470" font-family="'Red Hat Text', system-ui, sans-serif" role="img">
<defs><marker id="a" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#555"/></marker><marker id="am" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b8650a"/></marker></defs>
<rect x="20" y="60" width="920" height="170" rx="12" fill="#fafafa" stroke="#ddd"/>
<text x="32" y="80" font-size="12" font-weight="700" fill="#888">Kafka Connect</text>
<rect x="20" y="250" width="920" height="170" rx="12" fill="#fafafa" stroke="#ddd"/>
<text x="32" y="270" font-size="12" font-weight="700" fill="#888">Embedded in the service</text>
<rect x="40" y="110" width="150" height="90" rx="9" fill="#f4f4f4" stroke="#888888" stroke-width="1.5"/>
<text x="115.0" y="153.0" font-size="13.5" font-weight="700" fill="#111111" text-anchor="middle">PostgreSQL</text>
<text x="115.0" y="170.0" font-size="11.5" fill="#555555" text-anchor="middle">slot edp_inventory</text>
<rect x="230" y="110" width="190" height="90" rx="9" fill="#eef4fb" stroke="#2f6db5" stroke-width="2"/>
<text x="325.0" y="145.5" font-size="13.5" font-weight="700" fill="#111111" text-anchor="middle">Connect worker</text>
<text x="325.0" y="162.5" font-size="11.5" fill="#555555" text-anchor="middle">connector, offsets in</text>
<text x="325.0" y="177.5" font-size="11.5" fill="#555555" text-anchor="middle">a Kafka topic</text>
<rect x="460" y="110" width="190" height="90" rx="9" fill="#ffffff" stroke="#111111" stroke-width="2"/>
<text x="555.0" y="153.0" font-size="13.5" font-weight="700" fill="#111111" text-anchor="middle">item-changes</text>
<text x="555.0" y="170.0" font-size="11.5" fill="#555555" text-anchor="middle">envelopes, replayable</text>
<rect x="690" y="110" width="230" height="90" rx="9" fill="#fff8ef" stroke="#e8870c" stroke-width="2"/>
<text x="805.0" y="153.0" font-size="13.5" font-weight="700" fill="#111111" text-anchor="middle">inventory-service</text>
<text x="805.0" y="170.0" font-size="11.5" fill="#555555" text-anchor="middle">Camel route reads the topic</text>
<rect x="40" y="300" width="150" height="90" rx="9" fill="#f4f4f4" stroke="#888888" stroke-width="1.5"/>
<text x="115.0" y="343.0" font-size="13.5" font-weight="700" fill="#111111" text-anchor="middle">PostgreSQL</text>
<text x="115.0" y="360.0" font-size="11.5" fill="#555555" text-anchor="middle">slot edp_inventory_embedded</text>
<rect x="230" y="300" width="420" height="90" rx="9" fill="#fff8ef" stroke="#e8870c" stroke-width="2"/>
<text x="440.0" y="335.5" font-size="13.5" font-weight="700" fill="#111111" text-anchor="middle">inventory-service, one process</text>
<text x="440.0" y="352.5" font-size="11.5" fill="#555555" text-anchor="middle">debezium-postgres route, offsets in a file</text>
<text x="440.0" y="367.5" font-size="11.5" fill="#555555" text-anchor="middle">same mapper, no envelope on Kafka</text>
<rect x="690" y="300" width="230" height="90" rx="9" fill="#ffffff" stroke="#111111" stroke-width="2"/>
<text x="805.0" y="343.0" font-size="13.5" font-weight="700" fill="#111111" text-anchor="middle">edp.inventory.items</text>
<text x="805.0" y="360.0" font-size="11.5" fill="#555555" text-anchor="middle">same documents</text>
<path d="M190,155 L230,155" fill="none" stroke="#555" stroke-width="2" marker-end="url(#a)"/>
<path d="M420,155 L460,155" fill="none" stroke="#b8650a" stroke-width="2" marker-end="url(#am)"/>
<path d="M650,155 L690,155" fill="none" stroke="#b8650a" stroke-width="2" marker-end="url(#am)"/>
<path d="M190,345 L230,345" fill="none" stroke="#555" stroke-width="2" marker-end="url(#a)"/>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" font-family="'Red Hat Text', system-ui, sans-serif" role="img">
<defs><marker id="a" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#555"/></marker><marker id="am" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b8650a"/></marker></defs>
<rect x="20" y="60" width="620" height="430" rx="12" fill="#fff8ef" stroke="#ddd"/>
<text x="32" y="80" font-size="12" font-weight="700" fill="#888">One transaction in order-service</text>
<rect x="670" y="60" width="270" height="430" rx="12" fill="#fafafa" stroke="#ddd"/>
<text x="682" y="80" font-size="12" font-weight="700" fill="#888">Out of the service</text>
<rect x="40" y="100" width="280" height="56" rx="9" fill="#ffffff" stroke="#111111" stroke-width="2"/>
<text x="180.0" y="126.0" font-size="13.5" font-weight="700" fill="#111111" text-anchor="middle">Command</text>
<text x="180.0" y="143.0" font-size="11.5" fill="#555555" text-anchor="middle">REST, PaymentProcessed, ShipmentScheduled</text>
<rect x="350" y="100" width="270" height="56" rx="9" fill="#ffffff" stroke="#111111" stroke-width="2"/>
<text x="485.0" y="126.0" font-size="13.5" font-weight="700" fill="#111111" text-anchor="middle">EventStore.load(orderId)</text>
<text x="485.0" y="143.0" font-size="11.5" fill="#555555" text-anchor="middle">rows in version order</text>
<rect x="350" y="190" width="270" height="56" rx="9" fill="#ffffff" stroke="#111111" stroke-width="2"/>
<text x="485.0" y="216.0" font-size="13.5" font-weight="700" fill="#111111" text-anchor="middle">OrderAggregate.rehydrate</text>
<text x="485.0" y="233.0" font-size="11.5" fill="#555555" text-anchor="middle">fold the events into the state</text>
<rect x="40" y="190" width="280" height="56" rx="9" fill="#fff8ef" stroke="#e8870c" stroke-width="2"/>
<text x="180.0" y="216.0" font-size="13.5" font-weight="700" fill="#111111" text-anchor="middle">decide(command)</text>
<text x="180.0" y="233.0" font-size="11.5" fill="#555555" text-anchor="middle">refuse, or return the new events</text>
<rect x="40" y="290" width="580" height="70" rx="9" fill="#fff8ef" stroke="#e8870c" stroke-width="2"/>
<text x="330.0" y="323.0" font-size="13.5" font-weight="700" fill="#111111" text-anchor="middle">EventStore.append at the loaded version + 1</text>
<text x="330.0" y="340.0" font-size="11.5" fill="#555555" text-anchor="middle">unique (stream_id, version): a second writer at the same version fails</text>
<rect x="40" y="390" width="580" height="70" rx="9" fill="#f4f4f4" stroke="#888888" stroke-width="1.5"/>
<text x="330.0" y="423.0" font-size="13.5" font-weight="700" fill="#111111" text-anchor="middle">orders.events: every event</text>
<text x="330.0" y="440.0" font-size="11.5" fill="#555555" text-anchor="middle">orders.outboxevent: a row for OrderPlaced and OrderCancelled only</text>
<rect x="700" y="290" width="210" height="70" rx="9" fill="#f1f5f9" stroke="#64748b" stroke-width="2"/>
<text x="805.0" y="323.0" font-size="13.5" font-weight="700" fill="#111111" text-anchor="middle">Debezium connector</text>
<text x="805.0" y="340.0" font-size="11.5" fill="#555555" text-anchor="middle">and Event Router</text>
<rect x="700" y="390" width="210" height="70" rx="9" fill="#f1f5f9" stroke="#64748b" stroke-width="2"/>
<text x="805.0" y="423.0" font-size="13.5" font-weight="700" fill="#111111" text-anchor="middle">Kafka topics</text>
<text x="805.0" y="440.0" font-size="11.5" fill="#555555" text-anchor="middle">edp.orders.placed, edp.orders.cancelled</text>
<path d="M320,128 L350,128" fill="none" stroke="#555" stroke-width="2" marker-end="url(#a)"/>
<path d="M485,156 L485,190" fill="none" stroke="#555" stroke-width="2" marker-end="url(#a)"/>
<path d="M350,218 L320,218" fill="none" stroke="#555" stroke-width="2" marker-end="url(#a)"/>
<path d="M180,246 L180,290" fill="none" stroke="#555" stroke-width="2" marker-end="url(#a)"/>
<path d="M330,360 L330,390" fill="none" stroke="#555" stroke-width="2" marker-end="url(#a)"/>
<path d="M620,425 L700,325" fill="none" stroke="#b8650a" stroke-width="2" marker-end="url(#am)"/>
<path d="M805,360 L805,390" fill="none" stroke="#555" stroke-width="2" marker-end="url(#a)"/>
<text x="480" y="30" font-size="15" fill="#444444" text-anchor="middle" font-weight="700">The stream is the state; the outbox carries only the public events</text>
</svg>
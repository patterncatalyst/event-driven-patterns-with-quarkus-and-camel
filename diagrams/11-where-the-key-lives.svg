<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 440" font-family="'Red Hat Text', system-ui, sans-serif" role="img">
<defs><marker id="a" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#555"/></marker><marker id="am" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b8650a"/></marker></defs>
<rect x="20" y="60" width="920" height="120" rx="12" fill="#fff8ef" stroke="#ddd"/>
<text x="32" y="80" font-size="12" font-weight="700" fill="#888">Committed with the effect: no gap</text>
<rect x="20" y="210" width="920" height="200" rx="12" fill="#fafafa" stroke="#ddd"/>
<text x="32" y="230" font-size="12" font-weight="700" fill="#888">Committed apart from the effect: a crash between the two writes loses or repeats it</text>
<rect x="40" y="105" width="290" height="56" rx="9" fill="#fff8ef" stroke="#e8870c" stroke-width="2"/>
<text x="185.0" y="131.0" font-size="13.5" font-weight="700" fill="#111111" text-anchor="middle">inbox table</text>
<text x="185.0" y="148.0" font-size="11.5" fill="#555555" text-anchor="middle">in the handler&#x27;s transaction</text>
<rect x="335" y="105" width="290" height="56" rx="9" fill="#fff8ef" stroke="#e8870c" stroke-width="2"/>
<text x="480.0" y="131.0" font-size="13.5" font-weight="700" fill="#111111" text-anchor="middle">JpaMessageIdRepository</text>
<text x="480.0" y="148.0" font-size="11.5" fill="#555555" text-anchor="middle">inside a transacted route</text>
<rect x="630" y="105" width="290" height="56" rx="9" fill="#ffffff" stroke="#111111" stroke-width="2"/>
<text x="775.0" y="131.0" font-size="13.5" font-weight="700" fill="#111111" text-anchor="middle">natural idempotence</text>
<text x="775.0" y="148.0" font-size="11.5" fill="#555555" text-anchor="middle">an upsert keyed by the order id</text>
<rect x="40" y="250" width="440" height="56" rx="9" fill="#ffffff" stroke="#999999" stroke-width="1.5" stroke-dasharray="6 4"/>
<text x="260.0" y="276.0" font-size="13.5" font-weight="700" fill="#111111" text-anchor="middle">JpaMessageIdRepository</text>
<text x="260.0" y="293.0" font-size="11.5" fill="#555555" text-anchor="middle">route not transacted: key commits alone</text>
<rect x="500" y="250" width="420" height="56" rx="9" fill="#ffffff" stroke="#999999" stroke-width="1.5" stroke-dasharray="6 4"/>
<text x="710.0" y="276.0" font-size="13.5" font-weight="700" fill="#111111" text-anchor="middle">JdbcMessageIdRepository</text>
<text x="710.0" y="293.0" font-size="11.5" fill="#555555" text-anchor="middle">under JTA: fails on every message</text>
<rect x="40" y="330" width="440" height="56" rx="9" fill="#ffffff" stroke="#999999" stroke-width="1.5" stroke-dasharray="6 4"/>
<text x="260.0" y="356.0" font-size="13.5" font-weight="700" fill="#111111" text-anchor="middle">KafkaIdempotentRepository</text>
<text x="260.0" y="373.0" font-size="11.5" fill="#555555" text-anchor="middle">a topic, never in the database transaction</text>
<rect x="500" y="330" width="420" height="56" rx="9" fill="#ffffff" stroke="#999999" stroke-width="1.5" stroke-dasharray="6 4"/>
<text x="710.0" y="356.0" font-size="13.5" font-weight="700" fill="#111111" text-anchor="middle">a cache or a set in another store</text>
<text x="710.0" y="373.0" font-size="11.5" fill="#555555" text-anchor="middle">its own commit, its own failure</text>
<text x="480" y="30" font-size="15" fill="#444444" text-anchor="middle" font-weight="700">Where the processed-id key lives</text>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" font-family="'Red Hat Text', system-ui, sans-serif" role="img">
<defs><marker id="a" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#555"/></marker><marker id="am" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b8650a"/></marker></defs>
<rect x="20" y="60" width="920" height="220" rx="12" fill="#fff8ef" stroke="#ddd"/>
<text x="32" y="80" font-size="12" font-weight="700" fill="#888">Decide again after a conflict</text>
<rect x="20" y="300" width="920" height="220" rx="12" fill="#fafafa" stroke="#ddd"/>
<text x="32" y="320" font-size="12" font-weight="700" fill="#888">Append the old decision at the new head</text>
<rect x="40" y="100" width="200" height="70" rx="9" fill="#ffffff" stroke="#111111" stroke-width="2"/>
<text x="140.0" y="125.5" font-size="13.5" font-weight="700" fill="#111111" text-anchor="middle">Cancel loads v2</text>
<text x="140.0" y="142.5" font-size="11.5" fill="#555555" text-anchor="middle">status PAID</text>
<text x="140.0" y="157.5" font-size="11.5" fill="#555555" text-anchor="middle">decides OrderCancelled</text>
<rect x="270" y="100" width="200" height="70" rx="9" fill="#ffffff" stroke="#111111" stroke-width="2"/>
<text x="370.0" y="133.0" font-size="13.5" font-weight="700" fill="#111111" text-anchor="middle">Shipment appends v3</text>
<text x="370.0" y="150.0" font-size="11.5" fill="#555555" text-anchor="middle">OrderShipped commits first</text>
<rect x="500" y="100" width="200" height="70" rx="9" fill="#fff8ef" stroke="#e8870c" stroke-width="2"/>
<text x="600.0" y="133.0" font-size="13.5" font-weight="700" fill="#111111" text-anchor="middle">Cancel appends v3</text>
<text x="600.0" y="150.0" font-size="11.5" fill="#555555" text-anchor="middle">unique constraint: conflict</text>
<rect x="730" y="100" width="190" height="70" rx="9" fill="#fff8ef" stroke="#e8870c" stroke-width="2"/>
<text x="825.0" y="133.0" font-size="13.5" font-weight="700" fill="#111111" text-anchor="middle">Cancel loads v3 again</text>
<text x="825.0" y="150.0" font-size="11.5" fill="#555555" text-anchor="middle">SHIPPED to CANCELLED</text>
<rect x="500" y="190" width="420" height="56" rx="9" fill="#f1f5f9" stroke="#64748b" stroke-width="2"/>
<text x="710.0" y="216.0" font-size="13.5" font-weight="700" fill="#111111" text-anchor="middle">Answer 409, no cancelled record</text>
<text x="710.0" y="233.0" font-size="11.5" fill="#555555" text-anchor="middle">the stream stays at versions 1 to 3</text>
<rect x="40" y="340" width="200" height="70" rx="9" fill="#ffffff" stroke="#111111" stroke-width="2"/>
<text x="140.0" y="365.5" font-size="13.5" font-weight="700" fill="#111111" text-anchor="middle">Cancel loads v2</text>
<text x="140.0" y="382.5" font-size="11.5" fill="#555555" text-anchor="middle">status PAID</text>
<text x="140.0" y="397.5" font-size="11.5" fill="#555555" text-anchor="middle">decides OrderCancelled</text>
<rect x="270" y="340" width="200" height="70" rx="9" fill="#ffffff" stroke="#111111" stroke-width="2"/>
<text x="370.0" y="373.0" font-size="13.5" font-weight="700" fill="#111111" text-anchor="middle">Shipment appends v3</text>
<text x="370.0" y="390.0" font-size="11.5" fill="#555555" text-anchor="middle">OrderShipped commits first</text>
<rect x="500" y="340" width="200" height="70" rx="9" fill="#ffffff" stroke="#999999" stroke-width="1.5" stroke-dasharray="6 4"/>
<text x="600.0" y="373.0" font-size="13.5" font-weight="700" fill="#111111" text-anchor="middle">Cancel appends v3</text>
<text x="600.0" y="390.0" font-size="11.5" fill="#555555" text-anchor="middle">conflict</text>
<rect x="730" y="340" width="190" height="70" rx="9" fill="#ffffff" stroke="#999999" stroke-width="1.5" stroke-dasharray="6 4"/>
<text x="825.0" y="373.0" font-size="13.5" font-weight="700" fill="#111111" text-anchor="middle">Cancel appends v4</text>
<text x="825.0" y="390.0" font-size="11.5" fill="#555555" text-anchor="middle">the decision is not checked</text>
<rect x="500" y="430" width="420" height="56" rx="9" fill="#f1f5f9" stroke="#64748b" stroke-width="2"/>
<text x="710.0" y="456.0" font-size="13.5" font-weight="700" fill="#111111" text-anchor="middle">OrderCancelled after OrderShipped</text>
<text x="710.0" y="473.0" font-size="11.5" fill="#555555" text-anchor="middle">and a cancelled record on Kafka</text>
<path d="M240,135 L270,135" fill="none" stroke="#555" stroke-width="2" marker-end="url(#a)"/>
<path d="M470,135 L500,135" fill="none" stroke="#555" stroke-width="2" marker-end="url(#a)"/>
<path d="M700,135 L730,135" fill="none" stroke="#555" stroke-width="2" marker-end="url(#a)"/>
<path d="M825,170 L825,190" fill="none" stroke="#555" stroke-width="2" marker-end="url(#a)"/>
<path d="M240,375 L270,375" fill="none" stroke="#555" stroke-width="2" marker-end="url(#a)"/>
<path d="M470,375 L500,375" fill="none" stroke="#555" stroke-width="2" marker-end="url(#a)"/>
<path d="M700,375 L730,375" fill="none" stroke="#555" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#a)"/>
<path d="M825,410 L825,430" fill="none" stroke="#555" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#a)"/>
<text x="480" y="30" font-size="15" fill="#444444" text-anchor="middle" font-weight="700">A retry reloads and decides again, or the caller learns of the conflict</text>
</svg>
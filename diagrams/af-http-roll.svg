<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 360" font-family="'Red Hat Text', system-ui, sans-serif" role="img">
<defs><marker id="a" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#555"/></marker><marker id="am" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b8650a"/></marker></defs>
<rect x="20" y="60" width="960" height="250" rx="12" fill="#fafafa" stroke="#ddd"/>
<text x="32" y="80" font-size="12" font-weight="700" fill="#888">order-service, two replicas, readiness probe, maxUnavailable 0</text>
<rect x="40" y="120" width="150" height="80" rx="9" fill="#eef4fb" stroke="#2f6db5" stroke-width="2"/>
<text x="115.0" y="150.5" font-size="13.5" font-weight="700" fill="#111111" text-anchor="middle">HTTP client</text>
<text x="115.0" y="167.5" font-size="11.5" fill="#555555" text-anchor="middle">POST /orders</text>
<text x="115.0" y="182.5" font-size="11.5" fill="#555555" text-anchor="middle">about 80 per second</text>
<rect x="250" y="120" width="170" height="80" rx="9" fill="#f4f4f4" stroke="#888888" stroke-width="1.5"/>
<text x="335.0" y="150.5" font-size="13.5" font-weight="700" fill="#111111" text-anchor="middle">Service</text>
<text x="335.0" y="167.5" font-size="11.5" fill="#555555" text-anchor="middle">NodePort 30080</text>
<text x="335.0" y="182.5" font-size="11.5" fill="#555555" text-anchor="middle">ready pods only</text>
<rect x="500" y="90" width="200" height="60" rx="9" fill="#ffffff" stroke="#111111" stroke-width="2"/>
<text x="600.0" y="118.0" font-size="13.5" font-weight="700" fill="#111111" text-anchor="middle">pod A, ready</text>
<text x="600.0" y="135.0" font-size="11.5" fill="#555555" text-anchor="middle">answers 201</text>
<rect x="500" y="190" width="200" height="60" rx="9" fill="#ffffff" stroke="#999999" stroke-width="1.5" stroke-dasharray="6 4"/>
<text x="600.0" y="218.0" font-size="13.5" font-weight="700" fill="#111111" text-anchor="middle">pod B, being removed</text>
<text x="600.0" y="235.0" font-size="11.5" fill="#555555" text-anchor="middle">a request in flight is reset</text>
<rect x="780" y="90" width="180" height="60" rx="9" fill="#fff8ef" stroke="#e8870c" stroke-width="2"/>
<text x="870.0" y="118.0" font-size="13.5" font-weight="700" fill="#111111" text-anchor="middle">edp.orders.placed</text>
<text x="870.0" y="135.0" font-size="11.5" fill="#555555" text-anchor="middle">one event per 201</text>
<rect x="780" y="190" width="180" height="60" rx="9" fill="#ffffff" stroke="#999999" stroke-width="1.5" stroke-dasharray="6 4"/>
<text x="870.0" y="218.0" font-size="13.5" font-weight="700" fill="#111111" text-anchor="middle">one event or none;</text>
<text x="870.0" y="235.0" font-size="11.5" fill="#555555" text-anchor="middle">the retry answers 201 or 409</text>
<path d="M190,160 L250,160" fill="none" stroke="#555" stroke-width="2" marker-end="url(#a)"/>
<path d="M420,150 L500,120" fill="none" stroke="#555" stroke-width="2" marker-end="url(#a)"/>
<path d="M420,170 L500,220" fill="none" stroke="#555" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#a)"/>
<path d="M700,120 L780,120" fill="none" stroke="#b8650a" stroke-width="2" marker-end="url(#am)"/>
<path d="M700,220 L780,220" fill="none" stroke="#555" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#a)"/>
<text x="40" y="225" font-size="12" fill="#b8650a" text-anchor="start">A failed request is</text>
<text x="40" y="241" font-size="12" fill="#b8650a" text-anchor="start">retried by the client</text>
<text x="500" y="30" font-size="15" fill="#444444" text-anchor="middle" font-weight="700">A removed pod can drop requests in flight; the client retries</text>
<text x="500" y="335" font-size="12" fill="#555555" text-anchor="middle">quarkus.shutdown.timeout and quarkus.shutdown.delay drain running requests and do not remove every failure</text>
</svg>
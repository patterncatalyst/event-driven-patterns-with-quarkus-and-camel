<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 470" font-family="'Red Hat Text', system-ui, sans-serif" role="img">
<defs><marker id="a" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#555"/></marker><marker id="am" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b8650a"/></marker></defs>
<rect x="20" y="60" width="940" height="150" rx="12" fill="#fff8ef" stroke="#ddd"/>
<text x="32" y="80" font-size="12" font-weight="700" fill="#888">Lateness is 10 s: a window closes when the newest event time passes its end plus 10 s</text>
<rect x="20" y="240" width="940" height="200" rx="12" fill="#fafafa" stroke="#ddd"/>
<text x="32" y="260" font-size="12" font-weight="700" fill="#888">Later, after window 4 opened</text>
<rect x="40" y="100" width="200" height="90" rx="9" fill="#ffffff" stroke="#111111" stroke-width="2"/>
<text x="140.0" y="135.5" font-size="13.5" font-weight="700" fill="#111111" text-anchor="middle">Window 1: 0 to 60 s</text>
<text x="140.0" y="152.5" font-size="11.5" fill="#555555" text-anchor="middle">FASTLINE 5, 20, 40 s</text>
<text x="140.0" y="167.5" font-size="11.5" fill="#555555" text-anchor="middle">AIRCO 30, 50 s</text>
<rect x="270" y="100" width="200" height="90" rx="9" fill="#ffffff" stroke="#111111" stroke-width="2"/>
<text x="370.0" y="135.5" font-size="13.5" font-weight="700" fill="#111111" text-anchor="middle">62 s AIRCO</text>
<text x="370.0" y="152.5" font-size="11.5" fill="#555555" text-anchor="middle">opens window 2</text>
<text x="370.0" y="167.5" font-size="11.5" fill="#555555" text-anchor="middle">newest event time 62 s</text>
<rect x="500" y="100" width="200" height="90" rx="9" fill="#fff8ef" stroke="#e8870c" stroke-width="2"/>
<text x="600.0" y="135.5" font-size="13.5" font-weight="700" fill="#111111" text-anchor="middle">55 s FASTLINE</text>
<text x="600.0" y="152.5" font-size="11.5" fill="#555555" text-anchor="middle">7 s behind the newest</text>
<text x="600.0" y="167.5" font-size="11.5" fill="#555555" text-anchor="middle">inside 10 s: window 1 = 4</text>
<rect x="730" y="100" width="210" height="90" rx="9" fill="#f1f5f9" stroke="#64748b" stroke-width="2"/>
<text x="835.0" y="135.5" font-size="13.5" font-weight="700" fill="#111111" text-anchor="middle">195 s FASTLINE</text>
<text x="835.0" y="152.5" font-size="11.5" fill="#555555" text-anchor="middle">opens window 4</text>
<text x="835.0" y="167.5" font-size="11.5" fill="#555555" text-anchor="middle">windows 1 to 3 are closed</text>
<rect x="40" y="280" width="280" height="100" rx="9" fill="#ffffff" stroke="#111111" stroke-width="2"/>
<text x="180.0" y="320.5" font-size="13.5" font-weight="700" fill="#111111" text-anchor="middle">58 s FASTLINE arrives late</text>
<text x="180.0" y="337.5" font-size="11.5" fill="#555555" text-anchor="middle">window 1 ended at 60 s</text>
<text x="180.0" y="352.5" font-size="11.5" fill="#555555" text-anchor="middle">and closed at 70 s</text>
<rect x="370" y="280" width="270" height="100" rx="9" fill="#f4f4f4" stroke="#888888" stroke-width="1.5"/>
<text x="505.0" y="320.5" font-size="13.5" font-weight="700" fill="#111111" text-anchor="middle">Dropped by all three</text>
<text x="505.0" y="337.5" font-size="11.5" fill="#555555" text-anchor="middle">Kafka Streams logs the skip</text>
<text x="505.0" y="352.5" font-size="11.5" fill="#555555" text-anchor="middle">Flink and RisingWave: below the watermark</text>
<rect x="690" y="280" width="250" height="100" rx="9" fill="#fff8ef" stroke="#e8870c" stroke-width="2"/>
<text x="815.0" y="320.5" font-size="13.5" font-weight="700" fill="#111111" text-anchor="middle">Window 1 stays at 4</text>
<text x="815.0" y="337.5" font-size="11.5" fill="#555555" text-anchor="middle">nothing is revised or sent</text>
<text x="815.0" y="352.5" font-size="11.5" fill="#555555" text-anchor="middle">in any of the three</text>
<rect x="370" y="395" width="570" height="36" rx="9" fill="#ffffff" stroke="#999999" stroke-width="1.5" stroke-dasharray="6 4"/>
<text x="655.0" y="418.5" font-size="13.5" font-weight="700" fill="#111111" text-anchor="middle">A smaller bound in one engine (grace 0) counts window 1 as 3 there and 4 elsewhere</text>
<path d="M240,145 L270,145" fill="none" stroke="#555" stroke-width="2" marker-end="url(#a)"/>
<path d="M470,145 L500,145" fill="none" stroke="#555" stroke-width="2" marker-end="url(#a)"/>
<path d="M700,145 L730,145" fill="none" stroke="#555" stroke-width="2" marker-end="url(#a)"/>
<path d="M320,330 L370,330" fill="none" stroke="#555" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#a)"/>
<path d="M640,330 L690,330" fill="none" stroke="#b8650a" stroke-width="2" marker-end="url(#am)"/>
<text x="490" y="30" font-size="15" fill="#444444" text-anchor="middle" font-weight="700">The same bound in all three engines gives the same closed windows</text>
</svg>
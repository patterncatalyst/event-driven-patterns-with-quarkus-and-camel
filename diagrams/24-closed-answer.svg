<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 420" font-family="'Red Hat Text', system-ui, sans-serif" role="img">
<defs><marker id="a" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#555"/></marker><marker id="am" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b8650a"/></marker></defs>
<rect x="20" y="60" width="920" height="180" rx="12" fill="#fff8ef" stroke="#ddd"/>
<text x="32" y="80" font-size="12" font-weight="700" fill="#888">Three settings hold the answer in place</text>
<rect x="40" y="110" width="190" height="100" rx="9" fill="#ffffff" stroke="#111111" stroke-width="2"/>
<text x="135.0" y="150.5" font-size="13.5" font-weight="700" fill="#111111" text-anchor="middle">Free text</text>
<text x="135.0" y="167.5" font-size="11.5" fill="#555555" text-anchor="middle">Nobody home, card left,</text>
<text x="135.0" y="182.5" font-size="11.5" fill="#555555" text-anchor="middle">second attempt.</text>
<rect x="280" y="100" width="200" height="36" rx="9" fill="#f4f4f4" stroke="#888888" stroke-width="1.5"/>
<text x="380.0" y="123.5" font-size="13.5" font-weight="700" fill="#111111" text-anchor="middle">JSON schema with the enum</text>
<rect x="280" y="144" width="200" height="36" rx="9" fill="#f4f4f4" stroke="#888888" stroke-width="1.5"/>
<text x="380.0" y="167.5" font-size="13.5" font-weight="700" fill="#111111" text-anchor="middle">temperature 0, top-k 1</text>
<rect x="280" y="188" width="200" height="36" rx="9" fill="#f4f4f4" stroke="#888888" stroke-width="1.5"/>
<text x="380.0" y="211.5" font-size="13.5" font-weight="700" fill="#111111" text-anchor="middle">fixed seed</text>
<rect x="530" y="110" width="170" height="100" rx="9" fill="#ffffff" stroke="#111111" stroke-width="2"/>
<text x="615.0" y="150.5" font-size="13.5" font-weight="700" fill="#111111" text-anchor="middle">Model</text>
<text x="615.0" y="167.5" font-size="11.5" fill="#555555" text-anchor="middle">a local Ollama</text>
<text x="615.0" y="182.5" font-size="11.5" fill="#555555" text-anchor="middle">one request per note</text>
<rect x="750" y="110" width="170" height="100" rx="9" fill="#fff8ef" stroke="#e8870c" stroke-width="2"/>
<text x="835.0" y="150.5" font-size="13.5" font-weight="700" fill="#111111" text-anchor="middle">RECIPIENT_ABSENT</text>
<text x="835.0" y="167.5" font-size="11.5" fill="#555555" text-anchor="middle">and the evidence</text>
<text x="835.0" y="182.5" font-size="11.5" fill="#555555" text-anchor="middle">phrase</text>
<rect x="40" y="280" width="420" height="70" rx="9" fill="#ffffff" stroke="#999999" stroke-width="1.5" stroke-dasharray="6 4"/>
<text x="250.0" y="313.0" font-size="13.5" font-weight="700" fill="#111111" text-anchor="middle">Not about a delivery, or unsure</text>
<text x="250.0" y="330.0" font-size="11.5" fill="#555555" text-anchor="middle">the model answers UNKNOWN</text>
<rect x="500" y="280" width="420" height="70" rx="9" fill="#f4f4f4" stroke="#888888" stroke-width="1.5"/>
<text x="710.0" y="313.0" font-size="13.5" font-weight="700" fill="#111111" text-anchor="middle">An answer the schema cannot parse</text>
<text x="710.0" y="330.0" font-size="11.5" fill="#555555" text-anchor="middle">becomes UNKNOWN and is counted</text>
<path d="M230,160 L280,160" fill="none" stroke="#555" stroke-width="2" marker-end="url(#a)"/>
<path d="M480,160 L530,160" fill="none" stroke="#555" stroke-width="2" marker-end="url(#a)"/>
<path d="M700,160 L750,160" fill="none" stroke="#555" stroke-width="2" marker-end="url(#a)"/>
<path d="M835,210 L710,280" fill="none" stroke="#555" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#a)"/>
<text x="480" y="30" font-size="15" fill="#444444" text-anchor="middle" font-weight="700">A closed answer from an open text</text>
<text x="480" y="395" font-size="12" fill="#555555" text-anchor="middle">A stable answer is not always a correct one: the rules see only the value, never whether it is right</text>
</svg>
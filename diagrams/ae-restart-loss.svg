<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 360" font-family="'Red Hat Text', system-ui, sans-serif" role="img">
<defs><marker id="a" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#555"/></marker><marker id="am" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b8650a"/></marker></defs>
<rect x="30" y="120" width="180" height="90" rx="9" fill="#ffffff" stroke="#111111" stroke-width="2"/>
<text x="120.0" y="155.5" font-size="13.5" font-weight="700" fill="#111111" text-anchor="middle">Kafka</text>
<text x="120.0" y="172.5" font-size="11.5" fill="#555555" text-anchor="middle">502 to 506 consumed</text>
<text x="120.0" y="187.5" font-size="11.5" fill="#555555" text-anchor="middle">offset committed</text>
<rect x="270" y="120" width="200" height="90" rx="9" fill="#fff8ef" stroke="#e8870c" stroke-width="2"/>
<text x="370.0" y="155.5" font-size="13.5" font-weight="700" fill="#111111" text-anchor="middle">Resequencer memory</text>
<text x="370.0" y="172.5" font-size="11.5" fill="#555555" text-anchor="middle">holds 502 to 506</text>
<text x="370.0" y="187.5" font-size="11.5" fill="#555555" text-anchor="middle">501 is missing</text>
<rect x="530" y="120" width="170" height="90" rx="9" fill="#f4f4f4" stroke="#888888" stroke-width="1.5"/>
<text x="615.0" y="163.0" font-size="13.5" font-weight="700" fill="#111111" text-anchor="middle">Restart</text>
<text x="615.0" y="180.0" font-size="11.5" fill="#555555" text-anchor="middle">memory is gone</text>
<rect x="760" y="120" width="190" height="90" rx="9" fill="#f1f5f9" stroke="#64748b" stroke-width="2"/>
<text x="855.0" y="155.5" font-size="13.5" font-weight="700" fill="#111111" text-anchor="middle">After the restart</text>
<text x="855.0" y="172.5" font-size="11.5" fill="#555555" text-anchor="middle">only 501 is applied</text>
<text x="855.0" y="187.5" font-size="11.5" fill="#555555" text-anchor="middle">502 to 506 not re-read</text>
<rect x="270" y="260" width="430" height="70" rx="9" fill="#eef4fb" stroke="#2f6db5" stroke-width="2"/>
<text x="485.0" y="293.0" font-size="13.5" font-weight="700" fill="#111111" text-anchor="middle">Per-order buffer in PostgreSQL (chapter 4)</text>
<text x="485.0" y="310.0" font-size="11.5" fill="#555555" text-anchor="middle">held rows survive the restart</text>
<path d="M210,165 L270,165" fill="none" stroke="#b8650a" stroke-width="2" marker-end="url(#am)"/>
<path d="M470,165 L530,165" fill="none" stroke="#b8650a" stroke-width="2" marker-end="url(#am)"/>
<path d="M700,165 L760,165" fill="none" stroke="#b8650a" stroke-width="2" marker-end="url(#am)"/>
<path d="M370,210 L370,260" fill="none" stroke="#555" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#a)"/>
<text x="490" y="30" font-size="15" fill="#444444" text-anchor="middle" font-weight="700">The client commits offsets on a timer, not when the resequencer releases</text>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 420" font-family="'Red Hat Text', system-ui, sans-serif" role="img">
<defs><marker id="a" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#555"/></marker><marker id="am" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b8650a"/></marker></defs>
<rect x="20" y="70" width="960" height="100" rx="12" fill="#fff8ef" stroke="#ddd"/>
<text x="32" y="90" font-size="12" font-weight="700" fill="#888">edp.orders.notified, one repeated event</text>
<rect x="60" y="105" width="190" height="50" rx="9" fill="#ffffff" stroke="#111111" stroke-width="2"/>
<text x="155.0" y="135.5" font-size="13.5" font-weight="700" fill="#111111" text-anchor="middle">record 1 for O-3602</text>
<rect x="330" y="105" width="190" height="50" rx="9" fill="#fff8ef" stroke="#e8870c" stroke-width="2"/>
<text x="425.0" y="135.5" font-size="13.5" font-weight="700" fill="#111111" text-anchor="middle">record 2 for O-3602</text>
<rect x="640" y="105" width="300" height="50" rx="9" fill="#ffffff" stroke="#999999" stroke-width="1.5" stroke-dasharray="6 4"/>
<text x="790.0" y="135.5" font-size="13.5" font-weight="700" fill="#111111" text-anchor="middle">end of the wait window</text>
<rect x="60" y="235" width="400" height="70" rx="9" fill="#f1f5f9" stroke="#64748b" stroke-width="2"/>
<text x="260.0" y="268.0" font-size="13.5" font-weight="700" fill="#111111" text-anchor="middle">First match</text>
<text x="260.0" y="285.0" font-size="11.5" fill="#555555" text-anchor="middle">stops at record 1 and passes</text>
<rect x="540" y="235" width="400" height="70" rx="9" fill="#f4f4f4" stroke="#888888" stroke-width="1.5"/>
<text x="740.0" y="268.0" font-size="13.5" font-weight="700" fill="#111111" text-anchor="middle">Drain for the whole window</text>
<text x="740.0" y="285.0" font-size="11.5" fill="#555555" text-anchor="middle">counts 2, expects 1, fails</text>
<path d="M155,155 L155,235" fill="none" stroke="#b8650a" stroke-width="2" marker-end="url(#am)"/>
<path d="M425,155 L640,235" fill="none" stroke="#b8650a" stroke-width="2" marker-end="url(#am)"/>
<path d="M790,155 L790,235" fill="none" stroke="#555" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#a)"/>
<text x="500" y="30" font-size="15" fill="#444444" text-anchor="middle" font-weight="700">Only a read that waits can see a second record</text>
<text x="500" y="370" font-size="13" fill="#555555" text-anchor="middle">The window has to outlast the route, and a longer window costs every run that long</text>
</svg>
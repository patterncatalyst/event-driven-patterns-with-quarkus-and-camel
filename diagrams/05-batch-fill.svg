<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 470" font-family="'Red Hat Text', system-ui, sans-serif" role="img">
<defs><marker id="a" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#555"/></marker><marker id="am" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b8650a"/></marker></defs>
<rect x="300" y="60" width="330" height="330" rx="12" fill="#fafafa" stroke="#ddd"/>
<text x="312" y="80" font-size="12" font-weight="700" fill="#888">Producer accumulator</text>
<rect x="30" y="130" width="220" height="70" rx="9" fill="#ffffff" stroke="#111111" stroke-width="2"/>
<text x="140.0" y="163.0" font-size="13.5" font-weight="700" fill="#111111" text-anchor="middle">records, keyed by order id</text>
<text x="140.0" y="180.0" font-size="11.5" fill="#555555" text-anchor="middle">from many callers</text>
<rect x="320" y="100" width="290" height="66" rx="9" fill="#fff8ef" stroke="#e8870c" stroke-width="2"/>
<text x="465.0" y="131.0" font-size="13.5" font-weight="700" fill="#111111" text-anchor="middle">open batch, partition 0</text>
<text x="465.0" y="148.0" font-size="11.5" fill="#555555" text-anchor="middle">full at batch.size or after linger.ms</text>
<rect x="320" y="195" width="290" height="66" rx="9" fill="#ffffff" stroke="#111111" stroke-width="2"/>
<text x="465.0" y="226.0" font-size="13.5" font-weight="700" fill="#111111" text-anchor="middle">open batch, partition 1</text>
<text x="465.0" y="243.0" font-size="11.5" fill="#555555" text-anchor="middle">still filling</text>
<rect x="320" y="290" width="290" height="66" rx="9" fill="#fff8ef" stroke="#e8870c" stroke-width="2"/>
<text x="465.0" y="321.0" font-size="13.5" font-weight="700" fill="#111111" text-anchor="middle">open batch, partition 2</text>
<text x="465.0" y="338.0" font-size="11.5" fill="#555555" text-anchor="middle">full at batch.size or after linger.ms</text>
<rect x="690" y="130" width="250" height="70" rx="9" fill="#f1f5f9" stroke="#64748b" stroke-width="2"/>
<text x="815.0" y="163.0" font-size="13.5" font-weight="700" fill="#111111" text-anchor="middle">one request to the broker</text>
<text x="815.0" y="180.0" font-size="11.5" fill="#555555" text-anchor="middle">ready batches for partitions 0 and 2</text>
<rect x="690" y="290" width="250" height="66" rx="9" fill="#ffffff" stroke="#111111" stroke-width="2"/>
<text x="815.0" y="321.0" font-size="13.5" font-weight="700" fill="#111111" text-anchor="middle">broker appends each batch</text>
<text x="815.0" y="338.0" font-size="11.5" fill="#555555" text-anchor="middle">and acknowledges the request</text>
<path d="M250,165 L320,133" fill="none" stroke="#b8650a" stroke-width="2" marker-end="url(#am)"/>
<path d="M250,165 L320,228" fill="none" stroke="#555" stroke-width="2" marker-end="url(#a)"/>
<path d="M250,165 L320,323" fill="none" stroke="#b8650a" stroke-width="2" marker-end="url(#am)"/>
<path d="M610,133 L690,155" fill="none" stroke="#b8650a" stroke-width="2" marker-end="url(#am)"/>
<path d="M610,323 L690,180" fill="none" stroke="#b8650a" stroke-width="2" marker-end="url(#am)"/>
<path d="M815,200 L815,290" fill="none" stroke="#555" stroke-width="2" marker-end="url(#a)"/>
<text x="480" y="24" font-size="15" fill="#444444" text-anchor="middle" font-weight="700">Records wait in a per-partition batch; a request carries every batch that is ready</text>
<text x="480" y="430" font-size="11" fill="#555555" text-anchor="middle">Compression applies to the whole batch, so a fuller batch compresses better.</text>
</svg>
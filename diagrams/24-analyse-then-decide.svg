<text x="830.0" y="133.0" font-size="13.5" font-weight="700" fill="#111111" text-anchor="middle">exception-decisions</text>
<text x="830.0" y="150.0" font-size="11.5" fill="#555555" text-anchor="middle">RESHIP or REFUND, rule name</text>
<rect x="35" y="270" width="330" height="70" rx="9" fill="#ffffff" stroke="#999999" stroke-width="1.5" stroke-dasharray="6 4"/>
<text x="200.0" y="303.0" font-size="13.5" font-weight="700" fill="#111111" text-anchor="middle">POST /demo/replay</text>
<text x="200.0" y="320.0" font-size="11.5" fill="#555555" text-anchor="middle">demo code: the model is never called</text>
<rect x="395" y="270" width="150" height="70" rx="9" fill="#fff8ef" stroke="#e8870c" stroke-width="2"/>
<text x="470.0" y="303.0" font-size="13.5" font-weight="700" fill="#111111" text-anchor="middle">exception-analyses</text>
<text x="470.0" y="320.0" font-size="11.5" fill="#555555" text-anchor="middle">read from offset 0</text>
<rect x="575" y="270" width="130" height="70" rx="9" fill="#f4f4f4" stroke="#888888" stroke-width="1.5"/>
<text x="640.0" y="303.0" font-size="13.5" font-weight="700" fill="#111111" text-anchor="middle">DecisionUnit</text>
<text x="640.0" y="320.0" font-size="11.5" fill="#555555" text-anchor="middle">same rules</text>
<rect x="735" y="270" width="190" height="70" rx="9" fill="#ffffff" stroke="#111111" stroke-width="2"/>
<text x="830.0" y="303.0" font-size="13.5" font-weight="700" fill="#111111" text-anchor="middle">same decisions</text>
<text x="830.0" y="320.0" font-size="11.5" fill="#555555" text-anchor="middle">published nowhere</text>
<rect x="40" y="390" width="880" height="44" rx="9" fill="#f1f5f9" stroke="#64748b" stroke-width="2"/>
<text x="480.0" y="417.5" font-size="13.5" font-weight="700" fill="#111111" text-anchor="middle">The record holds the model digest and prompt version; the decision holds the rule name</text>

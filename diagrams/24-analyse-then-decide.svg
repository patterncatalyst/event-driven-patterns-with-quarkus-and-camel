<text x="285.0" y="133.0" font-size="13.5" font-weight="700" fill="#111111" text-anchor="middle">AI service</text>
<text x="285.0" y="150.0" font-size="11.5" fill="#555555" text-anchor="middle">model: one reason</text>
<rect x="395" y="100" width="150" height="70" rx="9" fill="#fff8ef" stroke="#e8870c" stroke-width="2"/>
<text x="470.0" y="133.0" font-size="13.5" font-weight="700" fill="#111111" text-anchor="middle">exception-analyses</text>
<text x="470.0" y="150.0" font-size="11.5" fill="#555555" text-anchor="middle">reason, model, prompt</text>

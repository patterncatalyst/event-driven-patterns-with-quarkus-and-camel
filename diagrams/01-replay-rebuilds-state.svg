<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 400" font-family="'Red Hat Text', system-ui, sans-serif" role="img">
<defs><marker id="a" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#555"/></marker><marker id="am" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b8650a"/></marker></defs>
<rect x="20" y="20" width="920" height="175" rx="12" fill="#fafafa" stroke="#ddd"/>
<text x="32" y="40" font-size="12" font-weight="700" fill="#888">Write: command, check, append</text>
<rect x="20" y="215" width="920" height="165" rx="12" fill="#fafafa" stroke="#ddd"/>
<text x="32" y="235" font-size="12" font-weight="700" fill="#888">Read: fold the stream</text>
<rect x="40" y="70" width="190" height="80" rx="9" fill="#f1f5f9" stroke="#64748b" stroke-width="2"/>
<text x="135.0" y="108.0" font-size="13.5" font-weight="700" fill="#111111" text-anchor="middle">ChangeConsignmentStatus</text>
<text x="135.0" y="125.0" font-size="11.5" fill="#555555" text-anchor="middle">to CLEARED</text>
<rect x="280" y="70" width="190" height="80" rx="9" fill="#ffffff" stroke="#111111" stroke-width="2"/>
<text x="375.0" y="108.0" font-size="13.5" font-weight="700" fill="#111111" text-anchor="middle">Replay the stream</text>
<text x="375.0" y="125.0" font-size="11.5" fill="#555555" text-anchor="middle">current status IN_TRANSIT</text>
<rect x="520" y="70" width="190" height="80" rx="9" fill="#fff8ef" stroke="#e8870c" stroke-width="2"/>

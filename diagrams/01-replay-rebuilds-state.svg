<text x="615.0" y="125.0" font-size="11.5" fill="#555555" text-anchor="middle">IN_TRANSIT to CLEARED allowed</text>
<rect x="760" y="70" width="160" height="80" rx="9" fill="#ffffff" stroke="#111111" stroke-width="2"/>
<text x="840.0" y="108.0" font-size="13.5" font-weight="700" fill="#111111" text-anchor="middle">Append v4</text>
<text x="840.0" y="125.0" font-size="11.5" fill="#555555" text-anchor="middle">ConsignmentStatusChanged</text>
<rect x="40" y="265" width="190" height="80" rx="9" fill="#ffffff" stroke="#111111" stroke-width="2"/>
<text x="135.0" y="303.0" font-size="13.5" font-weight="700" fill="#111111" text-anchor="middle">v1 ConsignmentBooked</text>
<text x="135.0" y="320.0" font-size="11.5" fill="#555555" text-anchor="middle">status BOOKED</text>
<rect x="280" y="265" width="190" height="80" rx="9" fill="#ffffff" stroke="#111111" stroke-width="2"/>
<text x="375.0" y="303.0" font-size="13.5" font-weight="700" fill="#111111" text-anchor="middle">v2 StatusChanged</text>
<text x="375.0" y="320.0" font-size="11.5" fill="#555555" text-anchor="middle">status LOADED</text>
<rect x="520" y="265" width="190" height="80" rx="9" fill="#ffffff" stroke="#111111" stroke-width="2"/>
<text x="615.0" y="303.0" font-size="13.5" font-weight="700" fill="#111111" text-anchor="middle">v3 StatusChanged</text>
<text x="615.0" y="320.0" font-size="11.5" fill="#555555" text-anchor="middle">status IN_TRANSIT</text>
<rect x="760" y="265" width="160" height="80" rx="9" fill="#fff8ef" stroke="#e8870c" stroke-width="2"/>
<text x="840.0" y="303.0" font-size="13.5" font-weight="700" fill="#111111" text-anchor="middle">ConsignmentDocument</text>
<text x="840.0" y="320.0" font-size="11.5" fill="#555555" text-anchor="middle">same as the row</text>

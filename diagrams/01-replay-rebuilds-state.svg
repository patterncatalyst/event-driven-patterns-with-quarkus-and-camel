<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 410" font-family="'Red Hat Text', system-ui, sans-serif" role="img">
<defs><marker id="a" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#555"/></marker><marker id="am" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b8650a"/></marker></defs>
<rect x="20" y="50" width="1240" height="140" rx="12" fill="#fafafa" stroke="#ddd"/>
<text x="32" y="70" font-size="12" font-weight="700" fill="#888">Write: stream holds v1 to v3, command appends v4</text>
<rect x="20" y="205" width="1240" height="140" rx="12" fill="#fafafa" stroke="#ddd"/>
<text x="32" y="225" font-size="12" font-weight="700" fill="#888">Read: stream holds v1 to v4, replay folds it</text>
<rect x="40" y="90" width="250" height="80" rx="9" fill="#f1f5f9" stroke="#64748b" stroke-width="2"/>
<text x="165.0" y="128.0" font-size="13.5" font-weight="700" fill="#111111" text-anchor="middle">ChangeConsignmentStatus</text>
<text x="165.0" y="145.0" font-size="11.5" fill="#555555" text-anchor="middle">to CLEARED</text>
<rect x="350" y="90" width="250" height="80" rx="9" fill="#ffffff" stroke="#111111" stroke-width="2"/>
<text x="475.0" y="128.0" font-size="13.5" font-weight="700" fill="#111111" text-anchor="middle">Replay v1 to v3</text>
<text x="475.0" y="145.0" font-size="11.5" fill="#555555" text-anchor="middle">current status IN_TRANSIT</text>
<rect x="660" y="90" width="250" height="80" rx="9" fill="#fff8ef" stroke="#e8870c" stroke-width="2"/>
<text x="785.0" y="128.0" font-size="13.5" font-weight="700" fill="#111111" text-anchor="middle">Check the transition</text>
<text x="785.0" y="145.0" font-size="11.5" fill="#555555" text-anchor="middle">IN_TRANSIT to CLEARED</text>
<rect x="970" y="90" width="250" height="80" rx="9" fill="#ffffff" stroke="#111111" stroke-width="2"/>
<text x="1095.0" y="128.0" font-size="13.5" font-weight="700" fill="#111111" text-anchor="middle">Append v4</text>
<text x="1095.0" y="145.0" font-size="11.5" fill="#555555" text-anchor="middle">ConsignmentStatusChanged</text>
<rect x="40" y="245" width="250" height="80" rx="9" fill="#ffffff" stroke="#111111" stroke-width="2"/>
<text x="165.0" y="283.0" font-size="13.5" font-weight="700" fill="#111111" text-anchor="middle">v1 ConsignmentBooked</text>
<text x="165.0" y="300.0" font-size="11.5" fill="#555555" text-anchor="middle">status BOOKED</text>
<rect x="350" y="245" width="250" height="80" rx="9" fill="#ffffff" stroke="#111111" stroke-width="2"/>
<text x="475.0" y="283.0" font-size="13.5" font-weight="700" fill="#111111" text-anchor="middle">v2 to v4 StatusChanged</text>
<text x="475.0" y="300.0" font-size="11.5" fill="#555555" text-anchor="middle">ConsignmentStatusChanged x3</text>
<rect x="660" y="245" width="250" height="80" rx="9" fill="#fff8ef" stroke="#e8870c" stroke-width="2"/>
<text x="785.0" y="283.0" font-size="13.5" font-weight="700" fill="#111111" text-anchor="middle">Fold left</text>
<text x="785.0" y="300.0" font-size="11.5" fill="#555555" text-anchor="middle">status after v4: CLEARED</text>
<rect x="970" y="245" width="250" height="80" rx="9" fill="#fff8ef" stroke="#e8870c" stroke-width="2"/>
<text x="1095.0" y="283.0" font-size="13.5" font-weight="700" fill="#111111" text-anchor="middle">ConsignmentDocument</text>
<text x="1095.0" y="300.0" font-size="11.5" fill="#555555" text-anchor="middle">same as the row</text>
<path d="M290,130 L350,130" fill="none" stroke="#555" stroke-width="2" marker-end="url(#a)"/>
<path d="M600,130 L660,130" fill="none" stroke="#555" stroke-width="2" marker-end="url(#a)"/>
<path d="M910,130 L970,130" fill="none" stroke="#555" stroke-width="2" marker-end="url(#a)"/>
<path d="M290,285 L350,285" fill="none" stroke="#555" stroke-width="2" marker-end="url(#a)"/>
<path d="M600,285 L660,285" fill="none" stroke="#555" stroke-width="2" marker-end="url(#a)"/>
<path d="M910,285 L970,285" fill="none" stroke="#b8650a" stroke-width="2" marker-end="url(#am)"/>
<text x="640" y="28" font-size="15" fill="#444444" text-anchor="middle" font-weight="700">Check against the replayed state, append, fold to read</text>
<text x="640" y="380" font-size="11" fill="#555555" text-anchor="middle">A command never edits history: it appends one fact, and every reader folds the same stream.</text>
</svg>
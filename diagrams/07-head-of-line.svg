<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" font-family="'Red Hat Text', system-ui, sans-serif" role="img">
<defs><marker id="a" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#555"/></marker><marker id="am" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b8650a"/></marker></defs>
<rect x="20" y="60" width="920" height="190" rx="12" fill="#fafafa" stroke="#ddd"/>
<text x="32" y="80" font-size="12" font-weight="700" fill="#888">Consumer group: a partition has one owner</text>
<rect x="20" y="280" width="920" height="190" rx="12" fill="#fff8ef" stroke="#ddd"/>
<text x="32" y="300" font-size="12" font-weight="700" fill="#888">Share group: any worker takes any record</text>
<rect x="40" y="100" width="250" height="70" rx="9" fill="#fff8ef" stroke="#e8870c" stroke-width="2"/>
<text x="165.0" y="133.0" font-size="13.5" font-weight="700" fill="#111111" text-anchor="middle">partition 1: offsets 0, 1, 2 ...</text>
<text x="165.0" y="150.0" font-size="11.5" fill="#555555" text-anchor="middle">offset 0 is the slow job (C-SLOW)</text>
<rect x="355" y="100" width="250" height="70" rx="9" fill="#ffffff" stroke="#111111" stroke-width="2"/>
<text x="480.0" y="133.0" font-size="13.5" font-weight="700" fill="#111111" text-anchor="middle">worker-1 owns partition 1</text>
<text x="480.0" y="150.0" font-size="11.5" fill="#555555" text-anchor="middle">delivers one record after another</text>
<rect x="670" y="100" width="250" height="70" rx="9" fill="#f1f5f9" stroke="#64748b" stroke-width="2"/>
<text x="795.0" y="133.0" font-size="13.5" font-weight="700" fill="#111111" text-anchor="middle">offsets 1, 2 ... wait</text>
<text x="795.0" y="150.0" font-size="11.5" fill="#555555" text-anchor="middle">and finish after the slow job</text>
<rect x="40" y="190" width="250" height="44" rx="9" fill="#ffffff" stroke="#999999" stroke-width="1.5" stroke-dasharray="6 4"/>
<text x="165.0" y="217.5" font-size="13.5" font-weight="700" fill="#111111" text-anchor="middle">worker-2 and worker-3: partitions 0 and 2</text>
<rect x="40" y="320" width="250" height="70" rx="9" fill="#fff8ef" stroke="#e8870c" stroke-width="2"/>
<text x="165.0" y="353.0" font-size="13.5" font-weight="700" fill="#111111" text-anchor="middle">partition 1: offsets 0, 1, 2 ...</text>
<text x="165.0" y="370.0" font-size="11.5" fill="#555555" text-anchor="middle">offset 0 is the slow job (C-SLOW)</text>
<rect x="355" y="310" width="250" height="56" rx="9" fill="#ffffff" stroke="#111111" stroke-width="2"/>
<text x="480.0" y="336.0" font-size="13.5" font-weight="700" fill="#111111" text-anchor="middle">worker-1 holds offset 0</text>
<text x="480.0" y="353.0" font-size="11.5" fill="#555555" text-anchor="middle">one record, locked</text>
<rect x="355" y="380" width="250" height="70" rx="9" fill="#ffffff" stroke="#111111" stroke-width="2"/>
<text x="480.0" y="413.0" font-size="13.5" font-weight="700" fill="#111111" text-anchor="middle">worker-2 and worker-3</text>
<text x="480.0" y="430.0" font-size="11.5" fill="#555555" text-anchor="middle">take offsets 1, 2 ... from the same partition</text>
<rect x="670" y="330" width="250" height="90" rx="9" fill="#f1f5f9" stroke="#64748b" stroke-width="2"/>
<text x="795.0" y="365.5" font-size="13.5" font-weight="700" fill="#111111" text-anchor="middle">later jobs finish before</text>
<text x="795.0" y="382.5" font-size="11.5" fill="#555555" text-anchor="middle">the slow job does</text>
<text x="795.0" y="397.5" font-size="11.5" fill="#555555" text-anchor="middle">no ordering guarantee</text>
<path d="M290,135 L355,135" fill="none" stroke="#555" stroke-width="2" marker-end="url(#a)"/>
<path d="M605,135 L670,135" fill="none" stroke="#555" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#a)"/>
<path d="M290,345 L355,338" fill="none" stroke="#b8650a" stroke-width="2" marker-end="url(#am)"/>
<path d="M290,365 L355,410" fill="none" stroke="#b8650a" stroke-width="2" marker-end="url(#am)"/>
<path d="M605,410 L670,380" fill="none" stroke="#b8650a" stroke-width="2" marker-end="url(#am)"/>
<text x="480" y="30" font-size="15" fill="#444444" text-anchor="middle" font-weight="700">One slow job: who waits behind it</text>
</svg>
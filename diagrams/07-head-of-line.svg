<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" font-family="'Red Hat Text', system-ui, sans-serif" role="img">
<defs><marker id="a" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#555"/></marker><marker id="am" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b8650a"/></marker></defs>
<rect x="20" y="60" width="920" height="190" rx="12" fill="#fafafa" stroke="#ddd"/>
<text x="32" y="80" font-size="12" font-weight="700" fill="#888">Consumer group: a partition has one owner</text>
<rect x="20" y="280" width="920" height="190" rx="12" fill="#fff8ef" stroke="#ddd"/>
<text x="32" y="300" font-size="12" font-weight="700" fill="#888">Share group: any worker takes any record</text>
<rect x="300" y="120" width="270" height="80" rx="9" fill="#f1f5f9" stroke="#64748b" stroke-width="2"/>
<text x="435.0" y="158.0" font-size="13.5" font-weight="700" fill="#111111" text-anchor="middle">offsets 1, 2 ... wait</text>
<text x="435.0" y="175.0" font-size="11.5" fill="#555555" text-anchor="middle">and finish after the slow job</text>
<rect x="630" y="130" width="270" height="60" rx="9" fill="#ffffff" stroke="#999999" stroke-width="1.5" stroke-dasharray="6 4"/>
<text x="765.0" y="158.0" font-size="13.5" font-weight="700" fill="#111111" text-anchor="middle">worker-2, worker-3, worker-4:</text>
<text x="765.0" y="175.0" font-size="11.5" fill="#555555" text-anchor="middle">idle for this partition</text>
<rect x="540" y="350" width="380" height="90" rx="9" fill="#f1f5f9" stroke="#64748b" stroke-width="2"/>
<text x="730.0" y="393.0" font-size="13.5" font-weight="700" fill="#111111" text-anchor="middle">later jobs finish before the slow job does,</text>
<text x="730.0" y="410.0" font-size="11.5" fill="#555555" text-anchor="middle">no ordering guarantee</text>
<path d="M240,150 L300,150" fill="none" stroke="#555" stroke-width="2" marker-end="url(#a)"/>
<path d="M230,370 L300,350" fill="none" stroke="#b8650a" stroke-width="2" marker-end="url(#am)"/>
<path d="M230,370 L300,460" fill="none" stroke="#b8650a" stroke-width="2" marker-end="url(#am)"/>
<path d="M480,350 L540,395" fill="none" stroke="#b8650a" stroke-width="2" marker-end="url(#am)"/>
<path d="M480,460 L540,420" fill="none" stroke="#b8650a" stroke-width="2" marker-end="url(#am)"/>
<text x="480" y="30" font-size="15" fill="#444444" text-anchor="middle" font-weight="700">One slow job: who waits behind it</text>
<rect x="56.0" y="126.0" width="140.0" height="30.0" rx="15.0" fill="#fff8ef" stroke="#555555" stroke-width="2"/>
<ellipse cx="181.0" cy="141.0" rx="6.3" ry="11.7" fill="none" stroke="#555555" stroke-width="1.3" opacity="0.6"/>
<circle cx="200.0" cy="141.0" r="13.8" fill="#e8870c" stroke="#555555" stroke-width="1.3"/>
<text x="140.0" y="201.0" font-size="11" fill="#555555" text-anchor="middle">partition 1: offset 0 is the slow job (C-SLOW)</text>
<rect x="59.0" y="346.0" width="152.0" height="30.0" rx="15.0" fill="#fff8ef" stroke="#555555" stroke-width="2"/>
<ellipse cx="196.0" cy="361.0" rx="6.3" ry="11.7" fill="none" stroke="#555555" stroke-width="1.3" opacity="0.6"/>
<text x="135.0" y="421.0" font-size="11" fill="#555555" text-anchor="middle">share group queue: offsets 0, 1, 2 ...</text>
<rect x="314.4" y="326.0" width="126.0" height="30.0" rx="15.0" fill="#fff8ef" stroke="#555555" stroke-width="2"/>
<ellipse cx="425.4" cy="341.0" rx="6.3" ry="11.7" fill="none" stroke="#555555" stroke-width="1.3" opacity="0.6"/>
<circle cx="444.0" cy="341.0" r="13.8" fill="#e8870c" stroke="#555555" stroke-width="1.3"/>
<text x="390.0" y="396.0" font-size="11" fill="#555555" text-anchor="middle">worker-1 takes one record</text>
<rect x="314.4" y="436.0" width="126.0" height="30.0" rx="15.0" fill="#fff8ef" stroke="#555555" stroke-width="2"/>
<ellipse cx="425.4" cy="451.0" rx="6.3" ry="11.7" fill="none" stroke="#555555" stroke-width="1.3" opacity="0.6"/>
<circle cx="444.0" cy="451.0" r="13.8" fill="#e8870c" stroke="#555555" stroke-width="1.3"/>
<text x="390.0" y="506.0" font-size="11" fill="#555555" text-anchor="middle">another worker takes the next record</text>
</svg>
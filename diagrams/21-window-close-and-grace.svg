<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 440" font-family="'Red Hat Text', system-ui, sans-serif" role="img">
<defs><marker id="a" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#555"/></marker><marker id="am" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b8650a"/></marker></defs>
<rect x="20" y="60" width="620" height="150" rx="12" fill="#fff8ef" stroke="#ddd"/>
<text x="32" y="80" font-size="12" font-weight="700" fill="#888">Slot 09:00 to 09:15 is open</text>
<rect x="660" y="60" width="280" height="150" rx="12" fill="#fafafa" stroke="#ddd"/>
<text x="672" y="80" font-size="12" font-weight="700" fill="#888">Window closed</text>
<rect x="40" y="100" width="180" height="80" rx="9" fill="#ffffff" stroke="#111111" stroke-width="2"/>
<text x="130.0" y="130.5" font-size="13.5" font-weight="700" fill="#111111" text-anchor="middle">09:01 to 09:07</text>
<text x="130.0" y="147.5" font-size="11.5" fill="#555555" text-anchor="middle">7 FASTLINE records</text>
<text x="130.0" y="162.5" font-size="11.5" fill="#555555" text-anchor="middle">stream time 09:07</text>
<rect x="240" y="100" width="180" height="80" rx="9" fill="#ffffff" stroke="#111111" stroke-width="2"/>
<text x="330.0" y="130.5" font-size="13.5" font-weight="700" fill="#111111" text-anchor="middle">09:16 FASTLINE</text>
<text x="330.0" y="147.5" font-size="11.5" fill="#555555" text-anchor="middle">opens slot 09:15</text>
<text x="330.0" y="162.5" font-size="11.5" fill="#555555" text-anchor="middle">stream time 09:16</text>
<rect x="440" y="100" width="180" height="80" rx="9" fill="#fff8ef" stroke="#e8870c" stroke-width="2"/>
<text x="530.0" y="130.5" font-size="13.5" font-weight="700" fill="#111111" text-anchor="middle">09:10 FASTLINE</text>
<text x="530.0" y="147.5" font-size="11.5" fill="#555555" text-anchor="middle">out of order</text>
<text x="530.0" y="162.5" font-size="11.5" fill="#555555" text-anchor="middle">inside grace: joins 09:00</text>
<rect x="680" y="100" width="240" height="80" rx="9" fill="#f1f5f9" stroke="#64748b" stroke-width="2"/>
<text x="800.0" y="130.5" font-size="13.5" font-weight="700" fill="#111111" text-anchor="middle">09:21 tick</text>
<text x="800.0" y="147.5" font-size="11.5" fill="#555555" text-anchor="middle">stream time 09:21</text>
<text x="800.0" y="162.5" font-size="11.5" fill="#555555" text-anchor="middle">slot end + grace 09:20 passed</text>
<rect x="680" y="240" width="240" height="70" rx="9" fill="#fff8ef" stroke="#e8870c" stroke-width="2"/>
<text x="800.0" y="265.5" font-size="13.5" font-weight="700" fill="#111111" text-anchor="middle">One list leaves</text>
<text x="800.0" y="282.5" font-size="11.5" fill="#555555" text-anchor="middle">FASTLINE 09:00, count 8</text>
<text x="800.0" y="297.5" font-size="11.5" fill="#555555" text-anchor="middle">closedBy window</text>
<rect x="440" y="240" width="200" height="70" rx="9" fill="#f4f4f4" stroke="#888888" stroke-width="1.5"/>
<text x="540.0" y="265.5" font-size="13.5" font-weight="700" fill="#111111" text-anchor="middle">Suppression buffer</text>
<text x="540.0" y="282.5" font-size="11.5" fill="#555555" text-anchor="middle">holds the list</text>
<text x="540.0" y="297.5" font-size="11.5" fill="#555555" text-anchor="middle">until the window closes</text>
<rect x="680" y="340" width="240" height="70" rx="9" fill="#ffffff" stroke="#111111" stroke-width="2"/>
<text x="800.0" y="365.5" font-size="13.5" font-weight="700" fill="#111111" text-anchor="middle">09:05 FASTLINE, late</text>
<text x="800.0" y="382.5" font-size="11.5" fill="#555555" text-anchor="middle">past grace: dropped</text>
<text x="800.0" y="397.5" font-size="11.5" fill="#555555" text-anchor="middle">dropped-records counter + 1</text>
<rect x="40" y="240" width="380" height="70" rx="9" fill="#ffffff" stroke="#999999" stroke-width="1.5" stroke-dasharray="6 4"/>
<text x="230.0" y="273.0" font-size="13.5" font-weight="700" fill="#111111" text-anchor="middle">Stream time is the newest event time seen</text>
<text x="230.0" y="290.0" font-size="11.5" fill="#555555" text-anchor="middle">the wall clock never closes a window</text>
<path d="M220,140 L240,140" fill="none" stroke="#555" stroke-width="2" marker-end="url(#a)"/>
<path d="M420,140 L440,140" fill="none" stroke="#555" stroke-width="2" marker-end="url(#a)"/>
<path d="M620,140 L680,140" fill="none" stroke="#555" stroke-width="2" marker-end="url(#a)"/>
<path d="M800,180 L800,240" fill="none" stroke="#555" stroke-width="2" marker-end="url(#a)"/>
<path d="M640,275 L680,275" fill="none" stroke="#b8650a" stroke-width="2" marker-end="url(#am)"/>
<path d="M800,310 L800,340" fill="none" stroke="#555" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#a)"/>
<text x="480" y="30" font-size="15" fill="#444444" text-anchor="middle" font-weight="700">The list leaves once, when stream time passes the end of the slot plus the grace</text>
</svg>
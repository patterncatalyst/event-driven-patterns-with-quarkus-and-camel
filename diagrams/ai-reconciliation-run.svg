<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 420" font-family="'Red Hat Text', system-ui, sans-serif" role="img">
<defs><marker id="a" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#555"/></marker><marker id="am" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b8650a"/></marker></defs>
<rect x="20" y="60" width="960" height="190" rx="12" fill="#fff8ef" stroke="#ddd"/>
<text x="32" y="80" font-size="12" font-weight="700" fill="#888">One run, three Jobs, each admitted by the queue</text>
<rect x="20" y="270" width="960" height="130" rx="12" fill="#fafafa" stroke="#ddd"/>
<text x="32" y="290" font-size="12" font-weight="700" fill="#888">State in PostgreSQL</text>
<rect x="40" y="110" width="160" height="90" rx="9" fill="#fff8ef" stroke="#e8870c" stroke-width="2"/>
<text x="120.0" y="145.5" font-size="13.5" font-weight="700" fill="#111111" text-anchor="middle">batch-runner</text>
<text x="120.0" y="162.5" font-size="11.5" fill="#555555" text-anchor="middle">Process Manager</text>
<text x="120.0" y="177.5" font-size="11.5" fill="#555555" text-anchor="middle">POST /runs</text>
<rect x="235" y="110" width="150" height="90" rx="9" fill="#ffffff" stroke="#111111" stroke-width="2"/>
<text x="310.0" y="145.5" font-size="13.5" font-weight="700" fill="#111111" text-anchor="middle">plan</text>
<text x="310.0" y="162.5" font-size="11.5" fill="#555555" text-anchor="middle">1 pod</text>
<text x="310.0" y="177.5" font-size="11.5" fill="#555555" text-anchor="middle">fixes the offsets</text>
<rect x="420" y="110" width="190" height="90" rx="9" fill="#ffffff" stroke="#111111" stroke-width="2"/>
<text x="515.0" y="145.5" font-size="13.5" font-weight="700" fill="#111111" text-anchor="middle">reconcile</text>
<text x="515.0" y="162.5" font-size="11.5" fill="#555555" text-anchor="middle">Indexed Job, 3 pods</text>
<text x="515.0" y="177.5" font-size="11.5" fill="#555555" text-anchor="middle">index i reads partition i</text>
<rect x="645" y="110" width="150" height="90" rx="9" fill="#ffffff" stroke="#111111" stroke-width="2"/>
<text x="720.0" y="145.5" font-size="13.5" font-weight="700" fill="#111111" text-anchor="middle">aggregate</text>
<text x="720.0" y="162.5" font-size="11.5" fill="#555555" text-anchor="middle">1 pod</text>
<text x="720.0" y="177.5" font-size="11.5" fill="#555555" text-anchor="middle">sums the partitions</text>
<rect x="830" y="110" width="130" height="90" rx="9" fill="#f1f5f9" stroke="#64748b" stroke-width="2"/>
<text x="895.0" y="145.5" font-size="13.5" font-weight="700" fill="#111111" text-anchor="middle">output topic</text>
<text x="895.0" y="162.5" font-size="11.5" fill="#555555" text-anchor="middle">reconciliations</text>
<text x="895.0" y="177.5" font-size="11.5" fill="#555555" text-anchor="middle">key run:carrier</text>
<rect x="40" y="310" width="160" height="70" rx="9" fill="#ffffff" stroke="#999999" stroke-width="1.5"/>
<text x="120.0" y="343.0" font-size="13.5" font-weight="700" fill="#111111" text-anchor="middle">run</text>
<text x="120.0" y="360.0" font-size="11.5" fill="#555555" text-anchor="middle">step</text>
<rect x="235" y="310" width="150" height="70" rx="9" fill="#ffffff" stroke="#999999" stroke-width="1.5"/>
<text x="310.0" y="343.0" font-size="13.5" font-weight="700" fill="#111111" text-anchor="middle">run_partition</text>
<text x="310.0" y="360.0" font-size="11.5" fill="#555555" text-anchor="middle">offsets per partition</text>
<rect x="420" y="310" width="190" height="70" rx="9" fill="#ffffff" stroke="#999999" stroke-width="1.5"/>
<text x="515.0" y="343.0" font-size="13.5" font-weight="700" fill="#111111" text-anchor="middle">partition_result</text>
<text x="515.0" y="360.0" font-size="11.5" fill="#555555" text-anchor="middle">written with DONE</text>
<rect x="645" y="310" width="150" height="70" rx="9" fill="#ffffff" stroke="#999999" stroke-width="1.5"/>
<text x="720.0" y="343.0" font-size="13.5" font-weight="700" fill="#111111" text-anchor="middle">carrier_total</text>
<text x="720.0" y="360.0" font-size="11.5" fill="#555555" text-anchor="middle">per carrier</text>

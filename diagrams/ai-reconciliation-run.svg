<path d="M385,155 L420,155" fill="none" stroke="#b8650a" stroke-width="2" marker-end="url(#am)"/>
<path d="M610,155 L645,155" fill="none" stroke="#b8650a" stroke-width="2" marker-end="url(#am)"/>
<path d="M795,155 L830,155" fill="none" stroke="#555" stroke-width="2" marker-end="url(#a)"/>
<path d="M120,200 L120,310" fill="none" stroke="#555" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#a)"/>
<path d="M310,200 L310,310" fill="none" stroke="#555" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#a)"/>
<path d="M515,200 L515,310" fill="none" stroke="#555" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#a)"/>
<path d="M720,200 L720,310" fill="none" stroke="#555" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#a)"/>
<text x="500" y="30" font-size="15" fill="#444444" text-anchor="middle" font-weight="700">The runner creates the next Job only when the previous step is done</text>
</svg>
<text x="545" y="28" font-size="15" fill="#444444" text-anchor="middle" font-weight="700">Five services, one step each, joined only by Kafka topics</text>
<text x="545" y="385" font-size="11" fill="#555555" text-anchor="middle">Topics carry the edp. prefix. Shipping also emits shipping.scheduled, in-transit and delivered; order also emits orders.cancelled.</text>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 420" font-family="'Red Hat Text', system-ui, sans-serif" role="img">
<defs><marker id="a" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#555"/></marker><marker id="am" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b8650a"/></marker></defs>
<rect x="20" y="60" width="450" height="310" rx="12" fill="#fff8ef" stroke="#ddd"/>
<text x="32" y="80" font-size="12" font-weight="700" fill="#888">Before the crash</text>
<rect x="490" y="60" width="450" height="310" rx="12" fill="#fafafa" stroke="#ddd"/>
<text x="502" y="80" font-size="12" font-weight="700" fill="#888">After the restart</text>
<rect x="50" y="100" width="390" height="56" rx="9" fill="#ffffff" stroke="#111111" stroke-width="2"/>
<text x="245.0" y="126.0" font-size="13.5" font-weight="700" fill="#111111" text-anchor="middle">1. read the record for C at offset 3</text>
<text x="245.0" y="143.0" font-size="11.5" fill="#555555" text-anchor="middle">committed offset of the group: 3</text>
<rect x="50" y="180" width="390" height="56" rx="9" fill="#ffffff" stroke="#111111" stroke-width="2"/>
<text x="245.0" y="206.0" font-size="13.5" font-weight="700" fill="#111111" text-anchor="middle">2. commit: inbox row C and stock - 4</text>
<text x="245.0" y="223.0" font-size="11.5" fill="#555555" text-anchor="middle">both rows are durable</text>
<rect x="50" y="260" width="390" height="56" rx="9" fill="#fff8ef" stroke="#e8870c" stroke-width="2"/>
<text x="245.0" y="286.0" font-size="13.5" font-weight="700" fill="#111111" text-anchor="middle">3. the JVM halts with exit 137</text>
<text x="245.0" y="303.0" font-size="11.5" fill="#555555" text-anchor="middle">the record is not acknowledged</text>
<rect x="520" y="100" width="390" height="56" rx="9" fill="#ffffff" stroke="#111111" stroke-width="2"/>
<text x="715.0" y="126.0" font-size="13.5" font-weight="700" fill="#111111" text-anchor="middle">4. the group member rejoins</text>
<text x="715.0" y="143.0" font-size="11.5" fill="#555555" text-anchor="middle">after the dead member&#x27;s session expires</text>
<rect x="520" y="180" width="390" height="56" rx="9" fill="#ffffff" stroke="#111111" stroke-width="2"/>
<text x="715.0" y="206.0" font-size="13.5" font-weight="700" fill="#111111" text-anchor="middle">5. the record for C is delivered again</text>
<text x="715.0" y="223.0" font-size="11.5" fill="#555555" text-anchor="middle">the offset was never committed past it</text>
<rect x="520" y="260" width="390" height="56" rx="9" fill="#fff8ef" stroke="#e8870c" stroke-width="2"/>
<text x="715.0" y="286.0" font-size="13.5" font-weight="700" fill="#111111" text-anchor="middle">6. the insert returns 0 rows: skipped</text>
<text x="715.0" y="303.0" font-size="11.5" fill="#555555" text-anchor="middle">stock stays at 91, lag reaches 0</text>
<path d="M245,156 L245,180" fill="none" stroke="#555" stroke-width="2" marker-end="url(#a)"/>
<path d="M245,236 L245,260" fill="none" stroke="#555" stroke-width="2" marker-end="url(#a)"/>
<path d="M440,288 L520,128" fill="none" stroke="#b8650a" stroke-width="2" marker-end="url(#am)"/>
<path d="M715,156 L715,180" fill="none" stroke="#555" stroke-width="2" marker-end="url(#a)"/>
<path d="M715,236 L715,260" fill="none" stroke="#555" stroke-width="2" marker-end="url(#a)"/>
<text x="480" y="30" font-size="15" fill="#444444" text-anchor="middle" font-weight="700">At-least-once delivery turns a crash into a duplicate</text>
</svg>
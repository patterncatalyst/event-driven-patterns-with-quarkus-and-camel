<rect x="490" y="420" width="430" height="60" rx="9" fill="#ffffff" stroke="#111111" stroke-width="2"/>
<text x="705.0" y="448.0" font-size="13.5" font-weight="700" fill="#111111" text-anchor="middle">read_uncommitted</text>
<text x="705.0" y="465.0" font-size="11.5" fill="#555555" text-anchor="middle">5 + 7 + 10 records: every copy</text>
<path d="M520,120 L580,120" fill="none" stroke="#555" stroke-width="2" marker-end="url(#a)"/>
<path d="M520,200 L580,200" fill="none" stroke="#b8650a" stroke-width="2" marker-end="url(#am)"/>
<text x="480" y="30" font-size="15" fill="#444444" text-anchor="middle" font-weight="700">An aborted transaction stays in the log and is invisible to read_committed</text>
</svg>
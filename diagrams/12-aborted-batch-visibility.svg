<text x="750.0" y="198.0" font-size="13.5" font-weight="700" fill="#111111" text-anchor="middle">read_committed</text>
<text x="750.0" y="215.0" font-size="11.5" fill="#555555" text-anchor="middle">5 records, nothing of O-5101 to O-5110</text>
<rect x="40" y="330" width="170" height="60" rx="9" fill="#ffffff" stroke="#111111" stroke-width="2"/>

<text x="695.0" y="375.0" font-size="11.5" fill="#555555" text-anchor="middle">committed</text>
<rect x="795" y="330" width="85" height="60" rx="9" fill="#f1f5f9" stroke="#64748b" stroke-width="2"/>
<text x="837.5" y="358.0" font-size="13.5" font-weight="700" fill="#111111" text-anchor="middle">commit</text>
<text x="837.5" y="375.0" font-size="11.5" fill="#555555" text-anchor="middle">marker</text>
<rect x="40" y="420" width="430" height="60" rx="9" fill="#fff8ef" stroke="#e8870c" stroke-width="2"/>
<text x="255.0" y="448.0" font-size="13.5" font-weight="700" fill="#111111" text-anchor="middle">read_committed</text>

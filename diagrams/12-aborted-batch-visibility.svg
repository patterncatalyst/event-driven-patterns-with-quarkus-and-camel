<rect x="225" y="330" width="85" height="60" rx="9" fill="#f1f5f9" stroke="#64748b" stroke-width="2"/>
<text x="267.5" y="358.0" font-size="13.5" font-weight="700" fill="#111111" text-anchor="middle">commit</text>
<text x="267.5" y="375.0" font-size="11.5" fill="#555555" text-anchor="middle">marker</text>
<rect x="325" y="330" width="170" height="60" rx="9" fill="#ffffff" stroke="#999999" stroke-width="1.5" stroke-dasharray="6 4"/>
<text x="410.0" y="358.0" font-size="13.5" font-weight="700" fill="#111111" text-anchor="middle">O-5101 to O-5107</text>

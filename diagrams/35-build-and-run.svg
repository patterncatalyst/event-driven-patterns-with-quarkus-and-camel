<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 380" font-family="'Red Hat Text', system-ui, sans-serif" role="img">
<defs><marker id="a" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#555"/></marker><marker id="am" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b8650a"/></marker></defs>
<rect x="20" y="60" width="960" height="190" rx="12" fill="#fff8ef" stroke="#ddd"/>
<text x="32" y="80" font-size="12" font-weight="700" fill="#888">In the namespace edp-kafka</text>
<rect x="40" y="110" width="180" height="110" rx="9" fill="#fff8ef" stroke="#e8870c" stroke-width="2"/>
<text x="130.0" y="155.5" font-size="13.5" font-weight="700" fill="#111111" text-anchor="middle">KafkaConnect</text>
<text x="130.0" y="172.5" font-size="11.5" fill="#555555" text-anchor="middle">build: plugin archive,</text>
<text x="130.0" y="187.5" font-size="11.5" fill="#555555" text-anchor="middle">sha512, output image</text>
<rect x="270" y="110" width="170" height="110" rx="9" fill="#ffffff" stroke="#111111" stroke-width="2"/>
<text x="355.0" y="155.5" font-size="13.5" font-weight="700" fill="#111111" text-anchor="middle">Build pod</text>
<text x="355.0" y="172.5" font-size="11.5" fill="#555555" text-anchor="middle">downloads the plugin,</text>
<text x="355.0" y="187.5" font-size="11.5" fill="#555555" text-anchor="middle">checks the sha512</text>
<rect x="490" y="110" width="170" height="110" rx="9" fill="#f1f5f9" stroke="#64748b" stroke-width="2"/>
<text x="575.0" y="155.5" font-size="13.5" font-weight="700" fill="#111111" text-anchor="middle">Registry</text>
<text x="575.0" y="172.5" font-size="11.5" fill="#555555" text-anchor="middle">fixed ClusterIP,</text>
<text x="575.0" y="187.5" font-size="11.5" fill="#555555" text-anchor="middle">plain HTTP</text>
<rect x="710" y="110" width="150" height="110" rx="9" fill="#ffffff" stroke="#111111" stroke-width="2"/>
<text x="785.0" y="163.0" font-size="13.5" font-weight="700" fill="#111111" text-anchor="middle">Connect pod</text>
<text x="785.0" y="180.0" font-size="11.5" fill="#555555" text-anchor="middle">pulls by digest</text>
<rect x="890" y="110" width="90" height="110" rx="9" fill="#ffffff" stroke="#999999" stroke-width="1.5" stroke-dasharray="6 4"/>
<text x="935.0" y="163.0" font-size="13.5" font-weight="700" fill="#111111" text-anchor="middle">Connector</text>
<text x="935.0" y="180.0" font-size="11.5" fill="#555555" text-anchor="middle">tasks</text>
<rect x="270" y="290" width="390" height="60" rx="9" fill="#ffffff" stroke="#999999" stroke-width="1.5" stroke-dasharray="6 4"/>
<text x="465.0" y="318.0" font-size="13.5" font-weight="700" fill="#111111" text-anchor="middle">A checksum that does not match:</text>
<text x="465.0" y="335.0" font-size="11.5" fill="#555555" text-anchor="middle">the build fails, no image, no Connect pod</text>
<path d="M220,165 L270,165" fill="none" stroke="#b8650a" stroke-width="2" marker-end="url(#am)"/>
<path d="M440,165 L490,165" fill="none" stroke="#555" stroke-width="2" marker-end="url(#a)"/>
<path d="M660,165 L710,165" fill="none" stroke="#555" stroke-width="2" marker-end="url(#a)"/>
<path d="M860,165 L890,165" fill="none" stroke="#555" stroke-width="2" marker-end="url(#a)"/>
<path d="M355,220 L355,290" fill="none" stroke="#555" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#a)"/>
<text x="500" y="30" font-size="15" fill="#444444" text-anchor="middle" font-weight="700">The image is built from the resource and never leaves the cluster</text>
<text x="465" y="150" font-size="12" fill="#444444" text-anchor="middle">push</text>
<text x="685" y="150" font-size="12" fill="#444444" text-anchor="middle">pull</text>
</svg>
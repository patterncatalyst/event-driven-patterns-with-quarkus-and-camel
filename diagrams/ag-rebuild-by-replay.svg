<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 470" font-family="'Red Hat Text', system-ui, sans-serif" role="img">
<defs><marker id="a" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#555"/></marker><marker id="am" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b8650a"/></marker></defs>
<rect x="20" y="60" width="960" height="150" rx="12" fill="#fafafa" stroke="#ddd"/>
<text x="32" y="80" font-size="12" font-weight="700" fill="#888">1. The cache is lost</text>
<rect x="20" y="230" width="960" height="210" rx="12" fill="#fff8ef" stroke="#ddd"/>
<text x="32" y="250" font-size="12" font-weight="700" fill="#888">2. A new group replays both topics from the start</text>
<rect x="40" y="100" width="250" height="70" rx="9" fill="#f4f4f4" stroke="#888888" stroke-width="1.5"/>
<text x="165.0" y="133.0" font-size="13.5" font-weight="700" fill="#111111" text-anchor="middle">Redis restarts</text>
<text x="165.0" y="150.0" font-size="11.5" fill="#555555" text-anchor="middle">no persistence: 0 keys</text>
<rect x="370" y="100" width="250" height="70" rx="9" fill="#ffffff" stroke="#111111" stroke-width="2"/>
<text x="495.0" y="133.0" font-size="13.5" font-weight="700" fill="#111111" text-anchor="middle">order-service</text>
<text x="495.0" y="150.0" font-size="11.5" fill="#555555" text-anchor="middle">keeps accepting orders</text>
<rect x="700" y="100" width="250" height="70" rx="9" fill="#ffffff" stroke="#999999" stroke-width="1.5" stroke-dasharray="6 4"/>
<text x="825.0" y="133.0" font-size="13.5" font-weight="700" fill="#111111" text-anchor="middle">events during the outage</text>
<text x="825.0" y="150.0" font-size="11.5" fill="#555555" text-anchor="middle">are not applied</text>
<rect x="40" y="280" width="230" height="70" rx="9" fill="#f1f5f9" stroke="#64748b" stroke-width="2"/>
<text x="155.0" y="313.0" font-size="13.5" font-weight="700" fill="#111111" text-anchor="middle">edp.orders.cancelled</text>
<text x="155.0" y="330.0" font-size="11.5" fill="#555555" text-anchor="middle">O-1 CANCELLED v2</text>
<rect x="40" y="360" width="230" height="60" rx="9" fill="#f1f5f9" stroke="#64748b" stroke-width="2"/>
<text x="155.0" y="388.0" font-size="13.5" font-weight="700" fill="#111111" text-anchor="middle">edp.orders.placed</text>
<text x="155.0" y="405.0" font-size="11.5" fill="#555555" text-anchor="middle">O-1 PLACED v1, O-2 PLACED v1</text>
<rect x="350" y="300" width="250" height="90" rx="9" fill="#ffffff" stroke="#111111" stroke-width="2"/>
<text x="475.0" y="335.5" font-size="13.5" font-weight="700" fill="#111111" text-anchor="middle">Camel route, group order-cache-2</text>
<text x="475.0" y="352.5" font-size="11.5" fill="#555555" text-anchor="middle">autoOffsetReset=earliest</text>
<text x="475.0" y="367.5" font-size="11.5" fill="#555555" text-anchor="middle">any arrival order</text>
<rect x="680" y="300" width="270" height="90" rx="9" fill="#fff8ef" stroke="#e8870c" stroke-width="2"/>
<text x="815.0" y="335.5" font-size="13.5" font-weight="700" fill="#111111" text-anchor="middle">version guard</text>
<text x="815.0" y="352.5" font-size="11.5" fill="#555555" text-anchor="middle">v1 after v2 is ignored</text>
<text x="815.0" y="367.5" font-size="11.5" fill="#555555" text-anchor="middle">O-1 CANCELLED v2, O-2 PLACED v1</text>
<path d="M290,135 L370,135" fill="none" stroke="#555" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#a)"/>
<path d="M620,135 L700,135" fill="none" stroke="#555" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#a)"/>
<path d="M270,315 L350,335" fill="none" stroke="#b8650a" stroke-width="2" marker-end="url(#am)"/>
<path d="M270,390 L350,365" fill="none" stroke="#b8650a" stroke-width="2" marker-end="url(#am)"/>
<path d="M600,345 L680,345" fill="none" stroke="#b8650a" stroke-width="2" marker-end="url(#am)"/>
<text x="500" y="30" font-size="15" fill="#444444" text-anchor="middle" font-weight="700">The topics hold the full state, so the cache is a rebuildable copy</text>
</svg>
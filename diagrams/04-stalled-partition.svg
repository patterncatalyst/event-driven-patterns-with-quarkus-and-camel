<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" font-family="'Red Hat Text', system-ui, sans-serif" role="img">
<defs><marker id="a" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#555"/></marker><marker id="am" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b8650a"/></marker></defs>
<rect x="20" y="190" width="920" height="100" rx="12" fill="#fafafa" stroke="#ddd"/>
<text x="32" y="210" font-size="12" font-weight="700" fill="#888">edp.shipping.shipments, keyed by event type</text>
<rect x="330" y="40" width="300" height="60" rx="9" fill="#f1f5f9" stroke="#64748b" stroke-width="2"/>
<text x="480.0" y="68.0" font-size="13.5" font-weight="700" fill="#111111" text-anchor="middle">shipping-service</text>
<text x="480.0" y="85.0" font-size="11.5" fill="#555555" text-anchor="middle">publishes 1 Scheduled, 2 InTransit, 3 Delivered</text>
<rect x="40" y="220" width="270" height="56" rx="9" fill="#ffffff" stroke="#111111" stroke-width="2"/>
<text x="175.0" y="246.0" font-size="13.5" font-weight="700" fill="#111111" text-anchor="middle">partition 0</text>
<text x="175.0" y="263.0" font-size="11.5" fill="#555555" text-anchor="middle">InTransit (2), Delivered (3)</text>
<rect x="345" y="220" width="270" height="56" rx="9" fill="#ffffff" stroke="#999999" stroke-width="1.5" stroke-dasharray="6 4"/>
<text x="480.0" y="246.0" font-size="13.5" font-weight="700" fill="#111111" text-anchor="middle">partition 1</text>
<text x="480.0" y="263.0" font-size="11.5" fill="#555555" text-anchor="middle">empty</text>
<rect x="650" y="220" width="270" height="56" rx="9" fill="#fff8ef" stroke="#e8870c" stroke-width="2"/>
<text x="785.0" y="246.0" font-size="13.5" font-weight="700" fill="#111111" text-anchor="middle">partition 2</text>
<text x="785.0" y="263.0" font-size="11.5" fill="#555555" text-anchor="middle">Scheduled (1)</text>
<rect x="40" y="340" width="270" height="56" rx="9" fill="#ffffff" stroke="#111111" stroke-width="2"/>
<text x="175.0" y="366.0" font-size="13.5" font-weight="700" fill="#111111" text-anchor="middle">order replica B</text>
<text x="175.0" y="383.0" font-size="11.5" fill="#555555" text-anchor="middle">applies InTransit, then Delivered</text>
<rect x="650" y="340" width="270" height="56" rx="9" fill="#ffffff" stroke="#999999" stroke-width="1.5" stroke-dasharray="6 4"/>
<text x="785.0" y="366.0" font-size="13.5" font-weight="700" fill="#111111" text-anchor="middle">order replica A: paused</text>
<text x="785.0" y="383.0" font-size="11.5" fill="#555555" text-anchor="middle">applies Scheduled after it resumes</text>
<rect x="250" y="440" width="460" height="56" rx="9" fill="#fff8ef" stroke="#e8870c" stroke-width="2"/>
<text x="480.0" y="466.0" font-size="13.5" font-weight="700" fill="#111111" text-anchor="middle">order status: SHIPPED, DELIVERED, then SHIPPED</text>
<text x="480.0" y="483.0" font-size="11.5" fill="#555555" text-anchor="middle">last write wins, so the order ends SHIPPED</text>
<path d="M400,100 L175,220" fill="none" stroke="#b8650a" stroke-width="2" marker-end="url(#am)"/>
<path d="M560,100 L785,220" fill="none" stroke="#b8650a" stroke-width="2" marker-end="url(#am)"/>
<path d="M175,276 L175,340" fill="none" stroke="#555" stroke-width="2" marker-end="url(#a)"/>
<path d="M785,276 L785,340" fill="none" stroke="#555" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#a)"/>
<path d="M175,396 L360,440" fill="none" stroke="#555" stroke-width="2" marker-end="url(#a)"/>
<path d="M785,396 L600,440" fill="none" stroke="#555" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#a)"/>
<text x="480" y="24" font-size="15" fill="#444444" text-anchor="middle" font-weight="700">One stalled partition reorders an order that was published in sequence</text>
</svg>
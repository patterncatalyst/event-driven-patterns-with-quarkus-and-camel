<path d="M245,250 L245,290" fill="none" stroke="#555" stroke-width="2" marker-end="url(#a)"/>
<path d="M440,325 L530,135" fill="none" stroke="#b8650a" stroke-width="2" marker-end="url(#am)"/>
<path d="M720,160 L720,190" fill="none" stroke="#555" stroke-width="2" marker-end="url(#a)"/>
<path d="M720,260 L720,290" fill="none" stroke="#555" stroke-width="2" marker-end="url(#a)"/>
<text x="480" y="30" font-size="15" fill="#444444" text-anchor="middle" font-weight="700">Nothing publishes from application memory</text>

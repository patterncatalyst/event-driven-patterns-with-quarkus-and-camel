<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 460" font-family="'Red Hat Text', system-ui, sans-serif" role="img">
<defs><marker id="a" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#555"/></marker><marker id="am" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b8650a"/></marker></defs>
<rect x="20" y="60" width="450" height="360" rx="12" fill="#fff8ef" stroke="#ddd"/>
<text x="32" y="80" font-size="12" font-weight="700" fill="#888">One transaction in order-service</text>
<rect x="500" y="60" width="440" height="360" rx="12" fill="#fafafa" stroke="#ddd"/>
<text x="512" y="80" font-size="12" font-weight="700" fill="#888">Kafka Connect</text>
<rect x="50" y="100" width="390" height="60" rx="9" fill="#ffffff" stroke="#111111" stroke-width="2"/>
<text x="245.0" y="128.0" font-size="13.5" font-weight="700" fill="#111111" text-anchor="middle">OrderService.place()</text>
<text x="245.0" y="145.0" font-size="11.5" fill="#555555" text-anchor="middle">persist the order, fire OrderPlacedEvent</text>
<rect x="50" y="190" width="390" height="60" rx="9" fill="#fff8ef" stroke="#e8870c" stroke-width="2"/>
<text x="245.0" y="218.0" font-size="13.5" font-weight="700" fill="#111111" text-anchor="middle">orders.orders and orders.outboxevent</text>
<text x="245.0" y="235.0" font-size="11.5" fill="#555555" text-anchor="middle">both rows commit together or not at all</text>
<rect x="50" y="290" width="390" height="70" rx="9" fill="#f4f4f4" stroke="#888888" stroke-width="1.5"/>
<text x="245.0" y="323.0" font-size="13.5" font-weight="700" fill="#111111" text-anchor="middle">PostgreSQL write-ahead log</text>
<text x="245.0" y="340.0" font-size="11.5" fill="#555555" text-anchor="middle">replication slot edp_order_outbox</text>
<rect x="530" y="100" width="380" height="60" rx="9" fill="#ffffff" stroke="#111111" stroke-width="2"/>
<text x="720.0" y="128.0" font-size="13.5" font-weight="700" fill="#111111" text-anchor="middle">Debezium PostgreSQL connector</text>
<text x="720.0" y="145.0" font-size="11.5" fill="#555555" text-anchor="middle">reads inserts of orders.outboxevent only</text>
<rect x="530" y="190" width="380" height="70" rx="9" fill="#ffffff" stroke="#111111" stroke-width="2"/>
<text x="720.0" y="223.0" font-size="13.5" font-weight="700" fill="#111111" text-anchor="middle">EventRouter transform</text>
<text x="720.0" y="240.0" font-size="11.5" fill="#555555" text-anchor="middle">topic column picks the topic, aggregateid the key</text>
<rect x="530" y="290" width="380" height="70" rx="9" fill="#f1f5f9" stroke="#64748b" stroke-width="2"/>
<text x="720.0" y="323.0" font-size="13.5" font-weight="700" fill="#111111" text-anchor="middle">edp.orders.placed</text>
<text x="720.0" y="340.0" font-size="11.5" fill="#555555" text-anchor="middle">key = order id; headers id and eventType</text>

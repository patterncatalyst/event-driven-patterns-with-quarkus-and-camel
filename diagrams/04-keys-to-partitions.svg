<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 470" font-family="'Red Hat Text', system-ui, sans-serif" role="img">
<defs><marker id="a" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#555"/></marker><marker id="am" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b8650a"/></marker></defs>
<rect x="20" y="70" width="920" height="110" rx="12" fill="#fafafa" stroke="#ddd"/>
<text x="32" y="90" font-size="12" font-weight="700" fill="#888">Key: order id</text>
<rect x="20" y="195" width="920" height="110" rx="12" fill="#fafafa" stroke="#ddd"/>
<text x="32" y="215" font-size="12" font-weight="700" fill="#888">Key: event type</text>
<rect x="20" y="320" width="920" height="110" rx="12" fill="#fafafa" stroke="#ddd"/>
<text x="32" y="340" font-size="12" font-weight="700" fill="#888">Key: carrier</text>
<rect x="40" y="100" width="230" height="66" rx="9" fill="#ffffff" stroke="#111111" stroke-width="2"/>
<text x="155.0" y="131.0" font-size="13.5" font-weight="700" fill="#111111" text-anchor="middle">murmur2(O-1001) mod 3</text>
<text x="155.0" y="148.0" font-size="11.5" fill="#555555" text-anchor="middle">one key per order</text>
<rect x="300" y="100" width="200" height="66" rx="9" fill="#ffffff" stroke="#111111" stroke-width="2"/>
<text x="400.0" y="131.0" font-size="13.5" font-weight="700" fill="#111111" text-anchor="middle">O-1002</text>
<text x="400.0" y="148.0" font-size="11.5" fill="#555555" text-anchor="middle">all three events</text>
<rect x="520" y="100" width="200" height="66" rx="9" fill="#ffffff" stroke="#111111" stroke-width="2"/>
<text x="620.0" y="131.0" font-size="13.5" font-weight="700" fill="#111111" text-anchor="middle">O-1004</text>
<text x="620.0" y="148.0" font-size="11.5" fill="#555555" text-anchor="middle">all three events</text>
<rect x="740" y="100" width="190" height="66" rx="9" fill="#fff8ef" stroke="#e8870c" stroke-width="2"/>
<text x="835.0" y="131.0" font-size="13.5" font-weight="700" fill="#111111" text-anchor="middle">O-1001</text>
<text x="835.0" y="148.0" font-size="11.5" fill="#555555" text-anchor="middle">all three events, in order</text>
<rect x="40" y="225" width="230" height="66" rx="9" fill="#ffffff" stroke="#111111" stroke-width="2"/>
<text x="155.0" y="256.0" font-size="13.5" font-weight="700" fill="#111111" text-anchor="middle">murmur2(ShipmentScheduled)</text>
<text x="155.0" y="273.0" font-size="11.5" fill="#555555" text-anchor="middle">three keys, shared by all orders</text>
<rect x="300" y="225" width="200" height="66" rx="9" fill="#fff8ef" stroke="#e8870c" stroke-width="2"/>
<text x="400.0" y="256.0" font-size="13.5" font-weight="700" fill="#111111" text-anchor="middle">InTransit and Delivered</text>
<text x="400.0" y="273.0" font-size="11.5" fill="#555555" text-anchor="middle">of every order</text>
<rect x="520" y="225" width="200" height="66" rx="9" fill="#ffffff" stroke="#999999" stroke-width="1.5" stroke-dasharray="6 4"/>
<text x="620.0" y="256.0" font-size="13.5" font-weight="700" fill="#111111" text-anchor="middle">no event type</text>
<text x="620.0" y="273.0" font-size="11.5" fill="#555555" text-anchor="middle">maps here</text>
<rect x="740" y="225" width="190" height="66" rx="9" fill="#fff8ef" stroke="#e8870c" stroke-width="2"/>
<text x="835.0" y="256.0" font-size="13.5" font-weight="700" fill="#111111" text-anchor="middle">Scheduled</text>
<text x="835.0" y="273.0" font-size="11.5" fill="#555555" text-anchor="middle">of every order</text>
<rect x="40" y="350" width="230" height="66" rx="9" fill="#ffffff" stroke="#111111" stroke-width="2"/>
<text x="155.0" y="381.0" font-size="13.5" font-weight="700" fill="#111111" text-anchor="middle">murmur2(AIRCO) mod 3</text>
<text x="155.0" y="398.0" font-size="11.5" fill="#555555" text-anchor="middle">two keys, shared by all orders</text>
<rect x="300" y="350" width="200" height="66" rx="9" fill="#ffffff" stroke="#111111" stroke-width="2"/>
<text x="400.0" y="381.0" font-size="13.5" font-weight="700" fill="#111111" text-anchor="middle">FASTLINE orders</text>
<text x="400.0" y="398.0" font-size="11.5" fill="#555555" text-anchor="middle">each order in order</text>
<rect x="520" y="350" width="200" height="66" rx="9" fill="#ffffff" stroke="#999999" stroke-width="1.5" stroke-dasharray="6 4"/>
<text x="620.0" y="381.0" font-size="13.5" font-weight="700" fill="#111111" text-anchor="middle">no carrier</text>
<text x="620.0" y="398.0" font-size="11.5" fill="#555555" text-anchor="middle">maps here</text>
<rect x="740" y="350" width="190" height="66" rx="9" fill="#ffffff" stroke="#111111" stroke-width="2"/>
<text x="835.0" y="381.0" font-size="13.5" font-weight="700" fill="#111111" text-anchor="middle">AIRCO orders</text>
<text x="835.0" y="398.0" font-size="11.5" fill="#555555" text-anchor="middle">each order in order</text>
<text x="480" y="24" font-size="15" fill="#444444" text-anchor="middle" font-weight="700">The key picks the partition; the partition is the only place order exists</text>
<text x="400" y="56" font-size="12" fill="#555555" text-anchor="middle">Partition 0</text>
<text x="620" y="56" font-size="12" fill="#555555" text-anchor="middle">Partition 1</text>
<text x="835" y="56" font-size="12" fill="#555555" text-anchor="middle">Partition 2</text>
<text x="480" y="455" font-size="11" fill="#555555" text-anchor="middle">Order id keeps an order whole and spreads orders. Event type splits one order. Carrier keeps orders whole but leaves a partition idle.</text>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 460" font-family="'Red Hat Text', system-ui, sans-serif" role="img">
<defs><marker id="a" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#555"/></marker><marker id="am" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b8650a"/></marker></defs>
<rect x="20" y="60" width="450" height="360" rx="12" fill="#fafafa" stroke="#ddd"/>
<text x="32" y="80" font-size="12" font-weight="700" fill="#888">edp.orders.placed, partition 0</text>
<rect x="500" y="60" width="440" height="360" rx="12" fill="#fff8ef" stroke="#ddd"/>
<text x="512" y="80" font-size="12" font-weight="700" fill="#888">inventory-service, one consumer</text>
<rect x="50" y="100" width="390" height="50" rx="9" fill="#ffffff" stroke="#111111" stroke-width="2"/>
<text x="245.0" y="130.5" font-size="13.5" font-weight="700" fill="#111111" text-anchor="middle">offset 3: O-7003, quantity 0 (dead-lettered)</text>
<rect x="50" y="170" width="390" height="70" rx="9" fill="#fff8ef" stroke="#e8870c" stroke-width="2"/>
<text x="245.0" y="203.0" font-size="13.5" font-weight="700" fill="#111111" text-anchor="middle">offset 4: O-7004 on SKU-14</text>
<text x="245.0" y="220.0" font-size="11.5" fill="#555555" text-anchor="middle">row held by another transaction</text>
<rect x="50" y="260" width="390" height="70" rx="9" fill="#ffffff" stroke="#999999" stroke-width="1.5" stroke-dasharray="6 4"/>
<text x="245.0" y="293.0" font-size="13.5" font-weight="700" fill="#111111" text-anchor="middle">offset 5: O-7005 on SKU-15</text>
<text x="245.0" y="310.0" font-size="11.5" fill="#555555" text-anchor="middle">nothing wrong with it, not read yet</text>
<rect x="530" y="100" width="380" height="70" rx="9" fill="#ffffff" stroke="#111111" stroke-width="2"/>
<text x="720.0" y="133.0" font-size="13.5" font-weight="700" fill="#111111" text-anchor="middle">attempt 1, 2, 3 ... of O-7004</text>
<text x="720.0" y="150.0" font-size="11.5" fill="#555555" text-anchor="middle">each waits 2 s for the lock, then 1 s delay</text>
<rect x="530" y="200" width="380" height="56" rx="9" fill="#fff8ef" stroke="#e8870c" stroke-width="2"/>
<text x="720.0" y="226.0" font-size="13.5" font-weight="700" fill="#111111" text-anchor="middle">lock released: O-7004 reserved</text>
<text x="720.0" y="243.0" font-size="11.5" fill="#555555" text-anchor="middle">offset 4 committed</text>
<rect x="530" y="290" width="380" height="56" rx="9" fill="#f1f5f9" stroke="#64748b" stroke-width="2"/>
<text x="720.0" y="316.0" font-size="13.5" font-weight="700" fill="#111111" text-anchor="middle">O-7005 reserved</text>
<text x="720.0" y="333.0" font-size="11.5" fill="#555555" text-anchor="middle">waited for the whole retry</text>
<path d="M440,205 L530,135" fill="none" stroke="#b8650a" stroke-width="2" marker-end="url(#am)"/>
<path d="M720,170 L720,200" fill="none" stroke="#555" stroke-width="2" marker-end="url(#a)"/>
<path d="M720,256 L720,290" fill="none" stroke="#555" stroke-width="2" marker-end="url(#a)"/>
<path d="M440,295 L530,318" fill="none" stroke="#555" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#a)"/>
<text x="480" y="30" font-size="15" fill="#444444" text-anchor="middle" font-weight="700">A retry in place blocks the partition behind it</text>
</svg>
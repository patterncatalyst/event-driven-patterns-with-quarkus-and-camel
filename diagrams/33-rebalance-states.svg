<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 330" font-family="'Red Hat Text', system-ui, sans-serif" role="img">
<defs><marker id="a" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#555"/></marker><marker id="am" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b8650a"/></marker></defs>
<rect x="20" y="60" width="1000" height="150" rx="12" fill="#fff8ef" stroke="#ddd"/>
<text x="32" y="80" font-size="12" font-weight="700" fill="#888">KafkaRebalance status</text>
<rect x="40" y="100" width="170" height="80" rx="9" fill="#ffffff" stroke="#111111" stroke-width="2"/>
<text x="125.0" y="130.5" font-size="13.5" font-weight="700" fill="#111111" text-anchor="middle">PendingProposal</text>
<text x="125.0" y="147.5" font-size="11.5" fill="#555555" text-anchor="middle">Cruise Control</text>
<text x="125.0" y="162.5" font-size="11.5" fill="#555555" text-anchor="middle">computes a plan</text>
<rect x="260" y="100" width="170" height="80" rx="9" fill="#fff8ef" stroke="#e8870c" stroke-width="2"/>
<text x="345.0" y="130.5" font-size="13.5" font-weight="700" fill="#111111" text-anchor="middle">ProposalReady</text>
<text x="345.0" y="147.5" font-size="11.5" fill="#555555" text-anchor="middle">optimizationResult</text>
<text x="345.0" y="162.5" font-size="11.5" fill="#555555" text-anchor="middle">nothing has moved</text>
<rect x="480" y="100" width="170" height="80" rx="9" fill="#ffffff" stroke="#111111" stroke-width="2"/>
<text x="565.0" y="130.5" font-size="13.5" font-weight="700" fill="#111111" text-anchor="middle">Rebalancing</text>
<text x="565.0" y="147.5" font-size="11.5" fill="#555555" text-anchor="middle">replicas are</text>
<text x="565.0" y="162.5" font-size="11.5" fill="#555555" text-anchor="middle">being copied</text>
<rect x="700" y="100" width="170" height="80" rx="9" fill="#f1f5f9" stroke="#64748b" stroke-width="2"/>
<text x="785.0" y="130.5" font-size="13.5" font-weight="700" fill="#111111" text-anchor="middle">Ready</text>
<text x="785.0" y="147.5" font-size="11.5" fill="#555555" text-anchor="middle">the new layout</text>
<text x="785.0" y="162.5" font-size="11.5" fill="#555555" text-anchor="middle">is in place</text>
<rect x="260" y="245" width="250" height="55" rx="9" fill="#ffffff" stroke="#999999" stroke-width="1.5" stroke-dasharray="6 4"/>
<text x="385.0" y="270.5" font-size="13.5" font-weight="700" fill="#111111" text-anchor="middle">rebalance=refresh</text>
<text x="385.0" y="287.5" font-size="11.5" fill="#555555" text-anchor="middle">a new plan from current load</text>
<rect x="560" y="245" width="300" height="55" rx="9" fill="#ffffff" stroke="#999999" stroke-width="1.5" stroke-dasharray="6 4"/>
<text x="710.0" y="270.5" font-size="13.5" font-weight="700" fill="#111111" text-anchor="middle">rebalance-auto-approval: true</text>
<text x="710.0" y="287.5" font-size="11.5" fill="#555555" text-anchor="middle">or the operator&#x27;s autoRebalance</text>
<path d="M210,140 L260,140" fill="none" stroke="#555" stroke-width="2" marker-end="url(#a)"/>
<path d="M430,140 L480,140" fill="none" stroke="#b8650a" stroke-width="2" marker-end="url(#am)"/>
<text x="461.0" y="130.0" font-size="11" fill="#ffffff" stroke="#ffffff" stroke-width="3" paint-order="stroke" text-anchor="middle">approve</text>
<text x="461.0" y="130.0" font-size="11" fill="#b8650a" text-anchor="middle">approve</text>
<path d="M650,140 L700,140" fill="none" stroke="#555" stroke-width="2" marker-end="url(#a)"/>
<path d="M345,245 L345,180" fill="none" stroke="#555" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#a)"/>
<path d="M710,245 L570,180" fill="none" stroke="#555" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#a)"/>
<text x="520" y="30" font-size="15" fill="#444444" text-anchor="middle" font-weight="700">A proposal is only a plan: nothing moves until it is approved</text>
<text x="520" y="320" font-size="13" fill="#555555" text-anchor="middle">A rebalance that cannot get a plan reports NotReady and is refreshed</text>
</svg>
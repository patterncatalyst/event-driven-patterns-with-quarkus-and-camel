<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 330" font-family="'Red Hat Text', system-ui, sans-serif" role="img">
<defs><marker id="a" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#555"/></marker><marker id="am" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b8650a"/></marker></defs>
<rect x="20" y="60" width="960" height="150" rx="12" fill="#fff8ef" stroke="#ddd"/>
<text x="32" y="80" font-size="12" font-weight="700" fill="#888">Cut-over, in this order</text>
<rect x="40" y="100" width="210" height="90" rx="9" fill="#ffffff" stroke="#111111" stroke-width="2"/>
<text x="145.0" y="135.5" font-size="13.5" font-weight="700" fill="#111111" text-anchor="middle">1 Scale blue to 0</text>
<text x="145.0" y="152.5" font-size="11.5" fill="#555555" text-anchor="middle">wait until the group</text>
<text x="145.0" y="167.5" font-size="11.5" fill="#555555" text-anchor="middle">notify-blue is Empty</text>
<rect x="285" y="100" width="210" height="90" rx="9" fill="#ffffff" stroke="#111111" stroke-width="2"/>
<text x="390.0" y="135.5" font-size="13.5" font-weight="700" fill="#111111" text-anchor="middle">2 Export offsets</text>
<text x="390.0" y="152.5" font-size="11.5" fill="#555555" text-anchor="middle">--to-current --dry-run</text>
<text x="390.0" y="167.5" font-size="11.5" fill="#555555" text-anchor="middle">--export: topic,partition,offset</text>
<rect x="530" y="100" width="210" height="90" rx="9" fill="#ffffff" stroke="#111111" stroke-width="2"/>
<text x="635.0" y="135.5" font-size="13.5" font-weight="700" fill="#111111" text-anchor="middle">3 Import into green</text>
<text x="635.0" y="152.5" font-size="11.5" fill="#555555" text-anchor="middle">--from-file --execute</text>
<text x="635.0" y="167.5" font-size="11.5" fill="#555555" text-anchor="middle">on group notify-green</text>
<rect x="775" y="100" width="185" height="90" rx="9" fill="#fff8ef" stroke="#e8870c" stroke-width="2"/>
<text x="867.5" y="135.5" font-size="13.5" font-weight="700" fill="#111111" text-anchor="middle">4 Scale green to 3</text>
<text x="867.5" y="152.5" font-size="11.5" fill="#555555" text-anchor="middle">reads from blue&#x27;s</text>
<text x="867.5" y="167.5" font-size="11.5" fill="#555555" text-anchor="middle">committed offsets</text>
<rect x="40" y="245" width="920" height="60" rx="9" fill="#f1f5f9" stroke="#64748b" stroke-width="2"/>
<text x="500.0" y="273.0" font-size="13.5" font-weight="700" fill="#111111" text-anchor="middle">Records blue processed after its last commit are processed again by green</text>
<text x="500.0" y="290.0" font-size="11.5" fill="#555555" text-anchor="middle">the overlap is bounded by the commit interval, not zero; nothing is missing</text>
<path d="M250,145 L285,145" fill="none" stroke="#555" stroke-width="2" marker-end="url(#a)"/>
<path d="M495,145 L530,145" fill="none" stroke="#555" stroke-width="2" marker-end="url(#a)"/>
<path d="M740,145 L775,145" fill="none" stroke="#b8650a" stroke-width="2" marker-end="url(#am)"/>
<text x="500" y="30" font-size="15" fill="#444444" text-anchor="middle" font-weight="700">Green starts where blue&#x27;s commits ended</text>
</svg>
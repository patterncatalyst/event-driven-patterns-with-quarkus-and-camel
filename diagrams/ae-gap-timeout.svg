<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 340" font-family="'Red Hat Text', system-ui, sans-serif" role="img">
<defs><marker id="a" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#555"/></marker><marker id="am" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b8650a"/></marker></defs>
<rect x="20" y="60" width="960" height="120" rx="12" fill="#fff8ef" stroke="#ddd"/>
<text x="32" y="80" font-size="12" font-weight="700" fill="#888">16 never arrives in time</text>
<rect x="40" y="95" width="170" height="70" rx="9" fill="#ffffff" stroke="#111111" stroke-width="2"/>
<text x="125.0" y="120.5" font-size="13.5" font-weight="700" fill="#111111" text-anchor="middle">13, 14, 15 arrive</text>
<text x="125.0" y="137.5" font-size="11.5" fill="#555555" text-anchor="middle">each is the successor</text>
<text x="125.0" y="152.5" font-size="11.5" fill="#555555" text-anchor="middle">of the one before</text>
<rect x="235" y="95" width="170" height="70" rx="9" fill="#f1f5f9" stroke="#64748b" stroke-width="2"/>
<text x="320.0" y="128.0" font-size="13.5" font-weight="700" fill="#111111" text-anchor="middle">Applied at once</text>
<text x="320.0" y="145.0" font-size="11.5" fill="#555555" text-anchor="middle">13, 14, 15</text>
<rect x="430" y="95" width="170" height="70" rx="9" fill="#ffffff" stroke="#111111" stroke-width="2"/>
<text x="515.0" y="120.5" font-size="13.5" font-weight="700" fill="#111111" text-anchor="middle">17, 18 arrive</text>
<text x="515.0" y="137.5" font-size="11.5" fill="#555555" text-anchor="middle">the successor of 15</text>
<text x="515.0" y="152.5" font-size="11.5" fill="#555555" text-anchor="middle">is 16: they wait</text>
<rect x="625" y="95" width="170" height="70" rx="9" fill="#fff8ef" stroke="#e8870c" stroke-width="2"/>
<text x="710.0" y="120.5" font-size="13.5" font-weight="700" fill="#111111" text-anchor="middle">Timeout passes</text>
<text x="710.0" y="137.5" font-size="11.5" fill="#555555" text-anchor="middle">17, 18 applied</text>
<text x="710.0" y="152.5" font-size="11.5" fill="#555555" text-anchor="middle">the gap is skipped</text>
<rect x="820" y="95" width="160" height="70" rx="9" fill="#f4f4f4" stroke="#888888" stroke-width="1.5"/>
<text x="900.0" y="128.0" font-size="13.5" font-weight="700" fill="#111111" text-anchor="middle">Nothing reports</text>
<text x="900.0" y="145.0" font-size="11.5" fill="#555555" text-anchor="middle">that 16 is missing</text>
<rect x="430" y="235" width="170" height="70" rx="9" fill="#eef4fb" stroke="#2f6db5" stroke-width="2"/>
<text x="515.0" y="275.5" font-size="13.5" font-weight="700" fill="#111111" text-anchor="middle">16 arrives late</text>
<rect x="625" y="235" width="170" height="70" rx="9" fill="#ffffff" stroke="#999999" stroke-width="1.5" stroke-dasharray="6 4"/>
<text x="710.0" y="268.0" font-size="13.5" font-weight="700" fill="#111111" text-anchor="middle">rejectOff: applied last</text>
<text x="710.0" y="285.0" font-size="11.5" fill="#555555" text-anchor="middle">13, 14, 15, 17, 18, 16</text>
<rect x="820" y="235" width="160" height="70" rx="9" fill="#fff8ef" stroke="#e8870c" stroke-width="2"/>
<text x="900.0" y="268.0" font-size="13.5" font-weight="700" fill="#111111" text-anchor="middle">rejectOld: refused</text>
<text x="900.0" y="285.0" font-size="11.5" fill="#555555" text-anchor="middle">CamelExchangeException</text>
<path d="M210,130 L235,130" fill="none" stroke="#555" stroke-width="2" marker-end="url(#a)"/>
<path d="M405,130 L430,130" fill="none" stroke="#555" stroke-width="2" marker-end="url(#a)"/>
<path d="M600,130 L625,130" fill="none" stroke="#b8650a" stroke-width="2" marker-end="url(#am)"/>
<path d="M795,130 L820,130" fill="none" stroke="#555" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#a)"/>
<path d="M600,270 L625,270" fill="none" stroke="#555" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#a)"/>
<path d="M795,270 L820,270" fill="none" stroke="#555" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#a)"/>
</svg>
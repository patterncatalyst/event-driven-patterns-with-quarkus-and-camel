<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 500" font-family="'Red Hat Text', system-ui, sans-serif" role="img">
<defs><marker id="a" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#555"/></marker><marker id="am" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b8650a"/></marker></defs>
<rect x="20" y="60" width="960" height="190" rx="12" fill="#fafafa" stroke="#ddd"/>
<text x="32" y="80" font-size="12" font-weight="700" fill="#888">Dual write: Redis first, then the commit (demo)</text>
<rect x="20" y="280" width="960" height="190" rx="12" fill="#fff8ef" stroke="#ddd"/>
<text x="32" y="300" font-size="12" font-weight="700" fill="#888">Write-forward: the commit, then the event</text>
<rect x="40" y="110" width="190" height="70" rx="9" fill="#ffffff" stroke="#111111" stroke-width="2"/>
<text x="135.0" y="143.0" font-size="13.5" font-weight="700" fill="#111111" text-anchor="middle">POST /orders</text>
<text x="135.0" y="160.0" font-size="11.5" fill="#555555" text-anchor="middle">O-4290</text>
<rect x="290" y="110" width="190" height="70" rx="9" fill="#ffffff" stroke="#111111" stroke-width="2"/>
<text x="385.0" y="143.0" font-size="13.5" font-weight="700" fill="#111111" text-anchor="middle">1. write Redis</text>
<text x="385.0" y="160.0" font-size="11.5" fill="#555555" text-anchor="middle">order O-4290 cached</text>
<rect x="540" y="110" width="190" height="70" rx="9" fill="#ffffff" stroke="#999999" stroke-width="1.5" stroke-dasharray="6 4"/>
<text x="635.0" y="143.0" font-size="13.5" font-weight="700" fill="#111111" text-anchor="middle">2. commit PostgreSQL</text>
<text x="635.0" y="160.0" font-size="11.5" fill="#555555" text-anchor="middle">fails: 500, rolled back</text>
<rect x="290" y="190" width="640" height="46" rx="9" fill="#fff8ef" stroke="#e8870c" stroke-width="2"/>
<text x="610.0" y="218.5" font-size="13.5" font-weight="700" fill="#111111" text-anchor="middle">GET /orders/O-4290 answers 200 from Redis; PostgreSQL has no such order</text>
<rect x="40" y="330" width="190" height="70" rx="9" fill="#ffffff" stroke="#111111" stroke-width="2"/>
<text x="135.0" y="363.0" font-size="13.5" font-weight="700" fill="#111111" text-anchor="middle">POST /orders</text>
<text x="135.0" y="380.0" font-size="11.5" fill="#555555" text-anchor="middle">O-4290</text>
<rect x="290" y="330" width="190" height="70" rx="9" fill="#ffffff" stroke="#111111" stroke-width="2"/>
<text x="385.0" y="363.0" font-size="13.5" font-weight="700" fill="#111111" text-anchor="middle">1. commit</text>
<text x="385.0" y="380.0" font-size="11.5" fill="#555555" text-anchor="middle">order row and outbox row</text>
<rect x="540" y="330" width="190" height="70" rx="9" fill="#ffffff" stroke="#999999" stroke-width="1.5" stroke-dasharray="6 4"/>
<text x="635.0" y="363.0" font-size="13.5" font-weight="700" fill="#111111" text-anchor="middle">fails: 500, rolled back</text>
<text x="635.0" y="380.0" font-size="11.5" fill="#555555" text-anchor="middle">both rows gone</text>
<rect x="290" y="410" width="640" height="46" rx="9" fill="#fff8ef" stroke="#e8870c" stroke-width="2"/>
<text x="610.0" y="438.5" font-size="13.5" font-weight="700" fill="#111111" text-anchor="middle">no event is published, Redis is untouched, GET /orders/O-4290 answers 404</text>
<path d="M230,145 L290,145" fill="none" stroke="#555" stroke-width="2" marker-end="url(#a)"/>
<path d="M480,145 L540,145" fill="none" stroke="#555" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#a)"/>
<path d="M230,365 L290,365" fill="none" stroke="#555" stroke-width="2" marker-end="url(#a)"/>
<path d="M480,365 L540,365" fill="none" stroke="#555" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#a)"/>
<text x="500" y="30" font-size="15" fill="#444444" text-anchor="middle" font-weight="700">No transaction spans PostgreSQL and Redis</text>
</svg>
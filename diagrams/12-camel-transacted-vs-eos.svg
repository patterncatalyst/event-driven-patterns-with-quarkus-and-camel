<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 470" font-family="'Red Hat Text', system-ui, sans-serif" role="img">
<defs><marker id="a" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#555"/></marker><marker id="am" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b8650a"/></marker></defs>
<rect x="20" y="50" width="920" height="170" rx="12" fill="#fafafa" stroke="#ddd"/>
<text x="32" y="70" font-size="12" font-weight="700" fill="#888">SmallRye: one transaction per batch, offsets inside</text>
<rect x="20" y="250" width="920" height="190" rx="12" fill="#fafafa" stroke="#ddd"/>
<text x="32" y="270" font-size="12" font-weight="700" fill="#888">Camel transacted=true: one transaction per exchange, offsets outside</text>
<rect x="40" y="100" width="200" height="80" rx="9" fill="#ffffff" stroke="#111111" stroke-width="2"/>
<text x="140.0" y="138.0" font-size="13.5" font-weight="700" fill="#111111" text-anchor="middle">Poll a batch</text>
<text x="140.0" y="155.0" font-size="11.5" fill="#555555" text-anchor="middle">O-5101 to O-5110</text>
<rect x="270" y="100" width="200" height="80" rx="9" fill="#ffffff" stroke="#111111" stroke-width="2"/>
<text x="370.0" y="138.0" font-size="13.5" font-weight="700" fill="#111111" text-anchor="middle">Outputs and offsets</text>
<text x="370.0" y="155.0" font-size="11.5" fill="#555555" text-anchor="middle">in one transaction</text>
<rect x="500" y="100" width="200" height="80" rx="9" fill="#ffffff" stroke="#999999" stroke-width="1.5" stroke-dasharray="6 4"/>
<text x="600.0" y="138.0" font-size="13.5" font-weight="700" fill="#111111" text-anchor="middle">Crash at O-5108</text>
<text x="600.0" y="155.0" font-size="11.5" fill="#555555" text-anchor="middle">transaction aborted</text>
<rect x="730" y="100" width="190" height="80" rx="9" fill="#fff8ef" stroke="#e8870c" stroke-width="2"/>
<text x="825.0" y="138.0" font-size="13.5" font-weight="700" fill="#111111" text-anchor="middle">Restart</text>
<text x="825.0" y="155.0" font-size="11.5" fill="#555555" text-anchor="middle">10 outputs, each once</text>
<rect x="40" y="310" width="200" height="80" rx="9" fill="#ffffff" stroke="#111111" stroke-width="2"/>
<text x="140.0" y="348.0" font-size="13.5" font-weight="700" fill="#111111" text-anchor="middle">Poll records</text>
<text x="140.0" y="365.0" font-size="11.5" fill="#555555" text-anchor="middle">O-6001 to O-6010</text>
<rect x="270" y="310" width="200" height="80" rx="9" fill="#ffffff" stroke="#111111" stroke-width="2"/>
<text x="370.0" y="348.0" font-size="13.5" font-weight="700" fill="#111111" text-anchor="middle">Each output commits</text>
<text x="370.0" y="365.0" font-size="11.5" fill="#555555" text-anchor="middle">O-6001 to O-6007</text>
<rect x="500" y="310" width="200" height="80" rx="9" fill="#ffffff" stroke="#999999" stroke-width="1.5" stroke-dasharray="6 4"/>
<text x="600.0" y="348.0" font-size="13.5" font-weight="700" fill="#111111" text-anchor="middle">Crash at O-6008</text>
<text x="600.0" y="365.0" font-size="11.5" fill="#555555" text-anchor="middle">offset not yet committed</text>
<rect x="730" y="310" width="190" height="80" rx="9" fill="#fff8ef" stroke="#e8870c" stroke-width="2"/>
<text x="825.0" y="348.0" font-size="13.5" font-weight="700" fill="#111111" text-anchor="middle">Restart</text>
<text x="825.0" y="365.0" font-size="11.5" fill="#555555" text-anchor="middle">O-6001 to O-6007 twice</text>
<path d="M240,140 L270,140" fill="none" stroke="#555" stroke-width="2" marker-end="url(#a)"/>
<path d="M470,140 L500,140" fill="none" stroke="#555" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#a)"/>
<path d="M700,140 L730,140" fill="none" stroke="#b8650a" stroke-width="2" marker-end="url(#am)"/>
<path d="M240,350 L270,350" fill="none" stroke="#555" stroke-width="2" marker-end="url(#a)"/>
<path d="M470,350 L500,350" fill="none" stroke="#555" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#a)"/>
<path d="M700,350 L730,350" fill="none" stroke="#b8650a" stroke-width="2" marker-end="url(#am)"/>
<text x="480" y="30" font-size="15" fill="#444444" text-anchor="middle" font-weight="700">The same crash, with and without the offsets in the transaction</text>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 410" font-family="'Red Hat Text', system-ui, sans-serif" role="img">
<defs><marker id="a" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#555"/></marker><marker id="am" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b8650a"/></marker></defs>
<rect x="20" y="60" width="920" height="150" rx="12" fill="#fff8ef" stroke="#ddd"/>
<text x="32" y="80" font-size="12" font-weight="700" fill="#888">Kafka Streams</text>
<rect x="20" y="240" width="920" height="150" rx="12" fill="#fafafa" stroke="#ddd"/>
<text x="32" y="260" font-size="12" font-weight="700" fill="#888">Camel aggregator</text>
<rect x="40" y="105" width="190" height="80" rx="9" fill="#ffffff" stroke="#111111" stroke-width="2"/>
<text x="135.0" y="135.5" font-size="13.5" font-weight="700" fill="#111111" text-anchor="middle">Join store</text>
<text x="135.0" y="152.5" font-size="11.5" fill="#555555" text-anchor="middle">RocksDB files in the</text>
<text x="135.0" y="167.5" font-size="11.5" fill="#555555" text-anchor="middle">container</text>
<rect x="260" y="105" width="200" height="80" rx="9" fill="#fff8ef" stroke="#e8870c" stroke-width="2"/>
<text x="360.0" y="135.5" font-size="13.5" font-weight="700" fill="#111111" text-anchor="middle">Changelog topic</text>
<text x="360.0" y="152.5" font-size="11.5" fill="#555555" text-anchor="middle">every put is also</text>
<text x="360.0" y="167.5" font-size="11.5" fill="#555555" text-anchor="middle">written to Kafka</text>
<rect x="490" y="105" width="200" height="80" rx="9" fill="#ffffff" stroke="#999999" stroke-width="1.5" stroke-dasharray="6 4"/>
<text x="590.0" y="143.0" font-size="13.5" font-weight="700" fill="#111111" text-anchor="middle">Container recreated</text>
<text x="590.0" y="160.0" font-size="11.5" fill="#555555" text-anchor="middle">the local files are gone</text>
<rect x="720" y="105" width="200" height="80" rx="9" fill="#f1f5f9" stroke="#64748b" stroke-width="2"/>
<text x="820.0" y="135.5" font-size="13.5" font-weight="700" fill="#111111" text-anchor="middle">Store restored by</text>
<text x="820.0" y="152.5" font-size="11.5" fill="#555555" text-anchor="middle">reading the changelog</text>
<text x="820.0" y="167.5" font-size="11.5" fill="#555555" text-anchor="middle">then the join resumes</text>
<rect x="40" y="285" width="190" height="80" rx="9" fill="#ffffff" stroke="#111111" stroke-width="2"/>
<text x="135.0" y="315.5" font-size="13.5" font-weight="700" fill="#111111" text-anchor="middle">Open group</text>
<text x="135.0" y="332.5" font-size="11.5" fill="#555555" text-anchor="middle">one exchange per order</text>
<text x="135.0" y="347.5" font-size="11.5" fill="#555555" text-anchor="middle">in memory</text>
<rect x="260" y="285" width="200" height="80" rx="9" fill="#fff8ef" stroke="#e8870c" stroke-width="2"/>
<text x="360.0" y="315.5" font-size="13.5" font-weight="700" fill="#111111" text-anchor="middle">shipping.readiness</text>
<text x="360.0" y="332.5" font-size="11.5" fill="#555555" text-anchor="middle">the group is a row, saved</text>
<text x="360.0" y="347.5" font-size="11.5" fill="#555555" text-anchor="middle">with the aggregation step</text>
<rect x="490" y="285" width="200" height="80" rx="9" fill="#ffffff" stroke="#999999" stroke-width="1.5" stroke-dasharray="6 4"/>
<text x="590.0" y="323.0" font-size="13.5" font-weight="700" fill="#111111" text-anchor="middle">Container recreated</text>
<text x="590.0" y="340.0" font-size="11.5" fill="#555555" text-anchor="middle">the JVM is gone</text>
<rect x="720" y="285" width="200" height="80" rx="9" fill="#f1f5f9" stroke="#64748b" stroke-width="2"/>
<text x="820.0" y="315.5" font-size="13.5" font-weight="700" fill="#111111" text-anchor="middle">Group read back from</text>
<text x="820.0" y="332.5" font-size="11.5" fill="#555555" text-anchor="middle">the table; the timeout</text>
<text x="820.0" y="347.5" font-size="11.5" fill="#555555" text-anchor="middle">starts again from the restart</text>
<path d="M230,145 L260,145" fill="none" stroke="#555" stroke-width="2" marker-end="url(#a)"/>
<path d="M460,145 L490,145" fill="none" stroke="#555" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#a)"/>
<path d="M690,145 L720,145" fill="none" stroke="#555" stroke-width="2" marker-end="url(#a)"/>
<path d="M230,325 L260,325" fill="none" stroke="#555" stroke-width="2" marker-end="url(#a)"/>
<path d="M460,325 L490,325" fill="none" stroke="#555" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#a)"/>
<path d="M690,325 L720,325" fill="none" stroke="#555" stroke-width="2" marker-end="url(#a)"/>
<text x="480" y="30" font-size="15" fill="#444444" text-anchor="middle" font-weight="700">Open state has to be somewhere a recreated container can find it</text>
</svg>
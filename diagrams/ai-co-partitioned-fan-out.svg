<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 420" font-family="'Red Hat Text', system-ui, sans-serif" role="img">
<defs><marker id="a" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#555"/></marker><marker id="am" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b8650a"/></marker></defs>
<rect x="20" y="60" width="360" height="270" rx="12" fill="#fafafa" stroke="#ddd"/>
<text x="32" y="80" font-size="12" font-weight="700" fill="#888">Same key, same partition</text>
<rect x="420" y="60" width="560" height="270" rx="12" fill="#fff8ef" stroke="#ddd"/>
<text x="432" y="80" font-size="12" font-weight="700" fill="#888">reconcile, one Indexed Job</text>
<rect x="40" y="100" width="320" height="60" rx="9" fill="#ffffff" stroke="#111111" stroke-width="2"/>
<text x="200.0" y="128.0" font-size="13.5" font-weight="700" fill="#111111" text-anchor="middle">partition 0</text>
<text x="200.0" y="145.0" font-size="11.5" fill="#555555" text-anchor="middle">scheduled and delivered</text>
<rect x="40" y="190" width="320" height="60" rx="9" fill="#ffffff" stroke="#111111" stroke-width="2"/>
<text x="200.0" y="218.0" font-size="13.5" font-weight="700" fill="#111111" text-anchor="middle">partition 1</text>
<text x="200.0" y="235.0" font-size="11.5" fill="#555555" text-anchor="middle">scheduled and delivered</text>
<rect x="40" y="260" width="320" height="50" rx="9" fill="#ffffff" stroke="#111111" stroke-width="2"/>
<text x="200.0" y="290.5" font-size="13.5" font-weight="700" fill="#111111" text-anchor="middle">partition 2, scheduled and delivered</text>
<rect x="450" y="100" width="220" height="60" rx="9" fill="#fff8ef" stroke="#e8870c" stroke-width="2"/>
<text x="560.0" y="128.0" font-size="13.5" font-weight="700" fill="#111111" text-anchor="middle">index 0</text>
<text x="560.0" y="145.0" font-size="11.5" fill="#555555" text-anchor="middle">reads offsets of partition 0</text>
<rect x="450" y="190" width="220" height="60" rx="9" fill="#fff8ef" stroke="#e8870c" stroke-width="2"/>
<text x="560.0" y="218.0" font-size="13.5" font-weight="700" fill="#111111" text-anchor="middle">index 1</text>
<text x="560.0" y="235.0" font-size="11.5" fill="#555555" text-anchor="middle">reads offsets of partition 1</text>
<rect x="450" y="260" width="220" height="50" rx="9" fill="#fff8ef" stroke="#e8870c" stroke-width="2"/>
<text x="560.0" y="290.5" font-size="13.5" font-weight="700" fill="#111111" text-anchor="middle">index 2, partition 2</text>
<rect x="740" y="100" width="220" height="60" rx="9" fill="#f1f5f9" stroke="#64748b" stroke-width="2"/>
<text x="850.0" y="128.0" font-size="13.5" font-weight="700" fill="#111111" text-anchor="middle">run_partition row 0</text>
<text x="850.0" y="145.0" font-size="11.5" fill="#555555" text-anchor="middle">one row per partition</text>
<rect x="740" y="190" width="220" height="60" rx="9" fill="#f1f5f9" stroke="#64748b" stroke-width="2"/>
<text x="850.0" y="218.0" font-size="13.5" font-weight="700" fill="#111111" text-anchor="middle">run_partition row 1</text>
<text x="850.0" y="235.0" font-size="11.5" fill="#555555" text-anchor="middle">DONE with its counts</text>
<rect x="740" y="260" width="220" height="50" rx="9" fill="#f1f5f9" stroke="#64748b" stroke-width="2"/>
<text x="850.0" y="290.5" font-size="13.5" font-weight="700" fill="#111111" text-anchor="middle">run_partition row 2</text>
<rect x="40" y="355" width="920" height="50" rx="9" fill="#ffffff" stroke="#999999" stroke-width="1.5"/>
<text x="500.0" y="385.5" font-size="13.5" font-weight="700" fill="#111111" text-anchor="middle">An order&#x27;s scheduled and delivered events share a key, so no index needs another index&#x27;s partition</text>
<path d="M360,130 L450,130" fill="none" stroke="#b8650a" stroke-width="2" marker-end="url(#am)"/>
<path d="M360,220 L450,220" fill="none" stroke="#b8650a" stroke-width="2" marker-end="url(#am)"/>
<path d="M360,285 L450,285" fill="none" stroke="#b8650a" stroke-width="2" marker-end="url(#am)"/>
<path d="M670,130 L740,130" fill="none" stroke="#555" stroke-width="2" marker-end="url(#a)"/>
<path d="M670,220 L740,220" fill="none" stroke="#555" stroke-width="2" marker-end="url(#a)"/>
<path d="M670,285 L740,285" fill="none" stroke="#555" stroke-width="2" marker-end="url(#a)"/>
<text x="500" y="30" font-size="15" fill="#444444" text-anchor="middle" font-weight="700">The partition is the unit of work</text>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 470" font-family="'Red Hat Text', system-ui, sans-serif" role="img">
<defs><marker id="a" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#555"/></marker><marker id="am" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b8650a"/></marker></defs>
<rect x="40" y="60" width="240" height="70" rx="9" fill="#ffffff" stroke="#111111" stroke-width="2"/>
<text x="160.0" y="93.0" font-size="13.5" font-weight="700" fill="#111111" text-anchor="middle">order replica B</text>
<text x="160.0" y="110.0" font-size="11.5" fill="#555555" text-anchor="middle">forwards 2 InTransit, 3 Delivered</text>
<rect x="40" y="250" width="240" height="70" rx="9" fill="#ffffff" stroke="#999999" stroke-width="1.5" stroke-dasharray="6 4"/>
<text x="160.0" y="283.0" font-size="13.5" font-weight="700" fill="#111111" text-anchor="middle">order replica A</text>
<text x="160.0" y="300.0" font-size="11.5" fill="#555555" text-anchor="middle">forwards 1 Scheduled after it resumes</text>
<rect x="350" y="150" width="220" height="90" rx="9" fill="#ffffff" stroke="#111111" stroke-width="2"/>
<text x="460.0" y="185.5" font-size="13.5" font-weight="700" fill="#111111" text-anchor="middle">funnel topic</text>
<text x="460.0" y="202.5" font-size="11.5" fill="#555555" text-anchor="middle">one partition</text>
<text x="460.0" y="217.5" font-size="11.5" fill="#555555" text-anchor="middle">arrival order: 2, 3, 1</text>
<rect x="640" y="150" width="280" height="90" rx="9" fill="#fff8ef" stroke="#e8870c" stroke-width="2"/>
<text x="780.0" y="185.5" font-size="13.5" font-weight="700" fill="#111111" text-anchor="middle">resequencer</text>
<text x="780.0" y="202.5" font-size="11.5" fill="#555555" text-anchor="middle">stream mode on streamSequence</text>
<text x="780.0" y="217.5" font-size="11.5" fill="#555555" text-anchor="middle">holds 2 and 3 until 1 arrives</text>
<rect x="640" y="320" width="280" height="70" rx="9" fill="#f1f5f9" stroke="#64748b" stroke-width="2"/>
<text x="780.0" y="345.5" font-size="13.5" font-weight="700" fill="#111111" text-anchor="middle">apply</text>
<text x="780.0" y="362.5" font-size="11.5" fill="#555555" text-anchor="middle">1 Scheduled, 2 InTransit, 3 Delivered</text>
<text x="780.0" y="377.5" font-size="11.5" fill="#555555" text-anchor="middle">status ends DELIVERED</text>
<path d="M280,95 L350,175" fill="none" stroke="#b8650a" stroke-width="2" marker-end="url(#am)"/>
<path d="M280,285 L350,215" fill="none" stroke="#555" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#a)"/>
<path d="M570,195 L640,195" fill="none" stroke="#b8650a" stroke-width="2" marker-end="url(#am)"/>
<path d="M780,240 L780,320" fill="none" stroke="#b8650a" stroke-width="2" marker-end="url(#am)"/>
<text x="480" y="24" font-size="15" fill="#444444" text-anchor="middle" font-weight="700">A resequencer needs every event of the sequence in one place</text>
<text x="480" y="430" font-size="11" fill="#555555" text-anchor="middle">If 1 never arrives, the resequencer waits for its timeout and then moves past the gap.</text>
</svg>
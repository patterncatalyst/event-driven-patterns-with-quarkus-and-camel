<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 470" font-family="'Red Hat Text', system-ui, sans-serif" role="img">
<defs><marker id="a" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#555"/></marker><marker id="am" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b8650a"/></marker></defs>
<rect x="20" y="60" width="920" height="150" rx="12" fill="#fafafa" stroke="#ddd"/>
<text x="32" y="80" font-size="12" font-weight="700" fill="#888">inventory.events, stream SKU-1503, ordered by version</text>
<rect x="20" y="240" width="450" height="190" rx="12" fill="#fff8ef" stroke="#ddd"/>
<text x="32" y="260" font-size="12" font-weight="700" fill="#888">Load with the snapshot</text>
<rect x="490" y="240" width="450" height="190" rx="12" fill="#fafafa" stroke="#ddd"/>
<text x="502" y="260" font-size="12" font-weight="700" fill="#888">Load without it</text>
<rect x="50" y="100" width="480" height="70" rx="9" fill="#f1f5f9" stroke="#64748b" stroke-width="2"/>
<text x="290.0" y="133.0" font-size="13.5" font-weight="700" fill="#111111" text-anchor="middle">versions 1 to s</text>
<text x="290.0" y="150.0" font-size="11.5" fill="#555555" text-anchor="middle">already folded into the snapshot</text>
<rect x="540" y="100" width="370" height="70" rx="9" fill="#fff8ef" stroke="#e8870c" stroke-width="2"/>
<text x="725.0" y="133.0" font-size="13.5" font-weight="700" fill="#111111" text-anchor="middle">versions s+1 to head</text>
<text x="725.0" y="150.0" font-size="11.5" fill="#555555" text-anchor="middle">fewer than N events when the policy keeps up</text>
<rect x="50" y="280" width="190" height="66" rx="9" fill="#ffffff" stroke="#111111" stroke-width="2"/>
<text x="145.0" y="311.0" font-size="13.5" font-weight="700" fill="#111111" text-anchor="middle">1 snapshot row</text>
<text x="145.0" y="328.0" font-size="11.5" fill="#555555" text-anchor="middle">version s, schema 1</text>
<rect x="260" y="280" width="190" height="66" rx="9" fill="#fff8ef" stroke="#e8870c" stroke-width="2"/>
<text x="355.0" y="311.0" font-size="13.5" font-weight="700" fill="#111111" text-anchor="middle">the tail</text>
<text x="355.0" y="328.0" font-size="11.5" fill="#555555" text-anchor="middle">events after s</text>
<rect x="150" y="365" width="210" height="50" rx="9" fill="#ffffff" stroke="#111111" stroke-width="2"/>
<text x="255.0" y="395.5" font-size="13.5" font-weight="700" fill="#111111" text-anchor="middle">state at head</text>
<rect x="520" y="280" width="390" height="66" rx="9" fill="#ffffff" stroke="#111111" stroke-width="2"/>
<text x="715.0" y="311.0" font-size="13.5" font-weight="700" fill="#111111" text-anchor="middle">every event from version 1</text>
<text x="715.0" y="328.0" font-size="11.5" fill="#555555" text-anchor="middle">100,000 and more rows to read and map</text>
<rect x="600" y="365" width="210" height="50" rx="9" fill="#ffffff" stroke="#111111" stroke-width="2"/>
<text x="705.0" y="395.5" font-size="13.5" font-weight="700" fill="#111111" text-anchor="middle">state at head</text>
<path d="M290,170 L145,280" fill="none" stroke="#555" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#a)"/>
<path d="M725,170 L355,280" fill="none" stroke="#b8650a" stroke-width="2" marker-end="url(#am)"/>
<path d="M145,346 L230,365" fill="none" stroke="#555" stroke-width="2" marker-end="url(#a)"/>
<path d="M355,346 L280,365" fill="none" stroke="#b8650a" stroke-width="2" marker-end="url(#am)"/>
<path d="M715,346 L705,365" fill="none" stroke="#555" stroke-width="2" marker-end="url(#a)"/>
<text x="480" y="30" font-size="15" fill="#444444" text-anchor="middle" font-weight="700">A snapshot is the fold at version s: load it, then replay only what follows</text>
</svg>
<rect x="270" y="305" width="200" height="80" rx="9" fill="#f1f5f9" stroke="#64748b" stroke-width="2"/>
<text x="370.0" y="335.5" font-size="13.5" font-weight="700" fill="#111111" text-anchor="middle">Kafka Streams</text>

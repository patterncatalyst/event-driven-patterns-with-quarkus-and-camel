<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" font-family="'Red Hat Text', system-ui, sans-serif" role="img">
<defs><marker id="a" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#555"/></marker><marker id="am" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b8650a"/></marker></defs>
<rect x="20" y="60" width="920" height="120" rx="12" fill="#fafafa" stroke="#ddd"/>
<text x="32" y="80" font-size="12" font-weight="700" fill="#888">Never succeeds: unparseable or invalid</text>
<rect x="20" y="200" width="920" height="150" rx="12" fill="#fff8ef" stroke="#ddd"/>
<text x="32" y="220" font-size="12" font-weight="700" fill="#888">Can succeed later: the row is locked</text>
<rect x="20" y="370" width="920" height="150" rx="12" fill="#fafafa" stroke="#ddd"/>
<text x="32" y="390" font-size="12" font-weight="700" fill="#888">Still failing after the last retry</text>
<rect x="40" y="100" width="230" height="56" rx="9" fill="#ffffff" stroke="#111111" stroke-width="2"/>
<text x="155.0" y="126.0" font-size="13.5" font-weight="700" fill="#111111" text-anchor="middle">edp.orders.placed</text>
<text x="155.0" y="143.0" font-size="11.5" fill="#555555" text-anchor="middle">truncated JSON, quantity 0</text>
<rect x="365" y="100" width="230" height="56" rx="9" fill="#fff8ef" stroke="#e8870c" stroke-width="2"/>
<text x="480.0" y="126.0" font-size="13.5" font-weight="700" fill="#111111" text-anchor="middle">1 attempt, no retry</text>
<text x="480.0" y="143.0" font-size="11.5" fill="#555555" text-anchor="middle">abortOn / onException</text>
<rect x="690" y="100" width="230" height="56" rx="9" fill="#f1f5f9" stroke="#64748b" stroke-width="2"/>
<text x="805.0" y="126.0" font-size="13.5" font-weight="700" fill="#111111" text-anchor="middle">edp.orders.placed-dlq</text>
<text x="805.0" y="143.0" font-size="11.5" fill="#555555" text-anchor="middle">original bytes</text>
<rect x="40" y="250" width="230" height="56" rx="9" fill="#ffffff" stroke="#111111" stroke-width="2"/>
<text x="155.0" y="276.0" font-size="13.5" font-weight="700" fill="#111111" text-anchor="middle">edp.orders.placed</text>
<text x="155.0" y="293.0" font-size="11.5" fill="#555555" text-anchor="middle">valid order, row locked</text>
<rect x="365" y="240" width="230" height="76" rx="9" fill="#fff8ef" stroke="#e8870c" stroke-width="2"/>
<text x="480.0" y="268.5" font-size="13.5" font-weight="700" fill="#111111" text-anchor="middle">PessimisticLockException</text>
<text x="480.0" y="285.5" font-size="11.5" fill="#555555" text-anchor="middle">retry after 1 s, new transaction</text>
<text x="480.0" y="300.5" font-size="11.5" fill="#555555" text-anchor="middle">each time</text>
<rect x="690" y="250" width="230" height="56" rx="9" fill="#ffffff" stroke="#111111" stroke-width="2"/>
<text x="805.0" y="276.0" font-size="13.5" font-weight="700" fill="#111111" text-anchor="middle">stock reserved</text>
<text x="805.0" y="293.0" font-size="11.5" fill="#555555" text-anchor="middle">offset committed</text>
<rect x="40" y="420" width="230" height="56" rx="9" fill="#ffffff" stroke="#111111" stroke-width="2"/>
<text x="155.0" y="446.0" font-size="13.5" font-weight="700" fill="#111111" text-anchor="middle">edp.orders.placed</text>
<text x="155.0" y="463.0" font-size="11.5" fill="#555555" text-anchor="middle">row locked for too long</text>
<rect x="365" y="410" width="230" height="76" rx="9" fill="#fff8ef" stroke="#e8870c" stroke-width="2"/>
<text x="480.0" y="438.5" font-size="13.5" font-weight="700" fill="#111111" text-anchor="middle">retried until the</text>
<text x="480.0" y="455.5" font-size="11.5" fill="#555555" text-anchor="middle">limit is reached</text>
<text x="480.0" y="470.5" font-size="11.5" fill="#555555" text-anchor="middle">(1 + RETRY_MAX attempts)</text>
<rect x="690" y="420" width="230" height="56" rx="9" fill="#f1f5f9" stroke="#64748b" stroke-width="2"/>
<text x="805.0" y="446.0" font-size="13.5" font-weight="700" fill="#111111" text-anchor="middle">edp.orders.placed-dlq</text>
<text x="805.0" y="463.0" font-size="11.5" fill="#555555" text-anchor="middle">original bytes</text>
<path d="M270,128 L365,128" fill="none" stroke="#555" stroke-width="2" marker-end="url(#a)"/>
<path d="M595,128 L690,128" fill="none" stroke="#555" stroke-width="2" marker-end="url(#a)"/>
<path d="M270,278 L365,278" fill="none" stroke="#555" stroke-width="2" marker-end="url(#a)"/>
<path d="M595,278 L690,278" fill="none" stroke="#555" stroke-width="2" marker-end="url(#a)"/>
<path d="M270,448 L365,448" fill="none" stroke="#555" stroke-width="2" marker-end="url(#a)"/>
<path d="M595,448 L690,448" fill="none" stroke="#555" stroke-width="2" marker-end="url(#a)"/>
<text x="480" y="30" font-size="15" fill="#444444" text-anchor="middle" font-weight="700">Retry what can succeed later, dead-letter what never will</text>
</svg>
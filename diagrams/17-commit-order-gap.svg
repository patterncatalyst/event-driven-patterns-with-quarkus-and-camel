<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" font-family="'Red Hat Text', system-ui, sans-serif" role="img">
<defs><marker id="a" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#555"/></marker><marker id="am" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b8650a"/></marker></defs>
<rect x="20" y="60" width="920" height="220" rx="12" fill="#fafafa" stroke="#ddd"/>
<text x="32" y="80" font-size="12" font-weight="700" fill="#888">Checkpoint by position</text>
<rect x="20" y="300" width="920" height="220" rx="12" fill="#fff8ef" stroke="#ddd"/>
<text x="32" y="320" font-size="12" font-weight="700" fill="#888">Checkpoint with the watermark</text>
<rect x="50" y="105" width="190" height="66" rx="9" fill="#ffffff" stroke="#111111" stroke-width="2"/>
<text x="145.0" y="136.0" font-size="13.5" font-weight="700" fill="#111111" text-anchor="middle">A appends position 41</text>
<text x="145.0" y="153.0" font-size="11.5" fill="#555555" text-anchor="middle">transaction still open</text>
<rect x="270" y="105" width="190" height="66" rx="9" fill="#ffffff" stroke="#111111" stroke-width="2"/>
<text x="365.0" y="136.0" font-size="13.5" font-weight="700" fill="#111111" text-anchor="middle">B appends position 42</text>
<text x="365.0" y="153.0" font-size="11.5" fill="#555555" text-anchor="middle">B commits first</text>
<rect x="490" y="105" width="200" height="66" rx="9" fill="#ffffff" stroke="#999999" stroke-width="1.5" stroke-dasharray="6 4"/>
<text x="590.0" y="136.0" font-size="13.5" font-weight="700" fill="#111111" text-anchor="middle">projector reads 42</text>
<text x="590.0" y="153.0" font-size="11.5" fill="#555555" text-anchor="middle">checkpoint = 42</text>
<rect x="720" y="105" width="190" height="66" rx="9" fill="#f1f5f9" stroke="#64748b" stroke-width="2"/>
<text x="815.0" y="136.0" font-size="13.5" font-weight="700" fill="#111111" text-anchor="middle">A commits</text>
<text x="815.0" y="153.0" font-size="11.5" fill="#555555" text-anchor="middle">41 is behind the checkpoint</text>
<rect x="490" y="195" width="420" height="56" rx="9" fill="#fff8ef" stroke="#e8870c" stroke-width="2"/>
<text x="700.0" y="228.5" font-size="13.5" font-weight="700" fill="#111111" text-anchor="middle">order A is never counted, and nothing reports it</text>
<rect x="50" y="345" width="190" height="66" rx="9" fill="#ffffff" stroke="#111111" stroke-width="2"/>
<text x="145.0" y="376.0" font-size="13.5" font-weight="700" fill="#111111" text-anchor="middle">A appends position 41</text>
<text x="145.0" y="393.0" font-size="11.5" fill="#555555" text-anchor="middle">transaction still open</text>
<rect x="270" y="345" width="190" height="66" rx="9" fill="#ffffff" stroke="#111111" stroke-width="2"/>
<text x="365.0" y="376.0" font-size="13.5" font-weight="700" fill="#111111" text-anchor="middle">B appends position 42</text>
<text x="365.0" y="393.0" font-size="11.5" fill="#555555" text-anchor="middle">B commits first</text>
<rect x="490" y="345" width="200" height="66" rx="9" fill="#ffffff" stroke="#999999" stroke-width="1.5" stroke-dasharray="6 4"/>
<text x="590.0" y="376.0" font-size="13.5" font-weight="700" fill="#111111" text-anchor="middle">oldest open transaction is A</text>
<text x="590.0" y="393.0" font-size="11.5" fill="#555555" text-anchor="middle">reads nothing past it</text>
<rect x="720" y="345" width="190" height="66" rx="9" fill="#f1f5f9" stroke="#64748b" stroke-width="2"/>
<text x="815.0" y="376.0" font-size="13.5" font-weight="700" fill="#111111" text-anchor="middle">A commits</text>
<text x="815.0" y="393.0" font-size="11.5" fill="#555555" text-anchor="middle">reads 41 and 42</text>
<rect x="490" y="435" width="420" height="56" rx="9" fill="#fff8ef" stroke="#e8870c" stroke-width="2"/>
<text x="700.0" y="468.5" font-size="13.5" font-weight="700" fill="#111111" text-anchor="middle">both counted, one batch later</text>
<path d="M240,138 L270,138" fill="none" stroke="#555" stroke-width="2" marker-end="url(#a)"/>
<path d="M460,138 L490,138" fill="none" stroke="#555" stroke-width="2" marker-end="url(#a)"/>
<path d="M690,138 L720,138" fill="none" stroke="#555" stroke-width="2" marker-end="url(#a)"/>
<path d="M815,171 L700,195" fill="none" stroke="#555" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#a)"/>
<path d="M240,378 L270,378" fill="none" stroke="#555" stroke-width="2" marker-end="url(#a)"/>
<path d="M460,378 L490,378" fill="none" stroke="#555" stroke-width="2" marker-end="url(#a)"/>
<path d="M690,378 L720,378" fill="none" stroke="#b8650a" stroke-width="2" marker-end="url(#am)"/>
<path d="M815,411 L700,435" fill="none" stroke="#b8650a" stroke-width="2" marker-end="url(#am)"/>
<text x="480" y="30" font-size="15" fill="#444444" text-anchor="middle" font-weight="700">A position is assigned when a row is inserted, a commit happens later, and the two orders can differ</text>
</svg>
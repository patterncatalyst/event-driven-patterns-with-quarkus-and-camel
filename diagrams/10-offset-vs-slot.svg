<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 500" font-family="'Red Hat Text', system-ui, sans-serif" role="img">
<defs><marker id="a" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#555"/></marker><marker id="am" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b8650a"/></marker></defs>
<rect x="20" y="60" width="920" height="190" rx="12" fill="#fafafa" stroke="#ddd"/>
<text x="32" y="80" font-size="12" font-weight="700" fill="#888">Forward: an offset ahead of the slot skips changes</text>
<rect x="20" y="280" width="920" height="190" rx="12" fill="#fff8ef" stroke="#ddd"/>
<text x="32" y="300" font-size="12" font-weight="700" fill="#888">Backward: an offset behind the slot is ignored</text>
<rect x="40" y="110" width="250" height="70" rx="9" fill="#ffffff" stroke="#111111" stroke-width="2"/>
<text x="165.0" y="143.0" font-size="13.5" font-weight="700" fill="#111111" text-anchor="middle">slot confirmed_flush_lsn</text>
<text x="165.0" y="160.0" font-size="11.5" fill="#555555" text-anchor="middle">the server&#x27;s position</text>
<rect x="355" y="110" width="250" height="70" rx="9" fill="#fff8ef" stroke="#e8870c" stroke-width="2"/>
<text x="480.0" y="143.0" font-size="13.5" font-weight="700" fill="#111111" text-anchor="middle">stored offset lsn</text>
<text x="480.0" y="160.0" font-size="11.5" fill="#555555" text-anchor="middle">altered to the current WAL end</text>
<rect x="670" y="110" width="250" height="70" rx="9" fill="#f1f5f9" stroke="#64748b" stroke-width="2"/>
<text x="795.0" y="143.0" font-size="13.5" font-weight="700" fill="#111111" text-anchor="middle">streaming starts at the offset</text>
<text x="795.0" y="160.0" font-size="11.5" fill="#555555" text-anchor="middle">changes in between are skipped</text>
<rect x="40" y="330" width="250" height="70" rx="9" fill="#ffffff" stroke="#111111" stroke-width="2"/>
<text x="165.0" y="363.0" font-size="13.5" font-weight="700" fill="#111111" text-anchor="middle">slot confirmed_flush_lsn</text>
<text x="165.0" y="380.0" font-size="11.5" fill="#555555" text-anchor="middle">the server&#x27;s position</text>
<rect x="355" y="330" width="250" height="70" rx="9" fill="#fff8ef" stroke="#e8870c" stroke-width="2"/>
<text x="480.0" y="363.0" font-size="13.5" font-weight="700" fill="#111111" text-anchor="middle">stored offset lsn</text>
<text x="480.0" y="380.0" font-size="11.5" fill="#555555" text-anchor="middle">altered to an older position</text>
<rect x="670" y="330" width="250" height="70" rx="9" fill="#f1f5f9" stroke="#64748b" stroke-width="2"/>
<text x="795.0" y="363.0" font-size="13.5" font-weight="700" fill="#111111" text-anchor="middle">streaming starts at the slot</text>
<text x="795.0" y="380.0" font-size="11.5" fill="#555555" text-anchor="middle">nothing is replayed</text>
<path d="M290,145 L355,145" fill="none" stroke="#555" stroke-width="2" marker-end="url(#a)"/>
<path d="M605,145 L670,145" fill="none" stroke="#b8650a" stroke-width="2" marker-end="url(#am)"/>
<path d="M290,365 L355,365" fill="none" stroke="#555" stroke-width="2" marker-end="url(#a)"/>
<path d="M605,365 L670,365" fill="none" stroke="#b8650a" stroke-width="2" marker-end="url(#am)"/>
<text x="480" y="30" font-size="15" fill="#444444" text-anchor="middle" font-weight="700">The server streams from whichever position is greater</text>
</svg>
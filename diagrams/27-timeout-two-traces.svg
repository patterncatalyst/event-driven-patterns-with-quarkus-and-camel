<text x="500" y="30" font-size="15" fill="#444444" text-anchor="middle" font-weight="700">Work that a timer starts is a new trace, linked to the one it continues</text>
<text x="500" y="365" font-size="13" fill="#555555" text-anchor="middle">A parent would stretch trace 1 across the whole timeout; a link keeps both short</text>

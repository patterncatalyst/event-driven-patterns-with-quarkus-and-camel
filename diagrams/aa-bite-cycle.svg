<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 330" font-family="'Red Hat Text', system-ui, sans-serif" role="img">
<defs><marker id="a" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#555"/></marker><marker id="am" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b8650a"/></marker></defs>
<rect x="20" y="90" width="170" height="90" rx="9" fill="#ffffff" stroke="#111111" stroke-width="2"/>
<text x="105.0" y="125.5" font-size="13.5" font-weight="700" fill="#111111" text-anchor="middle">Green suite</text>
<text x="105.0" y="142.5" font-size="11.5" fill="#555555" text-anchor="middle">every test passes</text>
<text x="105.0" y="157.5" font-size="11.5" fill="#555555" text-anchor="middle">on the real route</text>
<rect x="235" y="90" width="170" height="90" rx="9" fill="#fff8ef" stroke="#e8870c" stroke-width="2"/>
<text x="320.0" y="125.5" font-size="13.5" font-weight="700" fill="#111111" text-anchor="middle">Alter one guard</text>
<text x="320.0" y="142.5" font-size="11.5" fill="#555555" text-anchor="middle">a patch applied to a</text>
<text x="320.0" y="157.5" font-size="11.5" fill="#555555" text-anchor="middle">copy, never the source</text>
<rect x="450" y="90" width="170" height="90" rx="9" fill="#ffffff" stroke="#111111" stroke-width="2"/>
<text x="535.0" y="125.5" font-size="13.5" font-weight="700" fill="#111111" text-anchor="middle">Run the class</text>
<text x="535.0" y="142.5" font-size="11.5" fill="#555555" text-anchor="middle">broker from Dev Services</text>
<text x="535.0" y="157.5" font-size="11.5" fill="#555555" text-anchor="middle">fresh for each copy</text>
<rect x="665" y="90" width="150" height="90" rx="9" fill="#f1f5f9" stroke="#64748b" stroke-width="2"/>
<text x="740.0" y="125.5" font-size="13.5" font-weight="700" fill="#111111" text-anchor="middle">Exactly one</text>
<text x="740.0" y="142.5" font-size="11.5" fill="#555555" text-anchor="middle">named test fails</text>
<text x="740.0" y="157.5" font-size="11.5" fill="#555555" text-anchor="middle">the others pass</text>
<rect x="850" y="90" width="130" height="90" rx="9" fill="#ffffff" stroke="#999999" stroke-width="1.5" stroke-dasharray="6 4"/>
<text x="915.0" y="133.0" font-size="13.5" font-weight="700" fill="#111111" text-anchor="middle">Copy dropped</text>
<text x="915.0" y="150.0" font-size="11.5" fill="#555555" text-anchor="middle">source unchanged</text>
<rect x="235" y="235" width="385" height="55" rx="9" fill="#f4f4f4" stroke="#888888" stroke-width="1.5"/>
<text x="427.5" y="268.0" font-size="13.5" font-weight="700" fill="#111111" text-anchor="middle">A test that stays green is not guarding what it names</text>
<path d="M190,135 L235,135" fill="none" stroke="#b8650a" stroke-width="2" marker-end="url(#am)"/>
<path d="M405,135 L450,135" fill="none" stroke="#b8650a" stroke-width="2" marker-end="url(#am)"/>
<path d="M620,135 L665,135" fill="none" stroke="#b8650a" stroke-width="2" marker-end="url(#am)"/>
<path d="M815,135 L850,135" fill="none" stroke="#555" stroke-width="2" marker-end="url(#a)"/>
<path d="M740,180 L620,255" fill="none" stroke="#555" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#a)"/>
<text x="500" y="40" font-size="15" fill="#444444" text-anchor="middle" font-weight="700">Break the code and see which test notices</text>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 470" font-family="'Red Hat Text', system-ui, sans-serif" role="img">
<defs><marker id="a" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#555"/></marker><marker id="am" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b8650a"/></marker></defs>
<rect x="20" y="50" width="1240" height="175" rx="12" fill="#fafafa" stroke="#ddd"/>
<text x="32" y="70" font-size="12" font-weight="700" fill="#888">Event notification: the event holds the id</text>
<rect x="20" y="240" width="1240" height="175" rx="12" fill="#fafafa" stroke="#ddd"/>
<text x="32" y="260" font-size="12" font-weight="700" fill="#888">Event-carried state transfer: the event holds the Order</text>
<rect x="40" y="100" width="250" height="80" rx="9" fill="#ffffff" stroke="#111111" stroke-width="2"/>
<text x="165.0" y="138.0" font-size="13.5" font-weight="700" fill="#111111" text-anchor="middle">OrderPlaced</text>
<text x="165.0" y="155.0" font-size="11.5" fill="#555555" text-anchor="middle">orderId O-1001</text>
<rect x="350" y="100" width="250" height="80" rx="9" fill="#ffffff" stroke="#111111" stroke-width="2"/>
<text x="475.0" y="138.0" font-size="13.5" font-weight="700" fill="#111111" text-anchor="middle">Consumer</text>
<text x="475.0" y="155.0" font-size="11.5" fill="#555555" text-anchor="middle">needs the customer</text>
<rect x="660" y="100" width="250" height="80" rx="9" fill="#f1f5f9" stroke="#64748b" stroke-width="2"/>
<text x="785.0" y="138.0" font-size="13.5" font-weight="700" fill="#111111" text-anchor="middle">GET /orders/O-1001</text>
<text x="785.0" y="155.0" font-size="11.5" fill="#555555" text-anchor="middle">order-service must answer</text>
<rect x="970" y="100" width="250" height="80" rx="9" fill="#ffffff" stroke="#111111" stroke-width="2"/>
<text x="1095.0" y="138.0" font-size="13.5" font-weight="700" fill="#111111" text-anchor="middle">Current state</text>
<text x="1095.0" y="155.0" font-size="11.5" fill="#555555" text-anchor="middle">as of the fetch</text>
<rect x="40" y="290" width="250" height="80" rx="9" fill="#fff8ef" stroke="#e8870c" stroke-width="2"/>
<text x="165.0" y="328.0" font-size="13.5" font-weight="700" fill="#111111" text-anchor="middle">OrderPlaced</text>
<text x="165.0" y="345.0" font-size="11.5" fill="#555555" text-anchor="middle">whole Order, status PLACED</text>
<rect x="350" y="290" width="250" height="80" rx="9" fill="#ffffff" stroke="#111111" stroke-width="2"/>
<text x="475.0" y="328.0" font-size="13.5" font-weight="700" fill="#111111" text-anchor="middle">Consumer</text>
<text x="475.0" y="345.0" font-size="11.5" fill="#555555" text-anchor="middle">needs the customer</text>
<rect x="660" y="290" width="250" height="80" rx="9" fill="#fff8ef" stroke="#e8870c" stroke-width="2"/>
<text x="785.0" y="328.0" font-size="13.5" font-weight="700" fill="#111111" text-anchor="middle">Local copy</text>
<text x="785.0" y="345.0" font-size="11.5" fill="#555555" text-anchor="middle">no request to order-service</text>
<rect x="970" y="290" width="250" height="80" rx="9" fill="#ffffff" stroke="#111111" stroke-width="2"/>
<text x="1095.0" y="328.0" font-size="13.5" font-weight="700" fill="#111111" text-anchor="middle">State of the last event</text>
<text x="1095.0" y="345.0" font-size="11.5" fill="#555555" text-anchor="middle">as old as the lag</text>
<path d="M290,140 L350,140" fill="none" stroke="#555" stroke-width="2" marker-end="url(#a)"/>
<path d="M600,140 L660,140" fill="none" stroke="#555" stroke-width="2" marker-end="url(#a)"/>
<path d="M910,140 L970,140" fill="none" stroke="#555" stroke-width="2" marker-end="url(#a)"/>
<path d="M290,330 L350,330" fill="none" stroke="#b8650a" stroke-width="2" marker-end="url(#am)"/>
<path d="M600,330 L660,330" fill="none" stroke="#b8650a" stroke-width="2" marker-end="url(#am)"/>
<path d="M910,330 L970,330" fill="none" stroke="#b8650a" stroke-width="2" marker-end="url(#am)"/>
<text x="640" y="28" font-size="15" fill="#444444" text-anchor="middle" font-weight="700">Notification or state transfer: who has to be up, and how fresh the answer is</text>
<text x="640" y="445" font-size="11" fill="#555555" text-anchor="middle">Notification keeps one owner of the data; state transfer trades freshness and size for independence.</text>
</svg>
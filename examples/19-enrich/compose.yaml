name: edp-19

include:
  - path: ../_infra/compose-kafka.yaml
  - path: ../_infra/compose-postgres.yaml
  - path: ../_infra/compose-lgtm.yaml

x-app-env: &app-env
  KAFKA_BOOTSTRAP_SERVERS: kafka:9094
  CAMEL_COMPONENT_KAFKA_BROKERS: kafka:9094
  QUARKUS_DATASOURCE_JDBC_URL: jdbc:postgresql://postgres:5432/edp
  QUARKUS_DATASOURCE_USERNAME: edp
  QUARKUS_DATASOURCE_PASSWORD: edp
  QUARKUS_OTEL_EXPORTER_OTLP_ENDPOINT: http://lgtm:4318

services:
  # Creates the topics with one partition each, then exits. The carrier topic is compacted: it keeps the latest
  # reference record per carrier, which is all a new instance needs to rebuild its local copy.
  topics-init:
    image: docker.io/apache/kafka:4.3.2
    container_name: edp-topics-init
    depends_on:
      kafka:
        condition: service_healthy
    entrypoint: ["/bin/bash", "-c"]
    command:
      - |
        set -e
        create() { /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9094 --create --if-not-exists --partitions 1 --replication-factor 1 "$$@"; }
        create --topic edp.shipping.scheduled
        create --topic edp.shipping.carriers --config cleanup.policy=compact
        create --topic edp.shipping.scheduled-enriched
        create --topic edp.shipping.scheduled-enriched-camel
    restart: "no"
    mem_limit: 512m
    networks: [edp]

  shipping-service:
    build:
      context: ..
      dockerfile: 19-enrich/shipping-service/Containerfile
    container_name: edp-shipping-service
    ports:
      - "8082:8082"
    environment:
      <<: *app-env
    depends_on:
      postgres:
        condition: service_healthy
      lgtm:
        condition: service_healthy
    mem_limit: 384m
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:8082/q/health/ready"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 15s
    networks: [edp]

  notification-service:
    build:
      context: ..
      dockerfile: 19-enrich/notification-service/Containerfile
    container_name: edp-notification-service
    ports:
      - "8080:8080"
    environment:
      <<: *app-env
      SHIPPING_SERVICE_URL: http://shipping-service:8082
      # Demo code: false commits a record whose lookup failed, so it is never enriched.
      CAMEL_BREAK_ON_FIRST_ERROR: ${CAMEL_BREAK_ON_FIRST_ERROR:-true}
    depends_on:
      topics-init:
        condition: service_completed_successfully
      lgtm:
        condition: service_healthy
    mem_limit: 384m
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:8080/q/health/ready"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 15s
    networks: [edp]

networks:
  edp:
    name: edp

quarkus.application.name=notification-service
quarkus.http.port=8080

# The stream-table form. The application id is also the Streams group id and the prefix of its internal topics.
# Readiness waits until both input topics exist. A commit every second and no record cache make the output prompt.
# The session timeout of 10 s is how long the broker keeps the session of a stopped member before it hands out its
# partitions.
quarkus.kafka-streams.application-id=notification-enricher
quarkus.kafka-streams.topics=edp.shipping.scheduled,edp.shipping.carriers
kafka-streams.commit.interval.ms=1000
kafka-streams.statestore.cache.max.bytes=0
kafka-streams.auto.offset.reset=earliest
kafka-streams.consumer.session.timeout.ms=10000
kafka-streams.consumer.heartbeat.interval.ms=3000
kafka-streams.state.dir=/tmp/kafka-streams

# The lookup form. Compose sets SHIPPING_SERVICE_URL and CAMEL_COMPONENT_KAFKA_BROKERS.
shipping-service.url=http://localhost:8082
camel.component.kafka.auto-offset-reset=earliest
# Demo code, set in the environment: false commits a record whose lookup failed, and the record is never enriched.
enricher.break-on-first-error=${CAMEL_BREAK_ON_FIRST_ERROR:true}

# Traces, metrics and logs leave over OTLP. The endpoint comes from QUARKUS_OTEL_EXPORTER_OTLP_ENDPOINT.
quarkus.otel.logs.enabled=true
quarkus.otel.metric.export.interval=5s
quarkus.otel.exporter.otlp.protocol=http/protobuf
quarkus.otel.bsp.schedule.delay=1s
quarkus.otel.blrp.schedule.delay=1s

# Tests start no collector, so the OpenTelemetry SDK stays off. The shipping-service the route calls is a stub served
# by the test application itself, and the broker is Kafka Dev Services, with the one-partition topics compose creates.
%test.quarkus.otel.sdk.disabled=true
quarkus.http.test-port=8183
%test.shipping-service.url=http://localhost:8183
%test.camel.component.kafka.brokers=${kafka.bootstrap.servers}
quarkus.kafka.devservices.image-name=docker.io/apache/kafka:4.3.2
quarkus.kafka.devservices.topic-partitions.edp.shipping.scheduled=1
quarkus.kafka.devservices.topic-partitions.edp.shipping.carriers=1
quarkus.kafka.devservices.topic-partitions.edp.shipping.scheduled-enriched=1
quarkus.kafka.devservices.topic-partitions.edp.shipping.scheduled-enriched-camel=1

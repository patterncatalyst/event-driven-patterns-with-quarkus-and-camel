# Chapter 33: Kafka with Cruise Control on two brokers. The catalog topics are KafkaTopics with two replicas, so
# every replica sits on the two original brokers. No applications and no PostgreSQL.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../_k8s/namespaces
  - ../_k8s/strimzi
  - ../_k8s/kafka
  - topics
patches:
  - path: kafka-patch.yaml
  - path: broker-pool-patch.yaml

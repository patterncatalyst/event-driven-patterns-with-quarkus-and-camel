# The Connect ServiceAccount reads one secret, get only, for the ${secrets:...} references in the connector.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata: {name: connect-pg-secret}
rules:
  - {apiGroups: [""], resources: [secrets], resourceNames: [edp-pg-app], verbs: [get]}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata: {name: connect-pg-secret}
roleRef: {apiGroup: rbac.authorization.k8s.io, kind: Role, name: connect-pg-secret}
subjects:
  - {kind: ServiceAccount, name: edp-connect-connect, namespace: edp}

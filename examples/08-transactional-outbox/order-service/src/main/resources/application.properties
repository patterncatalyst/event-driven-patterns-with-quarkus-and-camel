quarkus.application.name=order-service

# Flyway owns the orders schema; Hibernate reads and writes the same schema, creates nothing and validates its mapping against it at boot.
quarkus.flyway.migrate-at-start=true
quarkus.flyway.schemas=orders
quarkus.hibernate-orm.database.default-schema=orders
quarkus.hibernate-orm.schema-management.strategy=validate
quarkus.datasource.db-kind=postgresql
quarkus.datasource.devservices.image-name=docker.io/library/postgres:18.6

# The outbox extension: one extra column holds the topic the connector routes the row to.
# The row is removed in the same transaction that inserts it: the insert still reaches the transaction log.
quarkus.debezium-outbox.additional-fields=topic:string
quarkus.debezium-outbox.remove-after-insert=true

# Demo code: order ids for which the JVM stops right after the commit (comma separated), set in the
# environment as DEMO_CRASH_AFTER_COMMIT_FOR.

# Kafka Dev Services runs the same broker image as the compose stack.
quarkus.kafka.devservices.image-name=docker.io/apache/kafka:4.3.2

# Traces, metrics and logs leave over OTLP. The endpoint comes from QUARKUS_OTEL_EXPORTER_OTLP_ENDPOINT.
quarkus.otel.logs.enabled=true
quarkus.otel.metric.export.interval=5s
quarkus.otel.exporter.otlp.protocol=http/protobuf
quarkus.otel.bsp.schedule.delay=1s
quarkus.otel.blrp.schedule.delay=1s

# Tests start no collector, so the OpenTelemetry SDK stays off. They keep the outbox rows, so a test can read
# them, and stop the JVM through an exception instead of halt.
%test.quarkus.otel.sdk.disabled=true
%test.quarkus.debezium-outbox.remove-after-insert=false
%test.demo.crash-after-commit-for=O-CRASH-1,O-CRASH-2

# Compose supplies QUARKUS_DATASOURCE_JDBC_URL, QUARKUS_DATASOURCE_USERNAME,
# QUARKUS_DATASOURCE_PASSWORD and CAMEL_COMPONENT_KAFKA_BROKERS.

name: edp-08

include:
  - path: ../_infra/compose-kafka.yaml
  - path: ../_infra/compose-postgres.yaml
  - path: ../_infra/compose-connect.yaml
  - path: ../_infra/compose-lgtm.yaml

services:
  # Creates the order topic with one partition, so the order in which events leave the outbox is the order
  # of the topic, then exits.
  topics-init:
    image: docker.io/apache/kafka:4.3.2
    container_name: edp-topics-init
    depends_on:
      kafka:
        condition: service_healthy
    entrypoint: ["/bin/bash", "-c"]
    command:
      - /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9094 --create --if-not-exists --topic edp.orders.placed --partitions 1 --replication-factor 1
    restart: "no"
    mem_limit: 512m
    networks: [edp]

  order-service:
    build:
      context: ..
      dockerfile: 08-transactional-outbox/order-service/Containerfile
    container_name: edp-order-service
    ports:
      - "8080:8080"
    environment:
      CAMEL_COMPONENT_KAFKA_BROKERS: kafka:9094
      QUARKUS_DATASOURCE_JDBC_URL: jdbc:postgresql://postgres:5432/edp
      QUARKUS_DATASOURCE_USERNAME: edp
      QUARKUS_DATASOURCE_PASSWORD: edp
      QUARKUS_OTEL_EXPORTER_OTLP_ENDPOINT: http://lgtm:4318
      QUARKUS_DEBEZIUM_OUTBOX_REMOVE_AFTER_INSERT: ${REMOVE_AFTER_INSERT:-true}
      # Demo code: order ids for which the JVM stops right after the commit.
      CRASH_AFTER_COMMIT_FOR: ${CRASH_AFTER_COMMIT_FOR:-}
    depends_on:
      topics-init:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      lgtm:
        condition: service_healthy
    mem_limit: 384m
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:8080/q/health/ready"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 15s
    networks: [edp]

networks:
  edp:
    name: edp

quarkus.application.name=payment-service
quarkus.http.port=8084

# Flyway owns the payments schema; Hibernate validates its mapping against it at boot.
quarkus.flyway.migrate-at-start=true
quarkus.flyway.schemas=payments
quarkus.hibernate-orm.database.default-schema=payments
quarkus.hibernate-orm.schema-management.strategy=validate
quarkus.hibernate-orm.mapping.format.global=ignore
quarkus.datasource.db-kind=postgresql
quarkus.datasource.devservices.image-name=docker.io/library/postgres:18.6

# PaymentProcessed and PaymentFailed leave through the outbox, in the transaction of the payment row.
quarkus.debezium-outbox.additional-fields=topic:string
quarkus.debezium-outbox.remove-after-insert=true
%test.quarkus.debezium-outbox.remove-after-insert=false

# Demo code: payments above PAYMENT_DECLINE_ABOVE are declined, and PAYMENT_CANCEL_GUARD=off removes the check of
# cancelled orders, which makes the late payment visible.
payment.decline-above=${PAYMENT_DECLINE_ABOVE:500.00}
payment.cancel-guard=${PAYMENT_CANCEL_GUARD:on}

# Traces, metrics and logs leave over OTLP. The endpoint comes from QUARKUS_OTEL_EXPORTER_OTLP_ENDPOINT.
quarkus.otel.logs.enabled=true
quarkus.otel.metric.export.interval=5s
quarkus.otel.exporter.otlp.protocol=http/protobuf
quarkus.otel.bsp.schedule.delay=1s
quarkus.otel.blrp.schedule.delay=1s
%test.quarkus.otel.sdk.disabled=true

# Kafka Dev Services runs the same broker image as the compose stack.
quarkus.kafka.devservices.image-name=docker.io/apache/kafka:4.3.2

# Compose supplies QUARKUS_DATASOURCE_JDBC_URL, QUARKUS_DATASOURCE_USERNAME, QUARKUS_DATASOURCE_PASSWORD,
# QUARKUS_HTTP_PORT, KAFKA_BOOTSTRAP_SERVERS and CAMEL_COMPONENT_KAFKA_BROKERS.

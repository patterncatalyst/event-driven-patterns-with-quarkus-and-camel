quarkus.application.name=order-service

# Flyway owns the orders schema; Hibernate validates its mapping against it at boot.
quarkus.flyway.migrate-at-start=true
quarkus.flyway.schemas=orders
quarkus.hibernate-orm.database.default-schema=orders
quarkus.hibernate-orm.schema-management.strategy=validate
quarkus.hibernate-orm.mapping.format.global=ignore
quarkus.datasource.db-kind=postgresql
quarkus.datasource.devservices.image-name=docker.io/library/postgres:18.6

# Every event the saga publishes goes through the outbox, in the transaction of the state change. One extra column
# holds the topic the connector routes the row to.
quarkus.debezium-outbox.additional-fields=topic:string
quarkus.debezium-outbox.remove-after-insert=true
%test.quarkus.debezium-outbox.remove-after-insert=false

# How long a saga may wait in one state before the sweeper cancels it (demo code: SAGA_PAYMENT_TIMEOUT).
saga.payment-timeout=${SAGA_PAYMENT_TIMEOUT:15s}
quarkus.scheduler.enabled=true
%test.quarkus.scheduler.enabled=false

# The four replies the saga reacts to, one consumer group each. A restarted member waits for the dead one's
# session to expire, so the session is short.
mp.messaging.connector.smallrye-kafka.auto.offset.reset=earliest
mp.messaging.connector.smallrye-kafka.session.timeout.ms=10000
mp.messaging.connector.smallrye-kafka.heartbeat.interval.ms=3000
mp.messaging.connector.smallrye-kafka.key.deserializer=org.apache.kafka.common.serialization.StringDeserializer
mp.messaging.incoming.reserved.connector=smallrye-kafka
mp.messaging.incoming.reserved.topic=edp.inventory.reserved
mp.messaging.incoming.reserved.group.id=order-saga-reserved
mp.messaging.incoming.reserved.value.deserializer=com.patterncatalyst.shipping.saga.order.InventoryReservedDeserializer
mp.messaging.incoming.insufficient.connector=smallrye-kafka
mp.messaging.incoming.insufficient.topic=edp.inventory.insufficient
mp.messaging.incoming.insufficient.group.id=order-saga-insufficient
mp.messaging.incoming.insufficient.value.deserializer=com.patterncatalyst.shipping.saga.order.InventoryInsufficientDeserializer
mp.messaging.incoming.processed.connector=smallrye-kafka
mp.messaging.incoming.processed.topic=edp.payments.processed
mp.messaging.incoming.processed.group.id=order-saga-processed
mp.messaging.incoming.processed.value.deserializer=com.patterncatalyst.shipping.saga.order.PaymentProcessedDeserializer
mp.messaging.incoming.failed.connector=smallrye-kafka
mp.messaging.incoming.failed.topic=edp.payments.failed
mp.messaging.incoming.failed.group.id=order-saga-failed
mp.messaging.incoming.failed.value.deserializer=com.patterncatalyst.shipping.saga.order.PaymentFailedDeserializer

# Traces, metrics and logs leave over OTLP. The endpoint comes from QUARKUS_OTEL_EXPORTER_OTLP_ENDPOINT.
quarkus.otel.logs.enabled=true
quarkus.otel.metric.export.interval=5s
quarkus.otel.exporter.otlp.protocol=http/protobuf
quarkus.otel.bsp.schedule.delay=1s
quarkus.otel.blrp.schedule.delay=1s
%test.quarkus.otel.sdk.disabled=true

# Kafka Dev Services runs the same broker image as the compose stack.
quarkus.kafka.devservices.image-name=docker.io/apache/kafka:4.3.2

# Compose supplies QUARKUS_DATASOURCE_JDBC_URL, QUARKUS_DATASOURCE_USERNAME, QUARKUS_DATASOURCE_PASSWORD and
# KAFKA_BOOTSTRAP_SERVERS.

quarkus.application.name=shipping-service
quarkus.http.port=8080

# Stage one, reused unchanged from chapter 24: temperature 0, a fixed seed and top-k 1 make the answer repeatable;
# the record return type is sent to Ollama as a JSON schema. Compose sets QUARKUS_LANGCHAIN4J_OLLAMA_BASE_URL. Dev
# Services would pull a model on its own, so it is off everywhere.
quarkus.langchain4j.ollama.base-url=http://localhost:11434
quarkus.langchain4j.ollama.chat-model.model-id=${ANALYST_MODEL:qwen3:4b-instruct-2507-q4_K_M}
quarkus.langchain4j.ollama.chat-model.temperature=0
quarkus.langchain4j.ollama.chat-model.seed=42
quarkus.langchain4j.ollama.chat-model.top-k=1
quarkus.langchain4j.ollama.chat-model.num-predict=96
quarkus.langchain4j.ollama.timeout=60s
quarkus.langchain4j.ollama.log-requests=false
quarkus.langchain4j.ollama.log-responses=false
quarkus.langchain4j.ollama.devservices.enabled=false

# The digest of the model recorded on every analysis: half of MemoizedAnalysisService's idempotency key.
analyst.model-digest=${ANALYST_MODEL_DIGEST:unpinned}
# Three redeliveries, this far apart, before the consumer seeks back to the record.
analyst.redelivery-delay-ms=${ANALYST_REDELIVERY_DELAY_MS:5000}
# Demo code: false leaves the analysis route stopped, so the service runs without a model (used by MODEL=off).
analyst.enabled=${ANALYST_ENABLED:true}

# The exactly-once guard. Demo code: off removes the keyed lookup, so a redelivered or duplicated note calls the
# model again (the negative witness, set with ANALYSIS_DEDUP).
analysis.dedup=${ANALYSIS_DEDUP:true}

# Demo code: the exception id named here (DEMO_CRASH_AFTER_ANALYSIS) throws once, after its row commits and before
# the record publishes, to force one redelivery that must reuse the committed row instead of calling the model again.

# Demo code: reanalyse (REPLAY_MODE) makes the replay endpoint read the notes again and call the model, instead of
# reading the disposition snapshot.
replay.mode=${REPLAY_MODE:recorded}

# Flyway owns the analysis schema; Hibernate creates nothing and validates its mapping against it at boot.
quarkus.flyway.migrate-at-start=true
quarkus.flyway.schemas=analysis
quarkus.hibernate-orm.database.default-schema=analysis
quarkus.hibernate-orm.schema-management.strategy=validate
quarkus.datasource.db-kind=postgresql
quarkus.datasource.devservices.image-name=docker.io/library/postgres:18.6

# The Camel Kafka component. Compose sets CAMEL_COMPONENT_KAFKA_BROKERS.
camel.component.kafka.brokers=localhost:9092

# Traces, metrics and logs leave over OTLP. The endpoint comes from QUARKUS_OTEL_EXPORTER_OTLP_ENDPOINT.
quarkus.otel.logs.enabled=true
quarkus.otel.metric.export.interval=5s
quarkus.otel.exporter.otlp.protocol=http/protobuf
quarkus.otel.bsp.schedule.delay=1s
quarkus.otel.blrp.schedule.delay=1s

# Tests start no collector and no Ollama: the analyst is a CDI mock (MockAnalyst), and both Kafka and PostgreSQL
# come from Dev Services.
quarkus.http.test-port=8190
%test.quarkus.otel.sdk.disabled=true
%test.quarkus.langchain4j.ollama.devservices.enabled=false
%test.analyst.redelivery-delay-ms=100
%test.camel.component.kafka.brokers=${kafka.bootstrap.servers}
quarkus.kafka.devservices.image-name=docker.io/apache/kafka:4.3.2
quarkus.kafka.devservices.topic-partitions.edp.shipping.delivery-exceptions=1
quarkus.kafka.devservices.topic-partitions.edp.shipping.exception-analyses=1

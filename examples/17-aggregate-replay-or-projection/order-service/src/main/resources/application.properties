quarkus.application.name=order-service

# Flyway owns the orders schema; Hibernate creates nothing and validates its mapping against it at boot.
# The events.payload column is mapped with Jackson, so Hibernate's own JSON formatter stays off.
quarkus.flyway.migrate-at-start=true
quarkus.flyway.schemas=orders
quarkus.hibernate-orm.database.default-schema=orders
quarkus.hibernate-orm.schema-management.strategy=validate
quarkus.hibernate-orm.mapping.format.global=ignore
quarkus.datasource.db-kind=postgresql
quarkus.datasource.devservices.image-name=docker.io/library/postgres:18.6

# The projector: a tick every projection.poll (the scheduler resolves to about one second), each tick applying
# batches of up to projection.batch events until none is left.
projection.poll=${PROJECTION_POLL:1s}
projection.batch=${PROJECTION_BATCH:1000}
%test.projection.poll=1h

# Demo code, off by default: PROJECTION_WATERMARK=off reads by position alone, the negative witness. DEMO_HOLD_FOR
# lists "<orderId>:<Command>" entries whose transaction stays open DEMO_HOLD_MS after the append, before the commit.
projection.watermark=${PROJECTION_WATERMARK:on}
demo.hold-for=${DEMO_HOLD_FOR:}
demo.hold-ms=${DEMO_HOLD_MS:10000}

# Traces, metrics and logs leave over OTLP. The endpoint comes from QUARKUS_OTEL_EXPORTER_OTLP_ENDPOINT.
quarkus.otel.logs.enabled=true
quarkus.otel.metric.export.interval=5s
quarkus.otel.exporter.otlp.protocol=http/protobuf
quarkus.otel.bsp.schedule.delay=1s
quarkus.otel.blrp.schedule.delay=1s
%test.quarkus.otel.sdk.disabled=true

# Compose supplies QUARKUS_DATASOURCE_JDBC_URL, QUARKUS_DATASOURCE_USERNAME and QUARKUS_DATASOURCE_PASSWORD.

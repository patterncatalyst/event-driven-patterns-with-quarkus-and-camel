name: edp-17

# PostgreSQL and the LGTM stack only: the decision between a replay and a projection needs a database and nothing else.
include:
  - path: ../_infra/compose-postgres.yaml
  - path: ../_infra/compose-lgtm.yaml

services:
  order-service:
    build:
      context: ..
      dockerfile: 17-aggregate-replay-or-projection/order-service/Containerfile
    container_name: edp-order-service
    ports:
      - "8080:8080"
    environment:
      QUARKUS_DATASOURCE_JDBC_URL: jdbc:postgresql://postgres:5432/edp
      QUARKUS_DATASOURCE_USERNAME: edp
      QUARKUS_DATASOURCE_PASSWORD: edp
      QUARKUS_OTEL_EXPORTER_OTLP_ENDPOINT: http://lgtm:4318
      PROJECTION_POLL: ${PROJECTION_POLL:-1s}
      PROJECTION_BATCH: ${PROJECTION_BATCH:-1000}
      # Demo code: off reads by position alone and skips a late commit.
      PROJECTION_WATERMARK: ${PROJECTION_WATERMARK:-on}
      # Demo code: "<orderId>:<Command>" entries; the command's transaction stays open DEMO_HOLD_MS after the append.
      DEMO_HOLD_FOR: ${DEMO_HOLD_FOR:-}
      DEMO_HOLD_MS: ${DEMO_HOLD_MS:-10000}
    depends_on:
      postgres:
        condition: service_healthy
      lgtm:
        condition: service_healthy
    # The peak of docker stats during a full run, 100,000 orders included, was 354 MiB; 512m leaves about 30 percent.
    mem_limit: 512m
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:8080/q/health/ready"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 15s
    networks: [edp]

networks:
  edp:
    name: edp

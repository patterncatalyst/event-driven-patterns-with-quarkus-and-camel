name: edp-ae

include:
  - path: ../_infra/compose-kafka.yaml
  - path: ../_infra/compose-postgres.yaml
  - path: ../_infra/compose-lgtm.yaml

services:
  # Creates the three per-event topics and the order-keyed shipments topic, three partitions each, then exits.
  topics-init:
    image: docker.io/apache/kafka:4.3.2
    container_name: edp-topics-init
    depends_on:
      kafka:
        condition: service_healthy
    entrypoint: ["/bin/bash", "-c"]
    command:
      - |
        set -e
        for t in edp.shipping.scheduled edp.shipping.in-transit edp.shipping.delivered edp.shipping.shipments; do
          /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9094 --create --if-not-exists --topic $$t --partitions 3 --replication-factor 1
        done
    restart: "no"
    mem_limit: 512m
    networks: [edp]

  order-service:
    build:
      context: ..
      dockerfile: ae-resequencing-across-partitions/Containerfile
    container_name: edp-order-service
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      CAMEL_COMPONENT_KAFKA_BROKERS: kafka:9094
      QUARKUS_DATASOURCE_JDBC_URL: jdbc:postgresql://postgres:5432/edp
      QUARKUS_DATASOURCE_USERNAME: edp
      QUARKUS_DATASOURCE_PASSWORD: edp
      QUARKUS_OTEL_EXPORTER_OTLP_ENDPOINT: http://lgtm:4318
      # stream (default) or batch. Demo code: RESEQUENCER=none applies every event as it arrives.
      RESEQUENCER: ${RESEQUENCER:-stream}
      # global (default) or order. Demo code: order drives the stream form with the per-order number.
      SEQUENCE_BY: ${SEQUENCE_BY:-global}
      # The settings below are raised or lowered by verify.sh for single scenarios.
      RESEQUENCER_TIMEOUT_MS: ${RESEQUENCER_TIMEOUT_MS:-2000}
      RESEQUENCER_CAPACITY: ${RESEQUENCER_CAPACITY:-1000}
      RESEQUENCER_REJECT_OLD: ${RESEQUENCER_REJECT_OLD:-false}
      RESEQUENCER_BATCH_SIZE: ${RESEQUENCER_BATCH_SIZE:-10}
      RESEQUENCER_BATCH_TIMEOUT_MS: ${RESEQUENCER_BATCH_TIMEOUT_MS:-3000}
    depends_on:
      topics-init:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      lgtm:
        condition: service_healthy
    mem_limit: 384m
    # Camel waits at most 3 s for the route to drain, then the consumer leaves its group before the container is killed.
    stop_grace_period: 20s
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:8080/q/health/ready"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 15s
    networks: [edp]

networks:
  edp:
    name: edp

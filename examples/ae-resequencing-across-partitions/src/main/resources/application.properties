quarkus.application.name=order-service

# RESEQUENCER selects the form: stream (default), batch, or none. none is demo code: events are applied as they arrive.
resequencer.mode=${RESEQUENCER:stream}
# global: the stream resequencer's sequence is the sequencer's global number. order: the per-order number (demo code,
# it shows why a per-order number cannot drive a stream resequencer).
resequencer.sequence-by=${SEQUENCE_BY:global}
# Stream form: how long to wait for a missing predecessor, how many exchanges to hold, whether a late one is an error.
resequencer.timeout=${RESEQUENCER_TIMEOUT_MS:2000}
resequencer.capacity=${RESEQUENCER_CAPACITY:1000}
resequencer.reject-old=${RESEQUENCER_REJECT_OLD:false}
# Batch form: the batch size and how long a batch may stay open.
resequencer.batch-size=${RESEQUENCER_BATCH_SIZE:10}
resequencer.batch-timeout=${RESEQUENCER_BATCH_TIMEOUT_MS:3000}

# One group reads the three per-event topics. The Camel Kafka defaults stay: offsets are committed by the Kafka client
# every five seconds, whether or not the resequencer has released the records yet.
resequencer.group=resequencer
camel.component.kafka.auto-offset-reset=earliest
# A route that is holding records must stop within the container's grace period.
camel.main.shutdown-timeout=3

# Flyway owns the schema; the table lives in the resequencing schema.
quarkus.flyway.migrate-at-start=true
quarkus.flyway.schemas=resequencing
quarkus.hibernate-orm.database.default-schema=resequencing
quarkus.datasource.db-kind=postgresql
quarkus.datasource.devservices.image-name=docker.io/library/postgres:18.6

# Traces, metrics and logs leave over OTLP. The endpoint comes from QUARKUS_OTEL_EXPORTER_OTLP_ENDPOINT.
quarkus.otel.exporter.otlp.protocol=http/protobuf
quarkus.otel.metric.export.interval=5s
quarkus.otel.bsp.schedule.delay=1s
quarkus.otel.blrp.schedule.delay=1s

quarkus.kafka.devservices.image-name=docker.io/apache/kafka:4.3.2

%test.quarkus.otel.sdk.disabled=true
%test.resequencer.timeout=500

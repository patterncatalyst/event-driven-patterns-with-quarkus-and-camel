quarkus.application.name=shipping-service

# Flyway owns the shipping schema; it holds the two tables of the Camel aggregation repository.
quarkus.datasource.db-kind=postgresql
quarkus.datasource.devservices.image-name=docker.io/library/postgres:18.6
quarkus.flyway.migrate-at-start=true
quarkus.flyway.schemas=shipping
quarkus.flyway.create-schemas=true

# Kafka Streams: the application id is the consumer group and the prefix of the internal topics. Listing the input
# topic makes readiness wait for it. With a commit interval of 1 s and no record cache an update leaves within a
# second; the defaults (30 s, 10 MiB) hold a result back until the next commit. A restarted instance takes its
# partitions back in seconds because the previous member's session is short.
quarkus.kafka-streams.application-id=shipping-pickups
quarkus.kafka-streams.topics=edp.shipping.scheduled
kafka-streams.commit.interval.ms=1000
kafka-streams.statestore.cache.max.bytes=0
kafka-streams.auto.offset.reset=earliest
kafka-streams.consumer.session.timeout.ms=10000
kafka-streams.consumer.heartbeat.interval.ms=3000
kafka-streams.state.dir=/tmp/shipping-pickups

# Camel: a batch closes at 5 shipments or after 10 s without a new one.
pickup.batch-size=5
pickup.timeout=${PICKUP_TIMEOUT_MS:10000}

# Demo code, set in the environment: PICKUP_EMIT=updates emits every update of a list; PICKUP_CHANGELOG=off keeps the
# open window out of the changelog topic.
pickup.emit=${PICKUP_EMIT:final}
pickup.changelog=${PICKUP_CHANGELOG:on}

# Both brokers settings are read in prod from the environment (KAFKA_BOOTSTRAP_SERVERS, CAMEL_COMPONENT_KAFKA_BROKERS);
# Dev Services fills them in test, so the %prod defaults must not be set outside the profile.
%prod.kafka.bootstrap.servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
%prod.camel.component.kafka.brokers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
%test.camel.component.kafka.brokers=${kafka.bootstrap.servers}
%test.pickup.timeout=3000

# Traces, metrics and logs leave over OTLP. The endpoint comes from QUARKUS_OTEL_EXPORTER_OTLP_ENDPOINT.
quarkus.otel.logs.enabled=true
quarkus.otel.metric.export.interval=5s
quarkus.otel.exporter.otlp.protocol=http/protobuf
quarkus.otel.bsp.schedule.delay=1s
quarkus.otel.blrp.schedule.delay=1s
%test.quarkus.otel.sdk.disabled=true

# Kafka Dev Services runs the broker image of the compose stack, with the one-partition topics compose creates.
quarkus.kafka.devservices.image-name=docker.io/apache/kafka:4.3.2
quarkus.kafka.devservices.topic-partitions.edp.shipping.scheduled=1
quarkus.kafka.devservices.topic-partitions.edp.shipping.pickup-lists=1
quarkus.kafka.devservices.topic-partitions.edp.shipping.pickup-lists-camel=1

# Compose supplies QUARKUS_DATASOURCE_JDBC_URL, QUARKUS_DATASOURCE_USERNAME, QUARKUS_DATASOURCE_PASSWORD,
# KAFKA_BOOTSTRAP_SERVERS and CAMEL_COMPONENT_KAFKA_BROKERS.

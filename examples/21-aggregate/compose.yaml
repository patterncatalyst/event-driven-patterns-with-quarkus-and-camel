name: edp-21

include:
  - path: ../_infra/compose-kafka.yaml
  - path: ../_infra/compose-postgres.yaml
  - path: ../_infra/compose-lgtm.yaml

services:
  # Creates the three topics, one partition each, then exits. One partition means one Kafka Streams task owns the
  # whole input, so a single record with a later event time moves the stream time for every carrier.
  topics-init:
    image: docker.io/apache/kafka:4.3.2
    container_name: edp-topics-init
    depends_on:
      kafka:
        condition: service_healthy
    entrypoint: ["/bin/bash", "-c"]
    command:
      - |
        for t in edp.shipping.scheduled edp.shipping.pickup-lists edp.shipping.pickup-lists-camel; do
          /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9094 --create --if-not-exists --topic $$t --partitions 1 --replication-factor 1
        done
    restart: "no"
    mem_limit: 512m
    networks: [edp]

  shipping-service:
    build:
      context: ..
      dockerfile: 21-aggregate/shipping-service/Containerfile
    container_name: edp-shipping-service
    ports:
      - "8080:8080"
    environment:
      CAMEL_COMPONENT_KAFKA_BROKERS: kafka:9094
      KAFKA_BOOTSTRAP_SERVERS: kafka:9094
      QUARKUS_DATASOURCE_JDBC_URL: jdbc:postgresql://postgres:5432/edp
      QUARKUS_DATASOURCE_USERNAME: edp
      QUARKUS_DATASOURCE_PASSWORD: edp
      QUARKUS_OTEL_EXPORTER_OTLP_ENDPOINT: http://lgtm:4318
      # Demo code: PICKUP_EMIT=updates removes the suppression, so every update of a list leaves.
      PICKUP_EMIT: ${PICKUP_EMIT:-final}
      # Demo code: PICKUP_CHANGELOG=off keeps the open window out of the changelog topic.
      PICKUP_CHANGELOG: ${PICKUP_CHANGELOG:-on}
      # verify.sh raises it for the restart scenario, so an open batch outlives the recreate.
      PICKUP_TIMEOUT_MS: ${PICKUP_TIMEOUT_MS:-10000}
    depends_on:
      topics-init:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      lgtm:
        condition: service_healthy
    mem_limit: 384m
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:8080/q/health/ready"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 15s
    networks: [edp]

networks:
  edp:
    name: edp

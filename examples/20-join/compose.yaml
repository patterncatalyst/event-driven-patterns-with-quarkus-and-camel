name: edp-20

include:
  - path: ../_infra/compose-kafka.yaml
  - path: ../_infra/compose-postgres.yaml
  - path: ../_infra/compose-lgtm.yaml

services:
  # Creates the two input topics and the two output topics, one partition each, then exits. One partition means one
  # Kafka Streams task sees both inputs, which a join needs.
  topics-init:
    image: docker.io/apache/kafka:4.3.2
    container_name: edp-topics-init
    depends_on:
      kafka:
        condition: service_healthy
    entrypoint: ["/bin/bash", "-c"]
    command:
      - |
        for t in edp.inventory.reserved edp.payments.processed edp.shipping.order-readiness edp.shipping.order-readiness-camel; do
          /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9094 --create --if-not-exists --topic $$t --partitions 1 --replication-factor 1
        done
    restart: "no"
    mem_limit: 512m
    networks: [edp]

  shipping-service:
    build:
      context: ..
      dockerfile: 20-join/shipping-service/Containerfile
    container_name: edp-shipping-service
    ports:
      - "8080:8080"
    environment:
      CAMEL_COMPONENT_KAFKA_BROKERS: kafka:9094
      KAFKA_BOOTSTRAP_SERVERS: kafka:9094
      QUARKUS_DATASOURCE_JDBC_URL: jdbc:postgresql://postgres:5432/edp
      QUARKUS_DATASOURCE_USERNAME: edp
      QUARKUS_DATASOURCE_PASSWORD: edp
      QUARKUS_OTEL_EXPORTER_OTLP_ENDPOINT: http://lgtm:4318
      # Demo code: memory keeps the Camel aggregator's open groups in the JVM instead of shipping.readiness.
      AGGREGATION_REPOSITORY: ${AGGREGATION_REPOSITORY:-postgres}
      # Demo code: how long a Camel group waits for its other fact, counted on the service's clock.
      READINESS_TIMEOUT_MS: ${READINESS_TIMEOUT_MS:-10000}
    depends_on:
      topics-init:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      lgtm:
        condition: service_healthy
    mem_limit: 384m
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:8080/q/health/ready"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 15s
    networks: [edp]

networks:
  edp:
    name: edp

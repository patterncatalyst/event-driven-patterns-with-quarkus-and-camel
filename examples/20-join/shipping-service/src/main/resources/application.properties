quarkus.application.name=shipping-service

# Flyway owns the shipping schema; the Camel repository writes the two tables it creates.
quarkus.flyway.migrate-at-start=true
quarkus.flyway.schemas=shipping
quarkus.datasource.db-kind=postgresql
quarkus.datasource.devservices.image-name=docker.io/library/postgres:18.6

# Kafka Streams. The application id is the consumer group and the prefix of the internal topics. The topics listed
# here must exist before the service is ready. The commit interval and the cache setting make a result leave within
# about a second; the session timeout lets a recreated service take its partitions back within seconds.
quarkus.kafka-streams.application-id=shipping-readiness
quarkus.kafka-streams.topics=edp.inventory.reserved,edp.payments.processed
%prod.kafka.bootstrap.servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
kafka-streams.auto.offset.reset=earliest
kafka-streams.commit.interval.ms=1000
kafka-streams.statestore.cache.max.bytes=0
kafka-streams.state.dir=/tmp/kafka-streams
kafka-streams.consumer.session.timeout.ms=10000
kafka-streams.consumer.heartbeat.interval.ms=3000

# The Camel aggregator: how long a group waits for its other fact, counted on this service's clock, and where the
# open groups are kept. Demo code, set in the environment: AGGREGATION_REPOSITORY=memory keeps groups in the JVM;
# READINESS_TIMEOUT_MS changes the wait.
readiness.timeout-ms=${READINESS_TIMEOUT_MS:10000}
readiness.repository=${AGGREGATION_REPOSITORY:postgres}
%test.camel.component.kafka.brokers=${kafka.bootstrap.servers}
%test.readiness.timeout-ms=4000

# Traces, metrics and logs leave over OTLP. The endpoint comes from QUARKUS_OTEL_EXPORTER_OTLP_ENDPOINT.
quarkus.otel.logs.enabled=true
quarkus.otel.metric.export.interval=5s
quarkus.otel.exporter.otlp.protocol=http/protobuf
quarkus.otel.bsp.schedule.delay=1s
quarkus.otel.blrp.schedule.delay=1s
%test.quarkus.otel.sdk.disabled=true

# Kafka Dev Services runs the same broker image as the compose stack, with the one-partition topics compose creates.
quarkus.kafka.devservices.image-name=docker.io/apache/kafka:4.3.2
quarkus.kafka.devservices.topic-partitions.edp.inventory.reserved=1
quarkus.kafka.devservices.topic-partitions.edp.payments.processed=1
quarkus.kafka.devservices.topic-partitions.edp.shipping.order-readiness=1
quarkus.kafka.devservices.topic-partitions.edp.shipping.order-readiness-camel=1

# Compose supplies QUARKUS_DATASOURCE_JDBC_URL, QUARKUS_DATASOURCE_USERNAME, QUARKUS_DATASOURCE_PASSWORD,
# KAFKA_BOOTSTRAP_SERVERS and CAMEL_COMPONENT_KAFKA_BROKERS.

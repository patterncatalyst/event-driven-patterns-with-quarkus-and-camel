quarkus.application.name=inventory-service
quarkus.http.port=8082

# Flyway owns the inventory schema; Hibernate creates nothing and validates its mapping against it at boot.
quarkus.flyway.migrate-at-start=true
quarkus.flyway.schemas=inventory
quarkus.hibernate-orm.database.default-schema=inventory
quarkus.hibernate-orm.schema-management.strategy=validate
quarkus.datasource.db-kind=postgresql
quarkus.datasource.devservices.image-name=docker.io/library/postgres:18.6

# The order channel. The value is read as bytes and parsed in the method; a failure goes to the dead letter topic,
# which keeps the key as text and the value and headers as they were (chapter 13). A restarted consumer waits for the
# previous member's session to expire, so the session is short.
mp.messaging.incoming.placed.connector=smallrye-kafka
mp.messaging.incoming.placed.topic=edp.orders.placed
mp.messaging.incoming.placed.group.id=inventory-placed
mp.messaging.incoming.placed.auto.offset.reset=earliest
mp.messaging.incoming.placed.session.timeout.ms=10000
mp.messaging.incoming.placed.heartbeat.interval.ms=3000
mp.messaging.incoming.placed.key.deserializer=org.apache.kafka.common.serialization.StringDeserializer
mp.messaging.incoming.placed.value.deserializer=org.apache.kafka.common.serialization.ByteArrayDeserializer
mp.messaging.incoming.placed.failure-strategy=dead-letter-queue
mp.messaging.incoming.placed.dead-letter-queue.topic=edp.orders.placed-dlq
mp.messaging.incoming.placed.dead-letter-queue.key.serializer=org.apache.kafka.common.serialization.StringSerializer
mp.messaging.incoming.placed.dead-letter-queue.value.serializer=org.apache.kafka.common.serialization.ByteArraySerializer

# Traces, metrics and logs leave over OTLP. The endpoint comes from QUARKUS_OTEL_EXPORTER_OTLP_ENDPOINT.
quarkus.otel.logs.enabled=true
quarkus.otel.metric.export.interval=5s
quarkus.otel.exporter.otlp.protocol=http/protobuf
quarkus.otel.bsp.schedule.delay=1s
quarkus.otel.blrp.schedule.delay=1s
%test.quarkus.otel.sdk.disabled=true

# Kafka Dev Services runs the same broker image as the compose stack.
quarkus.kafka.devservices.image-name=docker.io/apache/kafka:4.3.2

# Compose supplies QUARKUS_DATASOURCE_JDBC_URL, QUARKUS_DATASOURCE_USERNAME, QUARKUS_DATASOURCE_PASSWORD and
# KAFKA_BOOTSTRAP_SERVERS.

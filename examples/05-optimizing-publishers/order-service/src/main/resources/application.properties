quarkus.application.name=order-service

# The tuned route: wait up to 20 ms for a batch of up to 128 KiB, compressed with lz4.
publisher.tuned.linger-ms=${PUBLISHER_LINGER_MS:20}
publisher.tuned.batch-size=${PUBLISHER_BATCH_SIZE:131072}
publisher.tuned.compression=${PUBLISHER_COMPRESSION:lz4}

# Component-wide acks and idempotence, for all three routes; the defaults are Camel's and Kafka's own.
camel.component.kafka.request-required-acks=${REQUIRED_ACKS:all}
camel.component.kafka.enable-idempotence=${ENABLE_IDEMPOTENCE:true}

# Every Kafka producer Camel creates gets Micrometer client metrics from this bean.
camel.component.kafka.kafka-client-factory=#kafkaClientMetricsFactory

# Traces, metrics and logs leave over OTLP. The endpoint comes from QUARKUS_OTEL_EXPORTER_OTLP_ENDPOINT.
quarkus.otel.exporter.otlp.protocol=http/protobuf
quarkus.otel.metric.export.interval=5s
quarkus.otel.bsp.schedule.delay=1s
quarkus.otel.blrp.schedule.delay=1s

# Dev Services runs the same broker image as the compose stack, with the same three partitions.
quarkus.kafka.devservices.image-name=docker.io/apache/kafka:4.3.2
quarkus.kafka.devservices.topic-partitions."edp.orders.placed"=3

%test.quarkus.otel.sdk.disabled=true

# Camel's JSON data format uses the application's Jackson ObjectMapper, which handles java.time.
camel.dataformat.jackson.auto-discover-object-mapper=true

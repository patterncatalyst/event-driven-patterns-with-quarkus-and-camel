name: edp-05

include:
  - path: ../_infra/compose-kafka.yaml
  - path: ../_infra/compose-lgtm.yaml

services:
  # Creates the topic with a fixed partition count, then exits.
  topics-init:
    image: docker.io/apache/kafka:4.3.2
    container_name: edp-topics-init
    depends_on:
      kafka:
        condition: service_healthy
    entrypoint: ["/bin/bash", "-c"]
    command:
      - |
        set -e
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9094 --create --if-not-exists --topic edp.orders.placed --partitions 3 --replication-factor 1
    restart: "no"
    mem_limit: 512m
    networks: [edp]

  order-service:
    build:
      context: ..
      dockerfile: 05-optimizing-publishers/order-service/Containerfile
    container_name: edp-order-service
    ports:
      - "8080:8080"
    environment:
      CAMEL_COMPONENT_KAFKA_BROKERS: kafka:9094
      QUARKUS_OTEL_EXPORTER_OTLP_ENDPOINT: http://lgtm:4318
      # Component level (see application.properties), so they apply to all three routes.
      REQUIRED_ACKS: ${REQUIRED_ACKS:-all}
      ENABLE_IDEMPOTENCE: ${ENABLE_IDEMPOTENCE:-true}
      # The tuned route's values.
      PUBLISHER_LINGER_MS: ${PUBLISHER_LINGER_MS:-20}
      PUBLISHER_BATCH_SIZE: ${PUBLISHER_BATCH_SIZE:-131072}
      PUBLISHER_COMPRESSION: ${PUBLISHER_COMPRESSION:-lz4}
    depends_on:
      topics-init:
        condition: service_completed_successfully
      lgtm:
        condition: service_healthy
    mem_limit: 384m
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:8080/q/health/ready"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 15s
    networks: [edp]

networks:
  edp:
    name: edp

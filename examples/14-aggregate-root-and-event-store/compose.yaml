name: edp-14

include:
  - path: ../_infra/compose-kafka.yaml
  - path: ../_infra/compose-postgres.yaml
  - path: ../_infra/compose-connect.yaml
  - path: ../_infra/compose-lgtm.yaml

services:
  # Creates the four topics the service reads and publishes, one partition each, then exits.
  topics-init:
    image: docker.io/apache/kafka:4.3.2
    container_name: edp-topics-init
    depends_on:
      kafka:
        condition: service_healthy
    entrypoint: ["/bin/bash", "-c"]
    command:
      - |
        for t in edp.orders.placed edp.orders.cancelled edp.payments.processed edp.shipping.scheduled; do
          /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9094 --create --if-not-exists --topic $$t --partitions 1 --replication-factor 1
        done
    restart: "no"
    mem_limit: 512m
    networks: [edp]

  order-service:
    build:
      context: ..
      dockerfile: 14-aggregate-root-and-event-store/order-service/Containerfile
    container_name: edp-order-service
    ports:
      - "8080:8080"
    environment:
      CAMEL_COMPONENT_KAFKA_BROKERS: kafka:9094
      KAFKA_BOOTSTRAP_SERVERS: kafka:9094
      QUARKUS_DATASOURCE_JDBC_URL: jdbc:postgresql://postgres:5432/edp
      QUARKUS_DATASOURCE_USERNAME: edp
      QUARKUS_DATASOURCE_PASSWORD: edp
      QUARKUS_OTEL_EXPORTER_OTLP_ENDPOINT: http://lgtm:4318
      # prod (default) reads PaymentProcessed through the SmallRye channel; camel-commands reads it through the Camel route.
      QUARKUS_PROFILE: ${COMMAND_PROFILE:-prod}
      RETRY_MAX: ${RETRY_MAX:-3}
      CAMEL_REDELIVERIES: ${CAMEL_REDELIVERIES:-3}
      # Demo code: RETRY_MODE=reappend re-appends a decided command instead of deciding again.
      RETRY_MODE: ${RETRY_MODE:-redecide}
      # Demo code: "<orderId>:<Command>" entries; the command waits DEMO_PAUSE_MS between deciding and appending.
      DEMO_PAUSE_FOR: ${DEMO_PAUSE_FOR:-}
      DEMO_PAUSE_MS: ${DEMO_PAUSE_MS:-6000}
    depends_on:
      topics-init:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      lgtm:
        condition: service_healthy
    mem_limit: 384m
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:8080/q/health/ready"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 15s
    networks: [edp]

networks:
  edp:
    name: edp

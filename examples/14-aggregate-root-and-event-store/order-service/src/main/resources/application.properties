quarkus.application.name=order-service

# Flyway owns the orders schema; Hibernate creates nothing and validates its mapping against it at boot.
# The events.payload column is mapped with Jackson, so Hibernate's own JSON formatter stays off.
quarkus.flyway.migrate-at-start=true
quarkus.flyway.schemas=orders
quarkus.hibernate-orm.database.default-schema=orders
quarkus.hibernate-orm.schema-management.strategy=validate
quarkus.hibernate-orm.mapping.format.global=ignore
quarkus.datasource.db-kind=postgresql
quarkus.datasource.devservices.image-name=docker.io/library/postgres:18.6

# The outbox extension: one extra column holds the topic the connector routes the row to. Only the public events
# (OrderPlaced, OrderCancelled) write a row.
quarkus.debezium-outbox.additional-fields=topic:string
quarkus.debezium-outbox.remove-after-insert=true
%test.quarkus.debezium-outbox.remove-after-insert=false

# A command that loses a version race is decided again, this many times. @Retry takes the count from the config
# key of the method.
retry.max=${RETRY_MAX:3}
com.patterncatalyst.shipping.aggregate.OrderCommands/handle/Retry/maxRetries=${retry.max}

# Demo code, off by default, set in the environment: RETRY_MODE=reappend (property retry.mode) replaces the re-decide by
# a blind re-append, the negative witness; DEMO_PAUSE_FOR (demo.pause-for) lists "<orderId>:<Command>" entries that
# wait DEMO_PAUSE_MS (demo.pause-ms, default 6000) between deciding and appending.

# The SmallRye path: PaymentProcessed and ShipmentScheduled become commands on the aggregate.
mp.messaging.incoming.payments.connector=smallrye-kafka
mp.messaging.incoming.payments.topic=edp.payments.processed
mp.messaging.incoming.payments.group.id=order-payments
mp.messaging.incoming.payments.auto.offset.reset=earliest
mp.messaging.incoming.payments.key.deserializer=org.apache.kafka.common.serialization.StringDeserializer
mp.messaging.incoming.payments.value.deserializer=com.patterncatalyst.shipping.aggregate.PaymentProcessedDeserializer
# A restarted consumer waits for the previous member's session to expire before it is assigned its partition.
mp.messaging.incoming.payments.session.timeout.ms=10000
mp.messaging.incoming.shipments.connector=smallrye-kafka
mp.messaging.incoming.shipments.topic=edp.shipping.scheduled
mp.messaging.incoming.shipments.group.id=order-shipments
mp.messaging.incoming.shipments.auto.offset.reset=earliest
mp.messaging.incoming.shipments.key.deserializer=org.apache.kafka.common.serialization.StringDeserializer
mp.messaging.incoming.shipments.value.deserializer=com.patterncatalyst.shipping.aggregate.ShipmentScheduledDeserializer
mp.messaging.incoming.shipments.session.timeout.ms=10000

# The Camel path (profile camel-commands) replaces the payments channel with the route; shipments stay on SmallRye.
commands.camel.enabled=false
commands.camel.redeliveries=${CAMEL_REDELIVERIES:3}
%camel-commands.commands.camel.enabled=true
%camel-commands.mp.messaging.incoming.payments.enabled=false

# Traces, metrics and logs leave over OTLP. The endpoint comes from QUARKUS_OTEL_EXPORTER_OTLP_ENDPOINT.
quarkus.otel.logs.enabled=true
quarkus.otel.metric.export.interval=5s
quarkus.otel.exporter.otlp.protocol=http/protobuf
quarkus.otel.bsp.schedule.delay=1s
quarkus.otel.blrp.schedule.delay=1s

# Kafka Dev Services runs the same broker image as the compose stack.
quarkus.kafka.devservices.image-name=docker.io/apache/kafka:4.3.2
%test.quarkus.otel.sdk.disabled=true

# Compose supplies QUARKUS_DATASOURCE_JDBC_URL, QUARKUS_DATASOURCE_USERNAME, QUARKUS_DATASOURCE_PASSWORD,
# KAFKA_BOOTSTRAP_SERVERS and CAMEL_COMPONENT_KAFKA_BROKERS.

# Example 30: the example 02 pair on the shared platform. Every resource is applied server-side by the field
# manager edp-apps (k8s_fresh in verify.sh), so edp-apps owns the app manifests from the first apply.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../_k8s/namespaces
  - ../_k8s/strimzi
  - ../_k8s/kafka
  - ../_k8s/postgres
  - ../_k8s/lgtm
  - apps

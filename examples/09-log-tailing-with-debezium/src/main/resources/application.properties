quarkus.application.name=inventory-service

# Where the changes come from. connect (default): the Camel route reads the envelopes Kafka Connect writes.
# embedded: the profile turns that route off and starts Debezium inside the service.
cdc.connect.enabled=true
cdc.embedded.enabled=false
%embedded.cdc.connect.enabled=false
%embedded.cdc.embedded.enabled=true

# The embedded engine reads the legacy database itself and keeps its offsets in a file. Compose sets
# CDC_PG_HOST through the environment mapping.
cdc.pg.host=localhost
cdc.pg.user=edp
cdc.pg.password=edp
cdc.embedded.offsets=/tmp/cdc-offsets.dat

# The embedded engine's Camel extension brings the PostgreSQL JDBC driver and a datasource with it. The service
# has no database of its own, so the datasource is off and Dev Services starts no PostgreSQL.
quarkus.datasource.db-kind=postgresql
quarkus.datasource.active=false

# A new consumer group reads the change topic from the start.
camel.component.kafka.auto-offset-reset=earliest

# Traces, metrics and logs leave over OTLP. The endpoint comes from QUARKUS_OTEL_EXPORTER_OTLP_ENDPOINT.
quarkus.otel.logs.enabled=true
quarkus.otel.exporter.otlp.protocol=http/protobuf
quarkus.otel.metric.export.interval=5s
quarkus.otel.bsp.schedule.delay=1s
quarkus.otel.blrp.schedule.delay=1s

# Dev Services runs the same broker image as the compose stack.
quarkus.kafka.devservices.image-name=docker.io/apache/kafka:4.3.2
quarkus.kafka.devservices.topic-partitions."edp.inventory.item-changes"=3
quarkus.kafka.devservices.topic-partitions."edp.inventory.items"=3

%test.quarkus.otel.sdk.disabled=true

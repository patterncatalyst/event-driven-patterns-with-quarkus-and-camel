# The example 09 service in its default mode: a Camel route reads the change envelopes Connect writes and
# publishes one InventoryItem document per SKU. It has no database of its own.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: inventory-service
  labels: {app: inventory-service}
spec:
  replicas: 1
  selector:
    matchLabels: {app: inventory-service}
  template:
    metadata:
      labels: {app: inventory-service}
    spec:
      containers:
        - name: app
          image: localhost/edp/09-inventory-service:local
          imagePullPolicy: Never
          ports:
            - {name: http, containerPort: 8080}
          env:
            - {name: CAMEL_COMPONENT_KAFKA_BROKERS, value: "edp-kafka-bootstrap.edp-kafka.svc:9092"}
            - {name: QUARKUS_OTEL_EXPORTER_OTLP_ENDPOINT, value: "http://lgtm.edp-lgtm.svc:4318"}
          readinessProbe:
            httpGet: {path: /q/health/ready, port: 8080}
            periodSeconds: 5
            failureThreshold: 24
          livenessProbe:
            httpGet: {path: /q/health/live, port: 8080}
            periodSeconds: 10
            initialDelaySeconds: 20
          resources:
            requests: {memory: 256Mi}
            limits: {memory: 512Mi}
---
apiVersion: v1
kind: Service
metadata:
  name: inventory-service
  labels: {app: inventory-service}
spec:
  type: NodePort
  selector: {app: inventory-service}
  ports:
    - {name: http, port: 8080, targetPort: 8080, nodePort: 30082}

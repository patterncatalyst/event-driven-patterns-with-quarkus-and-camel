# The chapter 08 connector (examples/08-transactional-outbox/connect/order-outbox.json) as a resource. Only the
# host and the credentials differ: the host is the CloudNativePG read-write Service and the credentials are
# references into the secret edp-pg-app, resolved inside the Connect pod.
apiVersion: kafka.strimzi.io/v1
kind: KafkaConnector
metadata:
  name: order-outbox
  labels:
    strimzi.io/cluster: edp-connect
spec:
  class: io.debezium.connector.postgresql.PostgresConnector
  tasksMax: 1
  config:
    database.hostname: edp-pg-rw.edp.svc
    database.port: "5432"
    database.user: ${secrets:edp/edp-pg-app:username}
    database.password: ${secrets:edp/edp-pg-app:password}
    database.dbname: edp
    topic.prefix: edp
    plugin.name: pgoutput
    slot.name: edp_order_outbox
    publication.name: edp_order_outbox
    publication.autocreate.mode: filtered
    table.include.list: orders.outboxevent
    tombstones.on.delete: "false"
    key.converter: org.apache.kafka.connect.storage.StringConverter
    value.converter: org.apache.kafka.connect.json.JsonConverter
    value.converter.schemas.enable: "false"
    transforms: outbox
    transforms.outbox.type: io.debezium.transforms.outbox.EventRouter
    transforms.outbox.route.by.field: topic
    transforms.outbox.route.topic.replacement: ${routedByValue}
    transforms.outbox.table.expand.json.payload: "true"
    transforms.outbox.table.fields.additional.placement: type:header:eventType

# The example 10 connector (examples/10-managing-connector-offsets/connect/inventory-cdc.json) as a resource.
# Differences: the host and credentials as in order-outbox, and topic.prefix edp-inventory with both reroute
# regexes following it, because two Debezium connectors in one Connect cluster must not share a topic.prefix.
# The output topics keep their names. listOffsets and alterOffsets name the ConfigMaps the offset operations use.
apiVersion: kafka.strimzi.io/v1
kind: KafkaConnector
metadata:
  name: inventory-cdc
  labels:
    strimzi.io/cluster: edp-connect
spec:
  class: io.debezium.connector.postgresql.PostgresConnector
  tasksMax: 1
  state: running
  listOffsets:
    toConfigMap:
      name: inventory-cdc-offsets
  alterOffsets:
    fromConfigMap:
      name: inventory-cdc-offsets-alter
  config:
    database.hostname: edp-pg-rw.edp.svc
    database.port: "5432"
    database.user: ${secrets:edp/edp-pg-app:username}
    database.password: ${secrets:edp/edp-pg-app:password}
    database.dbname: edp
    topic.prefix: edp-inventory
    plugin.name: pgoutput
    slot.name: edp_inventory
    publication.name: edp_inventory
    publication.autocreate.mode: filtered
    table.include.list: inventory.inventory_item,inventory.dbz_signal
    snapshot.mode: initial
    signal.data.collection: inventory.dbz_signal
    key.converter: org.apache.kafka.connect.json.JsonConverter
    key.converter.schemas.enable: "false"
    value.converter: org.apache.kafka.connect.json.JsonConverter
    value.converter.schemas.enable: "false"
    transforms: reroute,signals
    transforms.reroute.type: org.apache.kafka.connect.transforms.RegexRouter
    transforms.reroute.regex: edp-inventory\.inventory\.inventory_item
    transforms.reroute.replacement: edp.inventory.item-changes
    transforms.signals.type: org.apache.kafka.connect.transforms.RegexRouter
    transforms.signals.regex: edp-inventory\.inventory\.dbz_signal
    transforms.signals.replacement: edp.inventory.signals

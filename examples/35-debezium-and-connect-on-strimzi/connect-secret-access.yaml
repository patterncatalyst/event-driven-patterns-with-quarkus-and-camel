# KubernetesSecretConfigProvider runs in the Connect pod and reads the CloudNativePG secret edp-pg-app in edp.
# The Role names that one secret and only the get verb; the ServiceAccount is the one Strimzi creates for the
# KafkaConnect edp-connect.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata: {name: connect-pg-secret, namespace: edp}
rules:
  - {apiGroups: [""], resources: [secrets], resourceNames: [edp-pg-app], verbs: [get]}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata: {name: connect-pg-secret, namespace: edp}
roleRef: {apiGroup: rbac.authorization.k8s.io, kind: Role, name: connect-pg-secret}
subjects:
  - {kind: ServiceAccount, name: edp-connect-connect, namespace: edp-kafka}

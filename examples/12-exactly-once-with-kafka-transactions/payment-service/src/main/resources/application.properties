quarkus.application.name=payment-service

# Input: a batch of records per poll. The consumer commits no offsets of its own (commit-strategy=ignore); the
# transaction sends them. isolation.level=read_committed matters when this service also reads transactional topics.
# A short session timeout lets a restarted instance take over the partition of a stopped one within seconds.
mp.messaging.incoming.inventory-reserved.connector=smallrye-kafka
mp.messaging.incoming.inventory-reserved.topic=edp.inventory.reserved
mp.messaging.incoming.inventory-reserved.group.id=payment-service
mp.messaging.incoming.inventory-reserved.batch=true
mp.messaging.incoming.inventory-reserved.commit-strategy=ignore
mp.messaging.incoming.inventory-reserved.failure-strategy=ignore
mp.messaging.incoming.inventory-reserved.auto.offset.reset=earliest
mp.messaging.incoming.inventory-reserved.isolation.level=read_committed
mp.messaging.incoming.inventory-reserved.session.timeout.ms=10000
mp.messaging.incoming.inventory-reserved.key.deserializer=org.apache.kafka.common.serialization.StringDeserializer
mp.messaging.incoming.inventory-reserved.value.deserializer=com.patterncatalyst.shipping.payments.InventoryReservedDeserializer

# Output: a transactional producer. The transactional.id is explicit so the broker's view of it can be inspected;
# one id per instance, and a second instance with the same id fences the first.
mp.messaging.outgoing.payments-processed.connector=smallrye-kafka
mp.messaging.outgoing.payments-processed.topic=edp.payments.processed
mp.messaging.outgoing.payments-processed.transactional.id=payment-service-tx
mp.messaging.outgoing.payments-processed.enable.idempotence=true
mp.messaging.outgoing.payments-processed.acks=all
mp.messaging.outgoing.payments-processed.transaction.timeout.ms=${TX_TIMEOUT_MS:60000}
mp.messaging.outgoing.payments-processed.key.serializer=org.apache.kafka.common.serialization.StringSerializer
mp.messaging.outgoing.payments-processed.value.serializer=io.quarkus.kafka.client.serialization.ObjectMapperSerializer

# Comparison: the camel-transacted profile turns the SmallRye channel off and the Camel route on.
camel.route.enabled=false
%camel-transacted.camel.route.enabled=true
%camel-transacted.mp.messaging.incoming.inventory-reserved.enabled=false

# Demo code: the order id at which the JVM stops inside a transaction, set in the environment as
# DEMO_CRASH_MID_BATCH_AT.

# Kafka Dev Services runs the same broker image as the compose stack.
quarkus.kafka.devservices.image-name=docker.io/apache/kafka:4.3.2

# Traces, metrics and logs leave over OTLP. The endpoint comes from QUARKUS_OTEL_EXPORTER_OTLP_ENDPOINT.
quarkus.otel.logs.enabled=true
quarkus.otel.metric.export.interval=5s
quarkus.otel.exporter.otlp.protocol=http/protobuf
quarkus.otel.bsp.schedule.delay=1s
quarkus.otel.blrp.schedule.delay=1s

# Tests start no collector, so the OpenTelemetry SDK stays off.
%test.quarkus.otel.sdk.disabled=true

# Compose supplies KAFKA_BOOTSTRAP_SERVERS and CAMEL_COMPONENT_KAFKA_BROKERS.

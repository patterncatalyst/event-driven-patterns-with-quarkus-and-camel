apiVersion: apps/v1
kind: Deployment
metadata:
  name: notification-service
  labels: {app: notification-service}
spec:
  replicas: 1
  selector:
    matchLabels: {app: notification-service}
  template:
    metadata:
      labels: {app: notification-service}
    spec:
      containers:
        - name: app
          image: localhost/edp/02-notification-service:local
          imagePullPolicy: Never
          ports:
            - {name: http, containerPort: 8082}
          env:
            - {name: CAMEL_COMPONENT_KAFKA_BROKERS, value: "edp-kafka-bootstrap.edp-kafka.svc:9092"}
            - {name: QUARKUS_OTEL_EXPORTER_OTLP_ENDPOINT, value: "http://lgtm.edp-lgtm.svc:4318"}
            - {name: QUARKUS_DATASOURCE_JDBC_URL, value: "jdbc:postgresql://edp-pg-rw.edp.svc:5432/edp"}
            - name: QUARKUS_DATASOURCE_USERNAME
              valueFrom: {secretKeyRef: {name: edp-pg-app, key: username}}
            - name: QUARKUS_DATASOURCE_PASSWORD
              valueFrom: {secretKeyRef: {name: edp-pg-app, key: password}}
            - {name: ORDER_SERVICE_URL, value: "http://order-service:8080"}
          readinessProbe:
            httpGet: {path: /q/health/ready, port: 8082}
            periodSeconds: 5
            failureThreshold: 24
          livenessProbe:
            httpGet: {path: /q/health/live, port: 8082}
            periodSeconds: 10
            initialDelaySeconds: 20
          resources:
            requests: {memory: 256Mi}
            limits: {memory: 384Mi}
---
apiVersion: v1
kind: Service
metadata:
  name: notification-service
  labels: {app: notification-service}
spec:
  type: NodePort
  selector: {app: notification-service}
  ports:
    - {name: http, port: 8082, targetPort: 8082, nodePort: 30082}


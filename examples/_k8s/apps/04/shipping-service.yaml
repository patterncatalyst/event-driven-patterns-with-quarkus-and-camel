apiVersion: apps/v1
kind: Deployment
metadata:
  name: shipping-service
  labels: {app: shipping-service}
spec:
  replicas: 1
  selector:
    matchLabels: {app: shipping-service}
  template:
    metadata:
      labels: {app: shipping-service}
    spec:
      containers:
        - name: app
          image: localhost/edp/04-shipping-service:local
          imagePullPolicy: Never
          ports:
            - {name: http, containerPort: 8080}
          env:
            - {name: CAMEL_COMPONENT_KAFKA_BROKERS, value: "edp-kafka-bootstrap.edp-kafka.svc:9092"}
            - {name: QUARKUS_OTEL_EXPORTER_OTLP_ENDPOINT, value: "http://lgtm.edp-lgtm.svc:4318"}
            - {name: SHIPPING_PARTITION_KEY, value: "order-id"}
          readinessProbe:
            httpGet: {path: /q/health/ready, port: 8080}
            periodSeconds: 5
            failureThreshold: 24
          livenessProbe:
            httpGet: {path: /q/health/live, port: 8080}
            periodSeconds: 10
            initialDelaySeconds: 20
          resources:
            requests: {memory: 256Mi}
            limits: {memory: 384Mi}
---
apiVersion: v1
kind: Service
metadata:
  name: shipping-service
  labels: {app: shipping-service}
spec:
  type: NodePort
  selector: {app: shipping-service}
  ports:
    - {name: http, port: 8080, targetPort: 8080, nodePort: 30080}


apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: edp-pg
spec:
  instances: 1
  imageName: ghcr.io/cloudnative-pg/postgresql:18.6-202611090812-standard-trixie
  bootstrap:
    initdb:
      database: edp
      owner: edp
  storage:
    size: 1Gi
  resources:
    requests:
      memory: 512Mi
    limits:
      memory: 1Gi

apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: edp-pg
spec:
  instances: 1
  imageName: ghcr.io/cloudnative-pg/postgresql:18.6-202611090812-standard-trixie
  bootstrap:
    initdb:
      database: edp
      owner: edp
  storage:
    size: 1Gi
  resources:
    requests:
      memory: 512Mi
    limits:
      memory: 1Gi
  managed:
    roles:
      # Debezium on Kubernetes connects as the application owner, which needs the REPLICATION attribute
      # (wal_level is already logical). The role belongs in the whole Cluster manifest, never in a fragment.
      - name: edp
        ensure: present
        login: true
        replication: true
        passwordSecret:
          name: edp-pg-app

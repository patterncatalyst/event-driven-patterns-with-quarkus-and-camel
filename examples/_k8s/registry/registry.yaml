# CNCF Distribution registry on emptyDir behind a Service with a fixed ClusterIP (versions.env REGISTRY_IP), plain HTTP.
apiVersion: apps/v1
kind: Deployment
metadata: {name: registry, labels: {app: registry}}
spec:
  replicas: 1
  strategy: {type: Recreate}
  selector: {matchLabels: {app: registry}}
  template:
    metadata: {labels: {app: registry}}
    spec:
      containers:
        - name: registry
          image: docker.io/library/registry:3.1.2@sha256:82f6ff4a7f982960c8aa51617fea3aabc485df6e55cce80d22deb1de36f1bc3c
          ports: [{name: http, containerPort: 5000}]
          readinessProbe: {httpGet: {path: /v2/, port: 5000}, periodSeconds: 3}
          volumeMounts: [{name: data, mountPath: /var/lib/registry}]
          resources: {requests: {memory: 64Mi}, limits: {memory: 256Mi}}
      volumes: [{name: data, emptyDir: {}}]
---
apiVersion: v1
kind: Service
metadata: {name: registry, labels: {app: registry}}
spec:
  clusterIP: 10.96.100.50
  selector: {app: registry}
  ports: [{name: http, port: 5000, targetPort: 5000}]

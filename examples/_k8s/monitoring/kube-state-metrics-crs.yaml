          help: KafkaRebalance status conditions (1 when True)
          each:
            type: Gauge
            gauge:
              path: [status, conditions]
              labelsFromPath: {type: [type]}
              valueFrom: [status]
    - groupVersionKind: {group: kafka.strimzi.io, version: v1, kind: KafkaConnector}
      metricNamePrefix: edp_kafkaconnector
      labelsFromPath: {name: [metadata, name]}
      metrics:
        - name: condition
          help: KafkaConnector status conditions (1 when True)
          each:
            type: Gauge
            gauge:
              path: [status, conditions]
              labelsFromPath: {type: [type], reason: [reason]}
              valueFrom: [status]
    - groupVersionKind: {group: kafka.strimzi.io, version: v1, kind: KafkaConnect}
      metricNamePrefix: edp_kafkaconnect
      labelsFromPath: {name: [metadata, name]}
      metrics:
        - name: condition
          help: KafkaConnect status conditions (1 when True)
          each:
            type: Gauge
            gauge:
              path: [status, conditions]
              labelsFromPath: {type: [type], reason: [reason]}
              valueFrom: [status]
    - groupVersionKind: {group: kafka.strimzi.io, version: v1, kind: KafkaMirrorMaker2}
      metricNamePrefix: edp_kafkamirrormaker2
      labelsFromPath: {name: [metadata, name]}

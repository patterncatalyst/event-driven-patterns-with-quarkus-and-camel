kind: CustomResourceStateMetrics
spec:
  resources:
    - groupVersionKind: {group: kafka.strimzi.io, version: v1, kind: Kafka}
      metricNamePrefix: edp_kafka
      labelsFromPath: {name: [metadata, name]}
      metrics:
        - name: condition
          help: Kafka status conditions (1 when True)
          each:
            type: Gauge
            gauge:
              path: [status, conditions]
              labelsFromPath: {type: [type], reason: [reason]}
              valueFrom: [status]
    - groupVersionKind: {group: kafka.strimzi.io, version: v1, kind: KafkaNodePool}
      metricNamePrefix: edp_kafkanodepool
      labelsFromPath: {name: [metadata, name]}
      metrics:
        - name: replicas
          help: node pool replicas in status
          each:
            type: Gauge
            gauge: {path: [status, replicas]}
    - groupVersionKind: {group: kafka.strimzi.io, version: v1, kind: KafkaTopic}
      metricNamePrefix: edp_kafkatopic
      labelsFromPath: {name: [metadata, name]}
      metrics:
        - name: condition
          help: KafkaTopic status conditions (1 when True)
          each:
            type: Gauge
            gauge:
              path: [status, conditions]
              labelsFromPath: {type: [type], reason: [reason]}
              valueFrom: [status]
    - groupVersionKind: {group: kafka.strimzi.io, version: v1, kind: KafkaRebalance}
      metricNamePrefix: edp_kafkarebalance
      labelsFromPath: {name: [metadata, name]}
      metrics:

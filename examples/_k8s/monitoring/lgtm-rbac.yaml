apiVersion: v1
kind: ServiceAccount
metadata: {name: lgtm, namespace: edp-lgtm}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata: {name: lgtm-pod-discovery, namespace: edp-kafka}
rules:
  - apiGroups: [""]
    resources: [pods]
    verbs: [get, list, watch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata: {name: lgtm-pod-discovery, namespace: edp-kafka}
roleRef: {apiGroup: rbac.authorization.k8s.io, kind: Role, name: lgtm-pod-discovery}
subjects: [{kind: ServiceAccount, name: lgtm, namespace: edp-lgtm}]

# kube-state-metrics with a CustomResourceStateMetrics configuration (kube-state-metrics-crs.yaml, generated into a ConfigMap by the kustomization): Ready conditions and a few status fields of the Strimzi
# resources. Strimzi's example configuration is cited in the chapter, not copied.
apiVersion: v1
kind: ServiceAccount
metadata: {name: kube-state-metrics, namespace: edp-lgtm}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata: {name: edp-kube-state-metrics}
rules:
  - apiGroups: [apiextensions.k8s.io]
    resources: [customresourcedefinitions]
    verbs: [get, list, watch]
  - apiGroups: [kafka.strimzi.io]
    resources: ["*"]
    verbs: [get, list, watch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata: {name: edp-kube-state-metrics}
roleRef: {apiGroup: rbac.authorization.k8s.io, kind: ClusterRole, name: edp-kube-state-metrics}
subjects:
  - {kind: ServiceAccount, name: kube-state-metrics, namespace: edp-lgtm}
---
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: kube-state-metrics, namespace: edp-lgtm, labels: {app: kube-state-metrics}}
spec:
  replicas: 1
  selector: {matchLabels: {app: kube-state-metrics}}
  template:
    metadata: {labels: {app: kube-state-metrics}}
    spec:
      serviceAccountName: kube-state-metrics
      containers:
        - name: ksm
          image: registry.k8s.io/kube-state-metrics/kube-state-metrics:v2.20.0@sha256:42cfe3723a5f058171c627537fb57a3ea0f26e4380fa18555a95cb1a1b4cfc5b
          args:
            - --custom-resource-state-only=true
            - --custom-resource-state-config-file=/config/crs.yaml
          ports:
            - {name: metrics, containerPort: 8080}
          readinessProbe: {httpGet: {path: /readyz, port: 8081}, periodSeconds: 5}
          volumeMounts: [{name: crs, mountPath: /config}]
          resources: {requests: {memory: 64Mi}, limits: {memory: 128Mi}}
      volumes: [{name: crs, configMap: {name: kube-state-metrics-crs}}]  # generated from kube-state-metrics-crs.yaml
---
apiVersion: v1
kind: Service
metadata: {name: kube-state-metrics, namespace: edp-lgtm, labels: {app: kube-state-metrics}}
spec:
  selector: {app: kube-state-metrics}
  ports: [{name: metrics, port: 8080, targetPort: 8080}]

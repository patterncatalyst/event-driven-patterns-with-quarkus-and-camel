apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../strimzi
patches:
  - target: {kind: Deployment, name: strimzi-cluster-operator}
    patch: |-
      - op: add
        path: /spec/template/spec/containers/0/env/-
        value: {name: STRIMZI_POD_SECURITY_PROVIDER_CLASS, value: restricted}

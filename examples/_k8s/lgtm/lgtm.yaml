apiVersion: apps/v1
kind: Deployment
metadata:
  name: lgtm
  labels: {app: lgtm}
spec:
  replicas: 1
  strategy: {type: Recreate}
  selector:
    matchLabels: {app: lgtm}
  template:
    metadata:
      labels: {app: lgtm}
    spec:
      containers:
        - name: lgtm
          image: docker.io/grafana/otel-lgtm:0.41.0
          env:
            - {name: GF_AUTH_ANONYMOUS_ENABLED, value: "true"}
            - {name: GF_AUTH_ANONYMOUS_ORG_ROLE, value: Admin}
            - {name: GF_AUTH_DISABLE_LOGIN_FORM, value: "true"}
          ports:
            - {name: grafana, containerPort: 3000}
            - {name: otlp-grpc, containerPort: 4317}
            - {name: otlp-http, containerPort: 4318}
            - {name: prometheus, containerPort: 9090}
            - {name: tempo, containerPort: 3200}
            - {name: loki, containerPort: 3100}
          readinessProbe:
            httpGet: {path: /api/health, port: 3000}
            periodSeconds: 5
            failureThreshold: 30
          resources:
            requests: {memory: 1Gi}
            limits: {memory: 2Gi}
---
apiVersion: v1
kind: Service
metadata:
  name: lgtm
  labels: {app: lgtm}
spec:
  type: NodePort
  selector: {app: lgtm}
  ports:
    - {name: grafana, port: 3000, targetPort: 3000, nodePort: 30300}
    - {name: otlp-grpc, port: 4317, targetPort: 4317}
    - {name: otlp-http, port: 4318, targetPort: 4318}
    - {name: prometheus, port: 9090, targetPort: 9090, nodePort: 30909}
    - {name: tempo, port: 3200, targetPort: 3200, nodePort: 30320}
    - {name: loki, port: 3100, targetPort: 3100, nodePort: 30100}

name: edp-13

include:
  - path: ../_infra/compose-kafka.yaml
  - path: ../_infra/compose-postgres.yaml
  - path: ../_infra/compose-lgtm.yaml

services:
  # Creates the order topic and its dead letter topic with one partition each, then exits.
  topics-init:
    image: docker.io/apache/kafka:4.3.2
    container_name: edp-topics-init
    depends_on:
      kafka:
        condition: service_healthy
    entrypoint: ["/bin/bash", "-c"]
    command:
      - |
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9094 --create --if-not-exists --topic edp.orders.placed --partitions 1 --replication-factor 1
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9094 --create --if-not-exists --topic edp.orders.placed-dlq --partitions 1 --replication-factor 1
    restart: "no"
    mem_limit: 512m
    networks: [edp]

  inventory-service:
    build:
      context: ..
      dockerfile: 13-retry-and-dead-letter/inventory-service/Containerfile
    container_name: edp-inventory-service
    ports:
      - "8080:8080"
    environment:
      CAMEL_COMPONENT_KAFKA_BROKERS: kafka:9094
      KAFKA_BOOTSTRAP_SERVERS: kafka:9094
      QUARKUS_DATASOURCE_JDBC_URL: jdbc:postgresql://postgres:5432/edp
      QUARKUS_DATASOURCE_USERNAME: edp
      QUARKUS_DATASOURCE_PASSWORD: edp
      QUARKUS_OTEL_EXPORTER_OTLP_ENDPOINT: http://lgtm:4318
      # prod (default) reads through the SmallRye channel; camel reads through the Camel route.
      QUARKUS_PROFILE: ${CONSUMER_PROFILE:-prod}
      FAILURE_STRATEGY: ${FAILURE_STRATEGY:-dead-letter-queue}
      RETRY_MAX: ${RETRY_MAX:-8}
      MAX_POLL_INTERVAL_MS: ${MAX_POLL_INTERVAL_MS:-300000}
      CAMEL_DEAD_LETTER_CHANNEL: ${CAMEL_DEAD_LETTER_CHANNEL:-true}
      CAMEL_BREAK_ON_FIRST_ERROR: ${CAMEL_BREAK_ON_FIRST_ERROR:-false}
    depends_on:
      topics-init:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      lgtm:
        condition: service_healthy
    mem_limit: 384m
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:8080/q/health/ready"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 15s
    networks: [edp]

networks:
  edp:
    name: edp

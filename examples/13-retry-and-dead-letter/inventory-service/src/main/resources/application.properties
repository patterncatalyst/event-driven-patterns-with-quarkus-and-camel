quarkus.application.name=inventory-service

# Flyway owns the inventory schema; Hibernate creates nothing and validates its mapping against it at boot.
quarkus.flyway.migrate-at-start=true
quarkus.flyway.schemas=inventory
quarkus.hibernate-orm.database.default-schema=inventory
quarkus.hibernate-orm.schema-management.strategy=validate
quarkus.datasource.db-kind=postgresql
quarkus.datasource.devservices.image-name=docker.io/library/postgres:18.6

# How often a transient failure is retried, for both consumers. @Retry takes it from the config key of the method.
retry.max=${RETRY_MAX:8}
com.patterncatalyst.shipping.deadletter.OrderPlacedConsumer/on/Retry/maxRetries=${retry.max}

# The SmallRye path. The value is read as bytes and parsed in the method. failure-strategy: dead-letter-queue
# (default here), fail or ignore. The dead letter keeps the key as text and the value as the original bytes.
mp.messaging.incoming.orders-placed.connector=smallrye-kafka
mp.messaging.incoming.orders-placed.topic=edp.orders.placed
mp.messaging.incoming.orders-placed.group.id=inventory-smallrye
mp.messaging.incoming.orders-placed.auto.offset.reset=earliest
mp.messaging.incoming.orders-placed.key.deserializer=org.apache.kafka.common.serialization.StringDeserializer
mp.messaging.incoming.orders-placed.value.deserializer=org.apache.kafka.common.serialization.ByteArrayDeserializer
mp.messaging.incoming.orders-placed.failure-strategy=${FAILURE_STRATEGY:dead-letter-queue}
mp.messaging.incoming.orders-placed.dead-letter-queue.topic=edp.orders.placed-dlq
mp.messaging.incoming.orders-placed.dead-letter-queue.key.serializer=org.apache.kafka.common.serialization.StringSerializer
mp.messaging.incoming.orders-placed.dead-letter-queue.value.serializer=org.apache.kafka.common.serialization.ByteArraySerializer
# A restarted consumer waits for the previous member's session to expire before it is assigned its partition.
mp.messaging.incoming.orders-placed.session.timeout.ms=10000
mp.messaging.incoming.orders-placed.max.poll.interval.ms=${max-poll-interval-ms}
max-poll-interval-ms=${MAX_POLL_INTERVAL_MS:300000}

# The Camel path (profile camel) replaces the SmallRye channel with the route. The two knobs below only serve
# the experiments: dead-letter-channel=false leaves Camel's default error handler, break-on-first-error=true
# re-polls a failed record instead of moving on.
dead-letter.camel.enabled=false
dead-letter.camel.dead-letter-channel=${CAMEL_DEAD_LETTER_CHANNEL:true}
dead-letter.camel.break-on-first-error=${CAMEL_BREAK_ON_FIRST_ERROR:false}
%camel.dead-letter.camel.enabled=true
%camel.mp.messaging.incoming.orders-placed.enabled=false

# Traces, metrics and logs leave over OTLP. The endpoint comes from QUARKUS_OTEL_EXPORTER_OTLP_ENDPOINT.
quarkus.otel.logs.enabled=true
quarkus.otel.metric.export.interval=5s
quarkus.otel.exporter.otlp.protocol=http/protobuf
quarkus.otel.bsp.schedule.delay=1s
quarkus.otel.blrp.schedule.delay=1s

# Kafka Dev Services runs the same broker image as the compose stack.
quarkus.kafka.devservices.image-name=docker.io/apache/kafka:4.3.2
%test.quarkus.otel.sdk.disabled=true

# Compose supplies QUARKUS_DATASOURCE_JDBC_URL, QUARKUS_DATASOURCE_USERNAME, QUARKUS_DATASOURCE_PASSWORD,
# KAFKA_BOOTSTRAP_SERVERS and CAMEL_COMPONENT_KAFKA_BROKERS.

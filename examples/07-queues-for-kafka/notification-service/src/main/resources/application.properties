quarkus.application.name=notification-service

# The replica name is the container hostname. It is the Kafka client id and the worker column of the log.
delivery.worker=${HOSTNAME:local}

# The email stand-in: every send takes base-ms; a C-SLOW customer takes slow-ms.
delivery.gateway.base-ms=${GATEWAY_BASE_MS:50}
delivery.gateway.slow-ms=${GATEWAY_SLOW_MS:8000}

# DELIVERY_MODE=share (default) reads through a share group. DELIVERY_MODE=group sets the group profile,
# which turns the SmallRye channel off and starts the Camel consumer-group route instead.
delivery.group.enabled=false
%group.delivery.group.enabled=true
%group.mp.messaging.incoming.delivery-jobs.enabled=false

# The share group. Its settings live on the group, not on the consumer; see compose.yaml (topics-init).
mp.messaging.incoming.delivery-jobs.connector=smallrye-kafka
mp.messaging.incoming.delivery-jobs.topic=edp.orders.placed
mp.messaging.incoming.delivery-jobs.group.id=notification-share
mp.messaging.incoming.delivery-jobs.client.id=${delivery.worker}
mp.messaging.incoming.delivery-jobs.share-group.enabled=true
mp.messaging.incoming.delivery-jobs.key.deserializer=org.apache.kafka.common.serialization.StringDeserializer
mp.messaging.incoming.delivery-jobs.value.deserializer=com.patterncatalyst.shipping.queues.DeliveryJobDeserializer
# One job per poll, and a fetch that returns as little as the log allows: a worker acquires only the records
# of the batch it fetched, so a slow job holds back little besides itself.
mp.messaging.incoming.delivery-jobs.share.acquire.mode=${SHARE_ACQUIRE_MODE:batch_optimized}
mp.messaging.incoming.delivery-jobs.max.poll.records=${MAX_POLL_RECORDS:1}
mp.messaging.incoming.delivery-jobs.max.partition.fetch.bytes=${MAX_PARTITION_FETCH_BYTES:1}

# Flyway owns the schema; the table lives in the notifications schema of the edp database.
quarkus.flyway.migrate-at-start=true
quarkus.flyway.schemas=notifications
quarkus.hibernate-orm.database.default-schema=notifications
quarkus.datasource.db-kind=postgresql
quarkus.datasource.devservices.image-name=docker.io/library/postgres:18.6

# The consumer-group route starts a new group at the beginning of the topic, unless the stack says otherwise.
camel.component.kafka.auto-offset-reset=${GROUP_OFFSET_RESET:earliest}

# Traces, metrics and logs leave over OTLP. The endpoint comes from QUARKUS_OTEL_EXPORTER_OTLP_ENDPOINT.
quarkus.otel.logs.enabled=true
quarkus.otel.exporter.otlp.protocol=http/protobuf
quarkus.otel.metric.export.interval=5s
quarkus.otel.bsp.schedule.delay=1s
quarkus.otel.blrp.schedule.delay=1s

# Kafka Dev Services runs the compose broker image, with the share protocol on and a single-broker share state topic.
quarkus.kafka.devservices.image-name=docker.io/apache/kafka:4.3.2
quarkus.kafka.devservices.topic-partitions."edp.orders.placed"=3
quarkus.kafka.devservices.container-env."KAFKA_GROUP_COORDINATOR_REBALANCE_PROTOCOLS"=classic,consumer,streams,share
quarkus.kafka.devservices.container-env."KAFKA_SHARE_COORDINATOR_STATE_TOPIC_REPLICATION_FACTOR"=1
quarkus.kafka.devservices.container-env."KAFKA_SHARE_COORDINATOR_STATE_TOPIC_MIN_ISR"=1
# Tests lower the broker's minimum record lock so a lock can be made to expire in seconds.
quarkus.kafka.devservices.container-env."KAFKA_GROUP_SHARE_MIN_RECORD_LOCK_DURATION_MS"=1000

%test.quarkus.otel.sdk.disabled=true
%test.delivery.gateway.base-ms=10
%test.delivery.gateway.slow-ms=300

# Chapter 06 notification-service, unchanged image. Group, protocol and client id come from the environment it
# already reads (NOTIFY_GROUP, GROUP_PROTOCOL, HOSTNAME). Telemetry is off: this overlay has no LGTM.
# verify.sh changes the strategy, NOTIFY_GROUP and GROUP_PROTOCOL between scenarios with kubectl patch and set env.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: notify-blue
  labels: {app: notify, color: blue}
spec:
  replicas: 3
  selector:
    matchLabels: {app: notify, color: blue}
  strategy:
    type: Recreate
  template:
    metadata:
      labels: {app: notify, color: blue}
    spec:
      containers:
        - name: app
          image: localhost/edp/06-notification-service:local
          imagePullPolicy: Never
          ports: [{name: http, containerPort: 8080}]
          env:
            - {name: CAMEL_COMPONENT_KAFKA_BROKERS, value: "edp-kafka-bootstrap.edp-kafka.svc:9092"}
            - {name: QUARKUS_OTEL_SDK_DISABLED, value: "true"}
            - {name: QUARKUS_DATASOURCE_JDBC_URL, value: "jdbc:postgresql://edp-pg-rw.edp.svc:5432/edp"}
            - name: QUARKUS_DATASOURCE_USERNAME
              valueFrom: {secretKeyRef: {name: edp-pg-app, key: username}}
            - name: QUARKUS_DATASOURCE_PASSWORD
              valueFrom: {secretKeyRef: {name: edp-pg-app, key: password}}
            - {name: NOTIFY_GROUP, value: "notify-stop"}
            - {name: GROUP_PROTOCOL, value: "classic"}
          readinessProbe:
            httpGet: {path: /q/health/ready, port: 8080}
            periodSeconds: 3
            failureThreshold: 30
          livenessProbe:
            httpGet: {path: /q/health/live, port: 8080}
            periodSeconds: 10
            initialDelaySeconds: 20
          resources:
            requests: {memory: 256Mi}
            limits: {memory: 384Mi}

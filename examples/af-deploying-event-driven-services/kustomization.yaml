# Deployment appendix: the shared platform without LGTM, and the notification-service and the
# order-service deployed unchanged. Producer Jobs are applied by verify.sh from tools/producer-job.yaml.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../_k8s/namespaces
  - ../_k8s/strimzi
  - ../_k8s/kafka
  - ../_k8s/postgres
  - apps

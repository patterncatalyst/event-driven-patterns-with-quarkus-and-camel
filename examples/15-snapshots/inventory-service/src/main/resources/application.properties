quarkus.application.name=inventory-service

# Flyway owns the inventory schema; Hibernate creates nothing and validates its mapping against it at boot.
quarkus.flyway.migrate-at-start=true
quarkus.flyway.schemas=inventory
quarkus.hibernate-orm.database.default-schema=inventory
quarkus.hibernate-orm.schema-management.strategy=validate
# The JSON columns are mapped with the application's Jackson mapper and its polymorphic annotations.
quarkus.hibernate-orm.mapping.format.global=ignore
quarkus.datasource.db-kind=postgresql
quarkus.datasource.devservices.image-name=docker.io/library/postgres:18.6

# Snapshot policy: a command writes a snapshot in its own transaction once this many events follow the last one.
# 0 disables snapshots. The schema is the version of the snapshot record: raise it when the record changes meaning,
# and every stored snapshot with another value is ignored and rebuilt from the events. guard=false is a demo switch that removes the version guard from the upsert.
inventory.snapshot.every=${SNAPSHOT_EVERY:100}
inventory.snapshot.inline=true
inventory.snapshot.schema=${SNAPSHOT_SCHEMA:1}
inventory.snapshot.guard=${SNAPSHOT_GUARD:true}

# The comparison: the Camel snapshotter writes the snapshots and the commands do not (profile camel-snapshotter).
inventory.snapshotter.enabled=false
inventory.snapshotter.delay-ms=${SNAPSHOTTER_DELAY_MS:1000}
%camel-snapshotter.inventory.snapshotter.enabled=true
%camel-snapshotter.inventory.snapshot.inline=false

# Demo switch: entities reads the replay as managed entities instead of a projection.
inventory.demo.fetch=${INVENTORY_FETCH:projection}

# Traces, metrics and logs leave over OTLP. The endpoint comes from QUARKUS_OTEL_EXPORTER_OTLP_ENDPOINT.
quarkus.otel.logs.enabled=true
quarkus.otel.metric.export.interval=5s
quarkus.otel.exporter.otlp.protocol=http/protobuf
quarkus.otel.bsp.schedule.delay=1s
quarkus.otel.blrp.schedule.delay=1s
%test.quarkus.otel.sdk.disabled=true

# Compose supplies QUARKUS_DATASOURCE_JDBC_URL, QUARKUS_DATASOURCE_USERNAME and QUARKUS_DATASOURCE_PASSWORD.

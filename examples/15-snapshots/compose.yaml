name: edp-15

# PostgreSQL and the LGTM stack only: no Kafka, the pattern needs a database and nothing else.
include:
  - path: ../_infra/compose-postgres.yaml
  - path: ../_infra/compose-lgtm.yaml

services:
  inventory-service:
    build:
      context: .
      dockerfile: inventory-service/Containerfile
    container_name: edp-inventory-service
    ports:
      - "8080:8080"
    environment:
      QUARKUS_DATASOURCE_JDBC_URL: jdbc:postgresql://postgres:5432/edp
      QUARKUS_DATASOURCE_USERNAME: edp
      QUARKUS_DATASOURCE_PASSWORD: edp
      QUARKUS_OTEL_EXPORTER_OTLP_ENDPOINT: http://lgtm:4318
      # prod (default) writes snapshots in the command; camel-snapshotter leaves them to the Camel route.
      QUARKUS_PROFILE: ${APP_PROFILE:-prod}
      SNAPSHOT_EVERY: ${SNAPSHOT_EVERY:-100}
      SNAPSHOT_SCHEMA: ${SNAPSHOT_SCHEMA:-1}
      SNAPSHOT_GUARD: ${SNAPSHOT_GUARD:-true}
      SNAPSHOTTER_DELAY_MS: ${SNAPSHOTTER_DELAY_MS:-1000}
      INVENTORY_FETCH: ${INVENTORY_FETCH:-projection}
      JAVA_OPTS_APPEND: "-Dquarkus.http.host=0.0.0.0 -Djava.util.logging.manager=org.jboss.logmanager.LogManager ${EXTRA_JAVA_OPTS:-}"
    depends_on:
      postgres:
        condition: service_healthy
      lgtm:
        condition: service_healthy
    mem_limit: 512m
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:8080/q/health/ready"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 15s
    networks: [edp]

networks:
  edp:
    name: edp

quarkus.application.name=notification-service

# The source of the facts a notification is built from. In a test the stub in src/test answers on the test port.
order-service.url=http://localhost:8080
quarkus.http.test-port=8183
%test.order-service.url=http://localhost:8183

# Camel reads camel.component.kafka.brokers, not kafka.bootstrap.servers; Kafka Dev Services fills the second in test.
%test.camel.component.kafka.brokers=${kafka.bootstrap.servers}
camel.component.kafka.auto-offset-reset=earliest

# Kafka Dev Services runs the same broker image as the compose stack. One partition per topic keeps the order of the
# records of one test exact.
quarkus.kafka.devservices.image-name=docker.io/apache/kafka:4.3.2
quarkus.kafka.devservices.topic-partitions.edp.orders.placed=1
quarkus.kafka.devservices.topic-partitions.edp.orders.notified=1

quarkus.application.name=inventory-service

# Flyway owns the inventory schema; Hibernate reads and writes the same schema, creates nothing and validates its
# mapping against it at boot. That includes the table of Camel's JPA id repository.
quarkus.flyway.migrate-at-start=true
quarkus.flyway.schemas=inventory
quarkus.hibernate-orm.database.default-schema=inventory
quarkus.hibernate-orm.schema-management.strategy=validate
quarkus.datasource.db-kind=postgresql
quarkus.datasource.devservices.image-name=docker.io/library/postgres:18.6
quarkus.datasource.jdbc.telemetry=true

# The inbox consumer. A restarted member waits for the dead one's session to expire, so the demo shortens it.
mp.messaging.incoming.orders-placed.connector=smallrye-kafka
mp.messaging.incoming.orders-placed.topic=edp.orders.placed
mp.messaging.incoming.orders-placed.group.id=${INVENTORY_GROUP:inventory-inbox}
mp.messaging.incoming.orders-placed.auto.offset.reset=earliest
mp.messaging.incoming.orders-placed.session.timeout.ms=10000
mp.messaging.incoming.orders-placed.key.deserializer=org.apache.kafka.common.serialization.StringDeserializer
mp.messaging.incoming.orders-placed.value.deserializer=com.patterncatalyst.shipping.inbox.OrderPlacedDeserializer

# The Camel repository route replaces the inbox consumer when the camel-repository profile is on
# (QUARKUS_PROFILE=camel-repository).
inventory.camel.enabled=false
%camel-repository.inventory.camel.enabled=true
%camel-repository.mp.messaging.incoming.orders-placed.enabled=false

# Demo code: the order ids for which the JVM stops right after the commit (DEMO_CRASH_AFTER_COMMIT_FOR) or the
# reservation fails after the decrement (DEMO_FAIL_AFTER_EFFECT_FOR), the inbox switch (DEMO_INBOX_ENABLED) and
# whether the Camel route is transacted (INVENTORY_CAMEL_TRANSACTED).

# Kafka Dev Services runs the same broker image as the compose stack.
quarkus.kafka.devservices.image-name=docker.io/apache/kafka:4.3.2

# Traces, metrics and logs leave over OTLP. The endpoint comes from QUARKUS_OTEL_EXPORTER_OTLP_ENDPOINT.
quarkus.otel.logs.enabled=true
quarkus.otel.metric.export.interval=5s
quarkus.otel.exporter.otlp.protocol=http/protobuf
quarkus.otel.bsp.schedule.delay=1s
quarkus.otel.blrp.schedule.delay=1s

# Tests start no collector, so the OpenTelemetry SDK stays off.
%test.quarkus.otel.sdk.disabled=true

# Compose supplies QUARKUS_DATASOURCE_JDBC_URL, QUARKUS_DATASOURCE_USERNAME, QUARKUS_DATASOURCE_PASSWORD,
# CAMEL_COMPONENT_KAFKA_BROKERS and KAFKA_BOOTSTRAP_SERVERS.

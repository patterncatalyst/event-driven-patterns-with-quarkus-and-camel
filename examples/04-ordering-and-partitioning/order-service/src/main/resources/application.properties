quarkus.application.name=order-service

# The replica name is the container hostname; it is also the Kafka client id, so the consumer group
# listing shows which replica owns which partition.
order.replica=${HOSTNAME:local}
order.group=${ORDER_CONSUMER_GROUP:order-service}

# RESEQUENCE=true holds each event in the database until its per-order sequence number is next.
order.resequence=${RESEQUENCE:false}

# Flyway owns the schema; the tables live in the orders schema.
quarkus.flyway.migrate-at-start=true
quarkus.flyway.schemas=orders
quarkus.hibernate-orm.database.default-schema=orders
quarkus.datasource.db-kind=postgresql
quarkus.datasource.devservices.image-name=docker.io/library/postgres:18.6

# A new group reads the stream from the start.
camel.component.kafka.auto-offset-reset=earliest

# Traces, metrics and logs leave over OTLP. The endpoint comes from QUARKUS_OTEL_EXPORTER_OTLP_ENDPOINT.
quarkus.otel.exporter.otlp.protocol=http/protobuf
quarkus.otel.metric.export.interval=5s
quarkus.otel.bsp.schedule.delay=1s
quarkus.otel.blrp.schedule.delay=1s

quarkus.kafka.devservices.image-name=docker.io/apache/kafka:4.3.2
quarkus.kafka.devservices.topic-partitions."edp.shipping.shipments"=3

%test.quarkus.otel.sdk.disabled=true

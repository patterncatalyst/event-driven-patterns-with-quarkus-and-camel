quarkus.application.name=inventory-service

# Flyway owns the inventory schema; Hibernate reads and writes the same schema.
quarkus.flyway.migrate-at-start=true
quarkus.flyway.schemas=inventory
quarkus.flyway.create-schemas=true
quarkus.hibernate-orm.database.default-schema=inventory
quarkus.datasource.db-kind=postgresql
quarkus.datasource.devservices.image-name=docker.io/library/postgres:18.6
quarkus.datasource.jdbc.telemetry=true

# The commands are read by one Camel route. A restarted member waits for the dead one's session to expire, so the
# demo shortens it.
camel.component.kafka.auto-offset-reset=earliest
camel.component.kafka.session-timeout-ms=10000
camel.component.kafka.heartbeat-interval-ms=3000

# The saga participant: the coordinator calls this service back at its own URL, and signs the callbacks with a
# shared secret. The environment names are not CAMEL_LRA_*, which Camel Main would read as its own properties.
camel.lra.coordinator-url=${LRA_COORDINATOR_URL:http://localhost:8091}
camel.lra.local-participant-url=${LRA_PARTICIPANT_URL:http://localhost:8080}
camel.lra.callback-secret=${LRA_CALLBACK_SECRET:edp-callback-secret}

# In prod the brokers come from the environment (CAMEL_COMPONENT_KAFKA_BROKERS); Dev Services fills them in test.
%test.camel.component.kafka.brokers=${kafka.bootstrap.servers}
# Tests run without a coordinator: a blank URL switches the LRA service off and the test sources add Camel's
# in-memory saga service.
%test.camel.lra.coordinator-url=
%test.camel.lra.local-participant-url=
%test.camel.lra.callback-secret=

# Kafka Dev Services runs the broker image of the compose stack, with the one-partition topics compose creates.
quarkus.kafka.devservices.image-name=docker.io/apache/kafka:4.3.2
quarkus.kafka.devservices.topic-partitions.edp.inventory.commands=1
quarkus.kafka.devservices.topic-partitions.edp.inventory.reserved=1
quarkus.kafka.devservices.topic-partitions.edp.inventory.insufficient=1

# Traces, metrics and logs leave over OTLP. The endpoint comes from QUARKUS_OTEL_EXPORTER_OTLP_ENDPOINT.
quarkus.otel.logs.enabled=true
quarkus.otel.metric.export.interval=5s
quarkus.otel.exporter.otlp.protocol=http/protobuf
quarkus.otel.bsp.schedule.delay=1s
quarkus.otel.blrp.schedule.delay=1s
%test.quarkus.otel.sdk.disabled=true

# Compose supplies QUARKUS_DATASOURCE_*, CAMEL_COMPONENT_KAFKA_BROKERS, LRA_COORDINATOR_URL, LRA_PARTICIPANT_URL and
# LRA_CALLBACK_SECRET.

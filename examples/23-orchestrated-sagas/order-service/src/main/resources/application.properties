quarkus.application.name=order-service

# Flyway owns the orders schema, and runs Flow's migration from its own location besides this service's. Hibernate
# reads and writes the same schema; Flow's tables are named in snake case by the naming strategy below.
quarkus.flyway.migrate-at-start=true
quarkus.flyway.schemas=orders
quarkus.flyway.create-schemas=true
quarkus.flyway.locations=db/migration,db/flow-migration/runtime/postgresql
quarkus.hibernate-orm.database.default-schema=orders
quarkus.hibernate-orm.physical-naming-strategy=org.hibernate.boot.model.naming.CamelCaseToUnderscoresNamingStrategy
quarkus.datasource.db-kind=postgresql
quarkus.datasource.devservices.image-name=docker.io/library/postgres:18.6
quarkus.datasource.jdbc.telemetry=true

# The time limit of a saga, ISO 8601, for both orchestrators: the coordinator cancels the Camel saga after it, and
# the workflow's listen task times out after it. Demo code: SAGA_TIMEOUT changes it.
saga.timeout=${SAGA_TIMEOUT:PT20S}

# Demo code: FLOW_COMPENSATION=off removes the refund and the release from the workflow's compensation.
flow.compensation=${FLOW_COMPENSATION:on}

# Camel: the replies route and the commands the Camel orchestrator sends.
camel.component.kafka.auto-offset-reset=earliest
camel.component.kafka.session-timeout-ms=10000
camel.component.kafka.heartbeat-interval-ms=3000

# The saga coordinator and this service's own URL, which the coordinator calls back; the callbacks are signed with a
# shared secret. The environment names are not CAMEL_LRA_*, which Camel Main would read as its own properties.
camel.lra.coordinator-url=${LRA_COORDINATOR_URL:http://localhost:8091}
camel.lra.local-participant-url=${LRA_PARTICIPANT_URL:http://localhost:8080}
camel.lra.callback-secret=${LRA_CALLBACK_SECRET:edp-callback-secret}

# Quarkus Flow: the messaging bridge reads the four reply topics as CloudEvents and wakes the instance named in the
# flowinstanceid attribute. The two outgoing channels are required once the defaults are on; no task emits on them.
# Instances persist to PostgreSQL through Hibernate and restore at start.
quarkus.flow.messaging.defaults-enabled=true
quarkus.flow.persistence.auto-restore=true
# Demo code: QUARKUS_FLOW_PERSISTENCE_SCAN_INTERVAL (compose passes FLOW_SCAN_INTERVAL) adds a periodic rescan of the
# store for instances this process does not hold; it is unset by default.
quarkus.flow.metrics.enabled=true
mp.messaging.incoming.flow-in.connector=smallrye-kafka
mp.messaging.incoming.flow-in.topics=edp.inventory.reserved,edp.inventory.insufficient,edp.payments.processed,edp.payments.failed
mp.messaging.incoming.flow-in.group.id=order-service-flow
mp.messaging.incoming.flow-in.auto.offset.reset=earliest
mp.messaging.incoming.flow-in.key.deserializer=org.apache.kafka.common.serialization.StringDeserializer
mp.messaging.incoming.flow-in.value.deserializer=org.apache.kafka.common.serialization.StringDeserializer
mp.messaging.incoming.flow-in.failure-strategy=ignore
mp.messaging.incoming.flow-in.session.timeout.ms=10000
mp.messaging.incoming.flow-in.heartbeat.interval.ms=3000
mp.messaging.outgoing.flow-out.connector=smallrye-kafka
mp.messaging.outgoing.flow-out.value.serializer=org.apache.kafka.common.serialization.StringSerializer
mp.messaging.outgoing.flow-lifecycle-out.connector=smallrye-kafka
mp.messaging.outgoing.flow-lifecycle-out.value.serializer=org.apache.kafka.common.serialization.StringSerializer

# The commands the workflow sends.
mp.messaging.outgoing.inventory-commands.connector=smallrye-kafka
mp.messaging.outgoing.inventory-commands.topic=edp.inventory.commands
mp.messaging.outgoing.inventory-commands.key.serializer=org.apache.kafka.common.serialization.StringSerializer
mp.messaging.outgoing.inventory-commands.value.serializer=org.apache.kafka.common.serialization.StringSerializer
mp.messaging.outgoing.payment-commands.connector=smallrye-kafka
mp.messaging.outgoing.payment-commands.topic=edp.payments.commands
mp.messaging.outgoing.payment-commands.key.serializer=org.apache.kafka.common.serialization.StringSerializer
mp.messaging.outgoing.payment-commands.value.serializer=org.apache.kafka.common.serialization.StringSerializer

# In prod the brokers come from the environment (KAFKA_BOOTSTRAP_SERVERS for SmallRye and Flow, CAMEL_COMPONENT_KAFKA_BROKERS
# for Camel); Dev Services fills them in test.
%prod.kafka.bootstrap.servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
%test.camel.component.kafka.brokers=${kafka.bootstrap.servers}
%test.quarkus.flow.messaging.devservices-messaging-enabled=false
%test.saga.timeout=PT3S
%test.camel.lra.coordinator-url=
%test.camel.lra.local-participant-url=
%test.camel.lra.callback-secret=

# Kafka Dev Services runs the broker image of the compose stack, with the one-partition topics compose creates.
quarkus.kafka.devservices.image-name=docker.io/apache/kafka:4.3.2
quarkus.kafka.devservices.topic-partitions.edp.inventory.commands=1
quarkus.kafka.devservices.topic-partitions.edp.payments.commands=1
quarkus.kafka.devservices.topic-partitions.edp.inventory.reserved=1
quarkus.kafka.devservices.topic-partitions.edp.inventory.insufficient=1
quarkus.kafka.devservices.topic-partitions.edp.payments.processed=1
quarkus.kafka.devservices.topic-partitions.edp.payments.failed=1
quarkus.kafka.devservices.topic-partitions.edp.orders.cancelled=1

# Traces, metrics and logs leave over OTLP. The endpoint comes from QUARKUS_OTEL_EXPORTER_OTLP_ENDPOINT.
quarkus.otel.logs.enabled=true
quarkus.otel.metric.export.interval=5s
quarkus.otel.exporter.otlp.protocol=http/protobuf
quarkus.otel.bsp.schedule.delay=1s
quarkus.otel.blrp.schedule.delay=1s
%test.quarkus.otel.sdk.disabled=true

# Compose supplies QUARKUS_DATASOURCE_*, KAFKA_BOOTSTRAP_SERVERS, CAMEL_COMPONENT_KAFKA_BROKERS, LRA_COORDINATOR_URL,
# LRA_PARTICIPANT_URL and LRA_CALLBACK_SECRET.

name: edp-23

include:
  - path: ../_infra/compose-kafka.yaml
  - path: ../_infra/compose-postgres.yaml
  - path: ../_infra/compose-lgtm.yaml
  - path: ../_infra/compose-lra.yaml

x-service: &service
  depends_on:
    topics-init:
      condition: service_completed_successfully
    postgres:
      condition: service_healthy
    lgtm:
      condition: service_healthy
    lra-coordinator:
      condition: service_healthy
  mem_limit: 384m
  healthcheck:
    test: ["CMD", "curl", "-sf", "http://localhost:8080/q/health/ready"]
    interval: 5s
    timeout: 3s
    retries: 20
    start_period: 15s
  networks: [edp]

x-environment: &environment
  CAMEL_COMPONENT_KAFKA_BROKERS: kafka:9094
  KAFKA_BOOTSTRAP_SERVERS: kafka:9094
  QUARKUS_DATASOURCE_JDBC_URL: jdbc:postgresql://postgres:5432/edp
  QUARKUS_DATASOURCE_USERNAME: edp
  QUARKUS_DATASOURCE_PASSWORD: edp
  QUARKUS_OTEL_EXPORTER_OTLP_ENDPOINT: http://lgtm:4318
  LRA_COORDINATOR_URL: http://lra-coordinator:8080
  LRA_CALLBACK_SECRET: edp-callback-secret

services:
  # Creates the topics, one partition each, then exits. One partition per topic keeps the commands of one order in
  # the order they were sent: a refund sent after a payment is read after it.
  topics-init:
    image: docker.io/apache/kafka:4.3.2
    container_name: edp-topics-init
    depends_on:
      kafka:
        condition: service_healthy
    entrypoint: ["/bin/bash", "-c"]
    command:
      - |
        for t in edp.inventory.commands edp.payments.commands edp.inventory.reserved edp.inventory.insufficient \
                 edp.payments.processed edp.payments.failed edp.orders.cancelled; do
          /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9094 --create --if-not-exists --topic $$t --partitions 1 --replication-factor 1
        done
    restart: "no"
    mem_limit: 512m
    networks: [edp]

  order-service:
    <<: *service
    build:
      context: ..
      dockerfile: 23-orchestrated-sagas/order-service/Containerfile
    container_name: edp-order-service
    ports:
      - "8080:8080"
    environment:
      <<: *environment
      LRA_PARTICIPANT_URL: http://order-service:8080
      # Both orchestrators give a saga this long. Demo code: SAGA_TIMEOUT changes it (ISO 8601).
      SAGA_TIMEOUT: ${SAGA_TIMEOUT:-PT20S}
      # Demo code: FLOW_COMPENSATION=off removes the refund and the release from the workflow's compensation.
      FLOW_COMPENSATION: ${FLOW_COMPENSATION:-on}
      # Demo code: a periodic rescan of the workflow store for instances this process does not hold.
      QUARKUS_FLOW_PERSISTENCE_SCAN_INTERVAL: ${FLOW_SCAN_INTERVAL:-}

  inventory-service:
    <<: *service
    build:
      context: ..
      dockerfile: 23-orchestrated-sagas/inventory-service/Containerfile
    container_name: edp-inventory-service
    ports:
      - "8082:8080"
    environment:
      <<: *environment
      LRA_PARTICIPANT_URL: http://inventory-service:8080

  payment-service:
    <<: *service
    build:
      context: ..
      dockerfile: 23-orchestrated-sagas/payment-service/Containerfile
    container_name: edp-payment-service
    ports:
      - "8084:8080"
    environment:
      <<: *environment
      LRA_PARTICIPANT_URL: http://payment-service:8080
      # Demo code: an amount above this is declined, and PAYMENT_JOIN=off runs TakePayment outside any saga.
      PAYMENT_DECLINE_ABOVE: ${PAYMENT_DECLINE_ABOVE:-500.00}
      PAYMENT_JOIN: ${PAYMENT_JOIN:-on}

networks:
  edp:
    name: edp

# Example 32: the example 02 pair on Kafka with the Strimzi Metrics Reporter on brokers and controllers, a
# collector that scrapes them and the operator, and kube-state-metrics for the state of the custom resources.
# Both are Components of ../_k8s, so that the demo overlay can leave the reporter out and keep the monitoring.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - base
components:
  - ../_k8s/monitoring
  - ../_k8s/kafka-metrics

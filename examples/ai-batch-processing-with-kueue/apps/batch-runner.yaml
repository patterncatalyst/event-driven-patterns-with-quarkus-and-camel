# The runner is a plain Deployment, never admitted by Kueue. The ConfigMap ai-demo-faults does not exist until
# verify.sh creates it; the demo switches QUEUE, REPLAY_GUARD, PRIORITY and FAIL_POLICY are added to this Deployment by
# verify.sh and are absent (every guard on) otherwise.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: batch-runner
  labels: {app: batch-runner}
spec:
  replicas: 1
  strategy: {type: Recreate}
  selector:
    matchLabels: {app: batch-runner}
  template:
    metadata:
      labels: {app: batch-runner}
    spec:
      serviceAccountName: batch-runner
      containers:
        - name: app
          image: localhost/edp/ai-batch-runner:local
          imagePullPolicy: Never
          ports:
            - {name: http, containerPort: 8080}
          env:
            - name: POD_NAMESPACE
              valueFrom: {fieldRef: {fieldPath: metadata.namespace}}
            - {name: KAFKA_BOOTSTRAP_SERVERS, value: "edp-kafka-bootstrap.edp-kafka.svc:9092"}
            - {name: QUARKUS_DATASOURCE_JDBC_URL, value: "jdbc:postgresql://edp-pg-rw.edp.svc:5432/edp"}
            - name: QUARKUS_DATASOURCE_USERNAME
              valueFrom: {secretKeyRef: {name: edp-pg-app, key: username}}
            - name: QUARKUS_DATASOURCE_PASSWORD
              valueFrom: {secretKeyRef: {name: edp-pg-app, key: password}}
            - {name: QUARKUS_OTEL_EXPORTER_OTLP_ENDPOINT, value: "http://lgtm.edp-lgtm.svc:4318"}
          readinessProbe:
            httpGet: {path: /q/health/ready, port: 8080}
            periodSeconds: 5
            failureThreshold: 36
          livenessProbe:
            httpGet: {path: /q/health/live, port: 8080}
            periodSeconds: 10
            initialDelaySeconds: 30
          resources:
            requests: {memory: 384Mi}
            limits: {memory: 640Mi}
---
apiVersion: v1
kind: Service
metadata:
  name: batch-runner
  labels: {app: batch-runner}
spec:
  type: NodePort
  selector: {app: batch-runner}
  ports:
    - {name: http, port: 8080, targetPort: 8080, nodePort: 30080}

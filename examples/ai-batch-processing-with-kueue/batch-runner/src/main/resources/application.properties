quarkus.application.name=ai-batch-runner

# Flyway owns the reconciliation schema; Hibernate reads and writes it, creates nothing and validates its mapping at boot.
quarkus.flyway.migrate-at-start=true
quarkus.flyway.schemas=reconciliation
quarkus.hibernate-orm.database.default-schema=reconciliation
quarkus.hibernate-orm.schema-management.strategy=validate
quarkus.datasource.db-kind=postgresql
quarkus.datasource.devservices.image-name=docker.io/library/postgres:18.6

# Where the Jobs go and what they run.
batch.namespace=${POD_NAMESPACE:edp}
batch.worker-image=${BATCH_WORKER_IMAGE:localhost/edp/ai-batch-worker:local}
batch.queue-name=reconciliation
reconcile.tick=2000

# Demo code, set in the environment of the runner. QUEUE=off leaves the queue label off every Job, PRIORITY=off leaves the
# priority label off, FAIL_POLICY=off omits the pod failure policy, REPLAY_GUARD=off is passed to the workers.
batch.queue=${QUEUE:on}
batch.priority=${PRIORITY:on}
batch.fail-policy=${FAIL_POLICY:on}
batch.replay-guard=${REPLAY_GUARD:on}

# The demo faults the pods read at start, from an optional ConfigMap. Kafka, database and telemetry settings are copied
# from the runner's own environment (KAFKA_BOOTSTRAP_SERVERS, QUARKUS_DATASOURCE_*, QUARKUS_OTEL_EXPORTER_OTLP_ENDPOINT).
batch.faults-config-map=ai-demo-faults

quarkus.http.port=8080
%test.quarkus.http.test-port=8185

# Traces, metrics and logs leave over OTLP. The endpoint comes from QUARKUS_OTEL_EXPORTER_OTLP_ENDPOINT.
quarkus.otel.logs.enabled=true
quarkus.otel.metric.export.interval=5s
quarkus.otel.exporter.otlp.protocol=http/protobuf
quarkus.otel.bsp.schedule.delay=1s
quarkus.otel.blrp.schedule.delay=1s

# Tests start no collector, so the OpenTelemetry SDK stays off.
%test.quarkus.otel.sdk.disabled=true
%test.reconcile.tick=3600000

# Compose or the Deployment supplies QUARKUS_DATASOURCE_JDBC_URL, QUARKUS_DATASOURCE_USERNAME and QUARKUS_DATASOURCE_PASSWORD.

# The Jobs are faked in tests, so no Kubernetes API server Dev Service starts.
quarkus.kubernetes-client.devservices.enabled=false

# Camel's JSON data format uses the application's ObjectMapper, which knows java.time.
camel.dataformat.jackson.auto-discover-object-mapper=true

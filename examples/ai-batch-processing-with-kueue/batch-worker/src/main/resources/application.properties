quarkus.application.name=ai-batch-worker

# The runner owns the reconciliation schema through Flyway. The worker validates its mapping against it and creates nothing.
quarkus.hibernate-orm.database.default-schema=reconciliation
quarkus.hibernate-orm.schema-management.strategy=validate
quarkus.datasource.db-kind=postgresql
quarkus.datasource.devservices.image-name=docker.io/library/postgres:18.6
%test.quarkus.flyway.migrate-at-start=true
%test.quarkus.flyway.schemas=reconciliation

# The pod gets KAFKA_BOOTSTRAP_SERVERS (kafka.bootstrap.servers) and the datasource settings from the runner. Camel reads its own key.
camel.component.kafka.brokers=${kafka.bootstrap.servers}

# Kafka Dev Services runs the same broker image as the cluster; the input topics have three partitions, as in the cluster.
quarkus.kafka.devservices.image-name=docker.io/apache/kafka:4.3.2
quarkus.kafka.devservices.topic-partitions.edp.shipping.scheduled=3
quarkus.kafka.devservices.topic-partitions.edp.shipping.delivered=3
quarkus.kafka.devservices.topic-partitions.edp.shipping.reconciliations=1

# Traces, metrics and logs leave over OTLP when the pod ends; the delays are short because the pod lives seconds.
quarkus.otel.logs.enabled=true
quarkus.otel.exporter.otlp.protocol=http/protobuf
quarkus.otel.bsp.schedule.delay=500ms
quarkus.otel.blrp.schedule.delay=500ms
quarkus.otel.metrics.enabled=false

# Tests start no collector, so the OpenTelemetry SDK stays off.
%test.quarkus.otel.sdk.disabled=true

# Camel's JSON data format uses the application's ObjectMapper, which knows java.time.
camel.dataformat.jackson.auto-discover-object-mapper=true

# The step name on the command line is Picocli's; Camel's own argument parser leaves it alone.
quarkus.camel.main.arguments.on-unknown=ignore

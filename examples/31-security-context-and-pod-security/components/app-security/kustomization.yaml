# The security context of the two applications: the four fields Pod Security Admission requires for restricted,
# plus a read-only root filesystem with an emptyDir on /tmp. Only Deployments in edp are patched.
apiVersion: kustomize.config.k8s.io/v1alpha1
kind: Component
patches:
  - target: {kind: Deployment, namespace: edp}
    patch: |-
      - op: add
        path: /spec/template/spec/securityContext
        value:
          runAsNonRoot: true
          seccompProfile: {type: RuntimeDefault}
      - op: add
        path: /spec/template/spec/containers/0/securityContext
        value:
          allowPrivilegeEscalation: false
          capabilities: {drop: [ALL]}
          readOnlyRootFilesystem: true
      - op: add
        path: /spec/template/spec/containers/0/volumeMounts
        value: [{name: tmp, mountPath: /tmp}]
      - op: add
        path: /spec/template/spec/volumes
        value: [{name: tmp, emptyDir: {}}]

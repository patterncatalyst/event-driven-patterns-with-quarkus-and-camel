name: edp-06

include:
  - path: ../_infra/compose-kafka.yaml
  - path: ../_infra/compose-postgres.yaml
  - path: ../_infra/compose-lgtm.yaml

# Every consumer setting comes from the environment, so verify.sh and bench.sh change one setting
# per run without rebuilding. Each default is the Kafka (or Camel) default.
x-notification-env: &notification-env
  QUARKUS_DATASOURCE_JDBC_URL: jdbc:postgresql://postgres:5432/edp
  QUARKUS_DATASOURCE_USERNAME: edp
  QUARKUS_DATASOURCE_PASSWORD: edp
  CAMEL_COMPONENT_KAFKA_BROKERS: kafka:9094
  QUARKUS_OTEL_EXPORTER_OTLP_ENDPOINT: http://lgtm:4318
  # One consumer group per run: a new group reads the seeded backlog from the start.
  NOTIFY_GROUP: ${NOTIFY_GROUP:-notify-default}
  # A fixed cost per record, in milliseconds, standing in for template rendering.
  NOTIFY_WORK_MS: ${NOTIFY_WORK_MS:-0}
  MAX_POLL_RECORDS: ${MAX_POLL_RECORDS:-500}
  FETCH_MIN_BYTES: ${FETCH_MIN_BYTES:-1}
  FETCH_WAIT_MAX_MS: ${FETCH_WAIT_MAX_MS:-500}
  MAX_POLL_INTERVAL_MS: ${MAX_POLL_INTERVAL_MS:-300000}
  CONSUMERS_COUNT: ${CONSUMERS_COUNT:-1}
  # classic or consumer (the KIP-848 protocol)
  GROUP_PROTOCOL: ${GROUP_PROTOCOL:-classic}
  # Used only by the classic protocol.
  PARTITION_ASSIGNOR: ${PARTITION_ASSIGNOR:-org.apache.kafka.clients.consumer.RangeAssignor}

x-notification: &notification
  build:
    context: ..
    dockerfile: 06-optimizing-subscribers/notification-service/Containerfile
  mem_limit: 384m
  healthcheck:
    test: ["CMD", "curl", "-sf", "http://localhost:8080/q/health/ready"]
    interval: 5s
    timeout: 3s
    retries: 12
    start_period: 15s
  networks: [edp]

services:
  # Creates the three catalog topics with three partitions each, then exits.
  topics-init:
    image: docker.io/apache/kafka:4.3.2
    container_name: edp-topics-init
    depends_on:
      kafka:
        condition: service_healthy
    entrypoint: ["/bin/bash", "-c"]
    command:
      - |
        set -e
        for t in edp.orders.placed edp.payments.processed edp.shipping.scheduled; do
          /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9094 --create --if-not-exists --topic $$t --partitions 3 --replication-factor 1
        done
    restart: "no"
    mem_limit: 512m
    networks: [edp]

  # Writes SEED_RECORDS records to each topic in SEED_TOPICS with the stock Kafka perf tool, taking
  # payloads from seed/<topic>.jsonl, spread round-robin over the three partitions. SEED_THROUGHPUT is records per second (-1 is unthrottled).
  # Run with: docker compose run --rm seeder
  seeder:
    image: docker.io/apache/kafka:4.3.2
    container_name: edp-seeder
    profiles: [seed]
    depends_on:
      topics-init:
        condition: service_completed_successfully
    environment:
      SEED_RECORDS: ${SEED_RECORDS:-200}
      SEED_THROUGHPUT: ${SEED_THROUGHPUT:--1}
      SEED_TOPICS: ${SEED_TOPICS:-edp.orders.placed edp.payments.processed edp.shipping.scheduled}
    entrypoint: ["/bin/bash", "-c"]
    command:
      - |
        set -e
        for t in $$SEED_TOPICS; do
          /opt/kafka/bin/kafka-producer-perf-test.sh --topic $$t --num-records $$SEED_RECORDS \
            --payload-file /seed/$$t.jsonl --throughput $$SEED_THROUGHPUT \
            --producer-props bootstrap.servers=kafka:9094 \
            partitioner.class=org.apache.kafka.clients.producer.RoundRobinPartitioner | tail -1
        done
    volumes:
      - ./seed:/seed:ro,Z
    restart: "no"
    mem_limit: 512m
    networks: [edp]

  notification-service:
    <<: *notification
    container_name: edp-notification-1
    hostname: notification-1
    ports:
      - "8080:8080"
    environment:
      <<: *notification-env
      NOTIFY_CLIENT: ${NOTIFY_CLIENT:-notification-1}
    depends_on:
      topics-init:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      lgtm:
        condition: service_healthy

  # A second replica of the same service, in the same consumer group. Start it with:
  #   docker compose up -d --no-deps notification-2
  notification-2:
    <<: *notification
    container_name: edp-notification-2
    hostname: notification-2
    profiles: [scale]
    environment:
      <<: *notification-env
      NOTIFY_CLIENT: notification-2
    depends_on:
      postgres:
        condition: service_healthy
      lgtm:
        condition: service_healthy

networks:
  edp:
    name: edp

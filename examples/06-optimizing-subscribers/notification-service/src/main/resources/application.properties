quarkus.application.name=notification-service

# One consumer group per run: a new group reads the seeded backlog from the start, so every run
# drains the same input. NOTIFY_CLIENT is the Kafka client id (the replica's name in group listings).
notify.group=${NOTIFY_GROUP:notify-default}
notify.client=${NOTIFY_CLIENT:${HOSTNAME:local}}
# A fixed cost per record, standing in for template rendering.
notify.work-ms=${NOTIFY_WORK_MS:0}

# Consumer settings. Each default is the Kafka default, except consumers-count (Camel's default). The
# environment overrides each one: MAX_POLL_RECORDS, FETCH_MIN_BYTES and so on.
camel.component.kafka.max-poll-records=${MAX_POLL_RECORDS:500}
camel.component.kafka.fetch-min-bytes=${FETCH_MIN_BYTES:1}
camel.component.kafka.fetch-wait-max-ms=${FETCH_WAIT_MAX_MS:500}
camel.component.kafka.max-poll-interval-ms=${MAX_POLL_INTERVAL_MS:300000}
camel.component.kafka.consumers-count=${CONSUMERS_COUNT:1}
camel.component.kafka.group-protocol=${GROUP_PROTOCOL:classic}
camel.component.kafka.partition-assignor=${PARTITION_ASSIGNOR:org.apache.kafka.clients.consumer.RangeAssignor}
camel.component.kafka.auto-offset-reset=earliest
camel.component.kafka.kafka-client-factory=#meteredFactory

# The coordinator's join, revoke and assign lines are logged at INFO by the Kafka client.
quarkus.log.min-level=INFO
quarkus.log.category."org.apache.kafka.clients.consumer".level=INFO

# Flyway owns the schema; the table lives in the notifications schema of the edp database.
quarkus.flyway.migrate-at-start=true
quarkus.flyway.schemas=notifications
quarkus.hibernate-orm.database.default-schema=notifications
quarkus.datasource.db-kind=postgresql
quarkus.datasource.devservices.image-name=docker.io/library/postgres:18.6

# Traces, metrics and logs leave over OTLP. The endpoint comes from QUARKUS_OTEL_EXPORTER_OTLP_ENDPOINT.
quarkus.otel.logs.enabled=true
quarkus.otel.exporter.otlp.protocol=http/protobuf
quarkus.otel.metric.export.interval=5s
quarkus.otel.bsp.schedule.delay=1s
quarkus.otel.blrp.schedule.delay=1s

# Dev Services runs the same broker image as the compose stack, with the same three partitions per topic.
quarkus.kafka.devservices.image-name=docker.io/apache/kafka:4.3.2
quarkus.kafka.devservices.topic-partitions."edp.orders.placed"=3
quarkus.kafka.devservices.topic-partitions."edp.payments.processed"=3
quarkus.kafka.devservices.topic-partitions."edp.shipping.scheduled"=3

%test.quarkus.otel.sdk.disabled=true
%test.notify.group=test-default

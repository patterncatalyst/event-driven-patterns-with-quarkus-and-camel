quarkus.application.name=crud-vs-events

# Flyway owns the schema.
quarkus.flyway.migrate-at-start=true

# Tests run against the same PostgreSQL minor as the compose stack.
quarkus.datasource.db-kind=postgresql
quarkus.datasource.devservices.image-name=docker.io/library/postgres:18.6

# Traces and logs leave over OTLP. The endpoint comes from QUARKUS_OTEL_EXPORTER_OTLP_ENDPOINT.
quarkus.otel.logs.enabled=true
quarkus.otel.exporter.otlp.protocol=http/protobuf

# Compose supplies QUARKUS_DATASOURCE_JDBC_URL, QUARKUS_DATASOURCE_USERNAME and QUARKUS_DATASOURCE_PASSWORD.

# Tests: no telemetry export.
%test.quarkus.otel.sdk.disabled=true

# jsonb columns use Hibernate's own JSON mapping, not the REST ObjectMapper.
quarkus.hibernate-orm.mapping.format.global=ignore

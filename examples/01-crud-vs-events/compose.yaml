name: edp-01

include:
  - path: ../_infra/compose-postgres.yaml
  - path: ../_infra/compose-lgtm.yaml

services:
  app:
    build:
      context: ..
      dockerfile: 01-crud-vs-events/Containerfile
    container_name: edp-01-app
    ports:
      - "8080:8080"
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/edp
      OTEL_EXPORTER_OTLP_ENDPOINT: http://lgtm:4318
    depends_on:
      postgres:
        condition: service_healthy
      lgtm:
        condition: service_healthy
    mem_limit: 512m
    networks:
      - edp

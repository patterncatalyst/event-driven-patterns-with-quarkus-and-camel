# The Kubernetes half: the namespaces, the Strimzi operator, Kafka as two node pools and a CloudNativePG Cluster,
# all from examples/_k8s. The CloudNativePG operator is installed by examples/_k8s/cluster.sh up.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../_k8s/namespaces
  - ../_k8s/strimzi
  - ../_k8s/kafka
  - ../_k8s/postgres

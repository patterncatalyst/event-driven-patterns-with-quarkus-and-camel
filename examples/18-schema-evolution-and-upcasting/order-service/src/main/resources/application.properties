quarkus.application.name=order-service

# Flyway owns the orders schema; Hibernate creates nothing and validates its mapping against it at boot.
quarkus.flyway.migrate-at-start=true
quarkus.flyway.schemas=orders
quarkus.hibernate-orm.database.default-schema=orders
quarkus.hibernate-orm.schema-management.strategy=validate
quarkus.hibernate-orm.mapping.format.global=ignore
quarkus.datasource.db-kind=postgresql
quarkus.datasource.devservices.image-name=docker.io/library/postgres:18.6

# The outbox row carries Avro bytes, not JSON: a bytea payload, and the topic the Event Router sends the row to.
quarkus.debezium-outbox.additional-fields=topic:string
quarkus.debezium-outbox.payload.type=binary
quarkus.debezium-outbox.payload.column-definition=bytea
quarkus.debezium-outbox.remove-after-insert=true
%test.quarkus.debezium-outbox.remove-after-insert=false

# The registry the standalone Avro serializer registers schemas in. Compose sets
# MP_MESSAGING_CONNECTOR_SMALLRYE_KAFKA_APICURIO_REGISTRY_URL; Dev Services fills the same property in dev and test.
evolution.registry-url=${mp.messaging.connector.smallrye-kafka.apicurio.registry.url:http://localhost:8081/apis/registry/v3}

# Demo code, off by default, set in the environment. ORDER_PLACED_SCHEMA=1 makes the service behave as the previous
# release (no shippingPriority), 3 as a broken release (shippingPriority without a default); 2 is the current one.
# UPCASTERS=off skips the upcaster chain, the negative witness.
order.placed-schema=${ORDER_PLACED_SCHEMA:2}
upcasters=${UPCASTERS:on}

# Traces, metrics and logs leave over OTLP. The endpoint comes from QUARKUS_OTEL_EXPORTER_OTLP_ENDPOINT.
quarkus.otel.logs.enabled=true
quarkus.otel.metric.export.interval=5s
quarkus.otel.exporter.otlp.protocol=http/protobuf
quarkus.otel.bsp.schedule.delay=1s
quarkus.otel.blrp.schedule.delay=1s

# Dev Services runs the same broker and registry images as the compose stack; the topic has one partition.
quarkus.kafka.devservices.image-name=docker.io/apache/kafka:4.3.2
quarkus.kafka.devservices.topic-partitions.edp.orders.placed=1
quarkus.apicurio-registry.devservices.image-name=quay.io/apicurio/apicurio-registry:3.3.4
%test.quarkus.otel.sdk.disabled=true

# Compose supplies QUARKUS_DATASOURCE_JDBC_URL, QUARKUS_DATASOURCE_USERNAME and QUARKUS_DATASOURCE_PASSWORD.

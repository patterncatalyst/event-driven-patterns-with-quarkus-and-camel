quarkus.application.name=notification-service
quarkus.http.port=8082

quarkus.flyway.migrate-at-start=true
quarkus.flyway.schemas=notifications
quarkus.hibernate-orm.database.default-schema=notifications
quarkus.hibernate-orm.schema-management.strategy=validate
quarkus.datasource.db-kind=postgresql
quarkus.datasource.devservices.image-name=docker.io/library/postgres:18.6

# The registry the Camel reader's deserializer resolves schema ids in. The SmallRye channel needs no setting: with a
# generated Avro class as the parameter type, Quarkus picks the Apicurio deserializer and the specific reader itself,
# and takes the registry from the same property. Compose sets MP_MESSAGING_CONNECTOR_SMALLRYE_KAFKA_APICURIO_REGISTRY_URL.
evolution.registry-url=${mp.messaging.connector.smallrye-kafka.apicurio.registry.url:http://localhost:8081/apis/registry/v3}

# The SmallRye path: OrderPlaced is read with the reader schema this service was built on (order-placed.avsc).
mp.messaging.incoming.placed.connector=smallrye-kafka
mp.messaging.incoming.placed.topic=edp.orders.placed
mp.messaging.incoming.placed.group.id=notification
mp.messaging.incoming.placed.auto.offset.reset=earliest
mp.messaging.incoming.placed.session.timeout.ms=10000

# The Camel path (profile camel-reader) replaces the channel with the route and its own group.
reader.camel.enabled=false
%camel-reader.reader.camel.enabled=true
%camel-reader.mp.messaging.incoming.placed.enabled=false

# Traces, metrics and logs leave over OTLP. The endpoint comes from QUARKUS_OTEL_EXPORTER_OTLP_ENDPOINT.
quarkus.otel.logs.enabled=true
quarkus.otel.metric.export.interval=5s
quarkus.otel.exporter.otlp.protocol=http/protobuf
quarkus.otel.bsp.schedule.delay=1s
quarkus.otel.blrp.schedule.delay=1s

quarkus.kafka.devservices.image-name=docker.io/apache/kafka:4.3.2
quarkus.kafka.devservices.topic-partitions.edp.orders.placed=1
quarkus.apicurio-registry.devservices.image-name=quay.io/apicurio/apicurio-registry:3.3.4
%test.quarkus.otel.sdk.disabled=true
%test.camel.component.kafka.brokers=${kafka.bootstrap.servers}

# Compose supplies QUARKUS_DATASOURCE_JDBC_URL, QUARKUS_DATASOURCE_USERNAME, QUARKUS_DATASOURCE_PASSWORD,
# KAFKA_BOOTSTRAP_SERVERS and CAMEL_COMPONENT_KAFKA_BROKERS.

name: edp-18

include:
  - path: ../_infra/compose-kafka.yaml
  - path: ../_infra/compose-postgres.yaml
  - path: ../_infra/compose-apicurio.yaml
  - path: ../_infra/compose-connect.yaml
  - path: ../_infra/compose-lgtm.yaml

x-app-env: &app-env
  KAFKA_BOOTSTRAP_SERVERS: kafka:9094
  CAMEL_COMPONENT_KAFKA_BROKERS: kafka:9094
  QUARKUS_DATASOURCE_JDBC_URL: jdbc:postgresql://postgres:5432/edp
  QUARKUS_DATASOURCE_USERNAME: edp
  QUARKUS_DATASOURCE_PASSWORD: edp
  QUARKUS_OTEL_EXPORTER_OTLP_ENDPOINT: http://lgtm:4318
  MP_MESSAGING_CONNECTOR_SMALLRYE_KAFKA_APICURIO_REGISTRY_URL: http://apicurio:8080/apis/registry/v3

x-app-depends: &app-depends
  topics-init:
    condition: service_completed_successfully
  postgres:
    condition: service_healthy
  apicurio:
    condition: service_healthy
  lgtm:
    condition: service_healthy

services:
  # Creates the one topic the services use, with one partition, then exits.
  topics-init:
    image: docker.io/apache/kafka:4.3.2
    container_name: edp-topics-init
    depends_on:
      kafka:
        condition: service_healthy
    entrypoint: ["/bin/bash", "-c"]
    command:
      - /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9094 --create --if-not-exists --topic edp.orders.placed --partitions 1 --replication-factor 1
    restart: "no"
    mem_limit: 512m
    networks: [edp]

  order-service:
    build:
      context: ..
      dockerfile: 18-schema-evolution-and-upcasting/order-service/Containerfile
    container_name: edp-order-service
    ports:
      - "8080:8080"
    environment:
      <<: *app-env
      # Demo code: 1 behaves as the previous release, 2 is the current one, 3 publishes a shippingPriority without a default.
      ORDER_PLACED_SCHEMA: ${ORDER_PLACED_SCHEMA:-2}
      # Demo code: off skips the upcaster chain.
      UPCASTERS: ${UPCASTERS:-on}
    depends_on: *app-depends
    mem_limit: 384m
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:8080/q/health/ready"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 15s
    networks: [edp]

  notification-service:
    build:
      context: ..
      dockerfile: 18-schema-evolution-and-upcasting/notification-service/Containerfile
    container_name: edp-notification-service
    ports:
      - "8082:8082"
    environment:
      <<: *app-env
      # prod (default) reads OrderPlaced through the SmallRye channel; camel-reader reads it through the Camel route.
      QUARKUS_PROFILE: ${READER_PROFILE:-prod}
    depends_on: *app-depends
    mem_limit: 384m
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:8082/q/health/ready"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 15s
    networks: [edp]

networks:
  edp:
    name: edp

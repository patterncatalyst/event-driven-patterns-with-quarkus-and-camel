services:
  connect:
    image: quay.io/debezium/connect:3.7.1.Final
    container_name: edp-connect
    ports:
      - "8083:8083"
    environment:
      - BOOTSTRAP_SERVERS=kafka:9094
      - GROUP_ID=edp-connect
      - CONFIG_STORAGE_TOPIC=edp-connect-configs
      - OFFSET_STORAGE_TOPIC=edp-connect-offsets
      - STATUS_STORAGE_TOPIC=edp-connect-status
      - CONFIG_STORAGE_REPLICATION_FACTOR=1
      - OFFSET_STORAGE_REPLICATION_FACTOR=1
      - STATUS_STORAGE_REPLICATION_FACTOR=1
      - HEAP_OPTS=-Xms256M -Xmx1G
    depends_on:
      kafka:
        condition: service_healthy
        required: false    # lets this file start alone when Kafka runs elsewhere
    mem_limit: 2g
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:8083/"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 40s
    networks:
      - edp

networks:
  edp:
    name: edp

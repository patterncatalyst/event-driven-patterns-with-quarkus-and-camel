services:
  apicurio:
    image: quay.io/apicurio/apicurio-registry:3.3.4
    container_name: edp-apicurio
    ports:
      - "8081:8080"     # REST API and UI (/apis/registry/v3)
      - "19000:9000"    # management interface: /health/ready
    # In-memory storage: the registry is empty after every restart.
    environment:
      - APICURIO_STORAGE_KIND=sql
      - APICURIO_STORAGE_SQL_KIND=h2
    mem_limit: 768m
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:9000/health/ready"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 20s
    networks:
      - edp

networks:
  edp:
    name: edp

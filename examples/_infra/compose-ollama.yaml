services:
  ollama:
    image: docker.io/ollama/ollama:0.40.16@sha256:910d0d8107b538fb0894e63163eb195de0cc7aefcbc666dc62d3b18f71124592
    container_name: edp-ollama
    ports:
      - "11434:11434"   # Ollama API: GET /api/tags
    environment:
      - OLLAMA_NUM_PARALLEL=1
      - OLLAMA_MAX_LOADED_MODELS=1
      - OLLAMA_KEEP_ALIVE=30m
      - OLLAMA_CONTEXT_LENGTH=2048
    volumes:
      # Filled once by scripts/ollama-model.sh pull; mounted read-only and never removed by down -v.
      - edp-ollama-models:/root/.ollama:ro
    mem_limit: 4g
    healthcheck:
      # The image has no curl, wget or bash.
      test: ["CMD", "ollama", "list"]
      interval: 3s
      timeout: 5s
      retries: 30
      start_period: 3s
    networks:
      - edp

volumes:
  edp-ollama-models:
    external: true

networks:
  edp:
    name: edp

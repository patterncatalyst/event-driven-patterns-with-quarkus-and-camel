quarkus.application.name=order-service

# Flyway owns the orders schema; Hibernate reads and writes the same schema, creates nothing and validates its mapping against it at boot.
quarkus.flyway.migrate-at-start=true
quarkus.flyway.schemas=orders
quarkus.hibernate-orm.database.default-schema=orders
quarkus.hibernate-orm.schema-management.strategy=validate
quarkus.datasource.db-kind=postgresql
quarkus.datasource.devservices.image-name=docker.io/library/postgres:18.6

# The outbox extension: one extra column holds the topic the connector routes the row to. The row is removed in the
# transaction that inserts it; the insert still reaches the transaction log. With quarkus-opentelemetry present the
# extension starts an outbox-write span and stores the active trace context in the tracingspancontext column.
quarkus.debezium-outbox.additional-fields=topic:string
quarkus.debezium-outbox.remove-after-insert=true

# Traces, metrics and logs leave over OTLP. The endpoint comes from QUARKUS_OTEL_EXPORTER_OTLP_ENDPOINT.
quarkus.otel.logs.enabled=true
quarkus.otel.metric.export.interval=5s
quarkus.otel.exporter.otlp.protocol=http/protobuf
quarkus.otel.bsp.schedule.delay=1s
quarkus.otel.blrp.schedule.delay=1s
quarkus.log.console.format=%d{HH:mm:ss} %-5p traceId=%X{traceId} spanId=%X{spanId} [%c{2.}] %s%e%n

# Tests export spans to memory, one at a time, and keep the outbox rows so a test can read them.
%test.quarkus.otel.traces.exporter=cdi
%test.quarkus.otel.simple=true
%test.quarkus.otel.logs.enabled=false
%test.quarkus.debezium-outbox.remove-after-insert=false

# Compose supplies QUARKUS_DATASOURCE_JDBC_URL, QUARKUS_DATASOURCE_USERNAME and QUARKUS_DATASOURCE_PASSWORD.

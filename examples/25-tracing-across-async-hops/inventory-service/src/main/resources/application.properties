quarkus.application.name=inventory-service
quarkus.http.port=8082

# Flyway owns the inventory schema; Hibernate validates its mapping against it at boot.
quarkus.flyway.migrate-at-start=true
quarkus.flyway.schemas=inventory
quarkus.hibernate-orm.database.default-schema=inventory
quarkus.hibernate-orm.schema-management.strategy=validate
quarkus.datasource.db-kind=postgresql
quarkus.datasource.devservices.image-name=docker.io/library/postgres:18.6

# One consumer group, one partition. A restarted member waits for the dead one's session to expire, so the session is short.
mp.messaging.connector.smallrye-kafka.auto.offset.reset=earliest
mp.messaging.connector.smallrye-kafka.session.timeout.ms=10000
mp.messaging.connector.smallrye-kafka.heartbeat.interval.ms=3000
mp.messaging.connector.smallrye-kafka.key.deserializer=org.apache.kafka.common.serialization.StringDeserializer
mp.messaging.incoming.placed.connector=smallrye-kafka
mp.messaging.incoming.placed.topic=edp.orders.placed
mp.messaging.incoming.placed.group.id=inventory-placed
mp.messaging.incoming.placed.value.deserializer=com.patterncatalyst.shipping.tracing.inventory.OrderPlacedDeserializer
# The channel's consumer span is a child of the record's context. Demo code: CONSUMER_TRACE=link with
# CONSUMER_TRACE_ENABLED=false (verify.sh sets both) replaces it with a new trace that links to that context.
mp.messaging.incoming.placed.tracing-enabled=${CONSUMER_TRACE_ENABLED:true}
demo.consumer-trace=${CONSUMER_TRACE:parent}

# Traces, metrics and logs leave over OTLP. The endpoint comes from QUARKUS_OTEL_EXPORTER_OTLP_ENDPOINT.
quarkus.otel.logs.enabled=true
quarkus.otel.metric.export.interval=5s
quarkus.otel.exporter.otlp.protocol=http/protobuf
quarkus.otel.bsp.schedule.delay=1s
quarkus.otel.blrp.schedule.delay=1s
quarkus.log.console.format=%d{HH:mm:ss} %-5p traceId=%X{traceId} spanId=%X{spanId} [%c{2.}] %s%e%n

# Tests export spans to memory, one at a time.
%test.quarkus.otel.traces.exporter=cdi
%test.quarkus.otel.simple=true
%test.quarkus.otel.logs.enabled=false

# Kafka Dev Services runs the same broker image as the compose stack.
quarkus.kafka.devservices.image-name=docker.io/apache/kafka:4.3.2

# Compose supplies QUARKUS_DATASOURCE_JDBC_URL, QUARKUS_DATASOURCE_USERNAME, QUARKUS_DATASOURCE_PASSWORD,
# QUARKUS_HTTP_PORT and KAFKA_BOOTSTRAP_SERVERS.

name: edp-ag

include:
  - path: ../_infra/compose-kafka.yaml
  - path: ../_infra/compose-postgres.yaml
  - path: ../_infra/compose-connect.yaml
  - path: ../_infra/compose-lgtm.yaml
  - path: ../_infra/compose-redis.yaml

services:
  # Creates the two order topics with one partition each, so the order of events is the order of the topic, then exits.
  topics-init:
    image: docker.io/apache/kafka:4.3.2
    container_name: edp-topics-init
    depends_on:
      kafka:
        condition: service_healthy
    entrypoint: ["/bin/bash", "-c"]
    command:
      - |
        for t in edp.orders.placed edp.orders.cancelled; do
          /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9094 --create --if-not-exists --topic $$t --partitions 1 --replication-factor 1
        done
    restart: "no"
    mem_limit: 512m
    networks: [edp]

  order-service:
    build:
      context: ..
      dockerfile: ag-write-forward-cache/order-service/Containerfile
    container_name: edp-order-service
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      CAMEL_COMPONENT_KAFKA_BROKERS: kafka:9094
      QUARKUS_REDIS_HOSTS: redis://redis:6379
      QUARKUS_DATASOURCE_JDBC_URL: jdbc:postgresql://postgres:5432/edp
      QUARKUS_DATASOURCE_USERNAME: edp
      QUARKUS_DATASOURCE_PASSWORD: edp
      QUARKUS_OTEL_EXPORTER_OTLP_ENDPOINT: http://lgtm:4318
      # The consumer group that feeds the cache; a new name makes the route read both topics again from the start.
      CACHE_GROUP: ${CACHE_GROUP:-order-cache}
      # Demo code: the topics the cache route reads (narrowed for the two-phase replay).
      CACHE_TOPICS: ${CACHE_TOPICS:-edp.orders.placed,edp.orders.cancelled}
      # Demo code: CACHE_GUARD=off removes the version guard.
      CACHE_GUARD: ${CACHE_GUARD:-on}
      # Demo code: CACHE_WRITE=dual writes Redis inside the request before the commit.
      CACHE_WRITE: ${CACHE_WRITE:-forward}
      # Demo code: order ids whose request fails after that write.
      FAIL_BEFORE_COMMIT_FOR: ${FAIL_BEFORE_COMMIT_FOR:-O-4290}
    depends_on:
      topics-init:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      lgtm:
        condition: service_healthy
    mem_limit: 512m
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:8080/q/health/ready"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 15s
    networks: [edp]

networks:
  edp:
    name: edp

quarkus.application.name=order-service

# Flyway owns the orders schema; Hibernate reads and writes the same schema, creates nothing and validates its mapping against it at boot.
quarkus.flyway.migrate-at-start=true
quarkus.flyway.schemas=orders
quarkus.hibernate-orm.database.default-schema=orders
quarkus.hibernate-orm.schema-management.strategy=validate
quarkus.datasource.db-kind=postgresql
quarkus.datasource.devservices.image-name=docker.io/library/postgres:18.6

# The outbox extension: one extra column holds the topic the connector routes the row to.
# The row is removed in the same transaction that inserts it: the insert still reaches the transaction log.
quarkus.debezium-outbox.additional-fields=topic:string
quarkus.debezium-outbox.remove-after-insert=true

# The cache. Dev Services starts the same Redis image as the compose stack; its default is the floating redis:7.
# Compose supplies QUARKUS_REDIS_HOSTS.
quarkus.redis.devservices.image-name=docker.io/library/redis:8.10.3-alpine

# The consumer group that feeds the cache. A new group name reads both topics again from the earliest offset.
cache.group=${CACHE_GROUP:order-cache}

# Demo code, set in the environment: CACHE_TOPICS narrows the topics the cache route reads, CACHE_GUARD=off removes
# the version guard, CACHE_WRITE=dual writes Redis inside the request before the commit, and FAIL_BEFORE_COMMIT_FOR
# names the order ids whose request fails after that write.
cache.topics=${CACHE_TOPICS:edp.orders.placed,edp.orders.cancelled}
cache.guard=${CACHE_GUARD:on}
demo.cache-write=${CACHE_WRITE:forward}
demo.fail-before-commit-for=${FAIL_BEFORE_COMMIT_FOR:}

# Kafka Dev Services runs the same broker image as the compose stack.
quarkus.kafka.devservices.image-name=docker.io/apache/kafka:4.3.2

# Traces, metrics and logs leave over OTLP. The endpoint comes from QUARKUS_OTEL_EXPORTER_OTLP_ENDPOINT.
quarkus.otel.logs.enabled=true
quarkus.otel.metric.export.interval=5s
quarkus.otel.exporter.otlp.protocol=http/protobuf
quarkus.otel.bsp.schedule.delay=1s
quarkus.otel.blrp.schedule.delay=1s

# Tests start no collector, so the OpenTelemetry SDK stays off. They keep the outbox rows, so a test can read them.
%test.quarkus.otel.sdk.disabled=true
%test.quarkus.debezium-outbox.remove-after-insert=false
%test.demo.fail-before-commit-for=O-FAIL

# Compose supplies QUARKUS_DATASOURCE_JDBC_URL, QUARKUS_DATASOURCE_USERNAME, QUARKUS_DATASOURCE_PASSWORD,
# QUARKUS_REDIS_HOSTS and CAMEL_COMPONENT_KAFKA_BROKERS.

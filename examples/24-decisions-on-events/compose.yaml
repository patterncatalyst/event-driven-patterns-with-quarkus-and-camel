name: edp-24

include:
  - path: ../_infra/compose-kafka.yaml
  - path: ../_infra/compose-lgtm.yaml
  - path: ../_infra/compose-ollama.yaml

x-app-env: &app-env
  KAFKA_BOOTSTRAP_SERVERS: kafka:9094
  CAMEL_COMPONENT_KAFKA_BROKERS: kafka:9094
  QUARKUS_OTEL_EXPORTER_OTLP_ENDPOINT: http://lgtm:4318
  QUARKUS_LANGCHAIN4J_OLLAMA_BASE_URL: http://ollama:11434

services:
  # Creates the three topics with one partition each, then exits.
  topics-init:
    image: docker.io/apache/kafka:4.3.2
    container_name: edp-topics-init
    depends_on:
      kafka:
        condition: service_healthy
    entrypoint: ["/bin/bash", "-c"]
    command:
      - |
        for t in edp.shipping.delivery-exceptions edp.shipping.exception-analyses edp.shipping.exception-decisions; do
          /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9094 --create --if-not-exists --topic $$t --partitions 1 --replication-factor 1
        done
    restart: "no"
    mem_limit: 512m
    networks: [edp]

  # Does not depend on ollama: with the model down the analysis route retries and the record waits, which is the behaviour
  # the example shows, and without a model the rest of the service still runs.
  shipping-service:
    build:
      context: ..
      dockerfile: 24-decisions-on-events/shipping-service/Containerfile
    container_name: edp-shipping-service
    ports:
      - "8080:8080"
    environment:
      <<: *app-env
      # The model recorded on every analysis. The digest is the one scripts/ollama-model.sh pins.
      ANALYST_MODEL: qwen3:4b-instruct-2507-q4_K_M
      ANALYST_MODEL_DIGEST: "0edcdef34593"
      # Demo code: false leaves the analysis route stopped, so the service runs without a model.
      ANALYST_ENABLED: ${ANALYST_ENABLED:-true}
      # Demo code: reanalyse makes the replay ask the model again instead of reusing the recorded analyses.
      REPLAY_MODE: ${REPLAY_MODE:-recorded}
      RESHIP_ATTEMPT_LIMIT: ${RESHIP_ATTEMPT_LIMIT:-3}
    depends_on:
      topics-init:
        condition: service_completed_successfully
      lgtm:
        condition: service_healthy
    mem_limit: 384m
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:8080/q/health/ready"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 15s
    networks: [edp]

networks:
  edp:
    name: edp

quarkus.application.name=notification-service
quarkus.http.port=8082

# Flyway owns the notifications schema; Hibernate reads and writes the same schema.
quarkus.flyway.migrate-at-start=true
quarkus.flyway.schemas=notifications
quarkus.hibernate-orm.database.default-schema=notifications
quarkus.datasource.db-kind=postgresql
quarkus.datasource.devservices.image-name=docker.io/library/postgres:18.6

# Kafka Dev Services runs the same broker image as the compose stack.
quarkus.kafka.devservices.image-name=docker.io/apache/kafka:4.3.2

# The source of the facts the notification is built from. Compose sets ORDER_SERVICE_URL.
order-service.url=http://localhost:8080

# A new consumer group reads the topic from the beginning.
camel.component.kafka.auto-offset-reset=earliest

# Traces and logs leave over OTLP. The endpoint comes from QUARKUS_OTEL_EXPORTER_OTLP_ENDPOINT.
quarkus.otel.logs.enabled=true
quarkus.otel.exporter.otlp.protocol=http/protobuf
quarkus.otel.bsp.schedule.delay=1s
quarkus.otel.blrp.schedule.delay=1s

# Tests start no collector, so the OpenTelemetry SDK stays off. The order-service the route
# fetches from is a stub served by the test application itself.
%test.quarkus.otel.sdk.disabled=true
quarkus.http.test-port=8182
%test.order-service.url=http://localhost:8182

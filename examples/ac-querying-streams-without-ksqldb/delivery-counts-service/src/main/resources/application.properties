quarkus.application.name=delivery-counts-service

# Kafka Streams: the application id is the consumer group. Listing the input topic makes readiness wait for it.
# With a commit interval of 1 s and no record cache an update is visible to a query within a second; the defaults
# (30 s, 10 MiB) hold it back until the next commit.
quarkus.kafka-streams.application-id=delivery-counts
quarkus.kafka-streams.topics=edp.shipping.delivered
kafka-streams.commit.interval.ms=1000
kafka-streams.statestore.cache.max.bytes=0
kafka-streams.auto.offset.reset=earliest
kafka-streams.state.dir=/tmp/delivery-counts

# The allowed lateness, in seconds (a plain number is seconds). The Flink and RisingWave statements carry the same
# number (LATENESS_SECONDS in verify.sh). Demo code: KS_GRACE_SECONDS overrides it for Kafka Streams alone.
counts.grace=${KS_GRACE_SECONDS:${LATENESS_SECONDS:10}}

# In prod the brokers come from the environment (KAFKA_BOOTSTRAP_SERVERS).
%prod.kafka.bootstrap.servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}

# Traces, metrics and logs leave over OTLP. The endpoint comes from QUARKUS_OTEL_EXPORTER_OTLP_ENDPOINT.
quarkus.otel.logs.enabled=true
quarkus.otel.metric.export.interval=5s
quarkus.otel.exporter.otlp.protocol=http/protobuf
quarkus.otel.bsp.schedule.delay=1s
quarkus.otel.blrp.schedule.delay=1s
%test.quarkus.otel.sdk.disabled=true

quarkus.application.name=order-service

# Flyway owns the orders schema; Hibernate creates nothing and validates its mapping against it at boot.
quarkus.flyway.migrate-at-start=true
quarkus.flyway.schemas=orders
quarkus.hibernate-orm.database.default-schema=orders
quarkus.hibernate-orm.schema-management.strategy=validate
quarkus.hibernate-orm.mapping.format.global=ignore
quarkus.datasource.db-kind=postgresql
quarkus.datasource.devservices.image-name=docker.io/library/postgres:18.6

# Demo code, set in the environment: PROJECTION_GUARD=off drops the forward-only guard of the shipment upsert (the
# negative witness); PROJECTOR_DELAY_MS sleeps in the projector before every event, so the backlog can outgrow it.
projection.guard=${PROJECTION_GUARD:on}
projection.delay-ms=${PROJECTOR_DELAY_MS:0}

# One channel and one consumer group per topic. Each is pausable, so a test or a demo can hold one topic back.
# The session timeout lets a restarted service take its partitions back within seconds.
mp.messaging.incoming.placed.connector=smallrye-kafka
mp.messaging.incoming.placed.topic=edp.orders.placed
mp.messaging.incoming.placed.group.id=order-view-placed
mp.messaging.incoming.placed.auto.offset.reset=earliest
mp.messaging.incoming.placed.key.deserializer=org.apache.kafka.common.serialization.StringDeserializer
mp.messaging.incoming.placed.value.deserializer=com.patterncatalyst.shipping.projections.Deserializers$Placed
mp.messaging.incoming.placed.session.timeout.ms=10000
mp.messaging.incoming.placed.pausable=true
mp.messaging.incoming.cancelled.connector=smallrye-kafka
mp.messaging.incoming.cancelled.topic=edp.orders.cancelled
mp.messaging.incoming.cancelled.group.id=order-view-cancelled
mp.messaging.incoming.cancelled.auto.offset.reset=earliest
mp.messaging.incoming.cancelled.key.deserializer=org.apache.kafka.common.serialization.StringDeserializer
mp.messaging.incoming.cancelled.value.deserializer=com.patterncatalyst.shipping.projections.Deserializers$Cancelled
mp.messaging.incoming.cancelled.session.timeout.ms=10000
mp.messaging.incoming.cancelled.pausable=true
mp.messaging.incoming.paid.connector=smallrye-kafka
mp.messaging.incoming.paid.topic=edp.payments.processed
mp.messaging.incoming.paid.group.id=order-view-paid
mp.messaging.incoming.paid.auto.offset.reset=earliest
mp.messaging.incoming.paid.key.deserializer=org.apache.kafka.common.serialization.StringDeserializer
mp.messaging.incoming.paid.value.deserializer=com.patterncatalyst.shipping.projections.Deserializers$Paid
mp.messaging.incoming.paid.session.timeout.ms=10000
mp.messaging.incoming.paid.pausable=true
mp.messaging.incoming.scheduled.connector=smallrye-kafka
mp.messaging.incoming.scheduled.topic=edp.shipping.scheduled
mp.messaging.incoming.scheduled.group.id=order-view-scheduled
mp.messaging.incoming.scheduled.auto.offset.reset=earliest
mp.messaging.incoming.scheduled.key.deserializer=org.apache.kafka.common.serialization.StringDeserializer
mp.messaging.incoming.scheduled.value.deserializer=com.patterncatalyst.shipping.projections.Deserializers$Scheduled
mp.messaging.incoming.scheduled.session.timeout.ms=10000
mp.messaging.incoming.scheduled.pausable=true
mp.messaging.incoming.in-transit.connector=smallrye-kafka
mp.messaging.incoming.in-transit.topic=edp.shipping.in-transit
mp.messaging.incoming.in-transit.group.id=order-view-in-transit
mp.messaging.incoming.in-transit.auto.offset.reset=earliest
mp.messaging.incoming.in-transit.key.deserializer=org.apache.kafka.common.serialization.StringDeserializer
mp.messaging.incoming.in-transit.value.deserializer=com.patterncatalyst.shipping.projections.Deserializers$InTransit
mp.messaging.incoming.in-transit.session.timeout.ms=10000
mp.messaging.incoming.in-transit.pausable=true
mp.messaging.incoming.delivered.connector=smallrye-kafka
mp.messaging.incoming.delivered.topic=edp.shipping.delivered
mp.messaging.incoming.delivered.group.id=order-view-delivered
mp.messaging.incoming.delivered.auto.offset.reset=earliest
mp.messaging.incoming.delivered.key.deserializer=org.apache.kafka.common.serialization.StringDeserializer
mp.messaging.incoming.delivered.value.deserializer=com.patterncatalyst.shipping.projections.Deserializers$Delivered
mp.messaging.incoming.delivered.session.timeout.ms=10000
mp.messaging.incoming.delivered.pausable=true

# The Camel path (profile camel-projector) replaces the six channels with one route and one group. The profile applies
# to a named config profile only, so it repeats the broker address that %test supplies.
projection.camel.enabled=false
%camel-projector.projection.camel.enabled=true
%camel-projector.mp.messaging.incoming.placed.enabled=false
%camel-projector.mp.messaging.incoming.cancelled.enabled=false
%camel-projector.mp.messaging.incoming.paid.enabled=false
%camel-projector.mp.messaging.incoming.scheduled.enabled=false
%camel-projector.mp.messaging.incoming.in-transit.enabled=false
%camel-projector.mp.messaging.incoming.delivered.enabled=false
%test.camel.component.kafka.brokers=${kafka.bootstrap.servers}
%camel-projector.camel.component.kafka.brokers=${kafka.bootstrap.servers}

# Traces, metrics and logs leave over OTLP. The endpoint comes from QUARKUS_OTEL_EXPORTER_OTLP_ENDPOINT.
quarkus.otel.logs.enabled=true
quarkus.otel.metric.export.interval=5s
quarkus.otel.exporter.otlp.protocol=http/protobuf
quarkus.otel.bsp.schedule.delay=1s
quarkus.otel.blrp.schedule.delay=1s
%test.quarkus.otel.sdk.disabled=true

# Kafka Dev Services runs the same broker image as the compose stack, with the one-partition topics compose creates.
quarkus.kafka.devservices.image-name=docker.io/apache/kafka:4.3.2
quarkus.kafka.devservices.topic-partitions.edp.orders.placed=1
quarkus.kafka.devservices.topic-partitions.edp.orders.cancelled=1
quarkus.kafka.devservices.topic-partitions.edp.payments.processed=1
quarkus.kafka.devservices.topic-partitions.edp.shipping.scheduled=1
quarkus.kafka.devservices.topic-partitions.edp.shipping.in-transit=1
quarkus.kafka.devservices.topic-partitions.edp.shipping.delivered=1

# Compose supplies QUARKUS_DATASOURCE_JDBC_URL, QUARKUS_DATASOURCE_USERNAME, QUARKUS_DATASOURCE_PASSWORD,
# KAFKA_BOOTSTRAP_SERVERS and CAMEL_COMPONENT_KAFKA_BROKERS.

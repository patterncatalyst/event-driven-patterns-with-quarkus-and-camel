name: Content

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.1.0
        with:
          python-version: "3.14"
      - run: python -m pip install pyyaml==6.0.3
      - name: Validator self-test
        run: python scripts/validate.py --self-test
      - name: Validate content
        run: python scripts/validate.py

  voice:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.1.0
        with:
          python-version: "3.14"
      - name: Voice scan (ban tier)
        run: bash scripts/voice-scan.sh

  idiomatic:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Idiomatic scan (ban tier)
        run: bash scripts/idiomatic-scan.sh

  host-ids:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.1.0
        with:
          python-version: "3.14"
      - name: Scanner self-test
        run: python scripts/host_ids.py self-test
      - name: Host identifiers (paths only, values never printed)
        run: python scripts/host_ids.py check

  # The one check branch protection requires: fails unless every job above succeeded.
  content-ok:
    name: content-ok
    if: always()
    needs: [validate, voice, idiomatic, host-ids]
    runs-on: ubuntu-latest
    steps:
      - env:
          NEEDS: ${{ toJSON(needs) }}
        run: jq -e 'to_entries | all(.value.result == "success")' <<<"$NEEDS"

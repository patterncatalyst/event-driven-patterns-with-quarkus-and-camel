name: Examples

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.pick.outputs.matrix }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0

      # Maven projects: examples/domain-model and every examples/NN-* directory with a pom.xml.
      # A change under examples/_infra or to the Maven parent selects all of them.
      - id: pick
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.event.pull_request.base.sha }}
          BEFORE: ${{ github.event.before }}
        run: |
          shopt -s nullglob
          all=()
          for d in examples/domain-model examples/[0-9][0-9]-*; do
            [[ -f "$d/pom.xml" ]] && all+=("$d")
          done
          if [[ "$EVENT" == pull_request ]]; then ref="$BASE"; else ref="$BEFORE"; fi
          if [[ -z "$ref" || "$ref" =~ ^0+$ ]] || ! git cat-file -e "$ref" 2>/dev/null; then
            changed=$(git ls-files examples)
          else
            changed=$(git diff --name-only "$ref" HEAD -- examples)
          fi
          selected=()
          if grep -qE '^examples/(_infra/|pom\.xml)' <<<"$changed"; then
            selected=("${all[@]}")
          else
            for d in "${all[@]}"; do
              grep -q "^$d/" <<<"$changed" && selected+=("$d")
            done
          fi
          if [[ ${#selected[@]} -eq 0 ]]; then
            echo 'matrix=[]' >> "$GITHUB_OUTPUT"
          else
            printf 'matrix=%s\n' "$(printf '%s\n' "${selected[@]}" | jq -R . | jq -sc .)" >> "$GITHUB_OUTPUT"
          fi

  scripts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - name: bash -n on every verify.sh
        run: |
          shopt -s nullglob
          for f in examples/*/verify.sh scripts/*.sh; do
            echo "bash -n $f"
            bash -n "$f"
          done

  maven:
    needs: changes
    if: needs.changes.outputs.matrix != '[]'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        dir: ${{ fromJSON(needs.changes.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-java@v6.2.0
        with:
          distribution: temurin
          java-version: "25"
          cache: maven
      - name: mvn verify
        working-directory: ${{ matrix.dir }}
        run: mvn -B verify

  examples-ok:
    name: examples-ok
    if: always()
    needs: [changes, scripts, maven]
    runs-on: ubuntu-latest
    steps:
      - env:
          NEEDS: ${{ toJSON(needs) }}
        run: jq -e 'to_entries | all(.value.result == "success" or .value.result == "skipped")' <<<"$NEEDS"
